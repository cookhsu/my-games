<style>
/* layout concept: a boxing-ring poster — warm cream canvas, one spotlighted ring card at center,
   a single rubbery punching-bag puppet reacts with squash/stretch + speech bubbles per hit */
:root{
  --bg:#FFF3DE; --bg-raise:#FFFFFF; --ring:#2B1B12; --line:#F0DCB0;
  --fg:#2B1B12; --fg-dim:#8B7458;
  --accent:#FF5A36; --accent-ink:#FFFFFF; --gold:#FFC83D; --good:#2BAE66; --bad:#E0443A;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A130F; --bg-raise:#271C16; --ring:#120C09; --line:#3B2C20;
    --fg:#F5E8D8; --fg-dim:#B9A289;
    --accent:#FF6B45; --accent-ink:#1A130F; --gold:#FFD166; --good:#3ED47F; --bad:#FF6464;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A130F; --bg-raise:#271C16; --ring:#120C09; --line:#3B2C20;
  --fg:#F5E8D8; --fg-dim:#B9A289;
  --accent:#FF6B45; --accent-ink:#1A130F; --gold:#FFD166; --good:#3ED47F; --bad:#FF6464;
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--fg); font-family:"Noto Sans TC","Inter",sans-serif; overflow-x:hidden;}
.wrap{max-width:460px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:18px 28px;}
h1,h2{font-family:"Baloo 2","Noto Sans TC",sans-serif; margin:0; text-wrap:balance;}
.titleRow{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.titleRow h1{font-size:26px; font-weight:800; letter-spacing:.5px;}
.iconBtn{width:32px; height:32px; border-radius:999px; border:1px solid var(--line); background:var(--bg-raise); color:var(--fg-dim); font-weight:700; font-family:"Baloo 2",sans-serif; cursor:pointer; flex:none;}
.subtitle{margin:6px 0 0; color:var(--fg-dim); font-size:13.5px; line-height:1.5;}
.infoPanel{margin-top:10px; background:var(--bg-raise); border:1px solid var(--line); border-radius:14px; padding:12px 14px; font-size:13px; color:var(--fg-dim); line-height:1.7;}
.infoPanel p{margin:0;}

.weaponRow{display:flex; gap:7px; margin-top:12px;}
.wBtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px; border-radius:13px; border:1.5px solid var(--line); background:var(--bg-raise); color:var(--fg-dim); cursor:pointer; font-family:"Noto Sans TC",sans-serif;}
.wBtn .wIcon{font-size:20px; line-height:1;}
.wBtn .wName{font-size:10.5px; font-weight:700;}
.wBtn.active{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--bg-raise)); color:var(--fg);}
.bombBtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px; border-radius:13px; border:1.5px solid var(--gold); background:color-mix(in srgb, var(--gold) 16%, var(--bg-raise)); color:var(--fg); cursor:pointer; font-family:"Noto Sans TC",sans-serif;}
.bombBtn .wIcon{font-size:20px; line-height:1;}
.bombBtn .wName{font-size:10.5px; font-weight:700;}
.bombBtn:disabled{opacity:.4; cursor:default;}
.ultRow{margin-top:8px; background:var(--bg-raise); border:1.5px solid var(--line); border-radius:13px; padding:8px 10px;}
.ultHead{display:flex; align-items:center; justify-content:space-between; margin-bottom:5px;}
.ultHead span{font-size:11.5px; font-weight:700; color:var(--fg-dim);}
.ultBarTrack{height:9px; background:rgba(0,0,0,.08); border-radius:999px; overflow:hidden; margin-bottom:7px;}
:root[data-theme="dark"] .ultBarTrack, body .ultBarTrack{background:color-mix(in srgb, var(--fg) 12%, transparent);}
.ultBarFill{height:100%; width:0%; background:linear-gradient(90deg,var(--gold),var(--accent)); transition:width .18s ease;}
.ultBtn{width:100%; border:none; border-radius:11px; padding:10px; font-family:"Baloo 2",sans-serif; font-weight:700; font-size:14.5px; background:var(--line); color:var(--fg-dim); cursor:default; transition:background .2s,color .2s;}
.ultBtn.ready{background:linear-gradient(90deg,var(--gold),var(--accent)); color:#2B1B12; cursor:pointer; animation:ultPulse 1s ease-in-out infinite;}
@keyframes ultPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.025);}}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px;}
.statCard{background:var(--bg-raise); border:1px solid var(--line); border-radius:14px; padding:10px 6px; text-align:center;}
.statLabel{display:block; font-size:11px; color:var(--fg-dim); margin-bottom:3px;}
.statVal{font-family:"Baloo 2",sans-serif; font-size:21px; font-weight:700; font-variant-numeric:tabular-nums;}
.mult{font-size:12px; color:var(--accent); font-weight:700; margin-left:4px;}

.ring{position:relative; margin-top:16px; background:var(--ring); border-radius:22px; padding:14px 12px 18px; overflow:hidden;}
.ring::before{content:""; position:absolute; inset:10px; border:3px dashed rgba(255,255,255,.14); border-radius:16px; pointer-events:none;}
.guestBanner{position:absolute; left:50%; top:10px; transform:translateX(-50%); background:var(--gold); color:#2B1B12; font-weight:800; font-family:"Baloo 2",sans-serif; font-size:13px; padding:7px 16px; border-radius:999px; z-index:5; box-shadow:0 4px 14px rgba(0,0,0,.35); white-space:nowrap;}
.puppetName{position:relative; z-index:2; text-align:center; display:flex; align-items:center; justify-content:center; gap:6px; font-family:"Baloo 2",sans-serif; color:#FFFFFF; font-weight:700; font-size:16px; letter-spacing:.3px; margin-bottom:1px;}
.puppetName .prop{font-size:15px;}
.puppetTagline{position:relative; z-index:2; text-align:center; color:rgba(245,232,216,.6); font-size:11.5px; margin-bottom:10px;}
.puppetStage{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center;}
.hpBar{width:100%; max-width:260px; height:8px; background:rgba(255,255,255,.15); border-radius:999px; overflow:hidden; margin-bottom:10px;}
.hpFill{height:100%; width:100%; background:linear-gradient(90deg,var(--pc,var(--accent)),var(--gold)); transition:width .15s ease;}
.punchZone{position:relative; width:220px; height:220px; display:flex; align-items:center; justify-content:center; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none;}
.puppetGlow{position:absolute; width:176px; height:176px; border-radius:50%; background:radial-gradient(circle, var(--pc,var(--accent)) 0%, transparent 72%); opacity:.4; z-index:0; transition:background .2s ease;}
.puppetGlow::after{content:""; position:absolute; inset:14px; border-radius:50%; border:2px dashed color-mix(in srgb, var(--pc,var(--accent)) 60%, transparent); opacity:.55;}
.puppet{position:relative; z-index:1; font-size:108px; line-height:1; filter:drop-shadow(0 10px 14px rgba(0,0,0,.4)); transform-origin:50% 85%; will-change:transform; animation:idleBob 2.6s ease-in-out infinite;}
@keyframes idleBob{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-4px) rotate(-1.5deg);}}
.puppet.hitAnim{animation:squash .18s ease;}
@keyframes squash{0%{transform:scale(1,1) rotate(0deg);}35%{transform:scale(1.18,.78) rotate(-4deg);}65%{transform:scale(.9,1.12) rotate(3deg);}100%{transform:scale(1,1) rotate(0deg);}}
.puppet.koAnim{animation:koSpin .5s ease forwards;}
@keyframes koSpin{0%{transform:scale(1) rotate(0);opacity:1;}60%{transform:scale(1.3) rotate(25deg);opacity:1;}100%{transform:scale(.3) rotate(80deg) translateY(40px);opacity:0;}}
.bubbleLayer,.fxLayer{position:absolute; inset:0; pointer-events:none; overflow:visible;}
.bubble{position:absolute; background:#FFFDF8; color:#2B1B12; font-weight:700; font-size:13px; padding:6px 11px 6px 9px; border-left:4px solid var(--pc,var(--accent)); border-radius:14px; border-bottom-left-radius:3px; white-space:nowrap; box-shadow:0 4px 10px rgba(0,0,0,.25); animation:bubblePop .9s ease forwards;}
@keyframes bubblePop{0%{transform:translate(-50%,0) scale(.4); opacity:0;}15%{transform:translate(-50%,-4px) scale(1.05); opacity:1;}25%{transform:translate(-50%,-6px) scale(1); opacity:1;}80%{transform:translate(-50%,-26px) scale(1); opacity:1;}100%{transform:translate(-50%,-40px) scale(.92); opacity:0;}}
.particle{position:absolute; border-radius:50%; pointer-events:none;}
.popup{position:absolute; left:50%; font-family:"Baloo 2",sans-serif; font-weight:700; font-size:16px; white-space:nowrap; transform:translateX(-50%); animation:popupFloat .75s ease forwards; pointer-events:none;}
.popup.good{color:var(--gold);} .popup.crit{color:var(--accent); font-size:19px;} .popup.bonus{color:var(--good);}
@keyframes popupFloat{0%{opacity:0; transform:translate(-50%,0) scale(.7);}20%{opacity:1; transform:translate(-50%,-10px) scale(1.1);}100%{opacity:0; transform:translate(-50%,-52px) scale(1);}}

.ringEl{animation-duration:.26s; animation-timing-function:ease-in-out;}
.shk1{animation-name:shk1;} .shk2{animation-name:shk2;} .shk3{animation-name:shk3;}
@keyframes shk1{0%,100%{transform:translate(0,0);}50%{transform:translate(1px,-1px);}}
@keyframes shk2{0%,100%{transform:translate(0,0);}25%{transform:translate(-3px,2px) rotate(-.4deg);}75%{transform:translate(3px,-2px) rotate(.4deg);}}
@keyframes shk3{0%,100%{transform:translate(0,0);}20%{transform:translate(-6px,4px) rotate(-.9deg);}60%{transform:translate(6px,-4px) rotate(.9deg);}85%{transform:translate(-3px,2px);}}

.actions{display:flex; gap:8px; margin-top:14px;}
.btn{flex:1; border:none; border-radius:14px; padding:13px; font-family:"Baloo 2",sans-serif; font-weight:700; font-size:15px; cursor:pointer; background:var(--accent); color:var(--accent-ink);}
.btnGhost{background:var(--bg-raise); color:var(--fg); border:1px solid var(--line);}
.bestRow{margin-top:10px; text-align:center; font-size:12.5px; color:var(--fg-dim);}
.bestRow b{color:var(--fg); font-variant-numeric:tabular-nums;}

.overlay{position:fixed; inset:0; background:rgba(20,14,10,.6); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s ease;}
.overlay.on{opacity:1; pointer-events:auto;}
.overlay .card{background:var(--bg-raise); border-radius:20px; padding:26px 22px; width:100%; max-width:340px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.35);}
.overlay h2{font-size:22px; margin-bottom:6px;}
.overlay p{color:var(--fg-dim); font-size:13.5px; margin:0 0 16px;}
.durRow{display:flex; gap:8px;}
.durBtn{flex:1; padding:14px 0; border-radius:14px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font-family:"Baloo 2",sans-serif; font-weight:700; font-size:16px; cursor:pointer;}
.durBtn:active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.endScore{font-family:"Baloo 2",sans-serif; font-size:34px; font-weight:800; color:var(--accent); margin:4px 0 14px;}
.endStatsRow{display:flex; gap:10px; margin-bottom:18px;}
.endStatsRow div{flex:1; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 0;}
.endStatsRow span{display:block; font-family:"Baloo 2",sans-serif; font-size:19px; font-weight:700;}
.endStatsRow label{font-size:11px; color:var(--fg-dim);}
[hidden]{display:none!important;}
</style>

<script>
(function(){
"use strict";

var PUPPETS = [
  {id:'client', icon:'😤', name:'難搞甲方', tagline:'改稿無限輪迴，今天改第 17 版', color:'#FF5A36', prop:'🎨', hp:5, value:7,
    hits:['改一下配色！','字再大一點！','重做！','這不是我要的感覺','明天早上要'],
    ko:'終於不吵了…'},
  {id:'boss', icon:'🙄', name:'甩鍋主管', tagline:'功勞他拿，責任你扛', color:'#8E6CCB', prop:'👔', hp:7, value:10,
    hits:['這個你來扛','我當時沒說過喔','再想想辦法','這很簡單吧？'],
    ko:'功勞都是他的！'},
  {id:'gossip', icon:'😏', name:'愛插嘴同事', tagline:'開會十分鐘，他講八分鐘', color:'#E85DAE', prop:'💬', hp:4, value:5,
    hits:['我覺得喔…','其實應該要…','你聽我說完','這樣不對吧'],
    ko:'終於閉嘴了'},
  {id:'ghost', icon:'📱', name:'已讀不回王', tagline:'已讀三天，回覆永遠在路上', color:'#3FB6D3', prop:'👻', hp:4, value:5,
    hits:['（已讀）','（已讀）','（已讀）','...'],
    ko:'已讀，不回'},
  {id:'alarm', icon:'⏰', name:'早八鬧鐘', tagline:'每天清晨準時摧毀你的夢', color:'#FFB13D', prop:'😫', hp:3, value:4,
    hits:['逼逼逼！','起床啦！','遲到囉！'],
    ko:'終於安靜了'},
  {id:'lazy', icon:'😴', name:'裝忙同事', tagline:'滑鼠動一動，假裝在工作', color:'#6FBE7A', prop:'🖱️', hp:3, value:4,
    hits:['我超忙的','等等再弄','今天真的很累'],
    ko:'裝睡裝不下去了'},
  {id:'bill', icon:'🧾', name:'帳單怪', tagline:'月初發薪，月底見底', color:'#4F8FE0', prop:'💸', hp:6, value:8,
    hits:['繳費期限到了','又要扣款囉','利息算你的'],
    ko:'月底總算喘口氣'},
  {id:'rude', icon:'🤡', name:'奧客', tagline:'一句「叫主管來」行走江湖', color:'#E0443A', prop:'📢', hp:6, value:9,
    hits:['我要客訴！','便宜一點啦','叫你們主管來'],
    ko:'終於走了'}
];

function multFor(c){ if(c>=28) return 5; if(c>=18) return 4; if(c>=10) return 3; if(c>=5) return 2; return 1; }

var RANKS = [
  {min:0, title:'紓壓新手'},
  {min:200, title:'情緒出口達人'},
  {min:500, title:'人形沙包剋星'},
  {min:1000, title:'壓力粉碎機'},
  {min:1800, title:'傳說級拳王・辦公室之神'}
];
function rankFor(score){ var r=RANKS[0]; for(var i=0;i<RANKS.length;i++){ if(score>=RANKS[i].min) r=RANKS[i]; } return r.title; }

var WEAPONS = {
  bat:    { icon:'🥊', name:'拳套',   dmg:1, cooldown:130 },
  hammer: { icon:'🔨', name:'鐵鎚',   dmg:2, cooldown:380 },
  heels:  { icon:'👠', name:'高跟鞋', dmg:1, cooldown:90  }
};
var ULT_MOVES = ['旋風連擊','怒氣總清算','終極直拳KO','憤怒大爆發'];

var statTime=document.getElementById('statTime'), statScore=document.getElementById('statScore'),
    statCombo=document.getElementById('statCombo'), multBadge=document.getElementById('multBadge'),
    puppetEl=document.getElementById('puppetEl'), puppetName=document.getElementById('puppetName'),
    puppetNameText=document.getElementById('puppetNameText'), puppetProp=document.getElementById('puppetProp'),
    puppetTagline=document.getElementById('puppetTagline'),
    hpFill=document.getElementById('hpFill'), punchZone=document.getElementById('punchZone'),
    bubbleLayer=document.getElementById('bubbleLayer'), fxLayer=document.getElementById('fxLayer'),
    ring=document.getElementById('ring'), guestBanner=document.getElementById('guestBanner'),
    startOv=document.getElementById('startOv'), endOv=document.getElementById('endOv'),
    endScore=document.getElementById('endScore'), rankTitle=document.getElementById('rankTitle'),
    endKO=document.getElementById('endKO'), endMaxCombo=document.getElementById('endMaxCombo'),
    bestVal=document.getElementById('bestVal'), btnPause=document.getElementById('btnPause'),
    btnRestart=document.getElementById('btnRestart'), btnAgain=document.getElementById('btnAgain'),
    infoBtn=document.getElementById('infoBtn'), infoPanel=document.getElementById('infoPanel'),
    bombBtn=document.getElementById('bombBtn'), bombCountEl=document.getElementById('bombCount'),
    ultBarFill=document.getElementById('ultBarFill'), ultPct=document.getElementById('ultPct'), ultBtn=document.getElementById('ultBtn');

var score=0, combo=0, maxCombo=0, koCount=0, timeLeft=60, duration=60, lastHitTime=0, running=false, paused=false;
var cur=null, lastQuoteIdx={}, timerInt=null, guestActive=false, guestTimeout=null, nextGuestAt=0, elapsed=0;
var activeWeapon='bat', lastActionTime=0, bombCount=2, ultMeter=0;

infoBtn.addEventListener('click', function(){ infoPanel.hidden = !infoPanel.hidden; });

// ---------- audio ----------
var actx=null;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(f,t0,dur,type,vol,slideTo){
  var c=ac(); if(!c) return;
  var o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f, c.currentTime+t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), c.currentTime+t0+dur);
  g.gain.setValueAtTime(0.0001, c.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(vol||0.2, c.currentTime+t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+t0+dur);
  o.connect(g).connect(c.destination);
  o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+0.02);
}
function noiseBurst(t0,dur,freq,q,vol){
  var c=ac(); if(!c) return;
  var n=c.createBufferSource(), buf=c.createBuffer(1, c.sampleRate*dur, c.sampleRate), data=buf.getChannelData(0);
  for(var i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*(1-i/data.length);
  n.buffer=buf;
  var f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1200; f.Q.value=q||1.2;
  var g=c.createGain(); g.gain.setValueAtTime(vol||0.25, c.currentTime+t0); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+t0+dur);
  n.connect(f).connect(g).connect(c.destination);
  n.start(c.currentTime+t0); n.stop(c.currentTime+t0+dur+0.02);
}
function punchSFX(crit){
  noiseBurst(0, crit?0.12:0.08, crit?900:700, 1.4, crit?0.4:0.28);
  tone(crit?180:140, 0, 0.1, 'square', crit?0.22:0.14, crit?70:60);
}
function boingSFX(){ tone(520,0,0.18,'triangle',0.18,180); tone(780,0.03,0.12,'sine',0.12,260); }
function koSFX(){ tone(300,0,0.1,'square',0.2,500); tone(500,0.08,0.1,'square',0.18,700); tone(700,0.16,0.18,'square',0.2,1000); }
function comboStinger(mult){ if(mult<2) return; var base=260+mult*60; tone(base,0,0.08,'square',0.14,base*1.5); tone(base*1.5,0.05,0.08,'square',0.12,base*2); }
function guestSFX(){ tone(600,0,0.08,'sine',0.2,900); tone(900,0.08,0.1,'sine',0.18,1300); }
function bonusSFX(){ tone(700,0,0.07,'triangle',0.18,1100); tone(1000,0.07,0.09,'triangle',0.16,1400); tone(1300,0.14,0.12,'triangle',0.14,1700); }
function tickSFX(){ tone(880,0,0.05,'sine',0.08); }
function ultSFX(){ tone(392,0,0.09,'square',0.2,500); tone(523,0.08,0.09,'square',0.2,700); tone(659,0.16,0.09,'square',0.2,900); tone(880,0.24,0.22,'square',0.24,1300); }

// ---------- particles ----------
var particles=[], rafId=null;
function ensureLoop(){ if(rafId) return; rafId=requestAnimationFrame(stepParticles); }
function stepParticles(){
  rafId=null;
  if(particles.length){
    for(var i=particles.length-1;i>=0;i--){
      var p=particles[i];
      p.age+=16; p.vy+=0.28; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      if(!p.el){ p.el=document.createElement('div'); p.el.className='particle'; p.el.style.width=p.size+'px'; p.el.style.height=p.size+'px'; p.el.style.background=p.color; fxLayer.appendChild(p.el); }
      p.el.style.transform='translate('+p.x+'px,'+p.y+'px) rotate('+p.rot+'deg)';
      p.el.style.opacity=Math.max(0,1-p.age/p.life);
      if(p.age>p.life){ p.el.remove(); particles.splice(i,1); }
    }
  }
  if(particles.length) ensureLoop();
}
function burst(x,y,color,count){
  for(var i=0;i<count;i++){
    var ang=Math.random()*Math.PI*2, spd=2+Math.random()*4;
    particles.push({x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-2,rot:0,vr:(Math.random()-0.5)*20,size:4+Math.random()*6,color:color,age:0,life:500+Math.random()*300,el:null});
  }
  ensureLoop();
}

function shake(mag){
  ring.classList.remove('shk1','shk2','shk3');
  void ring.offsetWidth;
  ring.classList.add('ringEl', mag>=3?'shk3':(mag>=2?'shk2':'shk1'));
  clearTimeout(shake._t);
  shake._t=setTimeout(function(){ ring.classList.remove('shk1','shk2','shk3'); }, 280);
}

function popupAt(x,y,text,cls){
  var el=document.createElement('div');
  el.className='popup '+(cls||'good');
  el.textContent=text;
  el.style.top=y+'px'; el.style.left=x+'px';
  fxLayer.appendChild(el);
  setTimeout(function(){ el.remove(); }, 780);
}
function bubbleAt(text){
  var el=document.createElement('div');
  el.className='bubble';
  el.textContent=text;
  var zx=punchZone.clientWidth/2 + (Math.random()*60-30);
  var zy=20+Math.random()*20;
  el.style.left=zx+'px'; el.style.top=zy+'px';
  bubbleLayer.appendChild(el);
  setTimeout(function(){ el.remove(); }, 900);
}

// ---------- puppet lifecycle ----------
function pickPuppet(excludeId){
  var pool = PUPPETS.filter(function(p){ return p.id!==excludeId; });
  return pool[Math.floor(Math.random()*pool.length)];
}
function spawnPuppet(){
  var def = pickPuppet(cur ? cur.def.id : null);
  cur = { def:def, hp:def.hp, maxHp:def.hp };
  puppetEl.textContent = def.icon;
  puppetEl.classList.remove('koAnim');
  puppetNameText.textContent = def.name;
  puppetProp.textContent = def.prop || '';
  puppetTagline.textContent = def.tagline || '';
  ring.style.setProperty('--pc', def.color || '#FF5A36');
  hpFill.style.width='100%';
  lastQuoteIdx[def.id] = -1;
}
function quoteFor(def){
  var hits=def.hits;
  var idx = Math.floor(Math.random()*hits.length);
  if(hits.length>1 && idx===lastQuoteIdx[def.id]) idx=(idx+1)%hits.length;
  lastQuoteIdx[def.id]=idx;
  return hits[idx];
}

function destroyCurrent(bonusMult){
  var def=cur.def;
  var mult=multFor(combo);
  var gain = Math.round(def.value * mult * (bonusMult||1));
  score += gain;
  koCount++;
  statScore.textContent=score;
  bubbleAt(def.ko);
  popupAt(punchZone.clientWidth/2, 70, '+'+gain+' KO!', 'crit');
  koSFX();
  burst(punchZone.clientWidth/2, punchZone.clientHeight/2, '#FFC83D', 22);
  shake(3);
  puppetEl.classList.add('koAnim');
  setTimeout(function(){ if(running && !paused) spawnPuppet(); }, 260);
}

function setUltMeter(v){
  ultMeter = Math.max(0, Math.min(100, v));
  ultBarFill.style.width = ultMeter+'%';
  ultPct.textContent = Math.floor(ultMeter)+'%';
  if(ultMeter>=100){ ultBtn.classList.add('ready'); ultBtn.textContent='⚡ 釋放絕招！'; }
  else { ultBtn.classList.remove('ready'); ultBtn.textContent='蓄力中…'; }
}

function hit(clientX, clientY){
  if(!running || paused || !cur) return;
  var weapon = WEAPONS[activeWeapon];
  var now=performance.now();
  if(now-lastActionTime < weapon.cooldown) return;
  lastActionTime = now;
  if(now-lastHitTime>700) combo=0;
  combo++; maxCombo=Math.max(maxCombo,combo);
  lastHitTime=now;
  var mult=multFor(combo);
  multBadge.textContent='x'+mult;
  statCombo.firstChild.textContent=combo;

  var crit = Math.random()<0.12;
  var guestBonus = guestActive;

  var dmg = crit?weapon.dmg+1:weapon.dmg;
  cur.hp -= dmg;
  hpFill.style.width = Math.max(0,(cur.hp/cur.maxHp)*100)+'%';

  puppetEl.classList.remove('hitAnim'); void puppetEl.offsetWidth; puppetEl.classList.add('hitAnim');
  bubbleAt(quoteFor(cur.def));
  burst(punchZone.clientWidth/2, punchZone.clientHeight/2, crit?'#FF5A36':'#F5E8D8', crit?14:8);
  shake(crit?2:1);
  punchSFX(crit);
  if(mult>1 && combo%5===0) comboStinger(mult);
  if(ultMeter<100) setUltMeter(ultMeter + (crit?15:8));

  var baseGain = Math.round(2*mult*weapon.dmg);
  if(crit){ baseGain*=2; popupAt(punchZone.clientWidth/2, 60, '會心一擊!', 'crit'); }
  if(guestBonus){
    baseGain += 40;
    popupAt(punchZone.clientWidth/2, 90, '+40 嘉賓加成!', 'bonus');
    bonusSFX();
    endGuest(true);
  } else if(!crit){
    popupAt(punchZone.clientWidth/2+(Math.random()*30-15), 60, '+'+baseGain, 'good');
  }
  score += baseGain;
  statScore.textContent=score;

  if(cur.hp<=0){ destroyCurrent(1); }
}

document.querySelectorAll('.wBtn').forEach(function(b){
  b.addEventListener('click', function(){
    activeWeapon = b.dataset.w;
    document.querySelectorAll('.wBtn').forEach(function(x){ x.classList.toggle('active', x===b); });
  });
});

bombBtn.addEventListener('click', function(){
  if(!running || paused || !cur || bombCount<=0) return;
  bombCount--;
  bombCountEl.textContent='x'+bombCount;
  if(bombCount<=0) bombBtn.disabled=true;
  popupAt(punchZone.clientWidth/2, 50, '🧨 爆破攻擊!', 'crit');
  shake(3);
  destroyCurrent(2);
});

ultBtn.addEventListener('click', function(){
  if(!running || paused || !cur || ultMeter<100) return;
  var moveName = ULT_MOVES[Math.floor(Math.random()*ULT_MOVES.length)];
  setUltMeter(0);
  popupAt(punchZone.clientWidth/2, 40, '✨ '+moveName+' ✨', 'crit');
  burst(punchZone.clientWidth/2, punchZone.clientHeight/2, '#FFC83D', 30);
  shake(3);
  ultSFX();
  destroyCurrent(3);
});

var holdPoint=null, holdInterval=null;
punchZone.addEventListener('pointerdown', function(e){
  e.preventDefault();
  try{ punchZone.setPointerCapture(e.pointerId); }catch(err){}
  hit(e.clientX, e.clientY);
});
punchZone.addEventListener('contextmenu', function(e){ e.preventDefault(); });

// ---------- guest event ----------
function scheduleGuest(){
  nextGuestAt = elapsed + 9 + Math.random()*8;
}
function maybeTriggerGuest(){
  if(!running || paused || guestActive) return;
  if(elapsed>=nextGuestAt && timeLeft>6){
    guestActive=true;
    guestBanner.hidden=false;
    guestSFX();
    guestTimeout=setTimeout(function(){ endGuest(false); }, 1700);
  }
}
function endGuest(hit){
  guestActive=false;
  guestBanner.hidden=true;
  clearTimeout(guestTimeout);
  scheduleGuest();
}

// ---------- game loop ----------
function tick(){
  if(paused) return;
  elapsed++;
  timeLeft--;
  statTime.textContent=Math.max(0,timeLeft);
  if(timeLeft<=5 && timeLeft>0) tickSFX();
  maybeTriggerGuest();
  if(timeLeft<=0) endGame();
}

function loadBest(d){ try{ var o=JSON.parse(localStorage.getItem('stressbox_best')||'{}'); return o[d]||0; }catch(e){ return 0; } }
function saveBest(d,v){ try{ var o=JSON.parse(localStorage.getItem('stressbox_best')||'{}'); if(!o[d]||v>o[d]){ o[d]=v; localStorage.setItem('stressbox_best', JSON.stringify(o)); } }catch(e){} }

function startGame(d){
  duration=d; timeLeft=d; elapsed=0;
  score=0; combo=0; maxCombo=0; koCount=0; guestActive=false;
  statScore.textContent='0'; statCombo.firstChild.textContent='0'; multBadge.textContent='x1';
  statTime.textContent=d;
  bestVal.textContent=loadBest(d);
  guestBanner.hidden=true;
  activeWeapon='bat'; lastActionTime=0;
  document.querySelectorAll('.wBtn').forEach(function(x){ x.classList.toggle('active', x.dataset.w==='bat'); });
  bombCount=2; bombCountEl.textContent='x2'; bombBtn.disabled=false;
  setUltMeter(0);
  startOv.classList.remove('on'); endOv.classList.remove('on');
  spawnPuppet();
  scheduleGuest();
  running=true; paused=false;
  clearInterval(timerInt);
  timerInt=setInterval(tick, 1000);
}

function endGame(){
  running=false;
  clearInterval(timerInt);
  clearTimeout(guestTimeout);
  guestBanner.hidden=true;
  saveBest(duration, score);
  endScore.textContent=score;
  rankTitle.textContent=rankFor(score);
  endKO.textContent=koCount;
  endMaxCombo.textContent=maxCombo;
  endOv.classList.add('on');
}

document.querySelectorAll('.durBtn').forEach(function(b){
  b.addEventListener('click', function(){ startGame(parseInt(b.dataset.dur,10)); });
});
btnAgain.addEventListener('click', function(){
  endOv.classList.remove('on');
  startOv.classList.add('on');
});
btnRestart.addEventListener('click', function(){
  if(!running && !startOv.classList.contains('on')) return;
  clearInterval(timerInt); clearTimeout(guestTimeout);
  running=false;
  endOv.classList.remove('on');
  startOv.classList.add('on');
});
btnPause.addEventListener('click', function(){
  if(!running) return;
  paused=!paused;
  btnPause.textContent = paused?'繼續':'暫停';
});

if (window.GMB) GMB.init({style:'circuit', button:true, key:'stressbox_bgm_off'});

window.__dbg = {
  get cur(){ return cur; },
  get combo(){ return combo; },
  get guestActive(){ return guestActive; },
  get activeWeapon(){ return activeWeapon; },
  get ultMeter(){ return ultMeter; },
  get bombCount(){ return bombCount; },
  setUltMeter: setUltMeter,
  hit: hit
};
})();
</script>

</body>
</html>
