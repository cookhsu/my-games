<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>夜光籃球機</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0E0A1F; --org:#FF7A2F; --org2:#FFB36B; --txt:#FFF4E6; --dim:#B8A9D9; --cy:#5CE1FF; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:'Noto Sans TC',system-ui,sans-serif; overflow:hidden; }
  body{ display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 0%, #3A1B5E 0%, #0E0A1F 65%); }
  .wrap{ position:relative; width:min(100vw, calc(100vh * 0.6)); aspect-ratio:360/600; max-height:100vh; border-radius:18px; overflow:hidden; box-shadow:0 20px 70px rgba(0,0,0,.65), 0 0 0 2px rgba(255,255,255,.08); touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }
  .ov{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; background:radial-gradient(ellipse at 20% 10%, rgba(255,110,150,.28), transparent 55%), radial-gradient(ellipse at 85% 90%, rgba(70,150,255,.25), transparent 55%), linear-gradient(180deg, rgba(70,28,110,.95), rgba(10,6,24,.97)); }
  .ov.hidden{ display:none; }
  h1{ margin:0; font-weight:900; font-size:clamp(34px,11vw,52px); letter-spacing:4px; color:var(--org); background:linear-gradient(180deg,#FFE2A8,#FF7A2F 60%,#E0501A); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 4px 0 #7A2800) drop-shadow(0 0 18px rgba(255,122,47,.55)); }
  .en{ font-weight:900; letter-spacing:6px; font-size:13px; color:var(--cy); margin-top:-8px; }
  p{ margin:0; color:var(--dim); font-size:13.5px; line-height:1.9; max-width:280px; }
  .ball{ font-size:70px; animation:bob 1.6s ease-in-out infinite; filter:drop-shadow(0 0 18px rgba(255,122,47,.6)); }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-8deg); } 50%{ transform:translateY(-14px) rotate(8deg); } }
  .btn{ font:900 17px 'Noto Sans TC',sans-serif; letter-spacing:2px; color:#2A1000; background:linear-gradient(180deg,#FFC285,#FF7A2F); border:none; padding:14px 34px; border-radius:999px; cursor:pointer; box-shadow:0 5px 0 #A53F00, 0 0 24px rgba(255,122,47,.45); }
  .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #A53F00; }
  .btn.g{ color:var(--txt); background:linear-gradient(180deg,#4A3478,#33215A); box-shadow:0 5px 0 #1B1033; font-size:14px; padding:11px 24px; text-decoration:none; display:inline-block; }
  .stats{ display:flex; gap:12px; }
  .stat{ min-width:96px; padding:10px 12px; border-radius:14px; background:linear-gradient(150deg,rgba(255,150,90,.22),rgba(110,70,210,.2) 55%,rgba(92,225,255,.16)); border:1px solid rgba(255,255,255,.18); }
  .stat b{ display:block; font-size:28px; background:linear-gradient(180deg,#FFE9C2,#FF8A3D); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .stat span{ font-size:11px; color:var(--dim); letter-spacing:2px; }
  .new{ color:#FFE24A; font-weight:900; letter-spacing:3px; }
  .btn:focus-visible{ outline:3px solid var(--cy); outline-offset:3px; }
  .back{ position:absolute; left:10px; top:10px; z-index:5; font-size:12px; font-weight:700; color:var(--txt); text-decoration:none; background:rgba(10,6,24,.55); border:1px solid rgba(255,255,255,.18); padding:5px 10px; border-radius:999px; backdrop-filter:blur(4px); }
  .mus{ position:absolute; right:10px; top:10px; z-index:5; width:34px; height:30px; font-size:15px; color:var(--txt); background:rgba(10,6,24,.55); border:1px solid rgba(255,255,255,.18); border-radius:999px; cursor:pointer; }
  @media (prefers-reduced-motion:reduce){ .ball{ animation:none; } }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <canvas id="cv" aria-label="投籃遊戲畫面"></canvas>
  <a class="back" href="index.html">← 大廳</a>
  <button class="mus" id="mus" aria-label="音樂開關">🎵</button>
  <div class="ov" id="menu">
    <div class="ball" aria-hidden="true">🏀</div>
    <h1>夜光籃球機</h1>
    <div class="en">MIDNIGHT HOOPS</div>
    <p>往後拉、放開就投籃。<br>空心入網得 3 分還會加時間，<br>連進 3 球起，每球多 1 分。</p>
    <button class="btn" id="start">開始投籃</button>
    <div style="font-size:12px;color:var(--dim)" id="bestLine"></div>
  </div>
  <div class="ov hidden" id="over">
    <h1 style="font-size:36px">時間到！</h1>
    <div class="stats"><div class="stat"><b id="rScore">0</b><span>得分</span></div><div class="stat"><b id="rBest">0</b><span>最高分</span></div></div>
    <div class="stats"><div class="stat"><b id="rMade">0</b><span>進球</span></div><div class="stat"><b id="rSwish">0</b><span>空心球</span></div></div>
    <div class="new" id="rNew"></div>
    <button class="btn" id="again">再來一局</button>
    <a class="btn g" href="index.html">回遊戲大廳</a>
  </div>
</div>
<script>
(function(){
  "use strict";
  var W = 360, H = 600, R = 14, G = 900, FLOOR = 548, RW = 24, RR = 4, TIME0 = 60;
  var $ = function(id){ return document.getElementById(id); };
  var cv = $('cv'), ctx = cv.getContext('2d'), DPR = 1;
  function resize(){ DPR = Math.min(2.5, window.devicePixelRatio || 1); var r = cv.getBoundingClientRect(); cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR); }
  window.addEventListener('resize', resize); resize();
  function rnd(a, b){ return a + Math.random() * (b - a); }
  function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { /* ignore */ } return null; }

  // ---------- 狀態 ----------
  var state = 'menu', time = TIME0, score = 0, made = 0, swishes = 0, streak = 0, best = +(store('bb_best') || 0), shots = 0;
  var hoop = { bx: 255, by: 270, x: 255, y: 270, t: 0, amp: 0 };
  var ball = { x: 90, y: 500, vx: 0, vy: 0, rot: 0, rv: 0, mode: 'ready', touched: false, scored: false, age: 0, floorHits: 0 };
  var aim = null, rings = [], bats = [], parts = [], pops = [], trail = [], netSwing = 0, shake = 0, clock = 0, gameOverPending = false;

  // ---------- 音效 ----------
  var AC = null, master = null, musicOn = store('bb_music') !== '0', musicTimer = null, nextT = 0, step16 = 0;
  function audio(){
    if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination); } catch (e) { AC = null; } }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f, d, type, vol, f2, t0, dest){
    if (!AC) return; t0 = t0 || AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    g.gain.setValueAtTime(vol || 0.2, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d); o.connect(g); g.connect(dest || master); o.start(t0); o.stop(t0 + d + 0.02);
  }
  function noise(d, vol, hp, t0, lp){
    if (!AC) return; t0 = t0 || AC.currentTime;
    var n = Math.floor(AC.sampleRate * d), b = AC.createBuffer(1, n, AC.sampleRate), a = b.getChannelData(0); for (var i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = AC.createBufferSource(); s.buffer = b; var f = AC.createBiquadFilter(); f.type = lp ? 'lowpass' : 'highpass'; f.frequency.value = hp; var g = AC.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start(t0);
  }
  var sfx = {
    bounce: function(v){ if (AC) tone(130, 0.12, 'sine', Math.min(0.35, v / 900), 60); },
    rim: function(){ if (AC){ tone(640, 0.16, 'triangle', 0.18, 420); tone(1280, 0.08, 'sine', 0.06); } },
    board: function(){ if (AC) tone(180, 0.1, 'square', 0.1, 120); },
    swish: function(){ if (AC){ noise(0.35, 0.25, 3500); tone(900, 0.25, 'sine', 0.06, 1400); } },
    score: function(){ if (AC){ tone(523, 0.12, 'triangle', 0.14); tone(659, 0.12, 'triangle', 0.14, null, AC.currentTime + 0.07); tone(784, 0.2, 'triangle', 0.14, null, AC.currentTime + 0.14); } },
    shoot: function(){ if (AC) noise(0.12, 0.1, 1800); },
    tick: function(){ if (AC) tone(1000, 0.06, 'square', 0.08); },
    buzz: function(){ if (AC){ tone(140, 0.7, 'sawtooth', 0.22); tone(146, 0.7, 'sawtooth', 0.18); } }
  };
  var BASS = [55, 0, 55, 0, 65.4, 0, 55, 0, 73.4, 0, 73.4, 0, 65.4, 0, 49, 0], LEAD = [0, 0, 440, 0, 0, 523, 0, 392, 0, 0, 440, 0, 587, 0, 523, 0];
  function musicTick(){
    if (!AC || !musicOn || state !== 'play') return;
    while (nextT < AC.currentTime + 0.25){
      var i = step16 % 16, t = Math.max(nextT, AC.currentTime);
      if (i % 4 === 0) tone(110, 0.14, 'sine', 0.28, 45, t);
      if (i % 4 === 2) noise(0.05, 0.08, 7000, t);
      if (i % 8 === 4) noise(0.12, 0.1, 1500, t);
      if (BASS[i]) tone(BASS[i], 0.2, 'sawtooth', 0.07, null, t);
      if (LEAD[i]) tone(LEAD[i], 0.16, 'triangle', 0.045, null, t);
      nextT += 60 / 104 / 4; step16++;
    }
  }
  function setMusic(){ $('mus').textContent = musicOn ? '🎵' : '🔇'; store('bb_music', musicOn ? '1' : '0'); }
  $('mus').addEventListener('click', function(e){ e.stopPropagation(); musicOn = !musicOn; setMusic(); audio(); nextT = AC ? AC.currentTime : 0; });
  setMusic();

  // ---------- 背景預繪 ----------
  function rrect(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r); c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath(); }
  var BG = document.createElement('canvas'); BG.width = W * 2; BG.height = H * 2;
  var STARS = [];
  (function(){
    var c = BG.getContext('2d'); c.scale(2, 2); var i, x, w, h;
    var g = c.createLinearGradient(0, 0, 0, FLOOR); g.addColorStop(0, '#0A0520'); g.addColorStop(0.32, '#26104A'); g.addColorStop(0.62, '#6A2A6E'); g.addColorStop(0.86, '#D9566F'); g.addColorStop(1, '#FFB067'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    var wash = c.createLinearGradient(0, 0, W, 0); wash.addColorStop(0, 'rgba(40,120,255,.22)'); wash.addColorStop(0.5, 'rgba(160,60,220,.12)'); wash.addColorStop(1, 'rgba(255,70,140,.24)'); c.fillStyle = wash; c.fillRect(0, 0, W, FLOOR);
    [[250, 190, 190, 'rgba(150,80,230,.28)'], [40, 330, 170, 'rgba(255,90,160,.2)'], [320, 400, 150, 'rgba(255,150,90,.22)']].forEach(function(a){ var rg = c.createRadialGradient(a[0], a[1], 0, a[0], a[1], a[2]); rg.addColorStop(0, a[3]); rg.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = rg; c.fillRect(0, 0, W, FLOOR); });
    for (i = 0; i < 80; i++){ c.fillStyle = 'rgba(255,255,255,' + rnd(0.15, 0.7) + ')'; c.beginPath(); c.arc(rnd(0, W), rnd(0, 280), rnd(0.3, 1.2), 0, 6.283); c.fill(); }
    for (i = 0; i < 22; i++) STARS.push({ x: rnd(10, W - 10), y: rnd(60, 260), p: rnd(0, 6.283), s: rnd(1.2, 2.6) });
    // 月亮
    var mg = c.createRadialGradient(72, 118, 6, 72, 118, 110); mg.addColorStop(0, 'rgba(255,238,190,.85)'); mg.addColorStop(0.2, 'rgba(255,214,150,.35)'); mg.addColorStop(1, 'rgba(255,190,120,0)'); c.fillStyle = mg; c.fillRect(0, 0, 220, 260);
    var mo = c.createRadialGradient(66, 112, 2, 72, 118, 26); mo.addColorStop(0, '#FFFBEA'); mo.addColorStop(1, '#FFE2A6'); c.fillStyle = mo; c.beginPath(); c.arc(72, 118, 25, 0, 6.283); c.fill();
    c.fillStyle = 'rgba(210,170,110,.35)'; [[64, 112, 5], [80, 124, 4], [70, 128, 2.6], [82, 108, 2.4]].forEach(function(k){ c.beginPath(); c.arc(k[0], k[1], k[2], 0, 6.283); c.fill(); });
    // 遠景天際線
    x = -10; while (x < W){ w = rnd(22, 46); h = rnd(110, 230); var fgr = c.createLinearGradient(0, FLOOR - h, 0, FLOOR); fgr.addColorStop(0, 'rgba(120,70,190,.85)'); fgr.addColorStop(1, 'rgba(60,28,100,.8)'); c.fillStyle = fgr; c.fillRect(x, FLOOR - h, w, h); x += w + rnd(0, 4); }
    var hz = c.createLinearGradient(0, FLOOR - 230, 0, FLOOR); hz.addColorStop(0, 'rgba(255,140,110,0)'); hz.addColorStop(1, 'rgba(255,150,100,.45)'); c.fillStyle = hz; c.fillRect(0, FLOOR - 230, W, 230);
    // 中景（霓虹與窗）
    var neon = [['#FF4FA8', 'BAR'], ['#4FE8FF', '24H'], ['#FFE24A', 'PIZZA'], ['#8F6BFF', 'HOOP']], nk = 0;
    x = 0; while (x < W){ w = rnd(34, 62); h = rnd(90, 190); var bgr = c.createLinearGradient(0, FLOOR - h, 0, FLOOR); bgr.addColorStop(0, '#41206E'); bgr.addColorStop(0.5, '#220F42'); bgr.addColorStop(1, '#100622'); c.fillStyle = bgr; c.fillRect(x, FLOOR - h, w, h);
      var sd = c.createLinearGradient(x, 0, x + w, 0); sd.addColorStop(0, 'rgba(255,120,170,.16)'); sd.addColorStop(0.4, 'rgba(255,120,170,0)'); sd.addColorStop(1, 'rgba(0,0,0,.25)'); c.fillStyle = sd; c.fillRect(x, FLOOR - h, w, h);
      c.fillStyle = 'rgba(255,200,120,.75)'; for (var wy = FLOOR - h + 8; wy < FLOOR - 10; wy += 13) for (var wx = x + 5; wx < x + w - 6; wx += 9) if (Math.random() < 0.34){ c.fillStyle = Math.random() < 0.8 ? 'rgba(255,205,120,.8)' : 'rgba(140,230,255,.8)'; c.fillRect(wx, wy, 4, 6); }
      if (w > 44 && nk < 4 && Math.random() < 0.7){ var nc = neon[nk++]; c.save(); c.shadowColor = nc[0]; c.shadowBlur = 12; c.fillStyle = nc[0]; c.font = "900 11px 'Noto Sans TC',sans-serif"; c.textAlign = 'center'; c.fillText(nc[1], x + w / 2, FLOOR - h + rnd(40, 80)); c.restore(); }
      c.fillStyle = '#190C34'; c.fillRect(x + w * 0.45, FLOOR - h - 12, 2, 12); x += w + rnd(0, 5); }
    // 圍欄
    c.strokeStyle = 'rgba(20,10,40,.7)'; c.lineWidth = 0.9; for (i = -40; i < W + 40; i += 9){ c.beginPath(); c.moveTo(i, FLOOR - 70); c.lineTo(i + 70, FLOOR); c.stroke(); c.beginPath(); c.moveTo(i + 70, FLOOR - 70); c.lineTo(i, FLOOR); c.stroke(); }
    c.fillStyle = '#0D0620'; c.fillRect(0, FLOOR - 72, W, 3); for (i = 6; i < W; i += 74) c.fillRect(i, FLOOR - 74, 3, 74);
    // 路燈
    c.fillStyle = '#0D0620'; c.fillRect(18, FLOOR - 200, 4, 200); c.fillRect(8, FLOOR - 204, 24, 4);
    var lg = c.createRadialGradient(20, FLOOR - 200, 0, 20, FLOOR - 200, 70); lg.addColorStop(0, 'rgba(255,230,160,.8)'); lg.addColorStop(1, 'rgba(255,200,120,0)'); c.fillStyle = lg; c.fillRect(-60, FLOOR - 270, 160, 140); c.fillStyle = '#FFF1BF'; c.beginPath(); c.arc(20, FLOOR - 198, 4, 0, 6.283); c.fill();
    // 球場地板
    var fg = c.createLinearGradient(0, FLOOR, 0, H); fg.addColorStop(0, '#A55A30'); fg.addColorStop(0.35, '#6B3418'); fg.addColorStop(1, '#2A1209'); c.fillStyle = fg; c.fillRect(0, FLOOR, W, H - FLOOR);
    for (i = 0; i < W; i += 22){ c.fillStyle = (i / 22) % 2 ? 'rgba(255,200,140,.05)' : 'rgba(0,0,0,.08)'; c.fillRect(i, FLOOR, 22, H - FLOOR); }
    c.strokeStyle = 'rgba(255,230,190,.55)'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, FLOOR + 1); c.lineTo(W, FLOOR + 1); c.stroke();
    c.strokeStyle = 'rgba(255,240,210,.4)'; c.lineWidth = 2; c.beginPath(); c.ellipse(W + 20, FLOOR + 26, 190, 20, 0, Math.PI * 0.9, Math.PI * 1.55); c.stroke();
    c.beginPath(); c.moveTo(220, FLOOR + 14); c.lineTo(W, FLOOR + 14); c.moveTo(220, FLOOR + 44); c.lineTo(W, FLOOR + 44); c.stroke();
    var sh = c.createLinearGradient(0, FLOOR, 0, FLOOR + 40); sh.addColorStop(0, 'rgba(255,200,140,.28)'); sh.addColorStop(1, 'rgba(255,200,140,0)'); c.fillStyle = sh; c.fillRect(0, FLOOR, W, 40);
  })();
  var BALL = document.createElement('canvas'); BALL.width = BALL.height = R * 2 * 3;
  (function(){
    var c = BALL.getContext('2d'); c.scale(3, 3); c.translate(R, R);
    var g = c.createRadialGradient(-R * 0.3, -R * 0.35, 1, 0, 0, R * 1.05); g.addColorStop(0, '#FFB67E'); g.addColorStop(0.45, '#F26A1F'); g.addColorStop(1, '#7A2804'); c.fillStyle = g; c.beginPath(); c.arc(0, 0, R, 0, 6.283); c.fill();
    c.save(); c.beginPath(); c.arc(0, 0, R, 0, 6.283); c.clip();
    for (var i = 0; i < 70; i++){ c.fillStyle = 'rgba(60,20,0,' + rnd(0.08, 0.2) + ')'; c.beginPath(); c.arc(rnd(-R, R), rnd(-R, R), 0.45, 0, 6.283); c.fill(); }
    c.strokeStyle = '#2E1002'; c.lineWidth = 1.5; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-R, 0); c.lineTo(R, 0); c.moveTo(0, -R); c.lineTo(0, R); c.stroke();
    c.beginPath(); c.arc(-R * 1.28, 0, R * 1.0, -1.02, 1.02); c.stroke(); c.beginPath(); c.arc(R * 1.28, 0, R * 1.0, Math.PI - 1.02, Math.PI + 1.02); c.stroke();
    c.restore(); c.strokeStyle = 'rgba(40,10,0,.6)'; c.lineWidth = 1; c.beginPath(); c.arc(0, 0, R - 0.5, 0, 6.283); c.stroke();
  })();

  // ---------- 籃框 / 球權 ----------
  function backX(){ return hoop.x + RW + 9; }
  function placeHoop(){
    var lvl = made;
    hoop.bx = lvl < 2 ? 255 : rnd(205, 300); hoop.by = lvl < 2 ? 270 : rnd(215, 330);
    hoop.amp = lvl >= 8 ? Math.min(46, 14 + (lvl - 8) * 4) : 0; hoop.t = rnd(0, 6);
  }
  function readyBall(){
    ball.x = lvlStartX(); ball.y = 496; ball.vx = ball.vy = 0; ball.rv = 0; ball.mode = 'ready'; ball.touched = false; ball.scored = false; ball.age = 0; ball.floorHits = 0; trail.length = 0;
  }
  function lvlStartX(){ return made < 2 ? 90 : rnd(48, 160); }

  // ---------- 物理 ----------
  function hitPoint(b, px, py, e){
    var dx = b.x - px, dy = b.y - py, d = Math.hypot(dx, dy), m = R + RR;
    if (d < m && d > 0.0001){
      var nx = dx / d, ny = dy / d; b.x = px + nx * m; b.y = py + ny * m;
      var vn = b.vx * nx + b.vy * ny; if (vn < 0){ b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; b.touched = true; return Math.abs(vn); }
    }
    return 0;
  }
  function stepBall(b, dt, events){
    var py0 = b.y; b.vy += G * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.age += dt;
    var hx = hoop.x, hy = hoop.y;
    var bx = hx + RW + 9, top = hy - 92, bot = hy + 6;
    if (b.vx > 0 && b.x + R > bx && b.x - R < bx + 6 && b.y > top && b.y < bot){ if (b.x < bx + 3){ b.x = bx - R; var vn = b.vx; b.vx = -b.vx * 0.5; b.touched = true; if (events) events.board = Math.max(events.board || 0, vn); } }
    var v1 = hitPoint(b, hx - RW, hy, 0.55), v2 = hitPoint(b, hx + RW, hy, 0.55);
