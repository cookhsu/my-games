<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>潮間帶排雷 Tidal Sweeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sea:#0E3B43; --sea-2:#14505A; --foam:#E8F4F2; --sand:#D9C48F; --sand-edge:#B39B63;
    --wet:#F6EEDC; --coral:#FF7F6B; --coral-dark:#C9503E; --ink:#17343A; --muted:#8FB5B8;
    --shadow:rgba(3,20,24,.5);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; min-height:100%; background:var(--sea); color:var(--foam); font-family:'Noto Sans TC',system-ui,sans-serif; }
  body{ display:flex; flex-direction:column; align-items:center; padding:28px 16px 56px; background:radial-gradient(ellipse at 50% -10%, rgba(255,127,107,.14), transparent 55%), var(--sea); }
  .marquee{ text-align:center; margin-bottom:18px; }
  .marquee h1{ margin:0 0 8px; font-weight:900; font-size:clamp(26px,6.5vw,38px); color:var(--foam); letter-spacing:1px; }
  .marquee p{ margin:0; color:var(--muted); font-size:14px; max-width:420px; line-height:1.7; }
  .board{ width:100%; max-width:420px; background:var(--sea-2); border-radius:22px; padding:16px; box-shadow:0 20px 45px var(--shadow); }
  .hud{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 6px 12px; }
  .stat .label{ display:block; font-size:11px; letter-spacing:1px; color:var(--muted); margin-bottom:2px; }
  .stat .value{ font-weight:900; font-size:24px; font-variant-numeric:tabular-nums; }
  .stat.right{ text-align:right; }
  .tools{ display:flex; gap:8px; }
  .icon-btn{ width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,.18); background:var(--sea); color:var(--foam); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-btn[aria-pressed="true"]{ background:var(--coral); color:var(--ink); border-color:var(--coral); }
  .icon-btn:focus-visible, .btn:focus-visible, .cell:focus-visible{ outline:3px solid var(--coral); outline-offset:2px; }
  .frame{ position:relative; background:var(--sea); border-radius:14px; padding:8px; }
  .grid{ display:grid; grid-template-columns:repeat(9,1fr); gap:3px; touch-action:manipulation; }
  .cell{ aspect-ratio:1/1; padding:0; border:none; border-radius:6px; background:var(--sand); border-bottom:3px solid var(--sand-edge); font:900 clamp(14px,4.6vw,20px) 'Noto Sans TC',sans-serif; color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .cell:active{ filter:brightness(.95); }
  .cell.open{ background:var(--wet); border-bottom:none; cursor:default; }
  .cell.boom{ background:#FFD2C9; }
  .cell svg{ width:70%; height:70%; pointer-events:none; }
  .n1{color:#1D5FA8}.n2{color:#2E7D32}.n3{color:#C62828}.n4{color:#4A2C8F}.n5{color:#8E3B00}.n6{color:#00796B}.n7{color:#222}.n8{color:#555}
  .overlay{ position:absolute; inset:8px; border-radius:10px; background:rgba(14,59,67,.93); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:22px; }
  .overlay.hidden{ display:none; }
  .overlay h2{ margin:0; font-weight:900; font-size:clamp(22px,6vw,30px); color:var(--coral); }
  .overlay p{ margin:0; font-size:14px; line-height:1.8; max-width:290px; }
  .btn{ font:900 16px 'Noto Sans TC',sans-serif; color:var(--ink); background:var(--coral); border:none; padding:12px 28px; border-radius:24px; cursor:pointer; box-shadow:0 4px 0 var(--coral-dark); }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--coral-dark); }
  .hint{ margin-top:16px; max-width:420px; text-align:center; font-size:12px; line-height:1.8; color:var(--muted); }
  @media (prefers-reduced-motion:reduce){ .btn{ transition:none; } }
/* ===== UI v2 (template) ===== */
body{ position:relative; }
.marquee{ margin-top:18px; }
.marquee h1{ letter-spacing:.06em; text-shadow:0 2px 0 rgba(255,255,255,.35), 0 6px 18px rgba(0,0,0,.18); }
.marquee h1::after{ content:""; display:block; width:56px; height:4px; margin:10px auto 0; border-radius:4px; background:currentColor; opacity:.35; }
.marquee p{ opacity:.9; line-height:1.7; }
.board,.box{ box-shadow:0 26px 54px rgba(0,0,0,.38), 0 3px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.14) !important; }
.hud .stat{ padding:7px 12px 8px; border-radius:12px; background:rgba(0,0,0,.14); box-shadow:inset 0 1px 0 rgba(0,0,0,.12), 0 1px 0 rgba(255,255,255,.25); min-width:84px; }
.hud .value{ font-variant-numeric:tabular-nums; text-shadow:0 1px 0 rgba(255,255,255,.25); }
.music-btn,.icon-btn{ box-shadow:0 3px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.6) !important; transition:transform .1s, box-shadow .1s; }
.music-btn:active,.icon-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.25) !important; }
.screen-frame,.frame,.field-frame,.table-frame,.tray-frame{ position:relative; box-shadow:inset 0 0 0 2px rgba(0,0,0,.18), inset 0 6px 16px rgba(0,0,0,.28), 0 1px 0 rgba(255,255,255,.3); }
.screen-frame::after,.frame::after,.field-frame::after,.table-frame::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, transparent 62%, rgba(0,0,0,.28)); z-index:1; }
.overlay{ z-index:3; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); animation:tplIn .32s ease; }
@keyframes tplIn{ from{ opacity:0; transform:scale(.97);} to{ opacity:1; transform:none; } }
.overlay>*{ animation:tplUp .45s ease backwards; } .overlay>*:nth-child(2){ animation-delay:.06s } .overlay>*:nth-child(3){ animation-delay:.12s } .overlay>*:nth-child(4){ animation-delay:.18s }
@keyframes tplUp{ from{ opacity:0; transform:translateY(12px);} }
.overlay h2{ letter-spacing:.08em; text-shadow:0 3px 0 rgba(0,0,0,.28), 0 8px 20px rgba(0,0,0,.3); }
.overlay p{ line-height:1.75; }
.overlay p[id]{ font-size:17px; font-weight:800; padding:10px 20px; border-radius:14px; background:rgba(255,255,255,.12); box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); max-width:none; }
.btn{ position:relative; overflow:hidden; letter-spacing:.08em; padding-left:30px; padding-right:30px; transition:transform .1s ease, box-shadow .1s ease, filter .15s; }
.btn::after{ content:""; position:absolute; left:14%; right:14%; top:3px; height:34%; border-radius:99px; background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0)); pointer-events:none; }
#startBtn,#restartBtn,.overlay .btn:first-of-type{ animation:tplPulse 2s ease-in-out infinite; }
@keyframes tplPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.05);} }
#startBtn::before,#restartBtn::before{ content:""; position:absolute; top:0; bottom:0; left:-45%; width:28%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent); transform:skewX(-20deg); animation:tplShine 3s ease-in-out infinite; }
@keyframes tplShine{ 0%{ left:-45%; } 55%,100%{ left:140%; } }
.hint kbd{ box-shadow:0 2px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.5); border:1px solid rgba(0,0,0,.12); }
@media (prefers-reduced-motion:reduce){ .overlay,.overlay>*,#startBtn,#restartBtn,.overlay .btn:first-of-type,#startBtn::before,#restartBtn::before{ animation:none !important; } }
</style>
</head>
<body>
  <div class="marquee">
    <h1>潮間帶排雷</h1>
    <p>退潮的沙灘上藏著 10 隻海膽，用數字推理出牠們的位置，安全地走完整片沙灘。</p>
  </div>

  <div class="board">
    <div class="hud">
      <div class="stat"><span class="label">剩餘海膽</span><span class="value" id="left">10</span></div>
      <div class="tools">
        <button class="icon-btn" id="flagBtn" aria-label="插旗模式" aria-pressed="false" title="插旗模式">🚩</button>
        <button class="icon-btn" id="musicBtn" aria-label="切換背景音樂" aria-pressed="true">🔊</button>
      </div>
      <div class="stat right"><span class="label">時間</span><span class="value" id="time">0</span></div>
    </div>

    <div class="frame">
      <div class="grid" id="grid" role="grid" aria-label="排雷棋盤"></div>

      <div class="overlay" id="startOverlay">
        <h2>準備踏沙</h2>
        <p>點一下翻開沙地，數字代表周圍八格有幾隻海膽。電腦可以按右鍵插旗，手機長按或打開上方的旗子模式。</p>
        <button class="btn" id="startBtn">開始遊戲</button>
      </div>

      <div class="overlay hidden" id="endOverlay">
        <h2 id="endTitle"></h2>
        <p id="endText"></p>
        <button class="btn" id="restartBtn">再走一次</button>
      </div>
    </div>
  </div>

  <p class="hint">第一下一定安全。點已翻開的數字，若周圍旗子數剛好等於數字，會一次翻開其餘格子。</p>

<script>
(function(){
  "use strict";
  var ROWS = 9, COLS = 9, MINES = 10;
  var gridEl = document.getElementById('grid');
  var leftEl = document.getElementById('left');
  var timeEl = document.getElementById('time');
  var flagBtn = document.getElementById('flagBtn');
  var musicBtn = document.getElementById('musicBtn');
  var startOverlay = document.getElementById('startOverlay');
  var endOverlay = document.getElementById('endOverlay');
  var endTitle = document.getElementById('endTitle');
  var endText = document.getElementById('endText');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');

  var URCHIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><g stroke="#2A1747" stroke-width="1.8" stroke-linecap="round"><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4M4.6 4.6l2.8 2.8M16.6 16.6l2.8 2.8M19.4 4.6l-2.8 2.8M7.4 16.6l-2.8 2.8"/></g><circle cx="12" cy="12" r="6.5" fill="#6B3FA8" stroke="#2A1747" stroke-width="1.2"/><ellipse cx="10" cy="9.6" rx="2.6" ry="1.6" fill="#fff" opacity=".35"/><circle cx="9.6" cy="12.4" r="1.2" fill="#fff"/><circle cx="14.4" cy="12.4" r="1.2" fill="#fff"/><circle cx="9.8" cy="12.6" r=".6" fill="#2A1747"/><circle cx="14.6" cy="12.6" r=".6" fill="#2A1747"/></svg>';
  var FLAG = '<svg class="flagsvg" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="9" cy="21" rx="6" ry="1.6" fill="rgba(0,0,0,.25)"/><path d="M7 3v18" stroke="#6B4423" stroke-width="2.2" stroke-linecap="round"/><g class="wave"><path d="M7.6 4l12 4.5L7.6 13z" fill="#FF7F6B" stroke="#C9503E" stroke-width="1" stroke-linejoin="round"/><path d="M9 6l6 2.3L9 10.6z" fill="#FFB1A3" opacity=".6"/></g></svg>';

  var lastR = 0, lastC = 0;
  var cells = [], active, started, over, flagMode, revealedCount, flagCount, seconds, timer, longPressFired, pressTimer;

  var best = 0;
  try { var sv = localStorage.getItem('tidalsweeper_best'); if (sv) best = parseInt(sv, 10) || 0; } catch (e) { /* ignore */ }

  var musicOn = true;
  try { var mv = localStorage.getItem('tidalsweeper_music'); if (mv !== null) musicOn = (mv === '1'); } catch (e) { /* ignore */ }

  var ac = null;
  function getAc(){
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
    return ac;
  }
  function tone(freq, dur, type, vol, delay){
    var a = getAc(); if (!a) return;
    try {
      var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) { /* ignore */ }
  }
  var music = {
    timer: null, step: 0,
    notes: [261.63, 329.63, 392.00, 329.63, 293.66, 392.00, 440.00, 392.00],
    start: function(){ this.stop(); if (!musicOn) return; this.step = 0; var self = this; this.play(); this.timer = setInterval(function(){ self.play(); }, 620); },
    play: function(){ tone(this.notes[this.step % this.notes.length], 0.9, 'sine', 0.03); if (this.step % 4 === 0) tone(130.81, 1.4, 'sine', 0.04); this.step++; },
    stop: function(){ if (this.timer){ clearInterval(this.timer); this.timer = null; } }
  };

  function idx(r, c){ return r * COLS + c; }
  function neighbors(r, c){
    var list = [];
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++){
      if (!dr && !dc) continue;
      var nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) list.push(cells[idx(nr, nc)]);
    }
    return list;
  }

  function buildGrid(){
    gridEl.innerHTML = '';
    cells = [];
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++){
      var el = document.createElement('button');
      el.className = 'cell';
      el.type = 'button';
      el.setAttribute('role', 'gridcell');
      el.dataset.r = r; el.dataset.c = c;
      el.setAttribute('aria-label', '第' + (r + 1) + '列第' + (c + 1) + '行，未翻開');
      gridEl.appendChild(el);
      cells.push({ r: r, c: c, mine: false, adj: 0, open: false, flag: false, el: el });
    }
  }

  function placeMines(sr, sc){
    var pool = cells.filter(function(x){ return Math.abs(x.r - sr) > 1 || Math.abs(x.c - sc) > 1; });
    for (var i = pool.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    for (var k = 0; k < MINES; k++) pool[k].mine = true;
    cells.forEach(function(x){ x.adj = neighbors(x.r, x.c).filter(function(n){ return n.mine; }).length; });
  }

  function paint(x){
    var el = x.el;
    el.className = 'cell';
    el.innerHTML = '';
    if (x.open){
      el.classList.add('open'); el.style.setProperty('--d', (Math.min(14, Math.abs(x.r - lastR) + Math.abs(x.c - lastC)) * 22) + 'ms');
      if (x.mine){ el.innerHTML = URCHIN; }
      else if (x.adj > 0){ el.textContent = x.adj; el.classList.add('n' + x.adj); }
      el.setAttribute('aria-label', x.mine ? '海膽' : (x.adj ? '周圍有 ' + x.adj + ' 隻海膽' : '空白'));
    } else if (x.flag){
      el.innerHTML = FLAG;
      el.setAttribute('aria-label', '已插旗');
    } else {
      el.setAttribute('aria-label', '第' + (x.r + 1) + '列第' + (x.c + 1) + '行，未翻開');
    }
  }

  function updateLeft(){ leftEl.textContent = MINES - flagCount; }

  function startTimer(){
    clearInterval(timer);
    timer = setInterval(function(){ seconds++; timeEl.textContent = seconds; }, 1000);
  }

  function lose(hit){
    over = true; clearInterval(timer); music.stop();
    var fr = gridEl.parentNode; fr.classList.remove('shake'); void fr.offsetWidth; fr.classList.add('shake');
    var mi = 0;
    cells.forEach(function(x){
      if (x.mine && !x.flag){ x.open = true; paint(x); x.el.classList.add('mine-show'); x.el.style.setProperty('--d', (80 + (mi++) * 70) + 'ms'); if (navigator.vibrate && mi === 1) { try { navigator.vibrate(60); } catch (e) {} } }
      if (!x.mine && x.flag){ x.el.classList.add('boom'); }
    });
    hit.el.classList.add('boom');
    tone(110, 0.5, 'sawtooth', 0.08);
    setTimeout(function(){
      endTitle.textContent = '踩到海膽了';
      endText.textContent = '這一次走了 ' + seconds + ' 秒。再試一次，把數字多看幾遍。';
      endOverlay.classList.remove('hidden');
    }, 1100);
  }

  function win(){
    over = true; clearInterval(timer); music.stop();
    cells.forEach(function(x){ if (x.mine && !x.flag){ x.flag = true; paint(x); } });
    flagCount = MINES; updateLeft();
    var isBest = !best || seconds < best;
    if (isBest){ best = seconds; try { localStorage.setItem('tidalsweeper_best', String(best)); } catch (e) { /* ignore */ } }
    [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){ tone(f, 0.25, 'triangle', 0.07, i * 0.1); });
    var fr2 = gridEl.parentNode; for (var q = 0; q < 26; q++){ var bb = document.createElement('div'); bb.className = 'bub'; var sz = 8 + Math.random() * 20; bb.style.cssText = 'left:' + (Math.random() * 96) + '%;width:' + sz + 'px;height:' + sz + 'px;animation-delay:' + (Math.random() * .9) + 's;--sx:' + ((Math.random() - .5) * 60) + 'px'; fr2.appendChild(bb); (function(e){ setTimeout(function(){ e.remove(); }, 3300); })(bb); }
    endTitle.textContent = '全部排除！';
    endText.textContent = (seconds <= 40 ? '潮間帶大師 🏆　' : seconds <= 90 ? '拾貝高手 🐚　' : '踏沙新手 🦀　') + '用時 ' + seconds + ' 秒' + (isBest ? '，刷新了你的最快紀錄！' : '，最快紀錄是 ' + best + ' 秒。');
    endOverlay.classList.remove('hidden');
  }

  function reveal(x){
    if (over || x.open || x.flag) return;
    lastR = x.r; lastC = x.c;
    if (!started){
      started = true; placeMines(x.r, x.c); startTimer();
    }
    if (x.mine){ x.open = true; paint(x); lose(x); return; }
    var stack = [x];
    while (stack.length){
      var cur = stack.pop();
      if (cur.open || cur.flag) continue;
      cur.open = true; revealedCount++; paint(cur);
      if (cur.adj === 0) neighbors(cur.r, cur.c).forEach(function(n){ if (!n.open && !n.flag && !n.mine) stack.push(n); });
    }
    tone(520, 0.06, 'sine', 0.04);
    if (revealedCount === ROWS * COLS - MINES) win();
  }

  function toggleFlag(x){
    if (over || x.open) return;
    if (!x.flag && flagCount >= MINES) return;
    x.flag = !x.flag;
    flagCount += x.flag ? 1 : -1;
    paint(x); updateLeft();
    tone(x.flag ? 700 : 400, 0.06, 'triangle', 0.04);
  }

  function chord(x){
    if (over || !x.open || x.adj === 0) return;
    var around = neighbors(x.r, x.c);
    var f = around.filter(function(n){ return n.flag; }).length;
    if (f !== x.adj) return;
    around.forEach(function(n){ if (!n.open && !n.flag) reveal(n); });
  }

  function cellFromEvent(e){
    var t = e.target.closest ? e.target.closest('.cell') : null;
    return t ? cells[idx(+t.dataset.r, +t.dataset.c)] : null;
  }

  gridEl.addEventListener('click', function(e){
    if (longPressFired){ longPressFired = false; return; }
    var x = cellFromEvent(e); if (!x) return;
    if (flagMode && !x.open) toggleFlag(x);
    else if (x.open) chord(x);
    else reveal(x);
  });
  gridEl.addEventListener('contextmenu', function(e){
    e.preventDefault();
    if (longPressFired) return;
    var x = cellFromEvent(e); if (x) toggleFlag(x);
  });
  gridEl.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'mouse') return;
    var x = cellFromEvent(e); if (!x || x.open) return;
    longPressFired = false;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function(){ longPressFired = true; toggleFlag(x); if (navigator.vibrate) navigator.vibrate(20); }, 450);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function(n){
    gridEl.addEventListener(n, function(){ clearTimeout(pressTimer); });
  });

  flagBtn.addEventListener('click', function(){
    flagMode = !flagMode;
    flagBtn.setAttribute('aria-pressed', String(flagMode));
  });
  function refreshMusicBtn(){
    musicBtn.textContent = musicOn ? '🔊' : '🔇';
    musicBtn.setAttribute('aria-pressed', 'false');
    musicBtn.setAttribute('aria-label', musicOn ? '關閉背景音樂' : '開啟背景音樂');
  }
  musicBtn.addEventListener('click', function(){
    musicOn = !musicOn;
    try { localStorage.setItem('tidalsweeper_music', musicOn ? '1' : '0'); } catch (e) { /* ignore */ }
    if (musicOn && active && !over) music.start(); else music.stop();
    refreshMusicBtn();
  });

  function newGame(){
    clearInterval(timer);
    buildGrid();
    active = false; started = false; over = false; flagMode = false; revealedCount = 0; flagCount = 0; seconds = 0; longPressFired = false;
    flagBtn.setAttribute('aria-pressed', 'false');
    timeEl.textContent = '0';
    updateLeft();
  }
  function startGame(){
    getAc();
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    newGame();
    active = true;
    music.start();
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
  refreshMusicBtn();
  newGame();
})();
</script>
<!--pl:start-->
<style id="pl-css">
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;animation:plIn .45s ease both}
@keyframes plIn{from{opacity:0}to{opacity:1}}
button,a,[role=button],canvas{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{transition:transform .12s ease,filter .15s ease,box-shadow .15s ease}
button:not(:disabled):hover{filter:brightness(1.07)}
button:not(:disabled):active{transform:translateY(1px) scale(.975);filter:brightness(.96)}
button:focus-visible,a:focus-visible{outline:3px solid rgba(255,255,255,.85);outline-offset:3px;box-shadow:0 0 0 6px rgba(0,0,0,.35)}
canvas{touch-action:none}
#pl-vig{position:fixed;inset:0;pointer-events:none;z-index:2147482000;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(0,0,0,.20) 100%)}
#pl-back{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:2147482500;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 12px 0 9px;border-radius:999px;font:700 12px/1 'Noto Sans TC',system-ui,sans-serif;letter-spacing:.06em;color:#fff;text-decoration:none;background:rgba(18,16,28,.55);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 3px 10px rgba(0,0,0,.3);opacity:.85;transition:opacity .15s,transform .12s}
#pl-back:hover{opacity:1}#pl-back:active{transform:scale(.95)}
#pl-splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;transition:opacity .45s ease,visibility .45s}
#pl-splash.off{opacity:0;visibility:hidden}
#pl-splash b{font:900 clamp(26px,7vw,40px)/1.2 'Noto Serif TC','Noto Sans TC',serif;letter-spacing:.14em;text-shadow:0 4px 18px rgba(0,0,0,.45)}
#pl-splash i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.28);border-top-color:#fff;animation:plSp .8s linear infinite}
#pl-splash small{font:500 11px 'Noto Sans TC',sans-serif;letter-spacing:.3em;opacity:.7}
@keyframes plSp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){body{animation:none}#pl-splash i{animation:none}}

/* ===== UI v3 (deep) ===== */
body{ background:
  radial-gradient(ellipse 120% 60% at 50% -12%, rgba(255,160,130,.20), transparent 60%),
  repeating-radial-gradient(circle at 50% 120%, rgba(255,255,255,.035) 0 3px, transparent 3px 46px),
  linear-gradient(180deg,#0A3440 0%,#0E4A55 45%,#126069 100%) fixed !important; }
.marquee h1{ background:linear-gradient(180deg,#FFFFFF,#BFE9E4); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; filter:drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
.board{ background:linear-gradient(180deg,#1A6370,#12505B) !important; border:2px solid rgba(255,255,255,.14); }
.frame{ background:linear-gradient(180deg,#0B3239,#0E3F47) !important; padding:10px; overflow:hidden; }
.frame::before{ content:""; position:absolute; left:0; right:0; top:0; height:10px; pointer-events:none; z-index:2;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 22px,rgba(255,255,255,.12) 22px 44px); opacity:.35; animation:foam 6s linear infinite; mask:linear-gradient(#000,transparent); -webkit-mask:linear-gradient(#000,transparent); }
@keyframes foam{ to{ background-position:44px 0; } }
.grid{ gap:3px; position:relative; z-index:1; }
.cell{ border:none !important; border-radius:8px !important; color:#fff; position:relative;
  background:
    radial-gradient(circle at 22% 28%,rgba(120,90,40,.22) 0 1.2px,transparent 1.6px),
    radial-gradient(circle at 70% 64%,rgba(120,90,40,.2) 0 1.2px,transparent 1.6px),
    radial-gradient(circle at 48% 82%,rgba(255,255,255,.35) 0 1px,transparent 1.5px),
    linear-gradient(180deg,#F4E3AE,#D9C189) !important;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7), inset 0 -3px 0 #B49A5E, 0 2px 0 rgba(0,0,0,.35); transition:transform .08s, filter .1s; }
.cell:nth-child(3n+1){ background-position:3px 2px,0 0,0 0,0 0 !important; }
.cell:nth-child(2n){ filter:brightness(.975); }
.cell:not(.open):hover{ filter:brightness(1.06); }
.cell:not(.open):active{ transform:translateY(2px); box-shadow:inset 0 2px 0 rgba(255,255,255,.5), inset 0 -1px 0 #B49A5E, 0 0 0 rgba(0,0,0,0); }
.cell.open{ background:linear-gradient(180deg,#A38A55,#B9A06A) !important; box-shadow:inset 0 3px 6px rgba(60,40,10,.55), inset 0 -1px 0 rgba(255,255,255,.25); animation:cellOpen .28s ease backwards; animation-delay:var(--d,0ms); }
.cell.open:not([class*=" n"]):not(.boom)::after{ content:""; position:absolute; inset:0; border-radius:inherit; background:radial-gradient(circle at 50% 120%,rgba(120,210,225,.28),transparent 70%); }
@keyframes cellOpen{ 0%{ transform:scale(.6); opacity:0; filter:brightness(1.6);} 60%{ transform:scale(1.08);} 100%{ transform:none; opacity:1; filter:none;} }
.cell.n1{ color:#9FE3FF; } .cell.n2{ color:#A6F3B5; } .cell.n3{ color:#FFB1A3; } .cell.n4{ color:#D6B8FF; } .cell.n5{ color:#FFD08A; } .cell.n6{ color:#8CF2E8; } .cell.n7{ color:#fff; } .cell.n8{ color:#ddd; }
.cell.open[class*=" n"]{ text-shadow:0 2px 0 rgba(20,10,0,.55), 0 0 8px currentColor; font-weight:900; }
.cell.boom{ background:radial-gradient(circle,#FFB199,#E5533D) !important; animation:boomPop .5s ease; }
@keyframes boomPop{ 0%{ transform:scale(.5);} 50%{ transform:scale(1.25);} 100%{ transform:scale(1);} }
.cell svg{ filter:drop-shadow(0 2px 1px rgba(0,0,0,.4)); }
.cell .flagsvg{ animation:flagIn .22s cubic-bezier(.3,1.6,.6,1); } @keyframes flagIn{ from{ transform:translateY(-8px) scale(.5); opacity:0;} }
.cell .wave{ transform-origin:7px 8px; animation:wave 1.3s ease-in-out infinite alternate; } @keyframes wave{ from{ transform:skewY(-5deg);} to{ transform:skewY(5deg);} }
.cell.mine-show{ animation:boomPop .45s ease backwards; animation-delay:var(--d,0ms); }
.frame.shake{ animation:shk .4s linear; } @keyframes shk{ 15%{ transform:translate(-4px,2px);} 30%{ transform:translate(4px,-2px);} 45%{ transform:translate(-3px,-1px);} 60%{ transform:translate(3px,2px);} 80%{ transform:translate(-1px,1px);} }
.bub{ position:absolute; bottom:-20px; border-radius:50%; background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(160,230,240,.25) 60%,rgba(160,230,240,.1)); border:1px solid rgba(255,255,255,.5); pointer-events:none; z-index:6; animation:rise 2.2s ease-in forwards; }
@keyframes rise{ to{ transform:translateY(-420px) translateX(var(--sx,0)); opacity:0; } }
.icon-btn[aria-pressed="true"]{ box-shadow:0 0 0 3px rgba(255,127,107,.35), 0 3px 0 rgba(0,0,0,.25) !important; }
.hud .stat .value::before{ content:""; }
#left::after{ content:" 🦔"; font-size:14px; } #time::after{ content:" s"; font-size:12px; opacity:.7; }
</style>
