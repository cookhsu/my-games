<body>
  <div class="marquee">
    <h1>潮間帶排雷</h1>
    <p>退潮的沙灘上藏著海膽，用數字推理出牠們的位置，安全地走完整片沙灘。</p>

        <div class="modes">

  </div>

  <p class="hint">第一下一定安全。點已翻開的數字，若周圍旗子數剛好等於數字，會一次翻開其餘格子。<br>踩到海膽會先用掉一個 🐚 護身貝殼；💡 提示會指出一格安全的沙地（+10 秒）。★★ 不破殼、★★★ 再加上不用提示且夠快。</p>

<script>
(function(){
  "use strict";
  var ROWS = 9, COLS = 9, MINES = 10;
  var LEVELS = [
    { id:'easy', n:'淺灘', r:9, c:9, m:10, shell:2, hint:3, par:45 },
    { id:'mid', n:'潮池', r:12, c:12, m:24, shell:2, hint:3, par:150 },
    { id:'hard', n:'深海', r:14, c:14, m:40, shell:3, hint:4, par:300 },
    { id:'daily', n:'每日海灘', r:11, c:11, m:20, shell:2, hint:3, par:120 }
  ];
  var lvIdx = 0, shells = 2, hints = 3, hintsUsed = 0, shellUsed = 0, penalty = 0, NB = [], toastT = null, rng = Math.random;
  function dailySeed(){ var d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
  function mkRng(seed){ var a = seed | 0; return function(){ a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function bestKey(){ var L = LEVELS[lvIdx]; return L.id === 'easy' ? 'tidalsweeper_best' : L.id === 'daily' ? 'tidalsweeper_daily_' + dailySeed() : 'tidalsweeper_best_' + L.id; }
  function loadBest(){ best = 0; try { var v = localStorage.getItem(bestKey()); if (v) best = parseInt(v, 10) || 0; } catch (e) { /* ignore */ } }
  function toast(m){ var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 1800); }
  function updateSub(){
    document.getElementById('lvTag').textContent = LEVELS[lvIdx].n;
    var sh = ''; for (var i = 0; i < shells; i++) sh += '🐚'; document.getElementById('shells').textContent = sh || '無護殼';
    var hb = document.getElementById('hintBtn'); hb.querySelector('b').textContent = hints; hb.disabled = !active || over || hints <= 0;
  }
  function buildNb(){ NB = []; for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++){ var l = []; for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++){ if (!dr && !dc) continue; var nr = r + dr, nc = c + dc; if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) l.push(nr * COLS + nc); } NB.push(l); } }
  /* 推理模擬：只用「已翻開的數字」做邏輯推理，判斷盤面是否不用猜；也用來給提示 */
  function simulate(mine, adj, openInit, start){
    var N = ROWS * COLS, op = new Uint8Array(N), mk = new Uint8Array(N), cnt = 0, first = -1, i, j, k;
    function doOpen(i0){ var q = [i0]; while (q.length){ var k0 = q.pop(); if (op[k0] || mk[k0]) continue; op[k0] = 1; cnt++; if (adj[k0] === 0){ var nb = NB[k0]; for (var z = 0; z < nb.length; z++) if (!op[nb[z]] && !mk[nb[z]]) q.push(nb[z]); } } }
    if (openInit){ for (i = 0; i < N; i++) if (openInit[i]){ op[i] = 1; cnt++; } }
    if (start >= 0) doOpen(start);
    var progress = true;
    while (progress){
      progress = false;
      var F = [];
      for (i = 0; i < N; i++){
        if (!op[i] || adj[i] === 0) continue;
        var nb = NB[i], u = [], f = 0;
        for (j = 0; j < nb.length; j++){ if (mk[nb[j]]) f++; else if (!op[nb[j]]) u.push(nb[j]); }
        if (!u.length) continue;
        var need = adj[i] - f;
        if (need === 0){ for (j = 0; j < u.length; j++){ if (first < 0) first = u[j]; doOpen(u[j]); } progress = true; }
        else if (need === u.length){ for (j = 0; j < u.length; j++) mk[u[j]] = 1; progress = true; }
        else F.push({ i: i, u: u, need: need });
      }
      if (progress) continue;
      for (var a = 0; a < F.length && !progress; a++){
        var A = F[a], ar = (A.i / COLS) | 0, ac = A.i % COLS;
        for (var b = 0; b < F.length; b++){
          if (a === b) continue; var B = F[b], br = (B.i / COLS) | 0, bc = B.i % COLS;
          if (Math.abs(ar - br) > 2 || Math.abs(ac - bc) > 2 || A.u.length > B.u.length) continue;
          var sub = true; for (j = 0; j < A.u.length; j++){ if (B.u.indexOf(A.u[j]) < 0){ sub = false; break; } }
          if (!sub) continue;
          var diff = B.u.filter(function(x){ return A.u.indexOf(x) < 0; }), dn = B.need - A.need;
          if (!diff.length) continue;
          if (dn === 0){ for (j = 0; j < diff.length; j++){ if (first < 0) first = diff[j]; doOpen(diff[j]); } progress = true; break; }
          else if (dn === diff.length){ for (j = 0; j < diff.length; j++) mk[diff[j]] = 1; progress = true; break; }
        }
      }
      if (progress) continue;
      var mc = 0; for (k = 0; k < N; k++) if (mk[k]) mc++;
      var unk = N - cnt - mc, remain = MINES - mc;
      if (unk > 0){
        if (remain === 0){ for (k = 0; k < N; k++) if (!op[k] && !mk[k]){ if (first < 0) first = k; doOpen(k); } progress = true; }
        else if (remain === unk){ for (k = 0; k < N; k++) if (!op[k] && !mk[k]) mk[k] = 1; progress = true; }
      }
    }
    return { solved: cnt === N - MINES, first: first };
  }
  function layout(sr, sc, rand){
    var N = ROWS * COLS, t0 = Date.now(), res = null;
    for (var att = 0; att < 500; att++){
      var pool = []; for (var i = 0; i < N; i++){ var r = (i / COLS) | 0, c = i % COLS; if (Math.abs(r - sr) > 1 || Math.abs(c - sc) > 1) pool.push(i); }
      for (var p = pool.length - 1; p > 0; p--){ var q = Math.floor(rand() * (p + 1)); var tmp = pool[p]; pool[p] = pool[q]; pool[q] = tmp; }
      var mine = new Uint8Array(N); for (var k = 0; k < MINES; k++) mine[pool[k]] = 1;
      var adj = new Uint8Array(N); for (i = 0; i < N; i++){ var n = 0, nb = NB[i]; for (var z = 0; z < nb.length; z++) n += mine[nb[z]]; adj[i] = n; }
      res = { mine: mine, adj: adj };
      if (simulate(mine, adj, null, sr * COLS + sc).solved) break;
      if (Date.now() - t0 > 700) break;
    }
    return res;
  }
  var gridEl = document.getElementById('grid');
  var leftEl = document.getElementById('left');
  var timeEl = document.getElementById('time');
  var flagBtn = document.getElementById('flagBtn');
