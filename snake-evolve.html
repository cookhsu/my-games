<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>蛇蛇進化</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C1F22;--p1:#13383A;--p2:#1C5254;--lime:#B6F24A;--green:#3FCF6B;--gold:#FFD54A;--red:#FF5A6E;--ink:#EAFBF0;--mut:#8DB8B0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#17484A 0%,#0C1F22 70%)}
.wrap{position:relative;width:min(100vw,calc(100vh*.6));aspect-ratio:360/600;max-height:100vh;border-radius:20px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.1),0 0 0 6px rgba(182,242,74,.25);font-size:calc(min(100vw,calc(100vh*.6))/360*14)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:absolute;top:.5em;z-index:5;border:0;border-radius:999px;padding:.35em .8em;font:700 .85em 'Fredoka','Noto Sans TC',sans-serif;color:#0C2A22;background:linear-gradient(180deg,#F2FFD2,#B6F24A);box-shadow:0 2px 0 rgba(0,0,0,.35);text-decoration:none;cursor:pointer}
.top:active{transform:translateY(2px)}.back{left:.6em}.pause{right:.6em}
.ov{position:absolute;inset:0;z-index:9;background:rgba(8,22,24,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8em;text-align:center;padding:1.4em}
.ov.hidden{display:none}
.ov h1{margin:0;font-size:2.9em;font-weight:900;color:var(--lime);letter-spacing:.1em;text-shadow:0 .08em 0 #2C6B1E}
.ov h2{margin:0;font-size:1.6em;font-weight:900}
.ov p{margin:0;color:var(--mut);font-size:.9em;line-height:1.7;max-width:21em}
.big{font-size:4.5em;line-height:1}
.btn{border:0;border-radius:999px;padding:.75em 2em;font:900 1.1em 'Noto Sans TC';color:#0C2A22;background:linear-gradient(180deg,#E9FFB0,var(--lime) 50%,#6FC21E);box-shadow:0 .3em 0 #3C7A12;cursor:pointer;letter-spacing:.1em;min-width:11em;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(.25em);box-shadow:0 .05em 0 #3C7A12}
.pill{background:var(--p2);border-radius:999px;padding:.35em .9em;font-weight:700;font-size:.85em}
.row{display:flex;gap:.6em;justify-content:center;flex-wrap:wrap}
.pcs{display:flex;flex-direction:column;gap:.6em;width:100%;max-width:21em}
.pc{display:flex;align-items:center;gap:.8em;text-align:left;border:0;border-radius:1em;padding:.7em .9em;background:linear-gradient(180deg,var(--p2),var(--p1));box-shadow:0 .25em 0 #08191B;color:var(--ink);font-family:inherit;cursor:pointer}
.pc:active{transform:translateY(2px)}
.pc i{font-style:normal;font-size:2em;width:1.6em;text-align:center}.pc b{display:block}.pc span{font-size:.78em;color:var(--mut)}
.pc em{font:700 .75em Fredoka;font-style:normal;background:var(--gold);color:#3B2A00;border-radius:.6em;padding:.05em .5em;margin-left:.4em}
.stat{background:var(--p1);border-radius:1em;padding:.6em 1em;min-width:5.5em;font-size:.8em;color:var(--mut)}.stat b{display:block;font:700 1.8em Fredoka;color:var(--lime)}

/* ===== v2 polish ===== */
.ov{background:radial-gradient(circle at 50% 28%,rgba(30,90,80,.96),rgba(6,16,18,.98))}
.ov .big{animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 .15em 0 rgba(0,0,0,.4))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-.15em) rotate(6deg)}}
.fd{position:absolute;inset:0;overflow:hidden;pointer-events:none}.fd i{position:absolute;top:-2em;font-style:normal;opacity:.15;animation:fd linear infinite}
@keyframes fd{to{transform:translateY(46em) rotate(360deg)}}
.ov>*{position:relative;z-index:1}.ov>.fd{position:absolute;z-index:0}
.btn{position:relative;overflow:hidden}.btn::after{content:"";position:absolute;left:12%;right:12%;top:.2em;height:.35em;border-radius:1em;background:rgba(255,255,255,.45)}
h1{background:linear-gradient(180deg,#F4FFD0,#B6F24A 55%,#58B81E);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .06em 0 #2C6B1E)}
.pc{position:relative;overflow:hidden;animation:pop .35s ease backwards}.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.3em;background:var(--lime)}
.pc:nth-child(2){animation-delay:.06s}.pc:nth-child(3){animation-delay:.12s}@keyframes pop{from{transform:scale(.85);opacity:0}}
@media (prefers-reduced-motion:reduce){.ov .big,.fd i{animation:none}}

/* ===== v3 ===== */
.btn.ghost{min-width:0;padding:.5em 1.4em;font-size:.95em;background:var(--p2);color:var(--ink);box-shadow:0 .2em 0 #08191B}.btn.ghost::after{display:none}
.row .stat{min-width:4.2em;padding:.5em .6em}
.pc.gold{background:linear-gradient(180deg,#7A6514,#3F3409);box-shadow:0 .25em 0 #1d1804}.pc.gold::before{background:var(--gold)}.pc.gold em{background:#fff3b0}
.achg{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;width:100%;max-width:23em}
.ac{background:var(--p1);border-radius:.9em;padding:.55em .3em;font-size:.72em;opacity:.5;filter:grayscale(.8)}
.ac.on{opacity:1;filter:none;background:linear-gradient(180deg,var(--p2),var(--p1));box-shadow:inset 0 0 0 1px rgba(182,242,74,.55)}
.ac i{font-style:normal;font-size:2em;display:block}.ac b{display:block;font-size:1.1em}.ac span{color:var(--mut);display:block;font-size:.9em;line-height:1.3}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="cv"></canvas>
  <a class="top back" href="index.html">← 大廳</a>
  <button class="top pause" id="pause">❚❚</button>

  <div class="ov" id="menu"><div class="fd" data-fd></div>
    <div class="big">🐍</div>
    <h1>蛇蛇進化</h1>
    <p>吃蘋果變長,<b style="color:#B6F24A">每吃 4 顆就能進化</b>;每 10 顆闖進<b style="color:#8FE3FF">新區域</b>,毒蘑菇、巨石、雷擊接連登場。<br>連擊吃滿 ×5 再吃 3 顆,<b style="color:#FFB347">狂熱無敵</b>!完成下方<b style="color:#7DF9C0">任務</b>拿獎勵。</p>
    <button class="btn" id="startBtn">開始遊戲</button>
    <div class="row"><span class="pill">最高分 <span id="best">0</span></span><span class="pill">最長 <span id="bestL">0</span> 節</span><span class="pill">最遠 區域 <span id="bestZ">1</span></span></div>
    <button class="btn ghost" id="achBtn">🏅 勳章 <span id="achN">0/12</span></button>
    <p style="font-size:.75em">手機:在畫面上滑動轉向 ・ 電腦:方向鍵 / WASD</p>
  </div>
  <div class="ov hidden" id="perk"><div class="fd" data-fd></div><h2>🧬 選擇進化</h2><p id="perkt"></p><div class="pcs" id="pcs"></div></div>
  <div class="ov hidden" id="ach"><div class="fd" data-fd></div><h2>🏅 勳章</h2><div class="achg" id="achg"></div><button class="btn" id="achBack">返回</button></div>
  <div class="ov hidden" id="over"><div class="fd" data-fd></div><div class="big">💥</div><h2 id="oT">撞到了!</h2>
    <div class="row"><div class="stat">分數<b id="oS">0</b></div><div class="stat">長度<b id="oL">0</b></div><div class="stat">進化<b id="oP">0</b></div><div class="stat">區域<b id="oZ">1</b></div></div>
    <p id="oN"></p><button class="btn" id="again">再來一次</button><a class="btn" href="index.html" style="min-width:0;padding:.5em 1.4em;font-size:.95em;background:var(--p2);color:var(--ink);box-shadow:none">回大廳</a></div>
</div>
<script>
(function(){
'use strict';
function $(i){return document.getElementById(i);}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
var W=360,H=600,CS=20,CW=18,CH=27,OY=40,ZS=10;
var cv=$('cv'),ctx=cv.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;
var best=parseInt(store('sn_best'))||0,bestL=parseInt(store('sn_len'))||0;
var S=(function(){var s=null;try{s=JSON.parse(store('sn_save2')||'null');}catch(e){}s=s||{};s.ach=s.ach||{};s.tot=s.tot||{};['apples','gold','smash','runs'].forEach(function(k){s.tot[k]=+s.tot[k]||0;});s.bz=+s.bz||0;return s;})();
function saveS(){store('sn_save2',JSON.stringify(S));}
var FAST=false,AC_=null;
function beep(f,d,t,v,s){if(FAST)return;try{AC_=AC_||new (window.AudioContext||window.webkitAudioContext)();var o=AC_.createOscillator(),g=AC_.createGain(),n=AC_.currentTime;o.type=t||'triangle';o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(s,n+d);g.gain.setValueAtTime(v||.04,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC_.destination);o.start();o.stop(n+d);}catch(e){}}
function arp(a){if(FAST)return;a.forEach(function(f,i){setTimeout(function(){beep(f,.12,'triangle',.05,f*1.4);},i*70);});}
function vib(p){if(FAST)return;try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* ---------- 區域 ---------- */
var ZN=[
 {n:'草原',h:'吃蘋果、避開岩石',a:'#103032',b:'#0F2C2E',e:'182,242,74'},
 {n:'毒沼',h:'🍄 毒蘑菇會讓你縮短',a:'#1A2A30',b:'#16262B',e:'170,120,255'},
 {n:'岩崩谷',h:'🪨 小心橫衝直撞的巨石',a:'#2A2724',b:'#242220',e:'230,170,100'},
 {n:'雷雨原',h:'⚡ 黃色警示處會被雷劈',a:'#16222F',b:'#121D29',e:'255,236,120'},
 {n:'霓虹夜',h:'全部危險一起來!',a:'#241431',b:'#1F1129',e:'255,90,200'},
 {n:'熔岩洞',h:'越來越快,撐住!',a:'#2E1714',b:'#28120F',e:'255,120,60'},
 {n:'星空',h:'你已是蛇界傳說',a:'#12163A',b:'#0F1332',e:'140,170,255'},
 {n:'蛇神殿',h:'無盡挑戰',a:'#2C2610',b:'#262009',e:'255,213,74'}
];
/* ---------- 進化 ---------- */
var PK={
 wrap:{i:'🌀',n:'穿牆術',d:'撞牆不會死,從另一邊出來',max:1},
 magnet:{i:'🧲',n:'蘋果磁鐵',d:'附近的蘋果會自己靠過來',max:3},
 shield:{i:'🛡️',n:'護身鱗片',d:'+1 次免死,擋下後自動彈開轉向',max:9},
 smash:{i:'🔨',n:'鐵頭功',d:'+3 次直接撞碎岩石/巨石',max:9},
 trim:{i:'✂️',n:'瘦身',d:'立刻縮短 4 節(最短 3 節)',max:9},
 slow:{i:'🐢',n:'慢動作',d:'移動速度 -12%',max:3},
 score2:{i:'💰',n:'黃金胃',d:'吃蘋果得分 ×2',max:1},
 combo:{i:'🔥',n:'連擊延長',d:'連擊時間 +1.5 秒',max:3},
 fire:{i:'🐲',n:'火焰吐息',d:'吃蘋果時燒掉附近的岩石(等級越高越多)',max:3},
 detox:{i:'🧪',n:'解毒體質',d:'毒蘑菇不再縮短,吃了反而 +40 分',max:1},
 rod:{i:'🗼',n:'避雷針',d:'閃電不會傷到你',max:1}
};
var SY={
 rush:{i:'💎',n:'財神到',d:'磁鐵 × 黃金胃:金蘋果更常出現、停留更久',need:function(){return G.P.magnet&&G.P.score2;}},
 iron:{i:'🏰',n:'鋼鐵之軀',d:'護盾 × 鐵頭功:每次護盾擋下攻擊,多送 1 次破岩',need:function(){return G.had.shield&&G.had.smash;}},
 warp2:{i:'🌌',n:'時空跳躍',d:'穿牆術 × 連擊延長:每次穿牆 +20 分並延長連擊',need:function(){return G.P.wrap&&G.P.combo;}},
 inferno:{i:'🌋',n:'地獄龍',d:'火焰吐息 Lv2 × 鐵頭功:燒岩範圍加倍,狂熱只需 2 顆',need:function(){return G.P.fire>=2&&G.had.smash;}}
};
function pinfo(k){return PK[k]||SY[k];}
/* ---------- 任務 / 勳章 ---------- */
var MS=[
 {k:'apples',g:6,t:'吃 6 顆蘋果',r:150,z:0},{k:'apples',g:12,t:'吃 12 顆蘋果',r:300,z:0},
 {k:'gold',g:1,t:'吃 1 顆金蘋果',r:200,z:0},{k:'smash',g:2,t:'碎掉 2 顆岩石',r:150,z:0},
 {k:'c4',g:1,t:'達成 ×4 連擊',r:200,z:0},{k:'blue',g:1,t:'吃 1 顆冰藍莓',r:150,z:0},
 {k:'zone',g:1,t:'進入下一個區域',r:300,z:0},{k:'fever',g:1,t:'觸發狂熱',r:400,z:0},
 {k:'dodge',g:3,t:'躲過 3 次落石/雷擊',r:300,z:2}
];
function tot(k){return S.tot[k]+G.st[k];}
var AC=[
 {id:'first',i:'🧬',n:'初次進化',d:'選擇一次進化',t:function(){return G.picks>=1;}},
 {id:'c5',i:'🔥',n:'連擊大師',d:'連擊達 ×5',t:function(){return G.combo>=5;}},
 {id:'fev',i:'🌈',n:'狂熱登場',d:'觸發一次狂熱',t:function(){return G.st.fever>=1;}},
 {id:'len25',i:'📏',n:'長蛇',d:'身長達 25 節',t:function(){return G.sn.length>=25;}},
 {id:'z2',i:'🪨',n:'闖進岩崩谷',d:'抵達 區域 3',t:function(){return G.z>=2;}},
 {id:'z3',i:'⚡',n:'雷雨將至',d:'抵達 區域 4',t:function(){return G.z>=3;}},
 {id:'sm10',i:'🔨',n:'碎石達人',d:'累計碎石 10 顆',t:function(){return tot('smash')>=10;}},
 {id:'gold5',i:'⭐',n:'淘金客',d:'累計吃 5 顆金蘋果',t:function(){return tot('gold')>=5;}},
 {id:'s3000',i:'💯',n:'三千分',d:'單局 3000 分',t:function(){return G.score>=3000;}},
 {id:'clean',i:'🛡️',n:'完美無傷',d:'沒用護盾抵達 區域 3',t:function(){return G.z>=2&&G.shieldUsed===0;}},
 {id:'m5',i:'🎯',n:'任務達人',d:'單局完成 5 個任務',t:function(){return G.mdone>=5;}},
 {id:'a100',i:'🍎',n:'百果大王',d:'累計吃 100 顆蘋果',t:function(){return tot('apples')>=100;}}
];
function chkAch(){if(FAST)return;AC.forEach(function(a){if(!S.ach[a.id]&&a.t()){S.ach[a.id]=1;G.newAch.push(a.i+a.n);note('🏅 解鎖勳章:'+a.n);arp([660,880,1100]);saveS();}});}

var G=null,running=false,paused=false,modal=false,acc=0,last=0,fx=[],shakeT=0;
function R(n){return Math.floor(Math.random()*n);}
function newGame(){var cx=Math.floor(CW/2),cy=Math.floor(CH/2);
 G={sn:[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}],dir:{x:1,y:0},q:[],food:null,gold:null,blue:null,rocks:[],poison:[],bw:[],bo:[],lw:[],
  score:0,eaten:0,grow:0,P:{},had:{},combo:1,comboT:0,streak:0,maxCombo:1,fever:0,slowT:0,inv:0,flash:0,over:false,t:0,picks:0,
  charge:{shield:0,smash:0},shieldUsed:0,msg:'',msgT:0,z:0,zn:0,zb:0,stepN:0,pT:3,bT:4,lT:3,why:'',
  st:{apples:0,gold:0,smash:0,c4:0,blue:0,zone:0,fever:0,dodge:0},mdone:0,mi:null,lastM:-1,newAch:[],opts:null};
 placeFood();nextMission();}
function occ(x,y){var i;for(i=0;i<G.sn.length;i++)if(G.sn[i].x===x&&G.sn[i].y===y)return true;
 var L=[G.rocks,G.poison,G.lw];for(var a=0;a<L.length;a++)for(i=0;i<L[a].length;i++)if(L[a][i].x===x&&L[a][i].y===y)return true;
 if(G.food&&G.food.x===x&&G.food.y===y)return true;if(G.gold&&G.gold.x===x&&G.gold.y===y)return true;if(G.blue&&G.blue.x===x&&G.blue.y===y)return true;return false;}
function freeCell(minHead){for(var t=0;t<200;t++){var x=R(CW),y=R(CH);if(!occ(x,y)&&(!minHead||Math.abs(x-G.sn[0].x)+Math.abs(y-G.sn[0].y)>=minHead))return {x:x,y:y};}
 for(var yy=0;yy<CH;yy++)for(var xx=0;xx<CW;xx++)if(!occ(xx,yy))return {x:xx,y:yy};return null;}
function placeFood(){G.food=freeCell(0);}
function interval(){return Math.max(.07,.15-G.eaten*.0011)*Math.pow(1.12,(G.P.slow||0))*(G.slowT>0?1.6:1)*(G.fever>0?.88:1);}
function note(s){G.msg=s;G.msgT=1.6;}
function pop(x,y,s,c){if(FAST)return;fx.push({x:x,y:y,vx:0,vy:-38,l:.9,c:c,s:s});}
function burst(cx,cy,c,n){if(FAST)return;for(var i=0;i<n;i++){var a=Math.random()*6.28,v=40+Math.random()*90;fx.push({x:cx*CS+CS/2,y:OY+cy*CS+CS/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5,c:c});}}

/* ---------- 任務 ---------- */
function nextMission(){var canS=G.charge.smash>0||G.P.fire,pool=[];MS.forEach(function(m,i){if(m.z<=G.z&&i!==G.lastM&&(m.k!=='smash'||canS))pool.push(i);});
 var i=pool[R(pool.length)];G.lastM=i;G.mi={i:i,base:G.st[MS[i].k],t:0};}
function mprog(){return G.mi?Math.min(MS[G.mi.i].g,G.st[MS[G.mi.i].k]-G.mi.base):0;}
function chkM(){if(!G.mi)return;var m=MS[G.mi.i];if(G.st[m.k]-G.mi.base>=m.g){G.score+=m.r;G.mdone++;var sh=G.mdone%2===0;if(sh)G.charge.shield++;
  note('🎯 任務完成 +'+m.r+(sh?' 並獲得護盾!':''));var h=G.sn[0];pop(h.x*CS+CS/2,OY+h.y*CS-12,'🎯+'+m.r,'#7DF9C0');arp([523,659,784]);vib(25);nextMission();chkAch();}}

/* ---------- 受傷 / 死亡 ---------- */
function cellOK(x,y){if(x<0||x>=CW||y<0||y>=CH)return false;for(var j=0;j<G.rocks.length;j++)if(G.rocks[j].x===x&&G.rocks[j].y===y)return false;
 for(var b=0;b<G.bo.length;b++)if(G.bo[b].x===x&&G.bo[b].y===y)return false;
 for(var i=0;i<G.sn.length-1;i++)if(G.sn[i].x===x&&G.sn[i].y===y)return false;return true;}
function deflect(){var h=G.sn[0],ds=[[1,0],[-1,0],[0,1],[0,-1]],c1=[],c2=[];
 ds.forEach(function(d){if(d[0]===-G.dir.x&&d[1]===-G.dir.y)return;if(d[0]===G.dir.x&&d[1]===G.dir.y)return;var x=h.x+d[0],y=h.y+d[1];if(G.P.wrap){x=(x+CW)%CW;y=(y+CH)%CH;}if(cellOK(x,y))c1.push(d);});
 if(!c1.length)ds.forEach(function(d){if(d[0]===-G.dir.x&&d[1]===-G.dir.y)return;var x=h.x+d[0],y=h.y+d[1];if(G.P.wrap){x=(x+CW)%CW;y=(y+CH)%CH;}if(cellOK(x,y))c2.push(d);});
 var c=c1.length?c1:c2;if(c.length){var d=c[R(c.length)];G.dir={x:d[0],y:d[1]};}G.q=[];}
function hit(why){
 if(G.fever>0||G.inv>0){deflect();return false;}
 if(G.charge.shield>0){G.charge.shield--;G.shieldUsed++;if(G.P.iron)G.charge.smash++;G.inv=.6;note('🛡 護身鱗片擋下了!');beep(300,.2,'square',.05,600);shakeT=.25;vib(30);burst(G.sn[0].x,G.sn[0].y,'#78C8FF',12);deflect();return false;}
 G.over=true;G.why=why;running=false;
 if(!FAST){G.sn.forEach(function(s,i){burst(s.x,s.y,i%2?'#B6F24A':'#3FCF6B',3);});vib(220);}
 endGame(why);return true;}
function cutAt(i){if(i<3)i=3;if(i>=G.sn.length)return;G.sn.length=i;G.grow=0;note('💥 身體被截斷!');shakeT=.3;beep(120,.25,'sawtooth',.07,50);vib(80);}
function breakRock(j,msg){var r=G.rocks.splice(j,1)[0];burst(r.x,r.y,'#aab',10);G.st.smash++;if(msg)note(msg);beep(150,.15,'sawtooth',.06,60);shakeT=Math.max(shakeT,.15);vib(15);chkM();chkAch();}

/* ---------- 前進一格 ---------- */
function step(){
 G.stepN++;
 if(G.q.length)G.dir=G.q.shift();
 var h=G.sn[0],nx=h.x+G.dir.x,ny=h.y+G.dir.y,wrapped=false,j,i;
 if(nx<0||nx>=CW||ny<0||ny>=CH){if(G.P.wrap){nx=(nx+CW)%CW;ny=(ny+CH)%CH;wrapped=true;}else{hit('撞到牆壁');return;}}
 for(j=0;j<G.rocks.length;j++){var r=G.rocks[j];if(r.x===nx&&r.y===ny){
   if(G.fever>0||G.charge.smash>0){if(G.fever<=0)G.charge.smash--;breakRock(j,'🔨 撞碎岩石!');}else{hit('撞到岩石');return;}break;}}
 for(j=0;j<G.bo.length;j++){var o=G.bo[j];if(o.x===nx&&o.y===ny){
   if(G.fever>0||G.charge.smash>0){if(G.fever<=0)G.charge.smash--;G.bo.splice(j,1);burst(nx,ny,'#C9A27A',12);G.st.smash++;note('🔨 打碎巨石!');shakeT=.2;chkM();}else{hit('被巨石砸中');return;}break;}}
 var tail=G.sn[G.sn.length-1],willGrow=G.grow>0;
 for(i=0;i<G.sn.length;i++){var s=G.sn[i];if(s.x===nx&&s.y===ny&&!(s===tail&&!willGrow)){hit('咬到自己');return;}}
 G.sn.unshift({x:nx,y:ny});
 if(willGrow)G.grow--;else G.sn.pop();
 if(wrapped&&G.P.warp2){G.score+=20;pop(nx*CS+CS/2,OY+ny*CS,'+20 🌌','#C9A0FF');if(G.comboT>0)G.comboT=Math.min(3+1.5*(G.P.combo||0),G.comboT+1.5);}
 if(G.food&&G.food.x===nx&&G.food.y===ny)eat(false);
 else if(G.gold&&G.gold.x===nx&&G.gold.y===ny)eat(true);
 if(G.over)return;
 if(G.blue&&G.blue.x===nx&&G.blue.y===ny)eatBlue();
 for(i=G.poison.length-1;i>=0;i--)if(G.poison[i].x===nx&&G.poison[i].y===ny)eatPoison(i);
 if(G.P.magnet&&G.food){var d=Math.abs(G.food.x-nx)+Math.abs(G.food.y-ny);if(d<=2+G.P.magnet*2&&d>1){var dx=Math.sign(nx-G.food.x),dy=Math.sign(ny-G.food.y);var ax=Math.abs(nx-G.food.x)>=Math.abs(ny-G.food.y);var tx_=G.food.x+(ax?dx:0),ty=G.food.y+(ax?0:dy);if(!occ(tx_,ty)||(tx_===nx&&ty===ny)){G.food.x=tx_;G.food.y=ty;}}
  if(G.food&&G.food.x===nx&&G.food.y===ny)eat(false);}
 if(G.stepN%2===0)boulderStep();
}
function startFever(){G.fever=6;G.streak=0;G.st.fever++;note('🔥 狂熱!6 秒無敵 ・ 分數 ×2');shakeT=.4;arp([392,523,659,784,1047]);vib([30,40,30,40,60]);chkM();chkAch();}
function eat(gold){
 var pts=(gold?50:10)*G.combo*(G.P.score2?2:1)*(G.fever>0?2:1);
 G.score+=pts;G.eaten++;G.zn++;G.st.apples++;if(gold)G.st.gold++;G.grow+=gold?3:1;
 G.comboT=3+1.5*(G.P.combo||0);
 if(G.combo>=5){G.streak++;if(G.streak>=(G.P.inferno?2:3)&&G.fever<=0)startFever();}
 else{G.combo++;if(G.combo===4)G.st.c4++;}
 if(G.combo>G.maxCombo)G.maxCombo=G.combo;
 var h=G.sn[0];burst(h.x,h.y,gold?'#FFD54A':'#FF5A6E',10+G.combo*2);
 pop(h.x*CS+CS/2,OY+h.y*CS,'+'+pts,gold?'#FFD54A':(G.combo>=4?'#FFB347':'#fff'));
 beep(460+Math.min(G.combo,6)*70,.09,'triangle',.05,900+G.combo*60);vib(gold?20:8);
 if(G.combo>=5)shakeT=Math.max(shakeT,.07);
 if(gold)G.gold=null;else{G.food=null;placeFood();}
 if(G.eaten%3===0&&G.rocks.length<14){var rk=freeCell(5);if(rk)G.rocks.push(rk);}
 if(G.eaten%(G.P.rush?5:7)===0&&!G.gold){var gc=freeCell(3);if(gc){G.gold={x:gc.x,y:gc.y,t:G.P.rush?10:7};}}
 if(G.eaten%9===0&&!G.blue){var bc=freeCell(3);if(bc){G.blue={x:bc.x,y:bc.y,t:9};}}
 if(G.P.fire&&G.rocks.length){var rad=G.P.inferno?8:4,cnt=G.P.fire*(G.P.inferno?2:1),hh=G.sn[0],near=G.rocks.map(function(r,i){return {i:i,d:Math.abs(r.x-hh.x)+Math.abs(r.y-hh.y)};}).filter(function(o){return o.d<=rad;}).sort(function(a,b){return a.d-b.d;}).slice(0,cnt).sort(function(a,b){return b.i-a.i;});
  if(near.length){near.forEach(function(o){breakRock(o.i,null);});note('🐲 火焰吐息!燒掉 '+near.length+' 顆岩石');}}
 if(G.zn>=ZS)zoneUp();
 chkM();chkAch();
 if(G.eaten%4===0&&!G.over)openPerk();}
function eatBlue(){G.blue=null;G.slowT=5;G.st.blue++;var cm=3+1.5*(G.P.combo||0);G.comboT=cm;var p=30*G.combo;G.score+=p;var h=G.sn[0];burst(h.x,h.y,'#8FE3FF',14);pop(h.x*CS+CS/2,OY+h.y*CS,'+'+p+' 🧊','#8FE3FF');note('🧊 冰藍莓!時間變慢 5 秒');beep(900,.18,'sine',.05,1300);vib(15);chkM();}
function eatPoison(i){G.poison.splice(i,1);var h=G.sn[0];
 if(G.P.detox||G.fever>0){G.score+=40;burst(h.x,h.y,'#C9A0FF',10);pop(h.x*CS+CS/2,OY+h.y*CS,'+40 🧪','#C9A0FF');beep(700,.1,'triangle',.05,1000);}
 else{G.sn.length=Math.max(3,G.sn.length-3);G.grow=0;G.combo=1;G.comboT=0;G.streak=0;note('🍄 中毒!縮短 3 節、連擊中斷');burst(h.x,h.y,'#9B5DE5',14);shakeT=.2;beep(140,.3,'sawtooth',.06,70);vib(60);}}
function zoneUp(){G.z++;G.zn=0;G.st.zone++;var bonus=100*G.z;G.score+=bonus;G.zb=2.4;
 G.poison=[];G.bw=[];G.bo=[];G.lw=[];G.rocks=G.rocks.filter(function(_,i){return i%2===0;});
 G.pT=Math.max(G.pT,3);G.bT=Math.max(G.bT,4.5);G.lT=Math.max(G.lT,4);
 note('區域 '+(G.z+1)+' ・ '+ZN[G.z%8].n+'  +'+bonus);shakeT=.25;arp([440,554,659,880]);vib([20,30,20]);chkM();chkAch();}

/* ---------- 危險物 ---------- */
function addBoulderWarn(){var h=G.sn[0],hor=Math.random()<.5,dir=Math.random()<.5?1:-1,w;
 if(hor){var row=Math.random()<.5?Math.max(0,Math.min(CH-1,h.y+R(3)-1)):R(CH);w={x:dir>0?0:CW-1,y:row,dx:dir,dy:0,t:1.6};}
 else{var col=Math.random()<.5?Math.max(0,Math.min(CW-1,h.x+R(3)-1)):R(CW);w={x:col,y:dir>0?0:CH-1,dx:0,dy:dir,t:1.6};}
 G.bw.push(w);}
function crush(b){
 for(var j=G.rocks.length-1;j>=0;j--)if(G.rocks[j].x===b.x&&G.rocks[j].y===b.y){burst(b.x,b.y,'#aab',8);G.rocks.splice(j,1);}
 var h=G.sn[0];
 if(h.x===b.x&&h.y===b.y){if(G.fever>0||G.charge.smash>0){if(G.fever<=0)G.charge.smash--;G.st.smash++;note('🔨 打碎巨石!');burst(b.x,b.y,'#C9A27A',12);shakeT=.2;chkM();return true;}hit('被巨石砸中');return true;}
 for(var i=1;i<G.sn.length;i++)if(G.sn[i].x===b.x&&G.sn[i].y===b.y){if(G.fever<=0)cutAt(i);return false;}
 return false;}
function boulderStep(){for(var k=G.bo.length-1;k>=0;k--){var b=G.bo[k];b.x+=b.dx;b.y+=b.dy;
  if(b.x<0||b.x>=CW||b.y<0||b.y>=CH){G.bo.splice(k,1);G.st.dodge++;chkM();continue;}
  if(crush(b))G.bo.splice(k,1);if(G.over)return;}}
function addLight(){var h=G.sn[0],c=null;
 if(Math.random()<.5){var k=3+R(4),x=h.x+G.dir.x*k,y=h.y+G.dir.y*k;if(x>=0&&x<CW&&y>=0&&y<CH&&!G.rocks.some(function(r){return r.x===x&&r.y===y;}))c={x:x,y:y};}
 if(!c)c=freeCell(2);if(c)G.lw.push({x:c.x,y:c.y,t:1.25});}
function strike(w){
 G.flash=.16;shakeT=Math.max(shakeT,.18);beep(90,.25,'sawtooth',.07,40);burst(w.x,w.y,'#FFF3A0',14);vib(40);
 var h=G.sn[0],safe=G.fever>0||G.P.rod;
 if(h.x===w.x&&h.y===w.y){if(!safe){hit('被雷劈到');return;}G.st.dodge++;chkM();return;}
 for(var i=1;i<G.sn.length;i++)if(G.sn[i].x===w.x&&G.sn[i].y===w.y){if(!safe)cutAt(i);else{G.st.dodge++;chkM();}return;}
 G.st.dodge++;chkM();
 if(!occ(w.x,w.y)&&G.rocks.length<18)G.rocks.push({x:w.x,y:w.y});}
function upd(dt){
 G.t+=dt;var i;
 if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0){G.combo=1;G.streak=0;}}
 if(G.gold){G.gold.t-=dt;if(G.gold.t<=0)G.gold=null;}
 if(G.blue){G.blue.t-=dt;if(G.blue.t<=0)G.blue=null;}
 for(i=G.poison.length-1;i>=0;i--){G.poison[i].t-=dt;if(G.poison[i].t<=0)G.poison.splice(i,1);}
 if(G.fever>0){G.fever-=dt;if(G.fever<=0){G.fever=0;note('狂熱結束');}}
 if(G.slowT>0)G.slowT-=dt;if(G.inv>0)G.inv-=dt;if(G.msgT>0)G.msgT-=dt;if(G.zb>0)G.zb-=dt;
 if(G.mi){G.mi.t+=dt;if(G.mi.t>50){note('任務超時,換新任務');nextMission();}}
 var z=G.z;
 if(z>=1){G.pT-=dt;if(G.pT<=0){G.pT=Math.max(2,6-z*.5);if(G.poison.length<Math.min(9,2+z)){var c=freeCell(3);if(c){c.t=16;G.poison.push(c);}}}}
 if(z>=2){G.bT-=dt;if(G.bT<=0){G.bT=Math.max(3.2,8-z*.8);if(G.bw.length+G.bo.length<(z>=7?4:z>=5?3:2))addBoulderWarn();}}
 if(z>=3){G.lT-=dt;if(G.lT<=0){G.lT=Math.max(.8,4.2-(z-3)*.5);addLight();if(z>=6)addLight();}}
 for(i=G.bw.length-1;i>=0;i--){var w=G.bw[i];w.t-=dt;if(w.t<=0){G.bw.splice(i,1);var b={x:w.x,y:w.y,dx:w.dx,dy:w.dy};G.bo.push(b);if(crush(b))G.bo.splice(G.bo.indexOf(b),1);if(G.over)return;}}
 for(i=G.lw.length-1;i>=0;i--){var l=G.lw[i];l.t-=dt;if(l.t<=0){G.lw.splice(i,1);strike(l);if(G.over)return;}}
}

function openPerk(){var pool=[];Object.keys(PK).forEach(function(k){var c=(k==='shield'||k==='smash'||k==='trim')?0:(G.P[k]||0);if(c<PK[k].max)pool.push(k);});
 var pick=[];while(pick.length<3&&pool.length)pick.push(pool.splice(R(pool.length),1)[0]);
 var av=Object.keys(SY).filter(function(k){return !G.P[k]&&SY[k].need();});if(av.length)pick[0]=av[R(av.length)];
 G.opts=pick;
 if(FAST)return;modal=true;var box=$('pcs');box.innerHTML='';
 pick.forEach(function(k,idx){var sy=!!SY[k],b=document.createElement('button');b.className='pc'+(sy?' gold':'');var lv=sy?'<em>合體進化</em>':((k==='shield'||k==='smash'||k==='trim')?'':(G.P[k]?'<em>Lv'+(G.P[k]+1)+'</em>':'<em>NEW</em>'));b.innerHTML='<i>'+pinfo(k).i+'</i><div><b>'+pinfo(k).n+lv+'</b><span>'+pinfo(k).d+'</span></div>';b.onclick=function(){choosePerk(idx);};box.appendChild(b);});
 $('perkt').textContent='已吃 '+G.eaten+' 顆,長度 '+G.sn.length;$('perk').classList.remove('hidden');}
function choosePerk(i){var k=G.opts[i];if(!k)return;G.picks++;

 else if(k==='trim'){var n=Math.max(0,Math.min(4,G.sn.length-3));G.sn.length-=n;G.grow=0;}
 else if(SY[k])G.P[k]=1;else G.P[k]=(G.P[k]||0)+1;
 G.opts=null;modal=false;if(!FAST){$('perk').classList.add('hidden');chkAch();}beep(780,.15,'triangle',.05,1200);}

 if(FAST)return;
 if(G.score>best){best=G.score;store('sn_best',String(best));nb=true;}if(len>bestL){bestL=len;store('sn_len',String(bestL));}

 ['apples','gold','smash'].forEach(function(k){S.tot[k]+=G.st[k];});S.tot.runs++;if(G.z>S.bz)S.bz=G.z;saveS();
 renderMenuStats();

 var lines=[];if(nb)lines.push('🎉 新的最高分!');lines.push('完成任務 '+G.mdone+' 個 ・ 最高連擊 ×'+G.maxCombo+(G.st.fever?' ・ 狂熱 '+G.st.fever+' 次':''));if(G.newAch.length)lines.push('🏅 新勳章:'+G.newAch.join('、'));
 $('oN').innerHTML=lines.join('<br>');
 beep(160,.4,'sawtooth',.06,50);setTimeout(function(){$('over').classList.remove('hidden');},650);}
function renderMenuStats(){$('best').textContent=best;$('bestL').textContent=bestL;$('bestZ').textContent=S.bz+1;var n=AC.filter(function(a){return S.ach[a.id];}).length;$('achN').textContent=n+'/'+AC.length;}

function turn(dx,dy){if(!running||paused||modal)return;var ref=G.q.length?G.q[G.q.length-1]:G.dir;if(ref.x===dx&&ref.y===dy)return;if(ref.x===-dx&&ref.y===-dy&&G.sn.length>1)return;if(G.q.length<2)G.q.push({x:dx,y:dy});}
document.addEventListener('keydown',function(e){var k=e.key;var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]}[k];if(m){turn(m[0],m[1]);e.preventDefault();}if(k===' '||k==='p'||k==='Escape')togglePause();});

/* ---------- 繪製 ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
var FONT='"Fredoka","Noto Sans TC",sans-serif';
function tx(s,x,y,sz,c,al){ctx.font='700 '+sz+'px '+FONT;ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillStyle=c;ctx.fillText(s,x,y);}
function draw(){
 var Z=ZN[G.z%8],fev=G.fever>0;
 ctx.setTransform(dpr,0,0,dpr,0,0);if(shakeT>0)ctx.translate((Math.random()-.5)*5,(Math.random()-.5)*5);
 ctx.fillStyle='#0C1F22';ctx.fillRect(0,0,W,H);
 for(var y=0;y<CH;y++)for(var x=0;x<CW;x++){ctx.fillStyle=((x+y)&1)?Z.a:Z.b;ctx.fillRect(x*CS,OY+y*CS,CS,CS);}
 ctx.strokeStyle=fev?'hsl('+((G.t*400)%360)+',90%,60%)':(G.P.wrap?'rgba(120,200,255,.5)':'rgba('+Z.e+',.45)');ctx.setLineDash(G.P.wrap?[6,6]:[]);ctx.lineWidth=fev?4:2;ctx.strokeRect(1,OY+1,W-2,CH*CS-2);ctx.setLineDash([]);
 // 巨石預警車道
 G.bw.forEach(function(w){var a=.15+.15*Math.sin(G.t*14);ctx.fillStyle='rgba(255,90,70,'+a+')';if(w.dx)ctx.fillRect(0,OY+w.y*CS,W,CS);else ctx.fillRect(w.x*CS,OY,CS,CH*CS);
  tx(w.dx>0?'▶▶':w.dx<0?'◀◀':w.dy>0?'▼':'▲',w.x*CS+CS/2,OY+w.y*CS+CS/2,12,'#FF8A7A');});
 // 雷擊預警
