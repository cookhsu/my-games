<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LED 燈光工作室</title>
<style>
:root{--bg:#07080d;--panel:#10131c;--panel2:#171b27;--line:rgba(255,255,255,.08);--txt:#eef1f8;--dim:#8a93aa;--acc:#7cc4ff;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.5 'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',system-ui,sans-serif;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:minmax(0,46%) minmax(0,1fr);max-width:1100px;margin:0 auto}
@media(min-width:860px){.app{grid-template-rows:none;grid-template-columns:minmax(0,1.35fr) 400px}}
#stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#161a2a,#07080d 75%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px 0;pointer-events:none;z-index:2}
.top h1{font-size:15px;margin:0;letter-spacing:.12em;text-shadow:0 1px 8px #000}.top small{display:block;color:var(--dim);font-size:11px;letter-spacing:.04em}
.top a,.top button{pointer-events:auto}
.pwr{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(20,24,36,.8);color:var(--dim);font-size:20px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);transition:.25s}
.pwr.on{color:#0a0c12;background:var(--acc);box-shadow:0 0 22px var(--acc)}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:var(--dim);font-size:11px;pointer-events:none}
.sheet{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
@media(min-width:860px){.sheet{border-top:0;border-left:1px solid var(--line)}}
.tabs{display:flex;gap:4px;padding:8px 10px 0}
.tabs button{flex:1;padding:9px 0;border:0;border-radius:12px 12px 0 0;background:transparent;color:var(--dim);font:700 13px 'Noto Sans TC',sans-serif;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--txt);border-bottom-color:var(--acc);background:var(--panel2)}
.body{flex:1;overflow:auto;padding:14px 14px 28px;background:var(--panel2);-webkit-overflow-scrolling:touch}
.pane{display:none;flex-direction:column;gap:14px}.pane.on{display:flex}
.lbl{font-size:12px;color:var(--dim);letter-spacing:.14em;font-weight:700;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#0e1119;color:var(--txt);padding:7px 12px;border-radius:999px;font:700 12.5px 'Noto Sans TC',sans-serif;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip.on{border-color:var(--acc);background:rgba(124,196,255,.14);color:#fff}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 6px currentColor}
.row{display:flex;gap:14px;align-items:center}
#wheel{width:170px;height:170px;border-radius:50%;touch-action:none;flex:none;cursor:crosshair;box-shadow:0 0 0 1px var(--line),0 8px 24px rgba(0,0,0,.4)}
.col{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.val{color:var(--txt);font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer}.sw:active{transform:scale(.92)}
.fx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fx button{padding:12px 4px;border-radius:14px;border:1px solid var(--line);background:#0e1119;color:var(--txt);font:700 12.5px 'Noto Sans TC',sans-serif;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
.fx button span{font-size:20px}.fx button.on{border-color:var(--acc);background:rgba(124,196,255,.14)}
.sc{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.scn{position:relative;border:1px solid var(--line);border-radius:14px;padding:12px;background:#0e1119;cursor:pointer;text-align:left;color:var(--txt);font:700 13px 'Noto Sans TC',sans-serif}
.scn small{display:block;color:var(--dim);font-weight:400;font-size:11px;margin-top:2px}
.scn .bar{height:6px;border-radius:3px;margin-top:9px}.scn .x{position:absolute;right:8px;top:6px;color:var(--dim);font-size:15px}
.btn{border:0;border-radius:12px;padding:11px 14px;font:700 13px 'Noto Sans TC',sans-serif;cursor:pointer;background:var(--acc);color:#07101a}.btn.g{background:#0e1119;color:var(--txt);border:1px solid var(--line)}
input[type=time],select{background:#0e1119;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:700 13px 'Noto Sans TC',sans-serif;color-scheme:dark}
.card{background:#0e1119;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.sw2{position:relative;width:44px;height:26px;flex:none}.sw2 input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer}.sw2 b{position:absolute;inset:0;border-radius:13px;background:#2a3042;transition:.2s}.sw2 b::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw2 input:checked+b{background:var(--acc)}.sw2 input:checked+b::after{left:21px}
.big{font:900 28px 'Fredoka','Noto Sans TC',sans-serif;font-variant-numeric:tabular-nums}
#msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px;z-index:9;opacity:0;transition:.25s;pointer-events:none}#msg.on{opacity:1}
#nogl{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:var(--dim)}
</style>
</head>
<body>
<div class="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div class="top"><div><h1>LED 燈光工作室</h1><small id="sub">模擬房間 ・ 拖曳旋轉視角</small></div><button class="pwr on" id="pwr" aria-label="電源">⏻</button></div>
    <div class="hint">拖曳旋轉 ・ 滾輪/雙指縮放</div>
    <div id="nogl">無法載入 3D 引擎(three.module.min.js)<br>請確認檔案與本頁放在同一個資料夾。</div>
  </div>
  <div class="sheet">
    <div class="tabs" id="tabs"><button data-p="color" class="on">顏色</button><button data-p="fx">動態</button><button data-p="scene">情境</button><button data-p="time">排程</button></div>
    <div class="body">
      <div class="pane on" id="p-color">
        <div><div class="lbl">編輯區域 <span style="font-weight:400;letter-spacing:0">可複選</span></div><div class="chips" id="zones"></div></div>
        <div class="row">
          <canvas id="wheel" width="340" height="340"></canvas>
          <div class="col">
            <div><div class="lbl">亮度 <span class="val" id="bv">80%</span></div><input type="range" id="bright" min="1" max="100" value="80"></div>
            <div><div class="lbl">色溫</div><div class="swatches" id="temps"></div></div>
          </div>
        </div>
        <div><div class="lbl">常用色</div><div class="swatches" id="sws"></div></div>
      </div>
      <div class="pane" id="p-fx">
        <div><div class="lbl">編輯區域</div><div class="chips" id="zones2"></div></div>
        <div class="fx" id="fxs"></div>
        <div><div class="lbl">速度 <span class="val" id="sv">50%</span></div><input type="range" id="speed" min="5" max="100" value="50"></div>
        <div class="card"><div class="row" style="justify-content:space-between"><div><b>🎤 麥克風音樂律動</b><div style="color:var(--dim);font-size:12px">「音樂」效果改用真實聲音節拍</div></div><label class="sw2"><input type="checkbox" id="mic"><b></b></label></div></div>
      </div>
      <div class="pane" id="p-scene">
        <div class="sc" id="scs"></div>
        <button class="btn g" id="saveSc">＋ 把目前設定存成情境</button>
        <button class="btn g" id="exp">📋 複製設定(JSON)</button>
      </div>
      <div class="pane" id="p-time">
        <div class="card"><div class="lbl" style="margin:0">睡眠倒數 <span class="val big" id="cd">--:--</span></div><div class="chips" id="tm"></div><div style="color:var(--dim);font-size:12px">時間到前 20 秒會慢慢調暗,最後自動關燈。</div></div>
        <div class="card"><div class="lbl" style="margin:0">日出喚醒</div><div style="color:var(--dim);font-size:12px">亮度與色溫從深紅慢慢升到暖白,像天亮一樣。</div><div class="row"><button class="btn" id="sun5">開始(5 分鐘)</button><button class="btn g" id="sun10">試跑 10 秒</button></div></div>
        <div class="card"><div class="lbl" style="margin:0">每日定時</div>
          <div class="row"><label class="sw2"><input type="checkbox" id="onEn"><b></b></label><span style="flex:1">開燈</span><input type="time" id="onT" value="18:30"></div>
          <div class="row"><label class="sw2"><input type="checkbox" id="offEn"><b></b></label><span style="flex:1">關燈</span><input type="time" id="offT" value="23:30"></div>
          <div style="color:var(--dim);font-size:12px">這是網頁模擬,頁面開著時才會觸發;真正控制燈具需要接上藍牙或 Wi-Fi 控制器。</div></div>
      </div>
    </div>
  </div>
</div>
<div id="msg"></div>

<script>
/* ===== 狀態(與 3D 無關,載入失敗也能操作) ===== */
const $=id=>document.getElementById(id);
const ZN=[['ceil','天花板','#7cc4ff'],['tv','電視牆','#ff6fa8'],['desk','書桌','#ffb454'],['floor','床底/踢腳','#9b7cff']];
const FX=[['static','靜態','●'],['breathe','呼吸','◐'],['rainbow','彩虹','🌈'],['chase','流星','☄'],['twinkle','星空','✦'],['beat','音樂','♪'],['fire','燭火','🔥']];
const TEMPS=[['#ff9d3a','2700K'],['#ffc07a','3200K'],['#ffe3b8','4000K'],['#fff6ea','5000K'],['#dfeaff','6500K']];
const SWS=['#ff3b3b','#ff8a2a','#ffd93b','#39e06b','#27e0d0','#3b8bff','#8a5bff','#ff4fd8'];
const SCENES0=[
 {n:'閱讀',e:'📖',b:75,z:{ceil:['#fff0d8','static'],tv:['#ffe3b8','static'],desk:['#fff6ea','static'],floor:['#ffc07a','static']}},
 {n:'電影',e:'🎬',b:45,z:{ceil:['#1a2a6a','breathe'],tv:['#ff5a2a','static'],desk:['#201030','static'],floor:['#552266','static']}},
 {n:'派對',e:'🎉',b:100,z:{ceil:['#ff3bd8','rainbow'],tv:['#3bd8ff','beat'],desk:['#ffd93b','chase'],floor:['#8a5bff','twinkle']}},
 {n:'睡前',e:'🌙',b:18,z:{ceil:['#ff7a2a','breathe'],tv:['#000000','static'],desk:['#ff9d3a','static'],floor:['#ff5a1a','static']}},
 {n:'專注',e:'🧠',b:85,z:{ceil:['#dfeaff','static'],tv:['#27e0d0','static'],desk:['#ffffff','static'],floor:['#3b8bff','static']}},
 {n:'浪漫',e:'💗',b:40,z:{ceil:['#ff4f8a','breathe'],tv:['#ff2a6a','fire'],desk:['#ff8a6a','static'],floor:['#8a2a6a','breathe']}}];
function ld(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const S=ld('led_state',null)||{on:true,bright:80,speed:50,zones:{}};
for(const [k,,c] of ZN)if(!S.zones[k])S.zones[k]={c:c,fx:'static'};
let SCN=ld('led_scenes',[]);let SEL=new Set(['ceil','tv','desk','floor']);
const save=()=>sv('led_state',S);
function toast(t){const m=$('msg');m.textContent=t;m.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>m.classList.remove('on'),1500);}
/* 顏色轉換 */
function hsv2rgb(h,s,v){const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);const m=[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6];return m;}
function rgb2hsv(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;if(h<0)h+=1;}return[h,mx?d/mx:0,mx];}
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);
const rgb2hex=c=>'#'+c.map(x=>('0'+Math.round(Math.max(0,Math.min(1,x))*255).toString(16)).slice(-2)).join('');
/* UI */
function chipsFor(el){el.innerHTML='';const all=document.createElement('button');all.className='chip'+(SEL.size===4?' on':'');all.textContent='全部';all.onclick=()=>{SEL=new Set(ZN.map(z=>z[0]));uiSel();};el.appendChild(all);
 for(const [k,n] of ZN){const b=document.createElement('button');b.className='chip'+(SEL.has(k)&&SEL.size<4?' on':'');b.innerHTML='<i style="color:'+S.zones[k].c+';background:'+S.zones[k].c+'"></i>'+n;b.onclick=()=>{if(SEL.size===4)SEL=new Set([k]);else if(SEL.has(k)){SEL.delete(k);if(!SEL.size)SEL=new Set([k]);}else SEL.add(k);uiSel();};el.appendChild(b);}}
function uiSel(){chipsFor($('zones'));chipsFor($('zones2'));drawWheel();fxUI();}
const first=()=>S.zones[[...SEL][0]];
function setColor(hex){for(const k of SEL)S.zones[k].c=hex;if(!S.on){S.on=true;pw();}save();uiSel();}
/* 色環 */
const wh=$('wheel'),wx=wh.getContext('2d');let wimg=null;
function drawWheel(){const W=wh.width,R=W/2;if(!wimg){wimg=wx.createImageData(W,W);for(let y=0;y<W;y++)for(let x=0;x<W;x++){const dx=x+.5-R,dy=y+.5-R,r=Math.hypot(dx,dy)/R,o=(y*W+x)*4;if(r>1){wimg.data[o+3]=0;continue;}let h=Math.atan2(dy,dx)/6.2832;if(h<0)h+=1;const c=hsv2rgb(h,Math.min(1,r),1);wimg.data[o]=c[0]*255;wimg.data[o+1]=c[1]*255;wimg.data[o+2]=c[2]*255;wimg.data[o+3]=r>.985?(1-r)/.015*255:255;}}
 wx.clearRect(0,0,W,W);wx.putImageData(wimg,0,0);const [h,s]=rgb2hsv(...hex2rgb(first().c)),a=h*6.2832,px=R+Math.cos(a)*s*R,py=R+Math.sin(a)*s*R;wx.lineWidth=5;wx.strokeStyle='#fff';wx.fillStyle=first().c;wx.beginPath();wx.arc(px,py,15,0,7);wx.fill();wx.stroke();wx.lineWidth=2;wx.strokeStyle='rgba(0,0,0,.45)';wx.stroke();}
function wpick(e){const r=wh.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*2-1,y=(e.clientY-r.top)/r.height*2-1;let rr=Math.hypot(x,y);let h=Math.atan2(y,x)/6.2832;if(h<0)h+=1;rr=Math.min(1,rr);setColor(rgb2hex(hsv2rgb(h,rr,1)));}
let wd=false;wh.addEventListener('pointerdown',e=>{wd=true;wh.setPointerCapture(e.pointerId);wpick(e);});wh.addEventListener('pointermove',e=>{if(wd)wpick(e);});wh.addEventListener('pointerup',()=>wd=false);wh.addEventListener('pointercancel',()=>wd=false);
for(const [c,n] of TEMPS){const d=document.createElement('div');d.className='sw';d.style.background=c;d.title=n;d.onclick=()=>setColor(c);$('temps').appendChild(d);}
for(const c of SWS){const d=document.createElement('div');d.className='sw';d.style.background=c;d.onclick=()=>setColor(c);$('sws').appendChild(d);}
/* 動態 */
function fxUI(){const f=first().fx;$('fxs').innerHTML='';for(const [k,n,i] of FX){const b=document.createElement('button');b.className=f===k?'on':'';b.innerHTML='<span>'+i+'</span>'+n;b.onclick=()=>{for(const z of SEL)S.zones[z].fx=k;save();fxUI();};$('fxs').appendChild(b);}}
$('bright').oninput=e=>{S.bright=+e.target.value;$('bv').textContent=S.bright+'%';save();};
$('speed').oninput=e=>{S.speed=+e.target.value;$('sv').textContent=S.speed+'%';save();};
/* 電源 */
function pw(){$('pwr').classList.toggle('on',S.on);}
$('pwr').onclick=()=>{S.on=!S.on;pw();save();toast(S.on?'已開燈':'已關燈');};
/* 分頁 */
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.p));};
/* 情境 */
function scUI(){const el=$('scs');el.innerHTML='';const all=[...SCENES0.map(s=>Object.assign({},s)),...SCN.map((s,i)=>Object.assign({u:i},s))];
 for(const s of all){const b=document.createElement('div');b.className='scn';const cs=ZN.map(z=>s.z[z[0]][0]);b.innerHTML=(s.u!==undefined?'<span class="x" data-u="'+s.u+'">✕</span>':'')+'<div>'+s.e+' '+s.n+'</div><small>亮度 '+s.b+'%</small><div class="bar" style="background:linear-gradient(90deg,'+cs.join(',')+')"></div>';
  b.onclick=ev=>{if(ev.target.dataset.u!==undefined){SCN.splice(+ev.target.dataset.u,1);sv('led_scenes',SCN);scUI();return;}S.on=true;S.bright=s.b;for(const k in s.z){S.zones[k].c=s.z[k][0];S.zones[k].fx=s.z[k][1];}pw();$('bright').value=S.bright;$('bv').textContent=S.bright+'%';save();uiSel();toast('已套用「'+s.n+'」');};el.appendChild(b);}}
