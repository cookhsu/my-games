<title>生日簿 · 記住每一位重要的人</title>
<style>
:root{
  --bg:#FFF8F0;--card:#FFFFFF;--ink:#3B2F2A;--sub:#8A7A70;--line:#F0E3D6;
  --acc:#F2674B;--acc2:#FFE3DB;--acc-ink:#fff;--ok:#3E9B6B;--warn:#E9A23B;
  --shadow:0 2px 10px rgba(120,70,40,.08);--r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.5}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:70px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:12px;padding:12px 0}
.logo{font-weight:800;font-size:20px;letter-spacing:1px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{font-style:normal;background:var(--acc);color:var(--acc-ink);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.top .sp{flex:1}
.btn{background:var(--acc);color:var(--acc-ink);border-radius:12px;padding:9px 16px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:none;border:1.5px solid #E5534B55;color:#E5534B}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn:active{transform:scale(.97)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;padding:8px 0 6px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs button b{font-size:20px;font-weight:400;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--acc);font-weight:700}
nav.tabs button.on b{filter:none;opacity:1}
@media(min-width:860px){
  body{padding-bottom:40px}
  nav.tabs{position:static;border:0;background:none;max-width:880px;margin:0 auto;padding:10px 16px 0;gap:6px}
  nav.tabs button{flex:none;flex-direction:row;gap:6px;font-size:15px;padding:8px 16px;border-radius:12px}
  nav.tabs button.on{background:var(--acc2)}
  nav.tabs button b{font-size:17px}
  .fab{display:none!important}
}
main{padding:16px 0 30px}
h2.sec{font-size:15px;color:var(--sub);font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec em{font-style:normal;background:var(--acc2);color:var(--acc);border-radius:20px;padding:0 9px;font-size:12px}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid transparent}
.card:hover{border-color:var(--line)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px}
.av.lg{width:64px;height:64px;font-size:27px}
.card .mid{flex:1;min-width:0}
.card .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sm{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;text-align:center;border-radius:12px;padding:4px 10px;background:var(--acc2);color:var(--acc);font-weight:800;line-height:1.2}
.pill small{display:block;font-weight:500;font-size:11px;opacity:.85}
.pill.now{background:var(--acc);color:var(--acc-ink)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:var(--line);color:var(--sub);margin-right:4px}
.hero{background:linear-gradient(135deg,var(--acc),#FF9F6B);color:#fff;border-radius:22px;padding:20px;margin-bottom:6px;box-shadow:var(--shadow)}
.hero h3{margin:0 0 8px;font-size:18px}
.hero .p{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.2);border-radius:14px;padding:10px 12px;margin-top:8px;width:100%;text-align:left;color:#fff}
.hero .p .av{background:rgba(255,255,255,.3)}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
.empty big{display:block;font-size:48px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar select{width:auto;flex:none}
.bar input{flex:1;min-width:140px}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:31;width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(242,103,75,.45);display:grid;place-items:center}
/* modal */
.mask{position:fixed;inset:0;background:rgba(30,15,5,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
@media(min-width:700px){.mask{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 14px;font-size:19px;display:flex;align-items:center;justify-content:space-between}
.x{width:32px;height:32px;border-radius:50%;background:var(--line);font-size:16px}
label.f{display:block;font-size:13px;color:var(--sub);font-weight:700;margin:12px 0 5px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:7px;border-radius:10px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:var(--shadow)}
.r3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:5px 12px;border-radius:20px;border:1.5px solid var(--line);font-size:14px;background:var(--card)}
.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dots button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.dots button.on{border-color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:10px 0}
.kv span:nth-child(odd){color:var(--sub)}
.gift{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.gift input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);flex:none}
.gift.done span{text-decoration:line-through;color:var(--sub)}
.gift span{flex:1}
.gift .del{color:var(--sub);padding:2px 8px}
.row2{display:flex;gap:8px}
/* calendar */
.cal{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px}
.cal .hd{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px;font-weight:800;font-size:17px}
.cal .w,.cal .g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal .w span{font-size:12px;color:var(--sub);padding:4px 0}
.cal .g button{aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:15px;position:relative;margin:1px}
.cal .g button.o{opacity:.25}
.cal .g button.t{outline:2px solid var(--acc);outline-offset:-2px}
.cal .g button.has{background:var(--acc2);font-weight:800;color:var(--acc)}
.cal .g button.sel{background:var(--acc);color:var(--acc-ink)}
.cal .g button i{font-style:normal;font-size:10px;line-height:1}
/* stats */
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.stat h4{margin:0 0 10px;font-size:15px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.big3 div{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;text-align:center}
.big3 b{display:block;font-size:26px;color:var(--acc)}
.big3 span{font-size:12px;color:var(--sub)}
.hbar{display:flex;align-items:center;gap:8px;font-size:14px;margin:5px 0}
.hbar>span:first-child{width:84px;flex:none;color:var(--sub);white-space:nowrap}
.hbar .t{flex:1;background:var(--line);border-radius:6px;height:14px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--acc);border-radius:6px}
.hbar>b{width:26px;text-align:right}
.mcol{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:110px}
.mcol div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--sub)}
.mcol div i{display:block;width:100%;background:var(--acc);border-radius:5px 5px 0 0;min-height:2px}
.mcol div.cur i{background:var(--warn)}
.mcol div b{font-size:11px;color:var(--ink)}
.note{font-size:13px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:99;display:flex;gap:12px;align-items:center;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast button{color:var(--acc);font-weight:800}
.banner{background:var(--acc2);color:var(--ink);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.banner button{margin-left:auto;color:var(--sub)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0}
.setrow small{display:block;color:var(--sub)}
.hide{display:none!important}
</style>
<style id="v3">
.sheet.na{animation:none!important}

:root[data-theme="dark"]{--sky1:#2C1B6B;--sky2:#120B33}:root[data-theme="dark"] body{background:radial-gradient(2px 2px at 10% 12%,#fff,transparent),radial-gradient(2px 2px at 30% 40%,#FFE9A8,transparent),radial-gradient(1.5px 1.5px at 62% 18%,#fff,transparent),radial-gradient(2px 2px at 85% 33%,#fff,transparent),radial-gradient(1.5px 1.5px at 48% 72%,#fff,transparent),radial-gradient(2px 2px at 92% 80%,#FFE9A8,transparent),radial-gradient(1.5px 1.5px at 18% 85%,#fff,transparent),linear-gradient(180deg,var(--sky1),var(--sky2));background-attachment:fixed}
html{background:var(--sky2)}
body{color:var(--on);font-weight:500;background:

 linear-gradient(180deg,var(--sky1),var(--sky2));background-attachment:fixed}
.card,.stat,.cal,.sheet,.big3 div,.banner,.toast,.kv{color:var(--ink)}
main>.note,main>p.note,.empty{color:var(--on);text-shadow:0 2px 0 rgba(42,27,77,.55)}
header.top{position:static;background:none;border:0;backdrop-filter:none}

function lunarMap(ry){
  if(LCACHE[ry])return LCACHE[ry];
  var map={},dt=new Date(ry,0,1),end=new Date(ry+1,2,20),guard=0;
  while(dt<=end&&guard++<500){
    var l=lunarOf(dt);
    if(l&&l.ry===ry)map[l.m+(l.leap?'b':'')+'-'+l.d]={y:dt.getFullYear(),m:dt.getMonth()+1,d:dt.getDate()};
    dt=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()+1);
  }
  return LCACHE[ry]=map;
}
function lunarToSolar(p,ry){
  var map=lunarMap(ry),d=p.d,keys=[];
  if(p.leap)keys.push(p.m+'b-'+d);
  keys.push(p.m+'-'+d);
  if(d===30){if(p.leap)keys.push(p.m+'b-29');keys.push(p.m+'-29')}
  for(var i=0;i<keys.length;i++)if(map[keys[i]])return map[keys[i]];
  return null;
}
function animalOfPerson(p){
  var ry=null;
  if(!p.y)return '';
  if(p.cal==='l')ry=p.y;
  else{var l=lunarOf(new Date(p.y,p.m-1,p.d));ry=l?l.ry:p.y}
  return ANIMALS[((ry-4)%12+12)%12];
}
function signName(m,d){
  var t=[['摩羯座','♑',1,20],['水瓶座','♒',2,19],['雙魚座','♓',3,21],['牡羊座','♈',4,20],['金牛座','♉',5,21],['雙子座','♊',6,22],['巨蟹座','♋',7,23],['獅子座','♌',8,23],['處女座','♍',9,23],['天秤座','♎',10,24],['天蠍座','♏',11,23],['射手座','♐',12,22]];
  var cur=t[m-1];
  if(d>=cur[3])return cur;
  return m===1?t[11]:t[m-2];
}

function occ(p,gy){
  if(p.cal==='s'){var d=p.d;if(p.m===2&&d===29&&!leapYear(gy))d=28;return {y:gy,m:p.m,d:d}}
  return lunarToSolar(p,gy);
}
function nextOf(p,t){
  t=t||tdy();var td=dnum(t);
  for(var gy=t.y-1;gy<=t.y+2;gy++){
    var o=occ(p,gy);if(!o)continue;
    var n=dnum(o)-td;
    if(n>=0)return {date:o,days:n,age:p.y?gy-p.y:null,idx:gy};
  }
  return {date:null,days:99999,age:null};
}
function dateStr(o){return o.m+'月'+o.d+'日（週'+WD[wday(o)]+'）'}
function birthStr(p){

  return (p.y?p.y+' 年 ':'')+p.m+' 月 '+p.d+' 日';
}

/* ========== 遊戲化：經驗值 / 等級 / 簽到 / 成就 ========== */
function lvOf(xp){var L=1;while(xp>=20*L*L)L++;return L}           /* Lv n 需要累積 20*(n-1)^2... 用 20*L^2 為升級門檻 */
function lvBase(L){return L<=1?0:20*(L-1)*(L-1)}
function lvNeed(L){return 20*L*L}
function dayKey(o){o=o||tdy();return o.y+'-'+o.m+'-'+o.d}
function gain(n,why){
  if(!n)return;var b=lvOf(S.xp);S.xp+=n;var a=lvOf(S.xp);save();
  if(a>b){confetti();toast('🎉 升級！Lv.'+a+'　（'+(why||'')+' +'+n+' XP）')}
  else if(why)toast('+'+n+' XP　'+why);
  drawHud();
}
function checkin(){
  var t=tdy(),k=dayKey(t);if(S.lastDay===k)return;
  var y=new Date(t.y,t.m-1,t.d-1),yk=dayKey({y:y.getFullYear(),m:y.getMonth()+1,d:y.getDate()});
  S.streak=(S.lastDay===yk)?S.streak+1:1;S.lastDay=k;
  var bonus=5+Math.min(S.streak,7);save();gain(bonus,'每日簽到 · 連續 '+S.streak+' 天');
}
function sentFor(p){return !!S.sent[p.id+'@'+tdy().y]}
function markSent(p){
  var k=p.id+'@'+tdy().y;if(S.sent[k])return;S.sent[k]=1;save();confetti();gain(15,'送出祝福給 '+p.name);
}

function confetti(){
  var c=document.getElementById('cf');if(!c)return;var x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  var cols=['#FF5C7A','#FFC93C','#3CCB7F','#4DA3FF','#8B5CF6','#fff'],P=[];
  for(var i=0;i<90;i++)P.push({x:innerWidth/2,y:innerHeight*0.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*6+3,c:cols[i%6],a:Math.random()*6,va:(Math.random()-.5)*.4});
  var f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(function(p){p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});
    if(++f<110)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})();
}

function csvParse(t){
  var rows=[],r=[],c='',q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}

  var title='🎂 '+p.name+'的生日'+(p.cal==='l'?'（農曆'+lunarName(p.m,p.d,p.leap)+'）':'');
  var alarms=rem.map(function(n){
    return ['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(p.name+(n?' '+n+' 天後生日':' 今天生日')),'TRIGGER:'+(n===0?'PT9H':'-P'+(n-1)+'DT15H'),'END:VALARM'];
  });
  function ev(o,idx,rrule){
    var l=['BEGIN:VEVENT','UID:'+p.id+'-'+idx+'@birthday-keeper','DTSTAMP:'+new Date().toISOString().replace(/[-:]|\.\d+/g,''),'DTSTART;VALUE=DATE:'+ymd(o),'DTEND;VALUE=DATE:'+ymd(addDay(o)),'SUMMARY:'+icsEsc(title),'TRANSP:TRANSPARENT'];
    if(p.note)l.push('DESCRIPTION:'+icsEsc(p.note));
    if(rrule)l.push('RRULE:FREQ=YEARLY');
    alarms.forEach(function(a){l=l.concat(a)});
    l.push('END:VEVENT');return l.map(fold).join('\r\n');
  }
  if(p.cal==='s'&&!(p.m===2&&p.d===29)){out.push(ev({y:t.y,m:p.m,d:p.d},'r',true))}
  else{for(var y=t.y;y<t.y+10;y++){var o=occ(p,y);if(o)out.push(ev(o,y,false))}}
  return out;
}
function ics(list){return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//生日簿//ZH-TW//','CALSCALE:GREGORIAN','X-WR-CALNAME:生日簿'].join('\r\n')+'\r\n'+list.reduce(function(a,p){return a.concat(icsEvents(p))},[]).join('\r\n')+'\r\nEND:VCALENDAR\r\n'}
function expIcs(list,name){dl(name,ics(list),'text/calendar');}

/* ========== 範例 ========== */
function sample(){
  var t=tdy(),mk=function(n,cal,m,d,y,g,extra){return Object.assign({id:uid(),name:n,cal:cal,m:m,d:d,y:y,leap:false,group:g,note:'',color:COLORS[Math.floor(Math.random()*COLORS.length)],gifts:[],rem:null},extra||{})};
  var dd=function(k){var x=new Date(t.y,t.m-1,t.d+k);return x};
  var a=dd(0),b=dd(3),c=dd(12),e=dd(45);

    mk('小美','s',b.getMonth()+1,b.getDate(),1994,'朋友',{note:'愛喝手搖：楊枝甘露'}),
    mk('主管 陳經理','s',c.getMonth()+1,c.getDate(),null,'同事'),
    mk('阿嬤','l',8,15,1944,'家人',{note:'中秋節生日'}),
    mk('舅舅','l',1,1,1970,'親戚'),
    mk('大學同學 阿凱','s',2,29,1996,'朋友',{note:'2/29 出生，平年改 2/28 慶祝'}),
    mk('客戶 王董','s',e.getMonth()+1,e.getDate(),null,'客戶')];
  var r=addMany(L,true);render();toast('已加入 '+r[0]+' 筆範例');

/* ========== Toast ========== */
var TT=0;
function toast(msg,undo){
  clearTimeout(TT);
  $('#toastBox').innerHTML='<div class="toast"><span>'+esc(msg)+'</span>'+(undo?'<button data-act="undo">復原</button>':'')+'</div>';
  TT=setTimeout(function(){$('#toastBox').innerHTML=''},undo?6000:2600);
}
var UNDO=null;

/* ========== 事件 ========== */
document.addEventListener('click',function(ev){
  var t=ev.target,el;
  if((el=t.closest('[data-tab]'))){UI.tab=el.dataset.tab;UI.calSel=null;render();window.scrollTo(0,0);return}
  if((el=t.closest('[data-open]'))){openDetail(el.dataset.open);return}
  if(t.dataset&&t.dataset.close&&(t.classList.contains('mask')||t.classList.contains('x')||t.tagName==='BUTTON')){closeModal();return}
  if((el=t.closest('[data-cd]'))){var d=+el.dataset.cd;UI.calSel=UI.calSel===d?null:d;render();return}
  if((el=t.closest('[data-cm]'))){UI.calM+=+el.dataset.cm;if(UI.calM>12){UI.calM=1;UI.calY++}if(UI.calM<1){UI.calM=12;UI.calY--}UI.calSel=null;render();return}
  if((el=t.closest('[data-grem]'))){var n=+el.dataset.grem,i=S.set.rem.indexOf(n);if(i>=0)S.set.rem.splice(i,1);else S.set.rem.push(n);S.set.rem.sort(function(a,b){return a-b});save();render();return}
  if(ED){
    if((el=t.closest('[data-ecal]'))){readEdit();ED.cal=el.dataset.ecal;if(ED.cal==='l'&&ED.d>30)ED.d=30;drawEdit();return}
    if((el=t.closest('[data-egrp]'))){readEdit();ED.group=el.dataset.egrp;drawEdit();return}
    if((el=t.closest('[data-ecol]'))){readEdit();ED.color=el.dataset.ecol;drawEdit();return}
    if((el=t.closest('[data-erem]'))){readEdit();var r=ED.rem||S.set.rem.slice(),n2=+el.dataset.erem,j=r.indexOf(n2);if(j>=0)r.splice(j,1);else r.push(n2);r.sort(function(a,b){return a-b});ED.rem=r;drawEdit();return}
  }
  var gp=t.closest('[data-pid]');
  if(gp){
    var p=byId(gp.dataset.pid);
    if((el=t.closest('[data-gdel]'))){p.gifts.splice(+el.dataset.gdel,1);save();openDetail(p.id);return}
  }
  if((el=t.closest('[data-act]'))){act(el.dataset.act)}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='grp'){UI.grp=t.value;render()}
  else if(t.id==='sort'){S.set.sort=t.value;save();render()}
  else if(t.id==='theme'){S.set.theme=t.value;save();applyTheme()}
  else if(t.id==='file'&&t.files[0]){var f=t.files[0],rd=new FileReader();rd.onload=function(){try{importText(String(rd.result),f.name)}catch(e){toast('檔案格式無法讀取')}};rd.readAsText(f);t.value=''}
  else if(t.dataset&&t.dataset.gdone!=null){var p=byId(t.closest('[data-pid]').dataset.pid);var g=p.gifts[+t.dataset.gdone];g.done=t.checked;save();openDetail(p.id);if(t.checked&&!g.xp){g.xp=1;save();gain(8,'禮物備妥')}}
  else if(ED&&(t.id==='e_m'||t.id==='e_y')){
    readEdit();var l=ED.cal==='l',mx=l?30:dim(ED.y||2000,ED.m);if(ED.d>mx)ED.d=mx;
    $('#e_d').innerHTML=opts(1,mx,ED.d,function(i){return l?lunarDay(i):i+' 日'});}
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='q'){UI.q=ev.target.value;render()}
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&$('#modal').innerHTML)closeModal();
  if(ev.key==='Enter'&&ev.target.id==='g_t'){ev.preventDefault();act('gadd')}
});
function curDetail(){var s=$('#modal [data-pid]');return s?byId(s.dataset.pid):null}
function act(a){
  var p;
  switch(a){
    case 'add':openEdit();break;
    case 'esave':saveEdit();break;
    case 'edel':
      if(!ED)break;var gone=byId(ED.id);S.people=S.people.filter(function(x){return x.id!==ED.id});UNDO=gone;save();closeModal();render();toast('已刪除 '+gone.name,true);break;
    case 'undo':if(UNDO){S.people.push(UNDO);UNDO=null;save();render();toast('已復原')}break;
    case 'dedit':p=curDetail();if(p)openEdit(p.id);break;
    case 'dics':p=curDetail();if(p)expIcs([p],p.name+'生日.ics');break;
    case 'gadd':
      p=curDetail();var t=$('#g_t').value.trim();if(!p||!t)break;
      (p.gifts=p.gifts||[]).push({t:t,price:$('#g_p').value,done:false});save();openDetail(p.id);gain(3,'新增禮物想法');break;
    case 'gnext':setGreet(GI.i+1);break;
    case 'gcopy':
      var txt=$('#gtxt').value;if(curDetail())markSent(curDetail());
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('已複製祝福語')},function(){$('#gtxt').select();try{document.execCommand('copy');toast('已複製祝福語')}catch(e){toast('請長按文字手動複製')}});break;
    case 'gline':if(curDetail())markSent(curDetail());window.open('https://line.me/R/msg/text/?'+encodeURIComponent($('#gtxt').value),'_blank');break;
    case 'gshare':
      if(curDetail())markSent(curDetail());if(navigator.share)navigator.share({text:$('#gtxt').value}).catch(function(){});else act('gcopy');break;
    case 'bulk':openBulk();break;
    case 'bimp':doBulk();break;
    case 'impfile':$('#file').click();break;
    case 'expjson':expJson();break;
    case 'expcsv':expCsv();break;
    case 'expics':if(!S.people.length){toast('還沒有資料');break}expIcs(S.people,'生日簿_'+stamp()+'.ics');toast('已匯出行事曆檔');break;
    case 'sample':sample();break;
    case 'wipe':
      if(confirmWipe()){S.people=[];save();render();toast('已清除全部資料')}break;
    case 'today':UI.calY=0;UI.calSel=null;render();break;
    case 'hideb':var tt=tdy();S.seenBanner=tt.y+'-'+tt.m+'-'+tt.d;render();break;
  }
}
var wipeAsk=0;
function confirmWipe(){
  /* 不使用 window.confirm（避免被瀏覽器封鎖）：連按兩次才執行 */
  if(Date.now()-wipeAsk<4000){wipeAsk=0;return true}
  wipeAsk=Date.now();toast('再按一次「清除全部資料」確認（建議先備份）');return false;
}

load();applyTheme();
if(!lfmt()){/* 瀏覽器不支援農曆時仍可使用國曆 */}
render();checkin();
window.__BK={gain:gain,lvOf:lvOf,checkAch:checkAch,S:S,nextOf:nextOf,lunarToSolar:lunarToSolar,lunarMap:lunarMap,parseLine:parseLine,ics:ics,render:render,UI:UI,act:act,setNow:function(f){NOW=f;render()},signName:signName,animalOfPerson:animalOfPerson,importText:importText};
})();
