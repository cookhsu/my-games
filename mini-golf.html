function tick(dt){

    }

     if(G.strokes>=MAXS){G.state='fail';G.timer=0;}else G.state='aim';
    }
   }
   if(b.evs.length)handleEvs(b);
   {const sk2=SKINS.find(k=>k.k===SV.skin);if(sk2&&sk2.trail&&G.state==='roll'&&Math.hypot(b.vx,b.vy)>120&&(n&3)===0){fx.push({x:b.x,y:b.y,vx:0,vy:0,life:.35,max:.35,col:sk2.trail==='rb'?'hsl('+((G.t*300)%360)+',95%,60%)':sk2.trail,r:2.6});}}
