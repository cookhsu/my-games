function cellAt(x,y){const c=Math.floor(x/CS),r=Math.floor((y-OY)/CS);if(c<0||c>=COLS||r<0||r>=ROWS)return '#';return cur.g[r][c];}

/* ---------- physics ---------- */
function collideWalls(b){
 const c0=Math.floor(b.x/CS),r0=Math.floor((b.y-OY)/CS);
 for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
  const c=c0+dc,r=r0+dr; if(!solid(c,r))continue;
  const rx=c*CS,ry=OY+r*CS;
  const qx=Math.max(rx,Math.min(b.x,rx+CS)),qy=Math.max(ry,Math.min(b.y,ry+CS));
  let dx=b.x-qx,dy=b.y-qy,d2=dx*dx+dy*dy;
  if(d2>=BR*BR)continue;
  let nx,ny,d=Math.sqrt(d2);
  if(d<1e-6){const sp=Math.hypot(b.vx,b.vy)||1;nx=-b.vx/sp;ny=-b.vy/sp;d=0;}
  else{nx=dx/d;ny=dy/d;}
  b.x=qx+nx*BR;b.y=qy+ny*BR;
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){b.vx-=(1+E_WALL)*vn*nx;b.vy-=(1+E_WALL)*vn*ny;b.wallHit=true;if(b.evs&&-vn>70)b.evs.push(['wall',b.x-nx*BR,b.y-ny*BR,-vn]);}
 }
}
const stopWater=60;
function step(b,dt,t){
 let ch=cellAt(b.x,b.y),sp=Math.hypot(b.vx,b.vy);
 if(sp>0){
  let d=GD,dr=GR;
  if(ch==='S'&&!b.fl)d=SD;else if(ch==='I'){d=ID;dr=IR;}
  let ns=Math.max(0,sp-d*dt);ns*=Math.exp(-dr*dt);
  const k=ns/sp;b.vx*=k;b.vy*=k;
 }
 if(!b.aim){const a=ARR[ch];if(a){b.vx+=a[0]*CONV*dt;b.vy+=a[1]*CONV*dt;}}
 if(b.bc>0)b.bc-=dt;
 if(!b.aim&&ch==='R'&&!(b.bc>0)&&sp>40){b.vx*=1.55;b.vy*=1.55;b.bc=.5;if(b.evs)b.evs.push(['boost',b.x,b.y]);}
 sp=Math.hypot(b.vx,b.vy);{const mv=b.pw?1250:MAXV;if(sp>mv){b.vx*=mv/sp;b.vy*=mv/sp;}}
 b.x+=b.vx*dt;b.y+=b.vy*dt;
 b.wallHit=false;
 collideWalls(b);collideWalls(b);
 for(const k of cur.bump){
  const dx=b.x-k.x,dy=b.y-k.y,d=Math.hypot(dx,dy);
  if(d<BR+13&&d>1e-6){
   const nx=dx/d,ny=dy/d;b.x=k.x+nx*(BR+13);b.y=k.y+ny*(BR+13);
   const vn=b.vx*nx+b.vy*ny;
   if(vn<0){b.vx-=2*vn*nx;b.vy-=2*vn*ny;}
   const s2=Math.hypot(b.vx,b.vy);
   if(s2<300){b.vx=nx*300;b.vy=ny*300;}
   if(b.evs){k.f=1;b.evs.push(['bump',k.x,k.y]);}
  }
 }

 for(const sl of cur.slide){
  const ph=sl.w*t+sl.ph,cx=sl.x+sl.A*Math.sin(ph),vs=sl.A*sl.w*Math.cos(ph),hw=26,hh=6;
  const qx=Math.max(cx-hw,Math.min(b.x,cx+hw)),qy=Math.max(sl.y-hh,Math.min(b.y,sl.y+hh));
  let dx=b.x-qx,dy=b.y-qy,d=Math.hypot(dx,dy);
  if(d<BR){
   let nx,ny;if(d<1e-6){nx=0;ny=b.y<sl.y?-1:1;}else{nx=dx/d;ny=dy/d;}
   b.x=qx+nx*BR;b.y=qy+ny*BR;
   const rx=b.vx-vs,ry=b.vy,vn=rx*nx+ry*ny;
   if(vn<0){b.vx=rx-1.9*vn*nx+vs;b.vy=ry-1.9*vn*ny;if(b.evs&&-vn>60)b.evs.push(['wall',b.x,b.y,-vn]);}
   const s4=Math.hypot(b.vx,b.vy);if(s4>MAXV){b.vx*=MAXV/s4;b.vy*=MAXV/s4;}
  }
 }
 collideWalls(b);
 for(const w of cur.wind){
  const a=windAng(w,t),ux=Math.cos(a),uy=Math.sin(a);
  const ax=w.x-ux*w.R,ay=w.y-uy*w.R,bx=w.x+ux*w.R,by=w.y+uy*w.R;
  const ex=bx-ax,ey=by-ay;
  let tt=((b.x-ax)*ex+(b.y-ay)*ey)/(ex*ex+ey*ey);tt=Math.max(0,Math.min(1,tt));
  const qx=ax+ex*tt,qy=ay+ey*tt;
  let dx=b.x-qx,dy=b.y-qy,d=Math.hypot(dx,dy);
  if(d<BR+HT){
   let nx,ny;if(d<1e-6){nx=-uy;ny=ux;}else{nx=dx/d;ny=dy/d;}
   b.x=qx+nx*(BR+HT);b.y=qy+ny*(BR+HT);
   const wv=w.dir*OM,vwx=-wv*(qy-w.y),vwy=wv*(qx-w.x);
   let rx=b.vx-vwx,ry=b.vy-vwy;const vn=rx*nx+ry*ny;
   if(vn<0){rx-=1.7*vn*nx;ry-=1.7*vn*ny;b.vx=rx+vwx;b.vy=ry+vwy;if(b.evs&&-vn>60)b.evs.push(['wall',b.x,b.y,-vn]);}
   const s3=Math.hypot(b.vx,b.vy);if(s3>MAXV){b.vx*=MAXV/s3;b.vy*=MAXV/s3;}
  }
 }
 if(b.cool>0)b.cool-=dt;
 else{
  for(const k in cur.port){
   const arr=cur.port[k];
   for(const p of arr){
    if(Math.hypot(b.x-p.x,b.y-p.y)<11&&Math.hypot(b.vx,b.vy)>25){
     const q=arr.find(z=>z!==p);if(!q)continue;
     if(b.evs)b.evs.push(['port',p.x,p.y,q.x,q.y,k]);
     b.x=q.x;b.y=q.y;b.cool=.55;break;
    }
   }
   if(b.cool>0)break;
  }
 }
 const H0=cur.hole,hx=H0.x-b.x,hy=H0.y-b.y,hd=Math.hypot(hx,hy);sp=Math.hypot(b.vx,b.vy);
 if(hd<(b.mg?HIN*1.7:HIN)&&sp<(b.mg?520:340))return 'hole';
 if(b.mg){if(hd<46&&sp<520&&hd>1e-6){b.vx+=hx/hd*1100*dt;b.vy+=hy/hd*1100*dt;}}
 else if(hd<15&&sp<250&&hd>1e-6){b.vx+=hx/hd*700*dt;b.vy+=hy/hd*700*dt;}
 ch=cellAt(b.x,b.y);
 if(ch==='W'&&!(b.fl&&sp>=stopWater)){
  const lx=b.x-Math.floor(b.x/CS)*CS,ly=(b.y-OY)-Math.floor((b.y-OY)/CS)*CS;
  if(lx>5&&lx<CS-5&&ly>5&&ly<CS-5)return 'water';
 }
 sp=Math.hypot(b.vx,b.vy);
 const conv=!!ARR[ch],stopV=ch==='I'?5:ch==='S'?22:14;
 if(sp<stopV&&(!conv||(b.wallHit&&sp<40))){
  if(ch==='W')return 'water';
  return 'rest';
 }
 return null;
}
function simulate(b0,ang,pow,maxT,t0,rec,opt){
 opt=opt||{};const v=(90+pow*730)*(opt.power?1.4:1);
 const b={x:b0.x,y:b0.y,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,cool:0,aim:false,wallHit:false,fl:!!opt.float,mg:!!opt.magnet,pw:!!opt.power};
 let t=0,n=0;const pts=[];
 while(t<maxT){
  const r=step(b,DT,t0+t);t+=DT;n++;
  if(rec&&n%8===0)pts.push([b.x,b.y]);
  if(r)return {res:r,x:b.x,y:b.y,t,pts};
 }
 return {res:'timeout',x:b.x,y:b.y,t,pts};
}

   }else{

   {const sk2=SKINS.find(k=>k.k===SV.skin);if(sk2&&sk2.trail&&G.state==='roll'&&Math.hypot(b.vx,b.vy)>120&&(n&3)===0){fx.push({x:b.x,y:b.y,vx:0,vy:0,life:.35,max:.35,col:sk2.trail==='rb'?'hsl('+((G.t*300)%360)+',95%,60%)':sk2.trail,r:2.6});}}

   G.timer+=DT;G.t+=DT;if(G.timer>=.5){G.state='done';fail();}

 }
 if(G.acc>DT*50)G.acc=0;

 for(let i=fx.length-1;i>=0;i--){const p=fx[i];p.life-=dt;if(p.life<=0){fx.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;}

 var probe=d.createElement('div');probe.setAttribute('aria-hidden','true');probe.style.cssText='position:absolute;left:0;top:0;width:100px;height:4px;visibility:hidden;pointer-events:none';probe.id='dv-probe';b.appendChild(probe);

  var t=1e9,bt=-1e9,l=1e9,r=-1e9,sy=scrollY,sx=scrollX,f=conv();
  for(var c=b.firstElementChild;c;c=c.nextElementSibling){

  }

 }
 function place(bx){
  var desk=mq.matches;de.classList.toggle('dv-desk',desk);de.classList.toggle('dv-mob',!desk);
  if(!desk){L.classList.remove('on');R.classList.remove('on');return;}
  var vw=innerWidth,gap=20,lw=Math.min(300,bx.l-gap*2),rw=Math.min(280,vw-bx.r-gap*2);

  if(rw>=190){R.style.width=rw+'px';R.style.left=(bx.r+gap)+'px';R.classList.add('on');}else R.classList.remove('on');
 }
 var lastKey='',noUp=false;
 function apply(v,vh){z=v;if(z===1){b.style.zoom='';b.style.minHeight='';}else{b.style.zoom=String(z);b.style.minHeight=(vh/z)+'px';}}
 function fit(force){
  var desk=mq.matches,bx=box();if(!bx)return;
  var vh=innerHeight,vw=innerWidth,h=(bx.b-bx.t)/z,w=(bx.r-bx.l)/z,key=Math.round(h/8)+','+Math.round(w/8),zmin=desk?.55:.78;

  var nz;
  if(desk){nz=Math.min(noUp?1:1.6,(vh-28)/h,(vw-48)/w);}else{nz=Math.min(1,vh/h);}
