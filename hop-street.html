  if(L.type==='road'||L.type==='river'){for(const v of L.veh){const x=vx(L,v,gtime);v.x=x;v.m.position.x=x;}}

   if(L.type==='road'){for(const v of L.veh){if(Math.abs(v.x-P.x)<v.hw+.22){die('car');break;}}}
   else if(L.type==='rail'&&L.state===2){if(Math.abs(L.x-P.x)<12&&L.x*L.dir>-30&&Math.abs(P.x-(L.x-L.dir*5))<7.6)die('train');}

 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue;}p.vy-=7*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.y<0){p.y=0;p.vy*=-.3;}}
 for(let i=0;i<PMAX;i++){const p=parts[i];if(p){pPos[i*3]=p.x;pPos[i*3+1]=p.y;pPos[i*3+2]=p.z;const q=Math.min(1,p.l*2.4);pCol[i*3]=p.c.r*q;pCol[i*3+1]=p.c.g*q;pCol[i*3+2]=p.c.b*q;}else{pPos[i*3+1]=-50;pCol[i*3]=pCol[i*3+1]=pCol[i*3+2]=0;}}
 pG.attributes.position.needsUpdate=true;pG.attributes.color.needsUpdate=true;
 /* 老鷹 */
 if(eagle){if(!eagle.m){eagle.m=mesh(proto('eagle',()=>[B(.5,.4,.9,0x5a3a22,0,0,0),B(.4,.3,.3,0xffffff,0,.3,-.55),B(.14,.1,.2,0xffc83b,0,.32,-.78),B(1.6,.08,.5,0x6a4a2a,-1.0,.2,.1),B(1.6,.08,.5,0x6a4a2a,1.0,.2,.1),B(.3,.06,.5,0x4a2a14,0,.25,.7)]));eagle.m.scale.setScalar(1.3);sc.add(eagle.m);}eagle.m.position.set(eagle.x,eagle.y,eagle.z);eagle.m.rotation.x=.3;eagle.m.children&&0;}
 else if(!eagle&&eagle===null){}
 /* 相機 */
 const tz=Math.min(scrollZ,P.z>scrollZ?scrollZ:P.z);
 const aimZ=(S==='menu'||S==='dead'&&deathKind!=='eagle')?(S==='menu'?0:P.z):scrollZ;
 camZc+=(aimZ-camZc)*(1-Math.exp(-dt*6));camX+=((P.x*.45)-camX)*(1-Math.exp(-dt*4));
 const el=48*Math.PI/180;
 cam.position.set(camX+camD*.12,camD*Math.sin(el),camZc+camD*Math.cos(el)+1.8);cam.lookAt(camX,0,camZc-1.8);
 /* 天空漸變 */
 const b=biomeAt(P.row+6);skyTgt.setHex(b.sky);sc.background.lerp(skyTgt,1-Math.exp(-dt*1.2));sc.fog.color.copy(sc.background);
 hemi.intensity=1.5;void tz;
}
/* ===== 主迴圈 ===== */
let last=performance.now();
function loop(ms){const dt=Math.max(0,Math.min(.05,(ms-last)/1000));last=ms;if(S!=='pause'&&dt>0)update(dt*TS);rd.render(sc,cam);requestAnimationFrame(loop);}
size();openMenu();try{rd.compile(sc,cam);}catch(e){}requestAnimationFrame(loop);
window.__HS={state:()=>S,info:()=>({S,score,row:P.row,x:+P.x.toFixed(2),coins:SV.coins,runCoins,best:SV.best,lanes:lanes.size,type:lanes.get(P.row)?.type,kind:deathKind,scroll:+scrollZ.toFixed(1)}),start:startRun,hop:tryHop,ts:v=>{TS=v;},tp:r=>{ensure(r+AHEAD);P.row=r;P.maxRow=r;P.z=-r;P.x=0;P.y=baseY(r);scrollZ=P.z;score=r;hud();},lane:r=>{const L=lanes.get(r);return L&&{type:L.type,obst:[...L.obst]};},god:v=>{godM=v;},SV};
let godM=false;
})();}catch(e){console.warn(e);$('nogl').style.display='flex';}
