<style>

/* ===== 物理 / 判定 ===== */
const TAU=Math.PI*2;

  sfx.smash();B.fire=false;B.combo=0;bMat.emissive.setHex(0);score+=10;banner('撞碎!','#ffb04a');
  for(let i=0;i<SEG;i++){const m=f.segs[i];if(!m)continue;const wp=new THREE.Vector3();m.getWorldPosition(wp);sc.attach(m);const ang=(i+.5)*TAU/SEG+rot+f.rot;shards.push({m,vx:Math.cos(ang)*rnd(2,5),vz:-Math.sin(ang)*rnd(2,5),vy:rnd(3,7),rx:rnd(-6,6),rz:rnd(-6,6),l:1.1});f.segs[i]=null;f.kind[i]=-1;}

function stepBall(dt){
 const n=Math.ceil(dt/.012),h=dt/n;
 for(let s=0;s<n&&S==='play';s++){

 /* 粒子 */
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue;}p.vy-=7*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;}
 for(let i=0;i<PMAX;i++){const p=parts[i];if(p){pPos[i*3]=p.x;pPos[i*3+1]=p.y;pPos[i*3+2]=p.z;const q=Math.min(1,p.l*2.6);pCol[i*3]=p.c.r*q;pCol[i*3+1]=p.c.g*q;pCol[i*3+2]=p.c.b*q;}else{pPos[i*3+1]=-9999;pCol[i*3]=pCol[i*3+1]=pCol[i*3+2]=0;}}
