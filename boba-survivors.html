var notes=[262,330,392,330,440,392,330,294],bi=0,bgm=null;

/* ---------- data ---------- */

};

function killE(e){e.dead=true;G.kills++;var d=ET[e.t];burst(e.x,e.y,d.edge,e.t==='boss'?26:6,e.t==='boss'?160:90);
  if(e.t==='boss'){shake=.5;shakeA=6;G.pend++;G.gems.push({x:e.x,y:e.y,v:0,heal:50,vx:0,vy:0});for(var i=0;i<14;i++)G.gems.push({x:e.x+rnd(-30,30),y:e.y+rnd(-30,30),v:3,vx:0,vy:0});beep(120,.4,'sawtooth',.07,40);}
  else{G.gems.push({x:e.x,y:e.y,v:d.xp*(G.hh>0?2:1),vx:0,vy:0});if(Math.random()<.012)G.gems.push({x:e.x+6,y:e.y,v:0,heal:25,vx:0,vy:0});beep(600+Math.random()*200,.05,'sine',.02);}}

/* ---------- weapons ---------- */
function nearest(n,range){var p=G.p,arr=[];G.en.forEach(function(e){if(e.dead)return;var d=Math.hypot(e.x-p.x,e.y-p.y);if(d<range)arr.push([d,e]);});arr.sort(function(a,b){return a[0]-b[0];});return arr.slice(0,n).map(function(a){return a[1];});}
function useWeapons(dt){
  var p=G.p,W_=G.W;
  for(var k in W_){var lv=W_[k];G.cd[k]=(G.cd[k]||0)-dt;
    if(k==='foam'){continue;}
    if(G.cd[k]>0)continue;
    if(k==='pearl'){var tg=nearest(1,260);if(!tg.length)continue;G.cd[k]=Math.max(.3,.7-.07*lv)*cdM();var cnt=[1,2,2,3,4][lv-1]+(G.E.pearl?1:0),ts=nearest(cnt,260);for(var i=0;i<cnt;i++){var e=ts[i%ts.length],a=Math.atan2(e.y-p.y,e.x-p.x)+(ts.length<cnt?(i-(cnt-1)/2)*.12:0);G.shots.push({k:'pearl',x:p.x,y:p.y,vx:Math.cos(a)*270,vy:Math.sin(a)*270,dmg:(8+3*lv)*dmgM(),life:1.4,pierce:lv>=5?2:0,hit:[],evo:!!G.E.pearl});}beep(900,.05,'triangle',.025);}
    else if(k==='straw'){if(!G.en.length)continue;G.cd[k]=Math.max(.7,1.7-.17*lv)*cdM()*(G.E.straw?.6:1);var L=(150+26*lv)*(G.E.straw?1.5:1),dirs=[[p.dx,p.dy]];if(lv>=3)dirs.push([-p.dx,-p.dy]);if(lv>=5){dirs.push([-p.dy,p.dx]);dirs.push([p.dy,-p.dx]);}
      dirs.forEach(function(d){var dmg=(14+7*lv)*dmgM();G.en.forEach(function(e){if(e.dead)return;var ex=e.x-p.x,ey=e.y-p.y,t=ex*d[0]+ey*d[1],perp=Math.abs(ex*d[1]-ey*d[0]);if(t>-e.r&&t<L+e.r&&perp<9+e.r)hurtE(e,dmg,d[0]*70,d[1]*70);});G.fx.push({k:'straw',x:p.x,y:p.y,dx:d[0],dy:d[1],L:L,life:.2,max:.2});});beep(300,.12,'square',.04,700);}
    else if(k==='pudding'){var tg2=nearest(8,220);if(!tg2.length)continue;G.cd[k]=Math.max(1.0,2.6-.22*lv)*cdM();var n2=(lv>=4?2:1)+(G.E.pudding?1:0);for(var j=0;j<n2;j++){var e2=tg2[Math.floor(Math.random()*tg2.length)];G.shots.push({k:'pudding',sx:p.x,sy:p.y,x:e2.x+rnd(-14,14),y:e2.y+rnd(-14,14),t:0,dur:.65,R:(46+8*lv)*(G.E.pudding?1.3:1),dmg:(22+10*lv)*dmgM()});}beep(260,.1,'sine',.04,500);}
    else if(k==='frost'){if(!nearest(1,160).length)continue;G.cd[k]=Math.max(2.2,5.0-.45*lv)*cdM()*(G.E.frost?.7:1);var R=(70+15*lv)*(G.E.frost?1.25:1),dm=(10+6*lv)*dmgM()*(G.E.frost?1.8:1);G.en.forEach(function(e){if(e.dead)return;var d=Math.hypot(e.x-p.x,e.y-p.y);if(d<R+e.r){e.slow=2.2;if(G.E.frost)e.frz=1.2;var a=Math.atan2(e.y-p.y,e.x-p.x);hurtE(e,dm,Math.cos(a)*140,Math.sin(a)*140);}});ring(p.x,p.y,R,'150,215,255',.45);burst(p.x,p.y,'#BFE6FA',14,160);beep(500,.3,'triangle',.05,160);}
    else if(k==='jelly'){var tg3=nearest(10,300);if(!tg3.length)continue;G.cd[k]=Math.max(1.2,3.0-.26*lv)*cdM();var c3=(2+lv)*(G.E.jelly?2:1);for(var q=0;q<c3;q++){var e3=tg3[Math.floor(Math.random()*tg3.length)];G.shots.push({k:'mark',x:e3.x+rnd(-10,10),y:e3.y+rnd(-10,10),t:0,dur:.4,R:(26+2*lv)*(G.E.jelly?1.4:1),dmg:(16+7*lv)*dmgM()});}beep(700,.08,'square',.025,300);}
  }
  if(W_.foam){G.orb+=dt*(2.4+.15*W_.foam);var lvF=W_.foam,cnt2=lvF+1+(G.E.foam?2:0),rad=50+4*lvF+(G.E.foam?16:0),dmgF=(6+3*lvF)*dmgM()*(G.E.foam?1.5:1);for(var i2=0;i2<cnt2;i2++){var a2=G.orb+i2*6.2832/cnt2,ox=p.x+Math.cos(a2)*rad,oy=p.y+Math.sin(a2)*rad;G.en.forEach(function(e){if(e.dead)return;if(e.fcd<=0&&Math.hypot(e.x-ox,e.y-oy)<e.r+11){e.fcd=.45;var ang=Math.atan2(e.y-p.y,e.x-p.x);hurtE(e,dmgF,Math.cos(ang)*160,Math.sin(ang)*160);beep(480,.05,'sine',.02);}});}}
}

/* ---------- update ---------- */
function update(dt){
  if(modal)return;
  G.t+=dt;var p=G.p;
  // input
  var ix=0,iy=0;if(keys.ArrowLeft||keys.a)ix-=1;if(keys.ArrowRight||keys.d)ix+=1;if(keys.ArrowUp||keys.w)iy-=1;if(keys.ArrowDown||keys.s)iy+=1;
  if(joy.on){var jx=joy.x-joy.ox,jy=joy.y-joy.oy,jl=Math.hypot(jx,jy);if(jl>6){var m=Math.min(1,jl/44);ix=jx/jl*m;iy=jy/jl*m;}}
  if(window.__ai){var v=window.__ai(G);ix=v[0];iy=v[1];}
  var il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il;il=1;}
  var spd=108*(1+.1*(G.P.shoe||0)+.03*(M.spd||0));p.x+=ix*spd*dt;p.y+=iy*spd*dt;if(il>.1){p.dx=ix/il;p.dy=iy/il;if(Math.abs(ix)>.2)p.face=ix>0?1:-1;p.bob+=dt*12;}
  if(G.inv>0)G.inv-=dt;if(G.hurtT>0)G.hurtT-=dt;
  if(G.P.regen)G.hp=Math.min(G.maxhp,G.hp+.6*G.P.regen*dt);
  // spawning
  G.spawnT-=dt;if(G.spawnT<=0){var rate=Math.max(.16,1.05-G.t*.0032),n=1+Math.floor(G.t/40)+(G.hh>0?1:0);G.spawnT=rate;if(G.en.length<230)for(var i=0;i<n;i++)spawnE(pickType(),Math.random()*6.28,rnd(370,420));}
  if(G.t>=G.nextHH){G.nextHH+=105;G.hh=20;G.banner={text:'✨ 珍珠時間!經驗×2',life:2,max:2};beep(880,.3,'triangle',.05,1500);}
  if(G.hh>0)G.hh-=dt;
  if(G.t>=G.nextRing){G.nextRing+=60;G.banner={text:'被包圍了!',life:1.6,max:1.6};for(var r2=0;r2<24;r2++)spawnE('ice',r2*6.2832/24,330);beep(200,.4,'sawtooth',.05,100);}
  if(G.t>=G.nextBoss){G.nextBoss+=150;G.banner={text:'大冰磚來襲!',life:2,max:2,boss:true};spawnE('boss',Math.random()*6.28,390);beep(100,.6,'sawtooth',.07,60);}
  // enemies
  for(var ei=0;ei<G.en.length;ei++){var e=G.en[ei];if(e.dead)continue;var dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,sp=ET[e.t].spd*(1+G.t/900)*(e.slow>0?.5:1);
    if(e.fl>0)e.fl-=dt;if(e.fcd>0)e.fcd-=dt;if(e.slow>0)e.slow-=dt;
    if(e.t==='mochi'){if(e.dst>0){e.dst-=dt;sp*=3.6;}else{e.dash-=dt;if(e.dash<=0&&d<260){e.dst=.7;e.dash=rnd(2.5,4);}if(e.dash<.55&&d<260)sp*=.2;}}
    if(e.t==='boss'){e.sp+=dt;if(e.sw>0){e.sw-=dt;sp*=.25;if(e.sw<=0)bossSlam(e);}else{e.sl=(e.sl||0)+dt;if(e.sl>6.5){e.sl=0;e.sw=1.0;e.sx=e.x;e.sy=e.y;beep(90,.5,'sawtooth',.05,60);}}
      if(e.sp>(e.hp<e.max*.5?2.4:3.6)){e.sp=0;for(var b=0;b<3;b++)G.en.push({t:'ice',x:e.x+rnd(-20,20),y:e.y+rnd(-20,20),hp:ET.ice.hp*(1+G.t/70),max:ET.ice.hp*(1+G.t/70),r:9,fl:0,fcd:0,slow:0,kx:0,ky:0,ph:Math.random()*6,dash:9,dst:0,sp:0});}}
    if(e.frz>0){e.frz-=dt;sp=0;}
    if(e.t==='lemon'){if(d<150)sp=-sp;else if(d<230)sp*=.1;e.sp+=dt;if(e.sp>2.4&&d<320){e.sp=0;var la=Math.atan2(dy,dx);G.ep.push({x:e.x,y:e.y,vx:Math.cos(la)*125,vy:Math.sin(la)*125,life:3.5});beep(520,.08,'square',.03,300);}}
    if(e.t==='pop'){if(e.fuse>0){sp=0;e.fuse-=dt;if(e.fuse<=0)explodePop(e);}else if(d<46)e.fuse=1.0;}
    var wob=Math.sin(G.t*2+e.ph)*.3;e.x+=(dx/d*Math.cos(wob)-dy/d*Math.sin(wob))*sp*dt+e.kx*dt;e.y+=(dy/d*Math.cos(wob)+dx/d*Math.sin(wob))*sp*dt+e.ky*dt;e.kx*=Math.pow(.02,dt);e.ky*=Math.pow(.02,dt);
    if(d>760){var aa=Math.random()*6.28;e.x=p.x+Math.cos(aa)*400;e.y=p.y+Math.sin(aa)*400;}
    if(ET[e.t].dmg>0&&G.inv<=0&&d<e.r+13){hurtP(ET[e.t].dmg);}
  }
  // soft separation (cheap): nudge overlapping neighbours
  for(var a1=0;a1<G.en.length;a1+=1){var A=G.en[a1];if(A.dead)continue;for(var b1=a1+1;b1<Math.min(G.en.length,a1+14);b1++){var B=G.en[b1];if(B.dead)continue;var sx=B.x-A.x,sy=B.y-A.y,sd=Math.hypot(sx,sy),mn=(A.r+B.r)*.8;if(sd<mn&&sd>.01){var push=(mn-sd)*.5;A.x-=sx/sd*push;A.y-=sy/sd*push;B.x+=sx/sd*push;B.y+=sy/sd*push;}}}
  useWeapons(dt);
  // shots
  for(var si=G.shots.length-1;si>=0;si--){var s=G.shots[si];
    if(s.k==='pearl'){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(var j=0;j<G.en.length;j++){var en=G.en[j];if(en.dead||s.hit.indexOf(en)>=0)continue;if(Math.hypot(en.x-s.x,en.y-s.y)<en.r+5){s.hit.push(en);hurtE(en,s.dmg,s.vx*.15,s.vy*.15);if(s.evo)aoe(s.x,s.y,34,s.dmg*.5,'120,80,50','#6B4226');if(s.pierce-- <=0){s.life=0;break;}}}if(s.life<=0)G.shots.splice(si,1);}
    else if(s.k==='pudding'){s.t+=dt;if(s.t>=s.dur){aoe(s.x,s.y,s.R,s.dmg,'255,200,90','#FFD45E');shake=.18;shakeA=3;beep(120,.2,'sawtooth',.06,50);G.shots.splice(si,1);}}
    else if(s.k==='mark'){s.t+=dt;if(s.t>=s.dur){aoe(s.x,s.y,s.R,s.dmg,'120,220,150','#6FD68A');beep(220,.08,'square',.04,100);G.shots.splice(si,1);}}
  }
  for(var pi=G.ep.length-1;pi>=0;pi--){var q=G.ep[pi];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(G.inv<=0&&Math.hypot(q.x-p.x,q.y-p.y)<14){hurtP(7);q.life=0;}if(q.life<=0)G.ep.splice(pi,1);}
  // gems
  var pr=75*(1+.3*(G.P.magnet||0)+.1*(M.mag||0));
  for(var gi=G.gems.length-1;gi>=0;gi--){var g=G.gems[gi],gd=Math.hypot(p.x-g.x,p.y-g.y);
    if(gd<pr||g.pull){g.pull=true;var pl=Math.min(1,(220)*dt/(gd||1))*Math.min(3,1+(1-Math.min(gd,pr)/pr)*2);g.x+=(p.x-g.x)*Math.min(1,pl*2.2);g.y+=(p.y-g.y)*Math.min(1,pl*2.2);}
    if(gd<16){if(g.heal){G.hp=Math.min(G.maxhp,G.hp+g.heal);say(p.x,p.y-22,'+'+g.heal,'#7BE07B',13);beep(700,.15,'triangle',.04,1100);}else{G.xp+=g.v;beep(900+Math.min(400,G.xp*4),.04,'sine',.02);}G.gems.splice(gi,1);}
  }
  while(G.xp>=need()){G.xp-=need();G.lv++;G.pend++;}
  if(G.pend>0&&!G.over){G.pend--;openLevel();}
  // cleanup + fx
  G.en=G.en.filter(function(e){return !e.dead;});
  G.fx.forEach(function(f){f.life-=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92;}});G.fx=G.fx.filter(function(f){return f.life>0;});
  G.txt.forEach(function(t){t.y-=26*dt;t.life-=dt;});G.txt=G.txt.filter(function(t){return t.life>0;});
  if(G.banner){G.banner.life-=dt;if(G.banner.life<=0)G.banner=null;}
  if(shake>0)shake-=dt;
  if(!G.won&&!G.endless&&G.t>=300)winGame();
}
function explodePop(e){ring(e.x,e.y,56,'255,120,60',.4);burst(e.x,e.y,'#FFB060',16,150);shake=.2;shakeA=3.5;beep(140,.2,'sawtooth',.06,50);
  if(G.inv<=0&&Math.hypot(G.p.x-e.x,G.p.y-e.y)<56+13)hurtP(16);
  G.en.forEach(function(o){if(o===e||o.dead||o.t==='boss')return;if(Math.hypot(o.x-e.x,o.y-e.y)<56+o.r)hurtE(o,25,(o.x-e.x)*2,(o.y-e.y)*2);});killE(e);}
function bossSlam(e){var R=100;ring(e.sx,e.sy,R,'255,80,80',.5);burst(e.sx,e.sy,'#BFE6FA',22,180);shake=.35;shakeA=5;beep(80,.4,'sawtooth',.07,40);if(G.inv<=0&&Math.hypot(G.p.x-e.sx,G.p.y-e.sy)<R+13)hurtP(24);}
function aoe(x,y,R,dmg,rgb,col){G.en.forEach(function(e){if(e.dead)return;var d=Math.hypot(e.x-x,e.y-y);if(d<R+e.r){var a=Math.atan2(e.y-y,e.x-x);hurtE(e,dmg,Math.cos(a)*120,Math.sin(a)*120);}});ring(x,y,R,rgb,.3);burst(x,y,col,10,130);}
function hurtP(d){if(G.god)return;G.hp-=d;G.inv=.55;G.hurtT=.25;shake=.2;shakeA=3.5;beep(160,.18,'sawtooth',.06,70);burst(G.p.x,G.p.y,'#C0392B',8,110);if(G.hp<=0){if(G.rev>0){G.rev--;G.hp=G.maxhp*.5;G.inv=2;G.en.forEach(function(e){if(e.t==='boss'){e.kx+=(e.x-G.p.x)*3;e.ky+=(e.y-G.p.y)*3;}else if(Math.hypot(e.x-G.p.x,e.y-G.p.y)<180)hurtE(e,300,(e.x-G.p.x)*3,(e.y-G.p.y)*3);});ring(G.p.x,G.p.y,180,'255,230,140',.6);G.banner={text:'☕ 再來一杯!',life:1.6,max:1.6};shake=.4;shakeA=5;beep(660,.4,'triangle',.06,1320);return;}G.hp=0;endGame(false);}}

/* ---------- level up ---------- */
function openLevel(){
  modal=true;var opts=[];
  Object.keys(WD).forEach(function(k){var lv=G.W[k]||0;if(lv<5)opts.push({type:'w',k:k,lv:lv,w:lv?1.6:1});});
  Object.keys(PD).forEach(function(k){var lv=G.P[k]||0;if(lv<5)opts.push({type:'p',k:k,lv:lv,w:1});});
  Object.keys(EV).forEach(function(k){if((G.W[k]||0)>=5&&!G.E[k]&&(G.P[EV[k].p]||0)>=1)opts.push({type:'e',k:k,w:8});});
  var pick=[],evs=opts.filter(function(o){return o.type==='e';});if(evs.length){var fe=evs[Math.floor(Math.random()*evs.length)];opts.splice(opts.indexOf(fe),1);pick.push(fe);}
  while(pick.length<3&&opts.length){var tot=opts.reduce(function(a,o){return a+o.w;},0),r=Math.random()*tot,idx=0;for(;idx<opts.length;idx++){r-=opts[idx].w;if(r<=0)break;}idx=Math.min(idx,opts.length-1);pick.push(opts.splice(idx,1)[0]);}
  if(!pick.length)pick.push({type:'h'});
  var box=$('pcs');box.innerHTML='';
  pick.forEach(function(o){var b=document.createElement('button');b.className='pc';var ic,nm,ds,tag='';
    if(o.type==='w'){ic=WD[o.k].i;nm=WD[o.k].n;ds=o.lv?WD[o.k].u:WD[o.k].d;tag=o.lv?'<em>Lv'+o.lv+'→'+(o.lv+1)+'</em>':'<em class="new">NEW</em>';}
    else if(o.type==='e'){ic=EV[o.k].i;nm=EV[o.k].n;ds=EV[o.k].d;tag='<em class="new">進化!</em>';}
    else if(o.type==='p'){ic=PD[o.k].i;nm=PD[o.k].n;ds=PD[o.k].d;tag=o.lv?'<em>Lv'+o.lv+'→'+(o.lv+1)+'</em>':'<em class="new">NEW</em>';}
    else{ic='🍰';nm='補給點心';ds='回復 40 點血量';}
    b.innerHTML='<i>'+ic+'</i><div><b>'+nm+tag+'</b><span>'+ds+'</span></div>';b.onclick=function(){choose(o);};box.appendChild(b);});
  var have=Object.keys(G.W).map(function(k){return WD[k].i+G.W[k];}).concat(Object.keys(G.P).map(function(k){return PD[k].i+G.P[k];}));
  $('have').textContent='目前:'+have.join('  ');$('lvTag').textContent='LEVEL '+G.lv;
  $('lvl').classList.remove('hidden');beep(660,.2,'triangle',.05,990);
}
function choose(o){
  if(o.type==='w')G.W[o.k]=(G.W[o.k]||0)+1;
  else if(o.type==='e'){G.E[o.k]=1;ring(G.p.x,G.p.y,140,'255,200,80',.6);burst(G.p.x,G.p.y,'#FFD45E',30,220);G.banner={text:'★ '+EV[o.k].n+'!',life:2,max:2,boss:true};shake=.3;shakeA=4;}
  else if(o.type==='p'){G.P[o.k]=(G.P[o.k]||0)+1;if(o.k==='heart'){G.maxhp+=20;G.hp=Math.min(G.maxhp,G.hp+20);}}
  else G.hp=Math.min(G.maxhp,G.hp+40);
  $('lvl').classList.add('hidden');modal=false;ring(G.p.x,G.p.y,60,'255,230,140',.4);beep(880,.15,'triangle',.05,1320);
}

/* ---------- end ---------- */
function endGame(win){
  G.over=true;running=false;var isNew=G.t>bestT;if(isNew){bestT=G.t;store('bb_time',String(bestT));}if(G.kills>bestK){bestK=G.kills;store('bb_kill',String(bestK));}
  $('bestMenu').textContent=fmt(bestT);$('bestKill').textContent=bestK;
  $('eTime').textContent=fmt(G.t);$('eKill').textContent=G.kills;$('eLv').textContent=G.lv;
  $('endTitle').textContent=win?'成功突圍!':'被淹沒了…';$('endIcon').textContent=win?'🏆':'🧊';$('contBtn').style.display=win?'':'none';
  $('eNew').textContent=isNew?'🎉 新的最久紀錄!':'';
  var earn=Math.max(0,Math.floor(G.kills/6+G.t/10)+(G.won?50:0)-G.paid);G.paid+=earn;coins+=earn;store('bb_coins',String(coins));$('eCoin').textContent='🧋 獲得珍珠 +'+earn+'(累計 '+coins+')';$('coinMenu').textContent=coins;
  beep(win?880:200,.5,win?'triangle':'sawtooth',.06,win?1500:60);setTimeout(function(){$('end').classList.remove('hidden');},win?200:600);

  var vw=innerWidth,gap=20,lw=Math.min(300,bx.l-gap*2),rw=Math.min(280,vw-bx.r-gap*2);
  if(info&&lw>=190){L.style.width=lw+'px';L.style.left=(bx.l-gap-lw)+'px';L.classList.add('on');}else L.classList.remove('on');
  if(rw>=190){R.style.width=rw+'px';R.style.left=(bx.r+gap)+'px';R.classList.add('on');}else R.classList.remove('on');
 }
 var lastKey='',noUp=false;
 function apply(v,vh){z=v;if(z===1){b.style.zoom='';b.style.minHeight='';}else{b.style.zoom=String(z);b.style.minHeight=(vh/z)+'px';}}
 function fit(force){
  var desk=mq.matches,bx=box();if(!bx)return;
  var vh=innerHeight,vw=innerWidth,h=(bx.b-bx.t)/z,w=(bx.r-bx.l)/z,key=Math.round(h/8)+','+Math.round(w/8),zmin=desk?.55:.5;
  var over=de.scrollHeight>vh+2&&z>zmin+.01&&!(noUp&&z===1);
  if(!force&&key===lastKey&&!over){place(bx);return;}
  if(key!==lastKey)noUp=false;lastKey=key;
  var nz;
  if(desk){nz=Math.min(noUp?1:1.6,(vh-28)/h,(vw-48)/w);}else{nz=Math.min(1,vh/h);}
  nz=Math.max(zmin,nz);if(Math.abs(nz-1)<(desk?.06:.015))nz=1;
  apply(nz,vh);
  for(var k=0;k<4;k++){var sh=de.scrollHeight;if(sh<=vh+2||z<=zmin)break;apply(Math.max(zmin,z*vh/sh*.995),vh);}
  if(z>1&&de.scrollHeight>vh+2){noUp=true;apply(1,vh);}
  place(box()||bx);
 }
 var tm=0;function soon(f){clearTimeout(tm);n=0;tm=setTimeout(function(){fit(f);},60);}
 document.addEventListener('touchmove',function(e){if(mq.matches||e.touches.length>1||!e.cancelable)return;if(de.scrollHeight>innerHeight+2)return;var t=e.target;while(t&&t!==document.body&&t.nodeType===1){var cs=getComputedStyle(t);if(/(auto|scroll)/.test(cs.overflowY)&&t.scrollHeight>t.clientHeight+1)return;if(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;t=t.parentElement;}e.preventDefault();},{passive:false});
 addEventListener('resize',function(){soon(true);});addEventListener('orientationchange',function(){soon(true);});
 if(mq.addEventListener)mq.addEventListener('change',function(){soon(true);});
 addEventListener('load',function(){fit(true);setTimeout(fit,500);setTimeout(fit,1600);});
 setInterval(function(){if(!d.hidden&&n<40){n++;fit(false);}},1500);
 fit(true);
 var fs=d.getElementById('dv-fs');
 fs.addEventListener('click',function(){try{if(d.fullscreenElement){d.exitFullscreen();}else{de.requestFullscreen();}}catch(e){}});
 d.addEventListener('fullscreenchange',function(){fs.textContent=d.fullscreenElement?'✕ 離開全螢幕':'⛶ 全螢幕';soon(true);});
})();
