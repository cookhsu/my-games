<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>蒸籠疊疊樂 Steamer Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --wall: #7A2323;
    --wall-dark: #5C1919;
    --lattice: rgba(244,213,141,0.10);
    --panel: #F4E3C1;
    --panel-dark: #E3CB9C;
    --gold: #E8B84B;
    --gold-dark: #B8862F;
    --ink: #3B1F1A;
    --ink-soft: #8A6B5C;
    --cream: #FBF3E4;
    --shadow: rgba(30,10,10,0.45);
  }

  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--wall-dark);
    color: var(--cream);
    font-family: 'Nunito', system-ui, sans-serif;
    min-height: 100%;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 60px;
    background: radial-gradient(ellipse at 50% -10%, rgba(232,184,75,0.15), transparent 55%), var(--wall-dark);
  }

  .marquee{
    text-align:center;
    margin-bottom: 18px;
  }
  .marquee h1{
    font-family:'Noto Serif TC', serif;
    font-weight: 900;
    font-size: clamp(24px, 6vw, 36px);
    color: var(--gold);
    margin: 0 0 8px;
    letter-spacing: 1px;
  }
  .marquee p{
    margin:0;
    color: #E7CBB8;
    font-size: 14px;
    max-width: 420px;
  }

  .board{
    background: linear-gradient(180deg, var(--panel), var(--panel-dark));
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 20px 45px var(--shadow);
    width: 100%;
    max-width: 400px;
    border: 3px solid var(--gold-dark);
  }

  .hud{
    display:flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 8px 12px;
  }
  .hud .stat{ text-align:left; }
  .hud .stat.right{ text-align:right; }
  .hud .label{
    font-family:'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 11px;
    color: var(--ink-soft);
    display:block;
    margin-bottom: 2px;
  }
  .hud .value{
    font-family:'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 22px;
    color: var(--ink);
  }
  .music-btn{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--cream);
    border: 1px solid var(--gold-dark);
    color: var(--ink);
    font-size: 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .music-btn:active{ background: var(--panel-dark); }
  .music-btn:focus-visible{
    outline: 3px solid var(--gold-dark);
    outline-offset: 2px;
  }

  .screen-frame{
    position:relative;
    border-radius: 10px;
    padding: 6px;
    background: var(--wall-dark);
  }

  canvas{
    display:block;
    width:100%;
    height:auto;
    border-radius: 6px;
    touch-action: none;
    cursor: pointer;
  }

  .overlay{
    position:absolute;
    inset: 6px;
    border-radius: 6px;
    background: rgba(59,31,26,0.88);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 20px;
    gap: 14px;
  }
  .overlay.hidden{ display:none; }
  .overlay h2{
    font-family:'Noto Serif TC', serif;
    font-weight: 900;
    font-size: clamp(18px, 5vw, 26px);
    color: var(--gold);
    margin:0;
  }
  .overlay p{
    margin:0;
    color: #F1DFC9;
    font-size: 13px;
    line-height:1.6;
    max-width: 260px;
  }
  .btn{
    font-family:'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    background: var(--gold);
    border: none;
    padding: 11px 26px;
    border-radius: 10px;
    cursor:pointer;
    box-shadow: 0 4px 0 var(--gold-dark);
    transition: transform 0.08s ease;
  }
  .btn:active{
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--gold-dark);
  }
  .btn:focus-visible{
    outline: 3px solid var(--cream);
    outline-offset: 2px;
  }

  .hint{
    margin-top: 16px;
    font-size: 12px;
    color: #E7CBB8;
    text-align:center;
    max-width: 420px;
  }
  .hint kbd{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size: 11px;
    background: var(--cream);
    border-radius: 4px;
    padding: 3px 8px;
    color: var(--ink);
  }

  @media (prefers-reduced-motion: reduce){
    .btn, .music-btn{ transition: none; }
  }
/* ===== UI v2 (template) ===== */
body{ position:relative; }
.marquee{ margin-top:18px; }
.marquee h1{ letter-spacing:.06em; text-shadow:0 2px 0 rgba(255,255,255,.35), 0 6px 18px rgba(0,0,0,.18); }
.marquee h1::after{ content:""; display:block; width:56px; height:4px; margin:10px auto 0; border-radius:4px; background:currentColor; opacity:.35; }
.marquee p{ opacity:.9; line-height:1.7; }
.board,.box{ box-shadow:0 26px 54px rgba(0,0,0,.38), 0 3px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.14) !important; }
.hud .stat{ padding:7px 12px 8px; border-radius:12px; background:rgba(0,0,0,.14); box-shadow:inset 0 1px 0 rgba(0,0,0,.12), 0 1px 0 rgba(255,255,255,.25); min-width:84px; }
.hud .value{ font-variant-numeric:tabular-nums; text-shadow:0 1px 0 rgba(255,255,255,.25); }
.music-btn,.icon-btn{ box-shadow:0 3px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.6) !important; transition:transform .1s, box-shadow .1s; }
.music-btn:active,.icon-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.25) !important; }
.screen-frame,.frame,.field-frame,.table-frame,.tray-frame{ position:relative; box-shadow:inset 0 0 0 2px rgba(0,0,0,.18), inset 0 6px 16px rgba(0,0,0,.28), 0 1px 0 rgba(255,255,255,.3); }
.screen-frame::after,.frame::after,.field-frame::after,.table-frame::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, transparent 62%, rgba(0,0,0,.28)); z-index:1; }
.overlay{ z-index:3; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); animation:tplIn .32s ease; }
@keyframes tplIn{ from{ opacity:0; transform:scale(.97);} to{ opacity:1; transform:none; } }
.overlay>*{ animation:tplUp .45s ease backwards; } .overlay>*:nth-child(2){ animation-delay:.06s } .overlay>*:nth-child(3){ animation-delay:.12s } .overlay>*:nth-child(4){ animation-delay:.18s }
@keyframes tplUp{ from{ opacity:0; transform:translateY(12px);} }
.overlay h2{ letter-spacing:.08em; text-shadow:0 3px 0 rgba(0,0,0,.28), 0 8px 20px rgba(0,0,0,.3); }
.overlay p{ line-height:1.75; }
.overlay p[id]{ font-size:17px; font-weight:800; padding:10px 20px; border-radius:14px; background:rgba(255,255,255,.12); box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); max-width:none; }
.btn{ position:relative; overflow:hidden; letter-spacing:.08em; padding-left:30px; padding-right:30px; transition:transform .1s ease, box-shadow .1s ease, filter .15s; }
.btn::after{ content:""; position:absolute; left:14%; right:14%; top:3px; height:34%; border-radius:99px; background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0)); pointer-events:none; }
#startBtn,#restartBtn,.overlay .btn:first-of-type{ animation:tplPulse 2s ease-in-out infinite; }
@keyframes tplPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.05);} }
#startBtn::before,#restartBtn::before{ content:""; position:absolute; top:0; bottom:0; left:-45%; width:28%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent); transform:skewX(-20deg); animation:tplShine 3s ease-in-out infinite; }
@keyframes tplShine{ 0%{ left:-45%; } 55%,100%{ left:140%; } }
.hint kbd{ box-shadow:0 2px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.5); border:1px solid rgba(0,0,0,.12); }
@media (prefers-reduced-motion:reduce){ .overlay,.overlay>*,#startBtn,#restartBtn,.overlay .btn:first-of-type,#startBtn::before,#restartBtn::before{ animation:none !important; } }
</style>
</head>
<body>

  <div class="marquee">
    <h1>蒸籠疊疊樂</h1>
    <p>抓準時機放下蒸籠，疊得越準、疊得越高！</p>
  </div>

  <div class="board">
    <div class="hud">
      <div class="stat">
        <span class="label">層數 HEIGHT</span>
        <span class="value" id="score">0</span>
      </div>
      <button class="music-btn" id="musicBtn" aria-label="切換背景音樂" aria-pressed="true">🔊</button>
      <div class="stat right">
        <span class="label">最高 BEST</span>
        <span class="value" id="best">0</span>
      </div>
    </div>

    <div class="screen-frame">
      <canvas id="game" width="360" height="540" aria-label="蒸籠疊疊樂遊戲畫面"></canvas>

      <div class="overlay" id="startOverlay">
        <h2>開始疊蒸籠</h2>
        <p>點畫面、按空白鍵或 ↑ 放下移動中的蒸籠，跟下方對齊越準，蒸籠塔就疊得越穩越高</p>
        <button class="btn" id="startBtn">開始遊戲</button>
      </div>

      <div class="overlay hidden" id="overOverlay">
        <h2>蒸籠塔倒了！</h2>
        <p id="finalScore">疊了 0 層</p>
        <button class="btn" id="restartBtn">再疊一次</button>
      </div>
    </div>
  </div>

  <p class="hint">桌機請點畫面、按 <kbd>空白鍵</kbd> 或 <kbd>↑</kbd>　手機請直接輕點畫面來放下蒸籠</p>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;

  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var startOverlay = document.getElementById('startOverlay');
  var overOverlay = document.getElementById('overOverlay');
  var finalScoreEl = document.getElementById('finalScore');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');

  var PALETTE = ['#C1272D', '#D9B382', '#3C6E58', '#E8B84B', '#8B5E34'];
  var BLOCK_H = 32;
  var BASE_W = 220;
  var BASE_Y = H - 70;
  var TOP_LIMIT = 170;
  var BASE_SPEED = 130;
  var PERFECT_MARGIN = 6;
  var MIN_SURVIVE_W = 6;

  var stack, current, debris, score, best, running, lastTime, rafId, scrollOffset, perfectToast;

  best = 0;
  try {
    var stored = localStorage.getItem('steamerstack_best');
    if (stored) best = parseInt(stored, 10) || 0;
  } catch (e) { /* storage unavailable */ }
  bestEl.textContent = best;

  function colorFor(i){ return PALETTE[i % PALETTE.length]; }

  function spawnCurrent(){
    var below = stack[stack.length - 1];
    current = {
      x: 0,
      w: below.w,
      row: stack.length,
      dir: 1,
      color: colorFor(stack.length)
    };
  }

  function resetState(){
    stack = [{ x: (W - BASE_W)/2, w: BASE_W, row: 0, color: colorFor(0) }];
    debris = [];
    score = 0;
    scoreEl.textContent = '0';
    scrollOffset = 0; steam = []; fx = []; streak = 0; shakeT = 0; ringFlash = 0;
    perfectToast = 0;
    spawnCurrent();
  }

  function rowToScreenY(row){
    return BASE_Y - row * BLOCK_H + scrollOffset;
  }

  function roundRectPath(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  var steam = [], fx = [], streak = 0, shakeT = 0, clock = 0, steamT = 0, ringFlash = 0;
  function shadeC(hex, f){ var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; function m(c){ return Math.max(0, Math.min(255, Math.round(f < 0 ? c * (1 + f) : c + (255 - c) * f))); } return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')'; }
  var bgCache = null;
  function buildBg(){
    var c = document.createElement('canvas'); c.width = W; c.height = H; var g = c.getContext('2d');
    var gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#5E1717'); gr.addColorStop(.55, '#7C2424'); gr.addColorStop(1, '#4A1111'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // lattice window pattern
    g.strokeStyle = 'rgba(244,213,141,.09)'; g.lineWidth = 1.5; var T = 44;
    for (var x = 0; x <= W; x += T){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
    for (var y = 0; y <= H; y += T){ g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    g.strokeStyle = 'rgba(244,213,141,.07)'; for (x = 0; x < W; x += T) for (y = 0; y < H; y += T){ g.strokeRect(x + 9, y + 9, T - 18, T - 18); g.beginPath(); g.moveTo(x + 9, y + 9); g.lineTo(x + T - 9, y + T - 9); g.moveTo(x + T - 9, y + 9); g.lineTo(x + 9, y + T - 9); g.stroke(); }
    var gl = g.createRadialGradient(W / 2, H * .55, 20, W / 2, H * .55, H * .7); gl.addColorStop(0, 'rgba(255,190,90,.30)'); gl.addColorStop(1, 'rgba(255,190,90,0)'); g.fillStyle = gl; g.fillRect(0, 0, W, H);
    return c;
  }
  function drawLantern(x, y, sc){
    ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
    ctx.strokeStyle = 'rgba(244,213,141,.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(0, -16); ctx.stroke();
    var g = ctx.createRadialGradient(-4, -4, 2, 0, 0, 20); g.addColorStop(0, '#FF8A6A'); g.addColorStop(.6, '#E0382F'); g.addColorStop(1, '#9C1C1C');
    ctx.shadowColor = 'rgba(255,120,60,.8)'; ctx.shadowBlur = 16; ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 15, 17, 0, 0, 6.3); ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(120,20,20,.45)'; ctx.lineWidth = 1; for (var i = -1; i <= 1; i++){ ctx.beginPath(); ctx.ellipse(0, 0, 15 * Math.abs(i) * .6 + .1, 17, 0, 0, 6.3); ctx.stroke(); }
    ctx.fillStyle = '#E8B84B'; ctx.fillRect(-7, -19, 14, 4); ctx.fillRect(-7, 15, 14, 4);
    ctx.strokeStyle = '#E8B84B'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, 19); ctx.lineTo(0, 30); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 32, 2.2, 0, 6.3); ctx.stroke();
    ctx.restore();
  }

  function drawBasket(x, y, w, color, rot){
    var h = BLOCK_H - 4, cx = x + w / 2;
    ctx.save();
    if (rot){ ctx.translate(cx, y + h / 2); ctx.rotate(rot); ctx.translate(-cx, -(y + h / 2)); }
    ctx.fillStyle = 'rgba(0,0,0,.28)'; roundRectPath(x + 2, y + 4, w, h, 5); ctx.fill();
    var g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, shadeC(color, .3)); g.addColorStop(.5, color); g.addColorStop(1, shadeC(color, -.28));
    ctx.fillStyle = g; roundRectPath(x, y, w, h, 5); ctx.fill();
    ctx.save(); roundRectPath(x, y, w, h, 5); ctx.clip();
    ctx.strokeStyle = 'rgba(40,20,5,.2)'; ctx.lineWidth = 1;
    for (var k = -h; k < w + h; k += 6){ ctx.beginPath(); ctx.moveTo(x + k, y); ctx.lineTo(x + k + h, y + h); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x + k + h, y); ctx.lineTo(x + k, y + h); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(x, y, w, 3);
    ctx.fillStyle = 'rgba(40,20,5,.35)'; ctx.fillRect(x, y + h - 4, w, 4);
    ctx.fillStyle = 'rgba(40,20,5,.28)'; ctx.fillRect(x, y + 5, w, 2); ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(x, y + 7, w, 1);
    ctx.restore();
    ctx.strokeStyle = 'rgba(40,15,5,.55)'; ctx.lineWidth = 1.2; roundRectPath(x + .5, y + .5, w - 1, h - 1, 5); ctx.stroke();
    ctx.restore();
  }

  function drawBackground(){
    if (!bgCache) bgCache = buildBg();
    ctx.drawImage(bgCache, 0, 0);
    var off = scrollOffset * .35;
    [[50, 70], [W - 55, 150], [70, 300], [W - 45, 420], [W / 2 + 60, 40]].forEach(function(p, i){ var yy = ((p[1] + off + i * 90) % (H + 160)) - 60; drawLantern(p[0], yy, .8 + (i % 2) * .15); });
  }

  function spawnDust(x, y, w, col, n){ for (var i = 0; i < n; i++) fx.push({ k: 'dust', x: x + Math.random() * w, y: y + BLOCK_H - 6, vx: (Math.random() - .5) * 70, vy: -20 - Math.random() * 40, life: .6, max: .6, r: 3 + Math.random() * 4, c: col }); }
  function spawnGold(cx, y){ ringFlash = .5; for (var i = 0; i < 16; i++){ var an = Math.random() * 6.283, v = 60 + Math.random() * 120; fx.push({ k: 'spark', x: cx, y: y + 10, vx: Math.cos(an) * v, vy: Math.sin(an) * v - 40, life: .7, max: .7, r: 2 + Math.random() * 2.5, c: i % 2 ? '#FFE9A8' : '#F4C44A' }); } }

  function stepFx(dt){
    clock += dt; steamT += dt;
    var top = stack[stack.length - 1];
    while (steamT > .1){ steamT -= .1; if (steam.length < 42 && top) steam.push({ x: top.x + 10 + Math.random() * Math.max(4, top.w - 20), y: rowToScreenY(top.row) + 4, r: 5 + Math.random() * 4, life: 1.6, max: 1.6, vx: (Math.random() - .5) * 14, vy: -28 - Math.random() * 16 }); }
    steam.forEach(function(p){ p.x += p.vx * dt + Math.sin(clock * 2 + p.y * .05) * .3; p.y += p.vy * dt; p.r += 10 * dt; p.life -= dt; }); steam = steam.filter(function(p){ return p.life > 0; });
    fx.forEach(function(p){ p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.k === 'spark' ? 260 : -10) * dt; p.life -= dt; }); fx = fx.filter(function(p){ return p.life > 0; });
    if (shakeT > 0) shakeT -= dt; if (ringFlash > 0) ringFlash -= dt;
  }

  function drawFx(){
    steam.forEach(function(p){ var a = Math.max(0, p.life / p.max); var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r); g.addColorStop(0, 'rgba(255,255,255,' + (.34 * a) + ')'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3); ctx.fill(); });
    fx.forEach(function(p){ var a = Math.max(0, p.life / p.max); if (p.k === 'dust'){ ctx.fillStyle = 'rgba(255,240,215,' + (.35 * a) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.6 - a * .6), 0, 6.3); ctx.fill(); } else { ctx.globalAlpha = a; ctx.fillStyle = p.c; ctx.shadowColor = p.c; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3); ctx.fill(); ctx.shadowBlur = 0; ctx.globalAlpha = 1; } });
  }

  function draw(){
    ctx.save();
    if (shakeT > 0) ctx.translate((Math.random() - .5) * 7 * shakeT * 3, (Math.random() - .5) * 7 * shakeT * 3);
    drawBackground();
    // stove table at base
    var by = rowToScreenY(0) + BLOCK_H - 4;
    if (by < H + 40){ var tg = ctx.createLinearGradient(0, by, 0, by + 60); tg.addColorStop(0, '#8B5A2B'); tg.addColorStop(1, '#4E2F14'); ctx.fillStyle = tg; ctx.fillRect(0, by, W, 90); ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(0, by, W, 3); ctx.strokeStyle = 'rgba(30,15,5,.3)'; ctx.lineWidth = 1; for (var q = 1; q < 4; q++){ ctx.beginPath(); ctx.moveTo(0, by + q * 14); ctx.lineTo(W, by + q * 14 + 2); ctx.stroke(); } }
    // milestone lines
    ctx.font = "800 11px 'Nunito', sans-serif"; ctx.textAlign = 'left';
    for (var r = 5; r <= stack.length + 8; r += 5){ var my = rowToScreenY(r) + BLOCK_H / 2; if (my > 20 && my < H){ ctx.strokeStyle = 'rgba(244,213,141,.28)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, my); ctx.lineTo(W, my); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = 'rgba(244,213,141,.7)'; ctx.fillText(r + ' 層', 8, my - 4); } }
    stack.forEach(function(b){
      var y = rowToScreenY(b.row);
      if (y > -BLOCK_H && y < H + BLOCK_H){ drawBasket(b.x, y, b.w, b.color); }
    });
    var top = stack[stack.length - 1];
    debris.forEach(function(d){ drawBasket(d.x, d.y, d.w, d.color, d.rot || 0); });
    var curY = rowToScreenY(current.row);
    // guide line
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.setLineDash([3, 5]); ctx.beginPath(); ctx.moveTo(top.x, curY + BLOCK_H); ctx.lineTo(top.x, H); ctx.moveTo(top.x + top.w, curY + BLOCK_H); ctx.lineTo(top.x + top.w, H); ctx.stroke(); ctx.setLineDash([]);
    drawBasket(current.x, curY, current.w, current.color);
    drawFx();
    if (ringFlash > 0){ var t = 1 - ringFlash / .5; ctx.strokeStyle = 'rgba(255,225,130,' + (1 - t) + ')'; ctx.lineWidth = 3 * (1 - t) + 1; roundRectPath(top.x - 4 - t * 10, rowToScreenY(top.row) - 4 - t * 6, top.w + 8 + t * 20, BLOCK_H + t * 12, 8); ctx.stroke(); }
    if (perfectToast > 0){
      var k = Math.min(1, perfectToast * 2), sc = 1 + (.6 - perfectToast) * .25;
      ctx.save(); ctx.globalAlpha = k; ctx.translate(W / 2, curY - 22 - (.6 - perfectToast) * 26); ctx.scale(sc, sc); ctx.textAlign = 'center'; ctx.lineJoin = 'round';
      var label = streak > 1 ? '完美 ×' + streak : '完美!';
      ctx.font = "900 24px 'Noto Serif TC', serif"; ctx.lineWidth = 6; ctx.strokeStyle = '#6B1414'; ctx.strokeText(label, 0, 0); ctx.fillStyle = '#FFE9A8'; ctx.fillText(label, 0, 0); ctx.restore();
    }
    ctx.restore();
    var vg = ctx.createRadialGradient(W / 2, H / 2, H * .38, W / 2, H / 2, H * .8); vg.addColorStop(0, 'rgba(30,5,5,0)'); vg.addColorStop(1, 'rgba(30,5,5,.45)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  var audioCtx = null;
  function getAudioCtx(){
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { audioCtx = null; }
    return audioCtx;
  }
  function sfx(freq, dur, type, vol){
    var ac = getAudioCtx();
    if (!ac) return;
    try {
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.value = 0;
      o.connect(g); g.connect(ac.destination);
      var t = ac.currentTime;
      o.start(t);
      g.gain.linearRampToValueAtTime(vol || 0.06, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.stop(t + dur + 0.02);
    } catch (e) { /* ignore */ }
  }
  function dropSfx(){ sfx(360, 0.08, 'square', 0.05); }
  function perfectSfx(){
    [660, 880].forEach(function(f, i){
      setTimeout(function(){ sfx(f, 0.14, 'triangle', 0.06); }, i*70);
    });
  }
  function fallSfx(){ sfx(140, 0.35, 'sawtooth', 0.06); }

  var music = {
    enabled: true,
    timer: null,
    step: 0,
    tempo: 260,
    melody: [349.23, 415.30, 493.88, 415.30, 349.23, 293.66, 349.23, 415.30],
    bass:   [87.31,  null,   123.47, null,   87.31,  null,   73.42,  null],
    loadPref: function(){
      try {
        var v = localStorage.getItem('steamerstack_music');
        if (v !== null) this.enabled = (v === '1');
      } catch (e) { /* ignore */ }
    },
    savePref: function(){
      try { localStorage.setItem('steamerstack_music', this.enabled ? '1' : '0'); } catch (e) { /* ignore */ }
    },
    tone: function(freq, dur, type, vol){
      var ac = getAudioCtx();
      if (!ac || !freq) return;
      try {
        var o = ac.createOscillator();
        var g = ac.createGain();
        o.type = type;
        o.frequency.value = freq;
        g.gain.value = 0;
        o.connect(g); g.connect(ac.destination);
        var t = ac.currentTime;
        o.start(t);
        g.gain.linearRampToValueAtTime(vol, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.stop(t + dur + 0.03);
      } catch (e) { /* ignore */ }
    },
    playStep: function(){
      var m = this.melody[this.step % this.melody.length];
      var b = this.bass[this.step % this.bass.length];
      this.tone(m, 0.28, 'triangle', 0.045);
      if (b) this.tone(b, 0.5, 'sine', 0.05);
      this.step++;
    },
    start: function(){
      this.stop();
      if (!this.enabled) return;
      getAudioCtx();
      this.step = 0;
      this.playStep();
      var self = this;
      this.timer = setInterval(function(){ self.playStep(); }, this.tempo);
    },
    stop: function(){
      if (this.timer){ clearInterval(this.timer); this.timer = null; }
    },
    toggle: function(){
      this.enabled = !this.enabled;
      this.savePref();
      if (this.enabled && running) this.start();
      else this.stop();
      return this.enabled;
    }
  };
  music.loadPref();

  function dropCurrent(){
    if (!running) return;
    var below = stack[stack.length - 1];
    var overlapLeft = Math.max(current.x, below.x);
    var overlapRight = Math.min(current.x + current.w, below.x + below.w);
    var overlapW = overlapRight - overlapLeft;

    if (overlapW <= MIN_SURVIVE_W){
      fallSfx(); shakeT = .35;
      debris.push({ x: current.x, y: rowToScreenY(current.row), w: current.w, color: current.color, vy: 40, rot: 0 });
      gameOver();
      return;
    }

    var perfect = Math.abs(current.w - overlapW) <= PERFECT_MARGIN &&
                  Math.abs(current.x - below.x) <= PERFECT_MARGIN;

    if (perfect){
      overlapLeft = below.x;
      overlapW = below.w;
      perfectToast = 0.6; streak++; spawnGold(overlapLeft + overlapW / 2, rowToScreenY(current.row)); shakeT = .12;
      perfectSfx();
      score += 2;
    } else {
      dropSfx(); streak = 0; spawnDust(overlapLeft, rowToScreenY(current.row), overlapW, '#FFF', 6);
      score += 1;
      if (current.x < overlapLeft){
        debris.push({
          x: current.x, y: rowToScreenY(current.row), w: overlapLeft - current.x,
          color: current.color, vy: 40
        });
      }
      if (current.x + current.w > overlapRight){
        debris.push({
          x: overlapRight, y: rowToScreenY(current.row), w: (current.x+current.w) - overlapRight,
          color: current.color, vy: 40
        });
      }
    }

    scoreEl.textContent = score;
    if (score > best){
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('steamerstack_best', String(best)); } catch (e) { /* ignore */ }
    }

    stack.push({ x: overlapLeft, w: overlapW, row: current.row, color: current.color });
    spawnCurrent();
  }

  function update(dt){
    var speed = Math.min(320, BASE_SPEED + score * 3);
    current.x += current.dir * speed * dt;
    if (current.x <= 0){ current.x = 0; current.dir = 1; }
    if (current.x + current.w >= W){ current.x = W - current.w; current.dir = -1; }

    var neededTopY = BASE_Y - current.row * BLOCK_H;
    scrollOffset = neededTopY < TOP_LIMIT ? (TOP_LIMIT - neededTopY) : 0;

    stepFx(dt);
    for (var i = debris.length - 1; i >= 0; i--){
      var d = debris[i];
      if (d.vr === undefined) d.vr = (Math.random() - .5) * 5; d.rot = (d.rot || 0) + d.vr * dt;
      d.vy += 900 * dt;
      d.y += d.vy * dt;
      if (d.y > H + 40) debris.splice(i, 1);
    }

    if (perfectToast > 0) perfectToast -= dt;
  }

  function loop(ts){
    if (!running) return;
    if (!lastTime) lastTime = ts;
    var dt = Math.min(0.033, (ts - lastTime) / 1000);
    lastTime = ts;
    update(dt);
    if (!running) return;
    draw();
    rafId = requestAnimationFrame(loop);
  }

  function gameOver(){
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    music.stop();
    var rank = score >= 60 ? '蒸籠宗師 🏆' : score >= 35 ? '點心師傅 🥟' : score >= 15 ? '小廚師 🍜' : '蒸籠學徒 🧺'; finalScoreEl.textContent = rank + '　疊了 ' + score + ' 層';
    overOverlay.classList.remove('hidden');
  }

  function startGame(){
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    resetState();
    draw();
    running = true;
    lastTime = 0;
    rafId = requestAnimationFrame(loop);
    music.start();
  }

  document.addEventListener('keydown', function(e){
    if (e.code === 'Space' || e.key === 'ArrowUp'){
      e.preventDefault();
      if (running) dropCurrent();
    }
  });
  canvas.addEventListener('mousedown', function(){ if (running) dropCurrent(); });
  canvas.addEventListener('touchstart', function(e){ if (running) dropCurrent(); e.preventDefault(); }, {passive:false});

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  var musicBtn = document.getElementById('musicBtn');
  function refreshMusicBtn(){
    musicBtn.textContent = music.enabled ? '🔊' : '🔇';
    musicBtn.setAttribute('aria-pressed', String(music.enabled));
  }
  musicBtn.addEventListener('click', function(){
    music.toggle();
    refreshMusicBtn();
  });
  refreshMusicBtn();

  resetState();
  draw();
})();
</script>
