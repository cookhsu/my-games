const W=window,KP='fun_profile';let G='game',DEFS=[],S={a:{},d:{}},P={xp:0};
const $=id=>document.getElementById(id);
const K=()=>'fun_'+G;
function load(){try{S=Object.assign({a:{},d:{}},JSON.parse(localStorage.getItem(K())||'{}'));}catch(e){}try{P=Object.assign({xp:0},JSON.parse(localStorage.getItem(KP)||'{}'));}catch(e){}}
function save(){try{localStorage.setItem(K(),JSON.stringify(S));localStorage.setItem(KP,JSON.stringify(P));}catch(e){}}
const need=lv=>100+lv*60;
function lvOf(xp){let lv=1,x=xp;while(x>=need(lv)){x-=need(lv);lv++;}return{lv,cur:x,nx:need(lv)};}
const TITLES=['新手牌友','熟客','牌桌常客','老手','高手','大師','傳說'];
const titleOf=lv=>TITLES[Math.min(TITLES.length-1,Math.floor((lv-1)/2))];
let q=[],qb=false;
function banner(ic,t1,t2){q.push([ic,t1,t2]);if(!qb)run();}
function run(){const it=q.shift();if(!it){qb=false;return;}qb=true;const d=document.createElement('div');d.className='fun-ban';d.innerHTML='<i>'+it[0]+'</i><div><small>'+it[1]+'</small><b>'+it[2]+'</b></div>';document.body.appendChild(d);requestAnimationFrame(()=>d.classList.add('on'));setTimeout(()=>{d.classList.remove('on');setTimeout(()=>{d.remove();run();},350);},2400);}
function xp(n){if(!n)return;const b=lvOf(P.xp);P.xp+=n;const a=lvOf(P.xp);save();if(a.lv>b.lv)banner('⬆️','等級提升','Lv.'+a.lv+' '+titleOf(a.lv));chip();}
function unlock(id){if(S.a[id])return false;const d=DEFS.find(x=>x.id===id);if(!d)return false;S.a[id]=Date.now();save();banner(d.ic,'成就解鎖',d.name);xp(30);return true;}
function dateKey(off){const t=new Date(Date.now()+8*3600e3+(off||0)*86400e3);return t.toISOString().slice(0,10);}
function hashS(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function dailySeed(extra){return hashS(dateKey()+'|'+G+(extra||''));}
function dailyInfo(){const t=dateKey();return{done:S.d.last===t,streak:(S.d.last===t||S.d.last===dateKey(-1))?(S.d.streak||0):0,best:S.d.best||0};}
function dailyDone(){const t=dateKey();if(S.d.last===t)return false;S.d.streak=(S.d.last===dateKey(-1)?(S.d.streak||0):0)+1;S.d.last=t;S.d.best=Math.max(S.d.best||0,S.d.streak);save();banner('📅','每日挑戰完成','連續 '+S.d.streak+' 天');xp(60+Math.min(S.d.streak,7)*10);return true;}
function chip(){const e=$('funChip');if(!e)return;const l=lvOf(P.xp);e.querySelector('b').textContent='Lv.'+l.lv+' · '+titleOf(l.lv);e.querySelector('em').style.width=Math.round(l.cur/l.nx*100)+'%';e.querySelector('small').textContent=l.cur+' / '+l.nx+' XP';}
function panel(){let o=$('funOv');if(!o){o=document.createElement('div');o.id='funOv';o.className='fun-ov';o.onclick=e=>{if(e.target===o)o.classList.remove('on');};document.body.appendChild(o);}
 const n=DEFS.filter(d=>S.a[d.id]).length,di=dailyInfo();
 o.innerHTML='<div class="fun-card"><h3>🏆 成就</h3><p class="fun-s">已解鎖 '+n+' / '+DEFS.length+(di.streak?' · 每日挑戰連續 '+di.streak+' 天':'')+'</p><div class="fun-l">'+DEFS.map(d=>{const u=S.a[d.id];return'<div class="fun-i'+(u?' u':'')+'"><i>'+(u?d.ic:'🔒')+'</i><div><b>'+d.name+'</b><small>'+d.desc+'</small></div></div>';}).join('')+'</div><button class="fun-x">關閉</button></div>';
 o.querySelector('.fun-x').onclick=()=>o.classList.remove('on');o.classList.add('on');}
function anchor(card){const st=card.querySelector('.stats');if(st&&st.parentNode===card)return st;const pb=$('playBtn')||$('startBtn');let n=pb;while(n&&n.parentNode!==card)n=n.parentNode;return n||null;}
function buildRow(row,opts){
 if(opts.daily){const b=document.createElement('button');b.className='btn ghost g';b.id='dailyBtn';b.type='button';b.onclick=opts.daily.onclick;row.appendChild(b);W.FUN._db=b;dailyLabel(opts.daily.label);}
 const a=document.createElement('button');a.className='btn ghost g';a.id='achBtn';a.type='button';a.textContent='🏆 成就';a.onclick=panel;row.appendChild(a);
}
function mount(opts){opts=opts||{};const how=$('howBtn');const card=how&&how.closest('.card,.panel,#startBox,.box,.menu');if(!card||$('funChip'))return;
 if(opts.compact){const row0=document.createElement('div');row0.className='row fun-row fun-compact';buildRow(row0,opts);const pr=how.parentNode;if(pr.parentNode===card){const wrap=document.createElement('div');wrap.className='fun-wrap';card.insertBefore(wrap,pr);wrap.appendChild(pr);wrap.appendChild(row0);}else pr.after(row0);return;}
 const chipEl=document.createElement('div');chipEl.id='funChip';chipEl.innerHTML='<b></b><span><em></em></span><small></small>';
 card.insertBefore(chipEl,anchor(card));
 const row=document.createElement('div');row.className='row fun-row';buildRow(row,opts);
 card.appendChild(row);chip();}
function segment(items,def,onchange,key){const how=$('howBtn');const card=how&&how.closest('.card,.panel,#startBox,.box,.menu');if(!card)return;let cur=def;try{const v=localStorage.getItem(key);if(v!==null&&items.some(i=>String(i[0])===v))cur=isNaN(+v)?v:+v;}catch(e){}
 const d=document.createElement('div');d.className='fun-seg';
 items.forEach(([v,t,sm])=>{const b=document.createElement('button');b.type='button';b.innerHTML=t+(sm?'<small>'+sm+'</small>':'');b.className=v===cur?'on':'';b.onclick=()=>{[...d.children].forEach(x=>x.classList.toggle('on',x===b));try{localStorage.setItem(key,v);}catch(e){}onchange(v);};d.appendChild(b);});
 const ch=$('funChip');card.insertBefore(d,ch||anchor(card));onchange(cur);}
function dailyLabel(l){const b=W.FUN._db;if(!b)return;const di=dailyInfo();b.textContent=(di.done?'✅ ':'📅 ')+(l||'每日挑戰')+(di.streak?' · '+di.streak+'天':'');}
function init(game,defs){G=game;DEFS=defs||[];load();}
W.FUN={segment,init,unlock,xp,mount,panel,banner,dailyInfo,dailyDone,dailySeed,rng,dateKey,dailyLabel,has:id=>!!S.a[id],_db:null,lvOf:()=>lvOf(P.xp)};
})();
</script>
</head>

</div></div>
<div class="ov" id="how"><div class="card"><h2>玩法</h2><ul class="rules">
 <li data-i="✊"><b>連勝對決:</b>跟著「石頭、剪刀、布、出!」的節奏出拳。贏了連勝加分,輸了扣愛心,三顆沒了結束。</li>
 <li data-i="🧠">AI 會<b>記住你的出拳習慣</b>並預測你,越難越準。別一直出同一種!</li>
 <li data-i="🎯"><b>指令反應:</b>看 AI 出什麼,依指令「贏它 / 輸它 / 平手」在時限內比出對的手勢。60 秒內越多越好。</li>
 <li data-i="📷"><b>鏡頭手勢:</b>✊石頭、✌️剪刀、✋布。手要放在鏡頭前明亮處,看到畫面右下的偵測手勢再維持一下。</li>

</ul><button class="btn" id="howOk">知道了</button></div></div>

<script>
/* ===== 猜拳大師 ===== */
const $=id=>document.getElementById(id);
if(window.FUN)FUN.init('rps',[
 {id:'r1',ic:'✊',name:'初試拳腳',desc:'完成第一場'},
 {id:'r2',ic:'🔥',name:'五連勝',desc:'連勝對決連贏 5 場'},
 {id:'r3',ic:'🏆',name:'十連勝',desc:'連勝對決連贏 10 場'},
 {id:'r4',ic:'🧠',name:'看穿 AI',desc:'困難難度連贏 4 場'},
 {id:'r5',ic:'🎯',name:'反應高手',desc:'指令反應 20 題答對'},
 {id:'r6',ic:'⚡',name:'神速',desc:'指令反應 0.6 秒內答對'},
 {id:'r7',ic:'🙈',name:'故意輸',desc:'指令反應連續 5 題都正確'},
 {id:'r8',ic:'📅',name:'每日猜拳',desc:'完成每日挑戰'}]);
const video=$('cam');
let cfg={mode:'duel',ctl:'cam',lvl:2};try{Object.assign(cfg,JSON.parse(localStorage.getItem('rp_cfg')||'{}'));}catch(e){}
let best={duel:0,rule:0};try{Object.assign(best,JSON.parse(localStorage.getItem('rp_best')||'{}'));}catch(e){}
const EM={r:'✊',s:'✌️',p:'✋'},NM={r:'石頭',s:'剪刀',p:'布'},BEATS={r:'s',s:'p',p:'r'},BEATEN={r:'p',s:'r',p:'s'};// BEATS[x]=x 贏的對象
/* audio */
let ac_=null;function ac(){try{if(!ac_)ac_=new(window.AudioContext||window.webkitAudioContext)();if(ac_.state==='suspended')ac_.resume();}catch(e){}return ac_;}
function tone(f,d,ty,v,dl,sl){const a=ac_;if(!a)return;try{const t=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),t+d);g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
const SFX={beat:k=>tone(300+k*90,.1,'square',.07),go:()=>tone(900,.14,'triangle',.14),win:()=>[523,659,784].forEach((f,k)=>tone(f,.14,'triangle',.13,k*.07)),lose:()=>tone(220,.3,'sawtooth',.1,0,-100),tie:()=>tone(440,.15,'sine',.1),end:()=>[392,330,262].forEach((f,k)=>tone(f,.28,'sine',.11,k*.15)),fin:()=>[523,659,784,1047].forEach((f,k)=>tone(f,.22,'triangle',.13,k*.11)),tick:()=>tone(900,.04,'square',.04)};
addEventListener('pointerdown',()=>ac(),true);
/* gesture recognizer */
let rec=null,rs='idle',stream=null,lastVT=-1,gNow=null,gT=0,heldG=null,heldT=0;
const GMAP={Closed_Fist:'r',Victory:'s',Open_Palm:'p'};
function loadRec(){if(rs==='ready'||rs==='loading')return Promise.resolve();rs='loading';const bases=['0.10.14','0.10.9'];
 const at=i=>{if(i>=bases.length){rs='failed';return Promise.resolve();}const base='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@'+bases[i];
  return import(base+'/vision_bundle.mjs').then(mod=>mod.FilesetResolver.forVisionTasks(base+'/wasm').then(fs=>{
   const mk=d=>mod.GestureRecognizer.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task',delegate:d},runningMode:'VIDEO',numHands:1});
   return mk('GPU').catch(()=>mk('CPU'));}).then(r=>{rec=r;rs='ready';})).catch(()=>at(i+1));};
 return at(0);}
function detect(now){if(cfg.ctl!=='cam'||rs!=='ready'||!video.videoWidth||video.currentTime===lastVT)return;lastVT=video.currentTime;
 try{const r=rec.recognizeForVideo(video,now);const g=r&&r.gestures&&r.gestures[0]&&r.gestures[0][0];if(g&&g.score>.55&&GMAP[g.categoryName])feedG(GMAP[g.categoryName],now);}catch(e){}}
function feedG(g,now){now=now||performance.now();gNow=g;gT=now;if(heldG!==g){heldG=g;heldT=now;}}
function liveG(now){now=now||performance.now();return(gNow&&now-gT<450)?gNow:null;}
function stableG(ms,now){now=now||performance.now();const g=liveG(now);return g&&now-heldT>=ms?g:null;}
/* state */
let phase='menu',paused=false,daily=false,rnd=Math.random,score=0,streak=0,bestStreak=0,lives=3,tLeft=60,wins=0,ties=0,hist=[],trans={},freq={r:0,s:0,p:0},timers=[],tapG=null,ai=null,rr=null,right=0,fastOk=false,rowOk=0,bestRow=0,lastT=0;
const rngFor=seed=>{let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};};
const pick=()=>'rsp'[Math.floor(rnd()*3)];
function after(s,fn){timers.push({t:s,fn});}
function hud(){$('v1').textContent=cfg.mode==='duel'?streak:Math.ceil(Math.max(0,tLeft));$('vScore').textContent=score;$('vCombo').textContent='❤'.repeat(Math.max(0,lives))+'🖤'.repeat(3-Math.max(0,lives));
 document.querySelector('#top .c small').textContent=cfg.mode==='duel'?'連勝':'時間';}
function setStatus(t){const l=$('loading');if(!t){l.style.display='none';return;}l.style.display='flex';l.style.opacity=1;l.textContent=t;}
let tt=0;function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),ms||1600);}
function setHands(a,m,cls){const A=$('hAI'),Me=$('hMe');A.textContent=a?EM[a]:'❔';Me.textContent=m?EM[m]:'❔';A.className='hand '+(cls&&cls[0]||'');Me.className='hand '+(cls&&cls[1]||'');}
function msg(t,sub){$('msg').textContent=t||'';$('sub').textContent=sub||'';$('msg').style.transform='translateY(-50%)';}
function bar(k){const b=$('tbar');b.style.opacity=k==null?0:1;if(k!=null)$('tfill').style.width=(Math.max(0,k)*100)+'%';}
/* start */
async function begin(d){ac();daily=!!d;rnd=daily&&window.FUN?rngFor(FUN.dailySeed('rps')):Math.random;if(daily)cfg=Object.assign({},cfg,{mode:'duel',lvl:2});
 $('start').classList.remove('on');
 if(cfg.ctl==='cam'&&!window.__mockCam){setStatus('開啟相機中…');
  try{if(!navigator.mediaDevices)throw{name:'NoMedia'};stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await video.play().catch(()=>{});}
  catch(e){setStatus('');$('start').classList.add('on');toast('打不開相機('+(e&&e.name||'?')+'),可改用「觸控按鈕」。',3400);return;}
  setStatus('載入手勢偵測…(第一次需要幾秒)');await loadRec();setStatus('');
  if(rs!=='ready'){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}$('start').classList.add('on');toast('手勢偵測載入失敗(可能網路不通),請改用「觸控按鈕」。',3600);return;}
  video.style.display='';}
 else video.style.display='none';
 $('hud').classList.add('on');$('pad').classList.toggle('on',cfg.ctl==='touch');$('live').style.display=cfg.ctl==='cam'?'block':'none';
 score=0;streak=0;bestStreak=0;lives=3;tLeft=60;wins=0;ties=0;right=0;rowOk=0;bestRow=0;fastOk=false;hist=[];trans={};freq={r:0,s:0,p:0};timers.length=0;tapG=null;hud();
 cfg.mode==='duel'?startRound():startRule();}
/* ---- 連勝對決 ---- */
function aiMove(){const p=[0,.45,.7,.9][cfg.lvl]*(cfg.lvl===1?0:1);if(cfg.lvl===1||hist.length<2||rnd()>p)return pick();
 const last=hist[hist.length-1];let tr=trans[last],g=null,b=-1;const src=tr&&(tr.r+tr.s+tr.p)>0?tr:freq;for(const k of 'rsp')if(src[k]>b){b=src[k];g=k;}return BEATEN[g];}// 預測你出 g,我出贏 g 的
function startRound(){phase='cd';ai=aiMove();tapG=null;setHands(null,null);msg('準備…','');$('pad').querySelectorAll('button').forEach(b=>b.classList.remove('sel'));bar(null);
 const A=$('hAI'),M=$('hMe');A.className='hand shake';M.className='hand shake';A.textContent='✊';M.textContent='✊';
 ['石頭','剪刀','布'].forEach((w,i)=>after(.35+i*.5,()=>{msg(w);SFX.beat(i);}));
 after(.35+1.5,()=>{msg('出!');SFX.go();phase='out';outT=0;});
 after(.35+1.5+.75,resolve);}
let outT=0;
function resolve(){phase='res';let me=cfg.ctl==='touch'?tapG:liveG();setHands(ai,me);
 if(!me){lives--;streak=0;SFX.lose();msg('沒出手!','來不及比出手勢');$('hMe').className='hand lose';}
 else{hist.push(me);freq[me]++;const pv=hist[hist.length-2];if(pv){trans[pv]=trans[pv]||{r:0,s:0,p:0};trans[pv][me]++;}
  if(me===ai){ties++;SFX.tie();msg('平手','再來一次');}
  else if(BEATS[me]===ai){wins++;streak++;bestStreak=Math.max(bestStreak,streak);const pts=100+Math.min(streak-1,9)*30;score+=pts;SFX.win();msg('你贏了!','+'+pts+(streak>1?'  ×'+streak+' 連勝':''));setHands(ai,me,['lose','win']);}
  else{lives--;streak=0;SFX.lose();msg('你輸了','AI 出'+NM[ai]);setHands(ai,me,['win','lose']);}}
 hud();after(1.4,()=>{if(lives<=0)endGame();else startRound();});}
/* ---- 指令反應 ---- */
const TASK={win:'贏它!',lose:'輸給它!',tie:'平手!'};
function startRule(){nextRule();}
function nextRule(){if(lives<=0||tLeft<=0)return endGame();const a=pick(),k=['win','lose','tie'][Math.floor(rnd()*3)];const want=k==='win'?BEATEN[a]:k==='lose'?BEATS[a]:a;
 const T=[0,3,2.3,1.7][cfg.lvl];rr={a,k,want,T,left:T};phase='rule';tapG=null;heldG=null;setHands(a,null);msg(TASK[k],'AI 出了'+NM[a]);bar(1);$('pad').querySelectorAll('button').forEach(b=>b.classList.remove('sel'));}
function ruleAnswer(g){if(phase!=='rule')return;phase='res';bar(null);const ok=g===rr.want;const used=rr.T-rr.left;setHands(rr.a,g,[ '',ok?'win':'lose']);
 if(ok){right++;rowOk++;bestRow=Math.max(bestRow,rowOk);const pts=100+Math.round(rr.left/rr.T*60)+Math.min(rowOk,10)*5;score+=pts;SFX.win();msg('答對!','+'+pts);if(used<=.6)fastOk=true;}
 else{lives--;rowOk=0;SFX.lose();msg('答錯了','應該出'+NM[rr.want]);}
 hud();after(.8,nextRule);}
function ruleTimeout(){phase='res';bar(null);lives--;rowOk=0;SFX.lose();setHands(rr.a,rr.want,['','lose']);msg('時間到','應該出'+NM[rr.want]);hud();after(.9,nextRule);}
/* update */
function update(dt,now){
 if(timers.length){for(let i=0;i<timers.length;i++){const w=timers[i];w.t-=dt;if(w.t<=0){timers.splice(i,1);i--;w.fn();}}}
 if(cfg.ctl==='cam'){const g=liveG(now);$('live').textContent=g?EM[g]:'🫥';}
 if(phase==='rule'){if(cfg.mode==='rule')tLeft-=dt;rr.left-=dt;bar(rr.left/rr.T);
  const g=cfg.ctl==='touch'?tapG:stableG(320,now);if(g)return ruleAnswer(g);if(rr.left<=0)ruleTimeout();else if(tLeft<=0){phase='res';bar(null);endGame();}hud();}
 else if(phase==='res'&&cfg.mode==='rule'&&tLeft>0){tLeft-=dt;hud();}
 if(phase==='cd'||phase==='out'){if(cfg.ctl==='touch'){}}}
/* end */
function endGame(){phase='over';bar(null);const key=cfg.mode;const val=cfg.mode==='duel'?bestStreak:right;const nb=!daily&&val>best[key];if(nb){best[key]=val;try{localStorage.setItem('rp_best',JSON.stringify(best));}catch(e){}}
 if(window.FUN){FUN.xp(10+val*5);FUN.unlock('r1');if(cfg.mode==='duel'){if(bestStreak>=5)FUN.unlock('r2');if(bestStreak>=10)FUN.unlock('r3');if(cfg.lvl===3&&bestStreak>=4)FUN.unlock('r4');}else{if(right>=20)FUN.unlock('r5');if(fastOk)FUN.unlock('r6');if(bestRow>=5)FUN.unlock('r7');}if(daily&&FUN.dailyDone()){FUN.unlock('r8');FUN.dailyLabel('每日挑戰');}}
 const rk=cfg.mode==='duel'?(bestStreak>=10?'S':bestStreak>=6?'A':bestStreak>=3?'B':'C'):(right>=22?'S':right>=15?'A':right>=8?'B':'C');(rk==='S'||rk==='A')?SFX.fin():SFX.end();
 const stat=cfg.mode==='duel'?'<div><b>'+bestStreak+'</b>最高連勝</div><div><b>'+wins+'勝 '+ties+'平</b>戰績</div><div><b>'+best.duel+'</b>個人最佳</div>':'<div><b>'+right+'</b>答對題數</div><div><b>'+bestRow+'</b>最高連對</div><div><b>'+best.rule+'</b>個人最佳</div>';
 $('resCard').innerHTML='<h2>'+(lives<=0?'挑戰結束':'時間到!')+'</h2><div class="rank">'+rk+'</div><p class="res-big">'+score+' 分'+(nb?' 🎉新紀錄':'')+'</p><div class="res-stat">'+stat+'</div><button class="btn" id="rAgain">再玩一次</button><button class="btn g" id="rSet">換設定</button><button class="btn g" id="rLobby">回遊戲大廳</button>';
 $('res').classList.add('on');$('rAgain').onclick=()=>{$('res').classList.remove('on');begin(daily);};$('rSet').onclick=()=>{$('res').classList.remove('on');toMenu();};$('rLobby').onclick=()=>{location.href='index.html';};}
function toMenu(){phase='menu';timers.length=0;$('hud').classList.remove('on');$('start').classList.add('on');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.style.display='';}
/* UI */
function seg(id,key,cv){const bs=document.querySelectorAll('#'+id+' button');const set=()=>bs.forEach(b=>b.classList.toggle('on',cv(b.dataset.v)===cfg[key]));bs.forEach(b=>b.onclick=()=>{cfg[key]=cv(b.dataset.v);set();try{localStorage.setItem('rp_cfg',JSON.stringify(cfg));}catch(e){}});set();}
seg('sMode','mode',String);seg('sCtl','ctl',String);seg('sLvl','lvl',Number);
$('startBtn').onclick=()=>begin(false);$('howBtn').onclick=()=>$('how').classList.add('on');$('howOk').onclick=()=>$('how').classList.remove('on');
$('back').onclick=()=>{location.href='index.html';};
$('menuBtn').onclick=()=>{paused=true;$('menu').classList.add('on');};$('mResume').onclick=()=>{paused=false;$('menu').classList.remove('on');};
$('mHow').onclick=()=>{$('menu').classList.remove('on');$('how').classList.add('on');};$('mRestart').onclick=()=>{$('menu').classList.remove('on');paused=false;begin(daily);};$('mLobby').onclick=()=>{location.href='index.html';};
document.querySelectorAll('#pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(phase!=='cd'&&phase!=='out'&&phase!=='rule')return;tapG=b.dataset.g;document.querySelectorAll('#pad button').forEach(x=>x.classList.toggle('sel',x===b));}));
addEventListener('keydown',e=>{const m={KeyR:'r',KeyS:'s',KeyP:'p',Digit1:'r',Digit2:'s',Digit3:'p'}[e.code];if(m&&cfg.ctl==='touch'&&(phase==='cd'||phase==='out'||phase==='rule'))tapG=m;});
if(window.FUN)FUN.mount({daily:{label:'每日挑戰',onclick:()=>begin(true)}});
if(window.GMB)try{GMB.init({style:'cute',button:true,key:'rp_bgm_off'});}catch(e){}
let last=performance.now();
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(paused)dt=0;detect(now);if(phase!=='menu'&&phase!=='over')update(dt,now);requestAnimationFrame(frame);}
requestAnimationFrame(frame);setTimeout(()=>{$('loading').style.display='none';},300);
window.__rp={get:()=>({phase,score,streak,lives,tLeft,wins,ties,right,ai,want:rr&&rr.want,hist:hist.join('')}),cfg:()=>cfg,feed:g=>feedG(g),begin,aiMove,setHist:h=>{hist=h.split('');trans={};freq={r:0,s:0,p:0};hist.forEach((m,i)=>{freq[m]++;if(i){const pv=hist[i-1];trans[pv]=trans[pv]||{r:0,s:0,p:0};trans[pv][m]++;}});}};

</script>
</body>
