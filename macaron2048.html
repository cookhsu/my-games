<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>馬卡龍 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --page: #FFF6EC;
    --box: #F6D3DE;
    --box-dark: #EAB6C6;
    --tray: #FFFDF9;
    --tray-cell: #F3E7DA;
    --ink: #5A3B42;
    --ink-soft: #9C7C82;
    --accent: #E8749A;
    --shadow: rgba(120,70,80,0.25);
  }
  :root:not([data-theme="light"]){
    --page: #FFF6EC;
  }
  :root[data-theme="dark"]{
    --page: #3A2C30;
    --box: #5A4048;
    --box-dark: #4A333A;
    --tray: #4A3A3E;
    --tray-cell: #5C494D;
    --ink: #FBEFE9;
    --ink-soft: #D8BFC5;
  }

  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--page);
    color: var(--ink);
    font-family: 'Nunito', system-ui, sans-serif;
    min-height: 100%;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 60px;
  }

  .marquee{
    text-align:center;
    margin-bottom: 18px;
  }
  .marquee h1{
    font-family:'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(24px, 6vw, 36px);
    color: var(--accent);
    margin: 0 0 8px;
  }
  .marquee p{
    margin:0;
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 420px;
  }

  .box{
    position:relative;
    background:
      radial-gradient(circle, rgba(255,255,255,0.55) 2.5px, transparent 2.6px) 0 0/18px 18px,
      linear-gradient(180deg, var(--box), var(--box-dark));
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 20px 45px var(--shadow);
    width: 100%;
    max-width: 420px;
  }

  .hud{
    display:flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 8px 14px;
  }
  .hud .stat{ text-align:left; }
  .hud .stat.right{ text-align:right; }
  .hud .label{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 11px;
    color: var(--ink);
    opacity: 0.7;
    display:block;
    margin-bottom: 2px;
  }
  .hud .value{
    font-family:'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--ink);
  }
  .music-btn{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--tray);
    border: none;
    color: var(--ink);
    font-size: 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    box-shadow: 0 2px 0 rgba(0,0,0,0.12);
  }
  .music-btn:active{ transform: translateY(1px); box-shadow:none; }
  .music-btn:focus-visible{
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .tray-frame{
    position:relative;
    border-radius: 16px;
    padding: 10px;
    background: var(--tray);
  }

  .grid-bg{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .cell{
    aspect-ratio: 1 / 1;
    background: var(--tray-cell);
    border-radius: 10px;
  }

  .tile-layer{
    container-type:inline-size;
    position:absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
  }
  .tile{
    position:absolute;
    top:0; left:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius: 10px;
    font-family:'Fredoka', sans-serif;
    font-weight: 700;
    transition: transform 0.13s ease;
    will-change: transform;
    box-shadow: 0 2px 4px rgba(90,59,66,0.18);
  }
  .tile.appear{
    animation: tile-appear 0.18s ease;
  }
  .tile.pop{
    animation: tile-pop 0.16s ease;
  }
  @keyframes tile-appear{
    from{ transform: scale(0.3); opacity: 0; }
    to{ transform: scale(1); opacity: 1; }
  }
  @keyframes tile-pop{
    0%{ transform: scale(1); }
    50%{ transform: scale(1.15); }
    100%{ transform: scale(1); }
  }

  .overlay{
    position:absolute;
    inset: 10px;
    border-radius: 12px;
    background: rgba(90,59,66,0.85);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 20px;
    gap: 14px;
    z-index: 5;
  }
  .overlay.hidden{ display:none; }
  .overlay h2{
    font-family:'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(18px, 5vw, 26px);
    color: #FFF6EC;
    margin:0;
  }
  .overlay p{
    margin:0;
    color: #F3DCE2;
    font-size: 13px;
    line-height:1.6;
    max-width: 260px;
  }
  .btn{
    font-family:'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: #fff;
    background: var(--accent);
    border: none;
    padding: 12px 26px;
    border-radius: 24px;
    cursor:pointer;
    box-shadow: 0 4px 0 #C15776;
    transition: transform 0.08s ease;
  }
  .btn:active{
    transform: translateY(3px);
    box-shadow: 0 1px 0 #C15776;
  }
  .btn:focus-visible{
    outline: 3px solid #fff;
    outline-offset: 2px;
  }
  .btn.secondary{
    background: transparent;
    border: 2px solid rgba(255,255,255,0.6);
    box-shadow: none;
    color: #fff;
  }
  .overlay-buttons{
    display:flex;
    gap: 10px;
  }

  .hint{
    margin-top: 16px;
    font-size: 12px;
    color: var(--ink-soft);
    text-align:center;
    max-width: 420px;
  }
  .hint kbd{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 11px;
    background: var(--tray);
    border-radius: 4px;
    padding: 3px 8px;
    color: var(--ink);
  }

  @media (prefers-reduced-motion: reduce){
    .btn, .music-btn, .tile{ transition: none; animation: none; }
  }
  .sub{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 8px 10px; font-family:'Fredoka',sans-serif; font-size:13px; font-weight:600; color:var(--ink); }
  #modeTag{ background:rgba(255,255,255,.4); border-radius:12px; padding:3px 10px; white-space:nowrap; }
  #timer{ background:#E8749A; color:#fff; border-radius:12px; padding:3px 10px; min-width:52px; text-align:center; font-variant-numeric:tabular-nums; }
  #timer.low{ background:#C0392B; animation:comboPop .5s ease infinite alternate; }
  #combo{ flex:1; text-align:center; font-weight:700; color:var(--accent); min-height:20px; font-size:13px; }
  #combo.fx{ animation:comboPop .45s ease; }
  @keyframes comboPop{ 0%{ transform:scale(.6); opacity:0; } 45%{ transform:scale(1.18); opacity:1; } 100%{ transform:scale(1); } }
  .tools{ display:flex; gap:8px; margin-top:12px; }
  .tool{ flex:1; font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px; color:var(--ink); background:var(--tray); border:none; border-radius:14px; padding:9px 4px; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.18); }
  .tool b{ display:inline-block; min-width:18px; margin-left:4px; background:var(--accent); color:#fff; border-radius:9px; font-size:11px; padding:1px 5px; }
  .tool:disabled{ opacity:.45; cursor:default; }
  .tool.on{ outline:3px solid var(--accent); }
  .missions{ margin-top:12px; background:rgba(255,255,255,.38); border-radius:14px; padding:8px 12px; font-size:12px; color:var(--ink); }
  .missions:empty{ display:none; }
  .missions .mrow{ display:flex; justify-content:space-between; gap:8px; padding:2px 0; }
  .missions .mrow.done{ opacity:.55; text-decoration:line-through; }
  .missions .rw{ white-space:nowrap; opacity:.8; }
  .mtoast{ position:absolute; left:50%; top:14px; transform:translateX(-50%); z-index:6; background:rgba(90,59,66,.92); color:#FFF6EC; font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px; padding:8px 16px; border-radius:18px; pointer-events:none; opacity:0; transition:opacity .25s; white-space:nowrap; }
  .mtoast.show{ opacity:1; }
  .tray-frame.hammer .tile{ cursor:crosshair; outline:2px dashed var(--accent); }
  .modes{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:230px; }
  .modes .btn{ width:100%; padding-left:12px; padding-right:12px; }
  .book{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:100%; }
  .bk{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:#F3DCE2; }
  .bk i{ font-style:normal; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; font-weight:700; font-size:11px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.15); }
  .bk.no i{ background:rgba(255,255,255,.15); color:#F3DCE2; }
/* ===== UI v2 (template) ===== */
body{ position:relative; }
.marquee{ margin-top:18px; }
.marquee h1{ letter-spacing:.06em; text-shadow:0 2px 0 rgba(255,255,255,.35), 0 6px 18px rgba(0,0,0,.18); }
.marquee h1::after{ content:""; display:block; width:56px; height:4px; margin:10px auto 0; border-radius:4px; background:currentColor; opacity:.35; }
.marquee p{ opacity:.9; line-height:1.7; }
.board,.box{ box-shadow:0 26px 54px rgba(0,0,0,.38), 0 3px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.14) !important; }
.hud .stat{ padding:7px 12px 8px; border-radius:12px; background:rgba(0,0,0,.14); box-shadow:inset 0 1px 0 rgba(0,0,0,.12), 0 1px 0 rgba(255,255,255,.25); min-width:84px; }
.hud .value{ font-variant-numeric:tabular-nums; text-shadow:0 1px 0 rgba(255,255,255,.25); }
.music-btn,.icon-btn{ box-shadow:0 3px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.6) !important; transition:transform .1s, box-shadow .1s; }
.music-btn:active,.icon-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.25) !important; }
.screen-frame,.frame,.field-frame,.table-frame,.tray-frame{ position:relative; box-shadow:inset 0 0 0 2px rgba(0,0,0,.18), inset 0 6px 16px rgba(0,0,0,.28), 0 1px 0 rgba(255,255,255,.3); }
.screen-frame::after,.frame::after,.field-frame::after,.table-frame::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, transparent 62%, rgba(0,0,0,.28)); z-index:1; }
.overlay{ z-index:3; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); animation:tplIn .32s ease; }
@keyframes tplIn{ from{ opacity:0; transform:scale(.97);} to{ opacity:1; transform:none; } }
.overlay>*{ animation:tplUp .45s ease backwards; } .overlay>*:nth-child(2){ animation-delay:.06s } .overlay>*:nth-child(3){ animation-delay:.12s } .overlay>*:nth-child(4){ animation-delay:.18s }
@keyframes tplUp{ from{ opacity:0; transform:translateY(12px);} }
.overlay h2{ letter-spacing:.08em; text-shadow:0 3px 0 rgba(0,0,0,.28), 0 8px 20px rgba(0,0,0,.3); }
.overlay p{ line-height:1.75; }
.overlay p[id]{ font-size:17px; font-weight:800; padding:10px 20px; border-radius:14px; background:rgba(255,255,255,.12); box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); max-width:none; }
.btn{ position:relative; overflow:hidden; letter-spacing:.08em; padding-left:30px; padding-right:30px; transition:transform .1s ease, box-shadow .1s ease, filter .15s; }
.btn::after{ content:""; position:absolute; left:14%; right:14%; top:3px; height:34%; border-radius:99px; background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0)); pointer-events:none; }
#startBtn,#restartBtn,.overlay .btn:first-of-type{ animation:tplPulse 2s ease-in-out infinite; }
@keyframes tplPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.05);} }
#startBtn::before,#restartBtn::before{ content:""; position:absolute; top:0; bottom:0; left:-45%; width:28%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent); transform:skewX(-20deg); animation:tplShine 3s ease-in-out infinite; }
@keyframes tplShine{ 0%{ left:-45%; } 55%,100%{ left:140%; } }
.hint kbd{ box-shadow:0 2px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.5); border:1px solid rgba(0,0,0,.12); }
@media (prefers-reduced-motion:reduce){ .overlay,.overlay>*,#startBtn,#restartBtn,.overlay .btn:first-of-type,#startBtn::before,#restartBtn::before{ animation:none !important; } }
</style>
</head>
<body>

  <div class="marquee">
    <h1>馬卡龍 2048</h1>
    <p>滑動甜點盤，把相同口味的馬卡龍疊在一起，疊出最厲害的一顆！</p>
  </div>

  <div class="box">
    <div class="hud">
      <div class="stat">
        <span class="label">分數 SCORE</span>
        <span class="value" id="score">0</span>
      </div>
      <button class="music-btn" id="musicBtn" aria-label="切換背景音樂" aria-pressed="true">🔊</button>
      <div class="stat right">
        <span class="label" id="bestLbl">最佳 BEST</span>
        <span class="value" id="best">0</span>
      </div>
    </div>

    <div class="sub"><span id="modeTag">經典</span><span id="timer" style="display:none">90</span><span id="combo"></span><button class="music-btn" id="bookBtn" aria-label="口味圖鑑" style="width:34px;height:34px;font-size:15px">📖</button></div>

    <div class="tray-frame" id="trayFrame">
      <div class="mtoast" id="mtoast"></div>
      <div class="grid-bg" id="gridBg"></div>
      <div class="tile-layer" id="tileLayer"></div>

      <div class="overlay" id="startOverlay">
        <h2>準備開動！</h2>
        <p>滑動移動所有馬卡龍，相同口味合體升級。連續合併有連擊加分，完成任務可得道具！</p>
        <div class="modes">
          <button class="btn" id="startBtn">🍰 經典模式</button>
          <button class="btn" id="rushBtn">⏱ 限時甜點（90 秒）</button>
          <button class="btn" id="dailyBtn">📅 每日挑戰</button>
        </div>
      </div>

      <div class="overlay hidden" id="overOverlay">
        <h2 id="overTitle">盤子滿了！</h2>
        <p id="finalScore">本局分數：0</p>
        <div class="overlay-buttons"><button class="btn" id="restartBtn">再來一盤</button><button class="btn secondary" id="menuBtn">換模式</button></div>
      </div>

      <div class="overlay hidden" id="bookOverlay">
        <h2>口味圖鑑</h2>
        <div class="book" id="book"></div>
        <button class="btn secondary" id="bookClose">關閉</button>
      </div>

      <div class="overlay hidden" id="winOverlay">
        <h2>疊出 2048 了！🎉</h2>
        <p id="winScore">本局分數：0</p>
        <div class="overlay-buttons">
          <button class="btn secondary" id="continueBtn">繼續挑戰</button>
          <button class="btn" id="winRestartBtn">重新開始</button>
        </div>
      </div>
    </div>

    <div class="tools" id="tools">
      <button class="tool" id="toolUndo">↶ 撤銷<b>3</b></button>
      <button class="tool" id="toolHammer">🔨 糖果槌<b>1</b></button>
      <button class="tool" id="toolShuffle">🔀 洗牌<b>1</b></button>
    </div>
    <div class="missions" id="missions"></div>
  </div>

  <p class="hint">桌機請按 <kbd>← ↑ → ↓</kbd> 或 <kbd>W A S D</kbd>　手機請直接在盤子上滑動<br>連續合併有連擊加分 · 完成任務、做出 256 / 512 / 1024 可得道具</p>

<script>
(function(){
  "use strict";

  var SIZE = 4;
  var VECTORS = {
    up:    { row: -1, col: 0 },
    down:  { row: 1,  col: 0 },
    left:  { row: 0,  col: -1 },
    right: { row: 0,  col: 1 }
  };

  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var startOverlay = document.getElementById('startOverlay');
  var overOverlay = document.getElementById('overOverlay');
  var winOverlay = document.getElementById('winOverlay');
  var finalScoreEl = document.getElementById('finalScore');
  var winScoreEl = document.getElementById('winScore');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  var continueBtn = document.getElementById('continueBtn');
  var winRestartBtn = document.getElementById('winRestartBtn');
  var gridBg = document.getElementById('gridBg');
  var tileLayer = document.getElementById('tileLayer');
  var trayFrame = document.getElementById('trayFrame');

  var FLAVOR = {
    2:    { bg: '#FCE4EC', fg: '#8A5568' },
    4:    { bg: '#E0F5EC', fg: '#3F7A63' },
    8:    { bg: '#EDE3F5', fg: '#6A4E8C' },
    16:   { bg: '#FCE0C8', fg: '#9A5A28' },
    32:   { bg: '#F6A695', fg: '#ffffff' },
    64:   { bg: '#EF6F8E', fg: '#ffffff' },
    128:  { bg: '#8FCB9B', fg: '#ffffff' },
    256:  { bg: '#A78BC9', fg: '#ffffff' },
    512:  { bg: '#6FB3D2', fg: '#ffffff' },
    1024: { bg: '#E8B84B', fg: '#ffffff' },
    2048: { bg: '#8C3B4A', fg: '#FBEFE9' }
  };
  function flavorFor(v){
    return FLAVOR[v] || { bg: '#4A3229', fg: '#FBEFE9' };
  }

  var best = 0;
  try {
    var stored = localStorage.getItem('macaron2048_best');
    if (stored) best = parseInt(stored, 10) || 0;
  } catch (e) { /* storage unavailable */ }
  bestEl.textContent = best;

  for (var i=0; i<16; i++){
    var c = document.createElement('div');
    c.className = 'cell';
    gridBg.appendChild(c);
  }

  var grid, tiles, nextId, score, running, hasWon, keepPlayingAfterWin;
  var mode = 'classic', rs = 0, streak = 0, moves = 0, snap = null, hammerMode = false, earned = {}, charges = { undo: 3, hammer: 1, shuffle: 1 }, mis = [], timeLeft = 90, maxTile = 0, tick = null, bookMax = 0, toastT = null, bookWasRunning = false;
  var NAMES = { 2:'玫瑰', 4:'抹茶', 8:'薰衣草', 16:'香橙', 32:'蜜桃', 64:'覆盆莓', 128:'開心果', 256:'紫薯', 512:'藍莓', 1024:'蜂蜜', 2048:'巧克力', 4096:'黑松露', 8192:'金箔' };
  var TOOLN = { undo:'↶ 撤銷', hammer:'🔨 糖果槌', shuffle:'🔀 洗牌' };
  function flavorName(v){ return NAMES[v] || '傳說'; }
  function R(){ rs = (rs + 0x6D2B79F5) | 0; var t = Math.imul(rs ^ rs >>> 15, 1 | rs); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  function dailySeed(){ var d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
  function bestKey(){ return mode === 'rush' ? 'macaron2048_best_rush' : mode === 'daily' ? 'macaron2048_best_d' + dailySeed() : 'macaron2048_best'; }
  function loadBest(){ best = 0; try { var v = localStorage.getItem(bestKey()); if (v) best = parseInt(v, 10) || 0; } catch (e) { /* ignore */ } bestEl.textContent = best; document.getElementById('bestLbl').textContent = mode === 'daily' ? '今日最佳' : mode === 'rush' ? '限時最佳' : '最佳 BEST'; }
  try { bookMax = parseInt(localStorage.getItem('macaron2048_book'), 10) || 0; } catch (e) { bookMax = 0; }
  function toast(msg){ var t = document.getElementById('mtoast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 1800); }
  function discover(v){ if (v > bookMax){ bookMax = v; try { localStorage.setItem('macaron2048_book', String(bookMax)); } catch (e) { /* ignore */ } if (v > 4) toast('📖 新口味解鎖：' + flavorName(v) + '！'); } }
  function milestone(v){ var rw = { 256:'hammer', 512:'shuffle', 1024:'undo' }[v]; if (rw && !earned[v]){ earned[v] = 1; charges[rw]++; toast('做出 ' + v + '！獲得 ' + TOOLN[rw] + ' +1'); updateTools(); } }
  var MIS_POOL = [
    [{ k:'make', v:64, t:'做出 64 號馬卡龍' }, { k:'multi', v:2, t:'一次滑動合併 2 對' }, { k:'fast', v:64, n:45, t:'45 步內做出 64' }],
    [{ k:'make', v:128, t:'做出 128 號馬卡龍' }, { k:'multi', v:3, t:'一次滑動合併 3 對' }, { k:'streak', v:5, t:'連續 5 次滑動都有合併' }],
    [{ k:'make', v:256, t:'做出 256 號馬卡龍' }, { k:'score', v:3000, t:'分數達到 3000' }, { k:'streak', v:8, t:'連續 8 次滑動都有合併' }]
  ];
  var MIS_RW = ['undo', 'hammer', 'shuffle'];
  function pickMissions(){ return MIS_POOL.map(function(arr, i){ var m = arr[Math.floor(R() * arr.length)]; return { k:m.k, v:m.v, n:m.n, t:m.t, done:false, rw:MIS_RW[i] }; }); }
  function mEvent(kind, val){
    var changed = false;
    mis.forEach(function(m){ if (m.done) return; var ok = false;
      if (m.k === 'make' && kind === 'make') ok = val >= m.v; else if (m.k === 'fast' && kind === 'make') ok = val >= m.v && moves <= m.n;

      if (ok){ m.done = true; charges[m.rw]++; changed = true; toast('任務完成！獲得 ' + TOOLN[m.rw] + ' +1'); } });
    if (changed){ renderMissions(); updateTools(); }
  }
  function renderMissions(){ var box = document.getElementById('missions'); box.innerHTML = ''; mis.forEach(function(m){ var d = document.createElement('div'); d.className = 'mrow' + (m.done ? ' done' : ''); d.innerHTML = '<span>' + (m.done ? '✓ ' : '◇ ') + m.t + '</span><span class="rw">' + TOOLN[m.rw] + '</span>'; box.appendChild(d); }); }
  function updateTools(){
    var map = { undo:'toolUndo', hammer:'toolHammer', shuffle:'toolShuffle' };
    Object.keys(map).forEach(function(k){ var b = document.getElementById(map[k]); b.querySelector('b').textContent = charges[k]; b.disabled = !running || charges[k] <= 0 || (k === 'undo' && !snap); });
    document.getElementById('toolHammer').classList.toggle('on', hammerMode);
  }
  function updateSub(){

    document.getElementById('modeTag').textContent = tag; var t = document.getElementById('timer');
    if (mode === 'rush'){ t.style.display = ''; t.textContent = Math.ceil(timeLeft) + 's'; t.classList.toggle('low', timeLeft <= 10); } else t.style.display = 'none';

  function comboFx(mc, st, mult, gain){

  }
  function snapshot(){ return { grid: JSON.stringify(grid), tiles: JSON.stringify(tiles), nextId: nextId, score: score, rs: rs, streak: streak, moves: moves, mis: JSON.stringify(mis), charges: JSON.stringify(charges), earned: JSON.stringify(earned) }; }
  function doUndo(){
    if (!running || !snap || charges.undo <= 0) return; var q = snap;
    grid = JSON.parse(q.grid); tiles = JSON.parse(q.tiles); nextId = q.nextId; score = q.score; rs = q.rs; streak = q.streak; moves = q.moves; mis = JSON.parse(q.mis); charges = JSON.parse(q.charges); earned = JSON.parse(q.earned);
    charges.undo--; snap = null; scoreEl.textContent = score; tileLayer.innerHTML = ''; tileElements = {}; render(); updateTools(); renderMissions(); sfx(250, 0.12, 'sine', 0.05); document.getElementById('combo').textContent = '';

  function setHammer(on){ hammerMode = on; trayFrame.classList.toggle('hammer', on); updateTools(); if (on) toast('點一顆馬卡龍把它敲掉'); }
  function doShuffle(){
    if (!running || charges.shuffle <= 0) return; var ids = Object.keys(tiles); if (!ids.length) return;
    var cells = []; for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) cells.push({ row: r, col: c });
    for (var i = cells.length - 1; i > 0; i--){ var j = Math.floor(R() * (i + 1)); var tmp = cells[i]; cells[i] = cells[j]; cells[j] = tmp; }

  }
  tileLayer.addEventListener('click', function(e){
    if (!hammerMode || !running) return; var el = e.target.closest('.tile'); if (!el) return; var id = el.dataset.id, t = tiles[id]; if (!t) return;
    sparkle(t.row, t.col, getMetrics().size, flavorFor(t.value).bg); grid[t.row][t.col] = null; delete tiles[id]; if (el.parentNode) el.parentNode.removeChild(el); delete tileElements[id];
    charges.hammer--; snap = null; setHammer(false); sfx(200, 0.15, 'square', 0.05);
  });
  function renderBook(){
    var box = document.getElementById('book'); box.innerHTML = '';
    [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096].forEach(function(v){ var f = flavorFor(v), d = document.createElement('div'), known = v <= bookMax; d.className = 'bk' + (known ? '' : ' no');
      d.innerHTML = '<i style="' + (known ? 'background:' + f.bg + ';color:' + f.fg : '') + '">' + (known ? v : '?') + '</i><span>' + (known ? flavorName(v) : '???') + '</span>'; box.appendChild(d); });
  }
  var tileElements = {};

  function withinBounds(cell){ return cell.row>=0 && cell.row<SIZE && cell.col>=0 && cell.col<SIZE; }

  function emptyGrid(){
    var g = [];

    return g;
  }

  function addRandomTile(){
    var empties = [];
    for (var r=0; r<SIZE; r++){
      for (var c=0; c<SIZE; c++){
        if (grid[r][c] === null) empties.push({row:r, col:c});
      }
    }
    if (empties.length === 0) return;
    var spot = empties[Math.floor(R()*empties.length)];
    var id = nextId++;
    var value = R() < 0.9 ? 2 : 4;
    tiles[id] = { id: id, row: spot.row, col: spot.col, value: value, pop:false, isNew:true };
    grid[spot.row][spot.col] = id;
  }

  function resetState(){
    grid = emptyGrid();
    tiles = {};
    tileElements = {};
    tileLayer.innerHTML = '';
    nextId = 1;
    score = 0;
    hasWon = false;
    keepPlayingAfterWin = false;
    scoreEl.textContent = '0';
    rs = (mode === 'daily') ? dailySeed() : ((Math.random() * 4294967296) | 0);
    streak = 0; moves = 0; snap = null; hammerMode = false; trayFrame.classList.remove('hammer'); earned = {}; maxTile = 0; timeLeft = 90;
    charges = { undo: 3, hammer: 1, shuffle: 1 };
    mis = (mode === 'rush') ? [] : pickMissions();
    document.getElementById('combo').textContent = '';
    addRandomTile();
    addRandomTile();
    updateTools(); renderMissions(); updateSub();
  }

  function buildTraversal(vector){
    var rowOrder = [0,1,2,3];
    var colOrder = [0,1,2,3];
    if (vector.row === 1) rowOrder = rowOrder.slice().reverse();
    if (vector.col === 1) colOrder = colOrder.slice().reverse();
    return { rowOrder: rowOrder, colOrder: colOrder };
  }

  function move(direction){
    if (!running) return;
    var vector = VECTORS[direction];
    if (hammerMode) setHammer(false);
    var pre = snapshot();
    var trav = buildTraversal(vector);
    var moved = false;
    var mergedIds = {};
    var mergedThisMove = [];
    var baseGain = 0;

    trav.rowOrder.forEach(function(row){
      trav.colOrder.forEach(function(col){
        var id = grid[row][col];
        if (id === null) return;
        var tile = tiles[id];

        var farthest = { row: row, col: col };
        var next;
        while (true){
          next = { row: farthest.row + vector.row, col: farthest.col + vector.col };
          if (!withinBounds(next) || grid[next.row][next.col] !== null) break;
          farthest = next;
        }

        var nextOcc = withinBounds(next) ? grid[next.row][next.col] : null;
        if (nextOcc !== null && !mergedIds[nextOcc]){
          var targetTile = tiles[nextOcc];
          if (targetTile.value === tile.value){
            grid[row][col] = null;
            targetTile.value *= 2;
            targetTile.pop = true;
            mergedIds[nextOcc] = true;
            baseGain += targetTile.value;
            mergedThisMove.push(targetTile.value);
            delete tiles[id];
            var el = tileElements[id];
            if (el && el.parentNode) el.parentNode.removeChild(el);
            delete tileElements[id];
            moved = true;
            return;
          }
        }

        if (farthest.row !== row || farthest.col !== col){
          grid[row][col] = null;
          grid[farthest.row][farthest.col] = id;
          tile.row = farthest.row;
          tile.col = farthest.col;
          moved = true;
        }
      });
    });

    if (!moved) return;
    snap = pre; moves++;
    var mc = mergedThisMove.length;
    if (mc){
      streak++; var mult = 1 + 0.1 * Math.min(streak - 1, 10);
      var gain = Math.round(baseGain * mult) + (mc > 1 ? 50 * (mc - 1) : 0);
      score += gain; comboFx(mc, streak, mult, gain);
      if (mode === 'rush') timeLeft = Math.min(120, timeLeft + mc);
    } else { streak = 0; document.getElementById('combo').textContent = ''; }
    mergedThisMove.forEach(function(v){ if (v > maxTile) maxTile = v; discover(v); milestone(v); mEvent('make', v); });
    if (mc) mEvent('multi', mc);
    mEvent('streak', streak);

    scoreEl.textContent = score;
    if (score > best){
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem(bestKey(), String(best)); } catch (e) { /* ignore */ }
    }

    addRandomTile();
    render();
    mEvent('score', score); updateTools(); updateSub();

    if (mergedThisMove.length){
      moveSfx();
      mergedThisMove.forEach(function(v){ mergeSfx(v); });
    } else {
      moveSfx();
    }

    if (!hasWon && mode !== 'rush' && mergedThisMove.indexOf(2048) !== -1){
      hasWon = true;
      winSfx();
      winScoreEl.textContent = '本局分數：' + score;
      winOverlay.classList.remove('hidden');
      running = false;
      return;
    }

    if (!canMove()){
      gameOver();
    }
  }

  function canMove(){
    for (var r=0; r<SIZE; r++){
      for (var c=0; c<SIZE; c++){
        if (grid[r][c] === null) return true;
      }
    }
    for (var r2=0; r2<SIZE; r2++){
      for (var c2=0; c2<SIZE; c2++){
        var id = grid[r2][c2];
        var v = tiles[id].value;
        if (c2 < SIZE-1 && grid[r2][c2+1] !== null && tiles[grid[r2][c2+1]].value === v) return true;
        if (r2 < SIZE-1 && grid[r2+1][c2] !== null && tiles[grid[r2+1][c2]].value === v) return true;
      }
    }
    return false;
  }

  function getMetrics(){
    var rect = trayFrame.getBoundingClientRect();
    var pad = 10, gap = 10;
    var innerWidth = rect.width - pad*2;
    var size = (innerWidth - gap*(SIZE-1)) / SIZE;
    return { size: size, gap: gap };
  }

  /* 用百分比排版：不依賴量測，大廳自動縮放（zoom）或視窗改變都不會錯位 */
  function positionEl(el, row, col){
    var cell = 'calc((100% - 30px) / 4)';
    el.style.width = cell;
    el.style.height = cell;
    el.style.transform = 'translate(calc(' + col + ' * (100% + 10px)), calc(' + row + ' * (100% + 10px)))';
    el.style.fontSize = 'max(13px, calc((100cqw - 30px) / 4 * ' + (String(el.textContent).length > 3 ? 0.22 : 0.29) + '))';
  }

  function sparkle(row, col, size, color){

      sp.style.left = 'calc(' + u + ' * ' + (col + 0.5) + ' + 10px * ' + col + ')'; sp.style.top = 'calc(' + u + ' * ' + (row + 0.5) + ' + 10px * ' + row + ')';
      sp.style.background = i % 2 ? '#FFF6D8' : color;
      sp.style.setProperty('--dx', 'calc((100cqw - 30px) / 4 * ' + (Math.cos(an) * d).toFixed(3) + ')'); sp.style.setProperty('--dy', 'calc((100cqw - 30px) / 4 * ' + (Math.sin(an) * d).toFixed(3) + ')');
      tileLayer.appendChild(sp); (function(n){ setTimeout(function(){ if (n.parentNode) n.parentNode.removeChild(n); }, 650); })(sp); }
  }

  function render(){
    var m = getMetrics();
    Object.keys(tiles).forEach(function(idStr){
      var id = idStr;
      var tile = tiles[id];
      var el = tileElements[id];
      var flavor = flavorFor(tile.value);
      if (!el){
        el = document.createElement('div');
        el.className = 'tile'; el.dataset.id = id;
        el.style.setProperty('--c', flavor.bg); el.dataset.v = tile.value; el.dataset.n = flavorName(tile.value);
        el.textContent = tile.value;
        positionEl(el, tile.row, tile.col);
        tileLayer.appendChild(el);
        tileElements[id] = el;

          requestAnimationFrame(function(){
            el.classList.add('appear');
            setTimeout(function(){ el.classList.remove('appear'); }, 200);
          });
          tile.isNew = false;
        }
      } else {
        positionEl(el, tile.row, tile.col);
        el.textContent = tile.value;
        el.style.setProperty('--c', flavor.bg); el.dataset.v = tile.value; el.dataset.n = flavorName(tile.value);

  }

  var audioCtx = null;
  function getAudioCtx(){
    try {

  var music = {
    enabled: true,
    timer: null,
    step: 0,
    tempo: 280,
    melody: [523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25, 440.00],
    bass:   [130.81, null,   164.81, null,   130.81, null,   110.00, null],

    savePref: function(){

    tone: function(freq, dur, type, vol){

        o.connect(g); g.connect(ac.destination);

  var touchStart = null;

  window.addEventListener('resize', repositionAll);

  startBtn.addEventListener('click', function(){ startGame('classic'); });
  document.getElementById('rushBtn').addEventListener('click', function(){ startGame('rush'); });
  document.getElementById('dailyBtn').addEventListener('click', function(){ startGame('daily'); });

  document.getElementById('menuBtn').addEventListener('click', function(){ overOverlay.classList.add('hidden'); startOverlay.classList.remove('hidden'); });
  document.getElementById('toolUndo').addEventListener('click', doUndo);
  document.getElementById('toolHammer').addEventListener('click', function(){ if (!running || charges.hammer <= 0) return; setHammer(!hammerMode); });
  document.getElementById('toolShuffle').addEventListener('click', doShuffle);
  document.getElementById('bookBtn').addEventListener('click', function(){ bookWasRunning = running; running = false; renderBook(); document.getElementById('bookOverlay').classList.remove('hidden'); });
  document.getElementById('bookClose').addEventListener('click', function(){ document.getElementById('bookOverlay').classList.add('hidden'); running = bookWasRunning; updateTools(); });
  continueBtn.addEventListener('click', continuePlaying);

  var musicBtn = document.getElementById('musicBtn');
  function refreshMusicBtn(){
    musicBtn.textContent = music.enabled ? '🔊' : '🔇';
    musicBtn.setAttribute('aria-pressed', String(music.enabled));
  }
  musicBtn.addEventListener('click', function(){
    music.toggle();
    refreshMusicBtn();
  });
  refreshMusicBtn();

  resetState();
  render();
})();
