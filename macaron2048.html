<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>馬卡龍 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --page: #FFF6EC;
    --box: #F6D3DE;
    --box-dark: #EAB6C6;
    --tray: #FFFDF9;
    --tray-cell: #F3E7DA;
    --ink: #5A3B42;
    --ink-soft: #9C7C82;
    --accent: #E8749A;
    --shadow: rgba(120,70,80,0.25);
  }
  :root:not([data-theme="light"]){
    --page: #FFF6EC;
  }
  :root[data-theme="dark"]{
    --page: #3A2C30;
    --box: #5A4048;
    --box-dark: #4A333A;
    --tray: #4A3A3E;
    --tray-cell: #5C494D;
    --ink: #FBEFE9;
    --ink-soft: #D8BFC5;
  }

  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--page);
    color: var(--ink);
    font-family: 'Nunito', system-ui, sans-serif;
    min-height: 100%;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 60px;
  }

  .marquee{
    text-align:center;
    margin-bottom: 18px;
  }
  .marquee h1{
    font-family:'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(24px, 6vw, 36px);
    color: var(--accent);
    margin: 0 0 8px;
  }
  .marquee p{
    margin:0;
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 420px;
  }

  .box{
    position:relative;
    background:
      radial-gradient(circle, rgba(255,255,255,0.55) 2.5px, transparent 2.6px) 0 0/18px 18px,
      linear-gradient(180deg, var(--box), var(--box-dark));
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 20px 45px var(--shadow);
    width: 100%;
    max-width: 420px;
  }

  .hud{
    display:flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 8px 14px;
  }
  .hud .stat{ text-align:left; }
  .hud .stat.right{ text-align:right; }
  .hud .label{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 11px;
    color: var(--ink);
    opacity: 0.7;
    display:block;
    margin-bottom: 2px;
  }
  .hud .value{
    font-family:'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--ink);
  }
  .music-btn{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--tray);
    border: none;
    color: var(--ink);
    font-size: 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    box-shadow: 0 2px 0 rgba(0,0,0,0.12);
  }
  .music-btn:active{ transform: translateY(1px); box-shadow:none; }
  .music-btn:focus-visible{
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .tray-frame{
    position:relative;
    border-radius: 16px;
    padding: 10px;
    background: var(--tray);
  }

  .grid-bg{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .cell{
    aspect-ratio: 1 / 1;
    background: var(--tray-cell);
    border-radius: 10px;
  }

  .tile-layer{
    position:absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
  }
  .tile{
    position:absolute;
    top:0; left:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius: 10px;
    font-family:'Fredoka', sans-serif;
    font-weight: 700;
    transition: transform 0.13s ease;
    will-change: transform;
    box-shadow: 0 2px 4px rgba(90,59,66,0.18);
  }
  .tile.appear{
    animation: tile-appear 0.18s ease;
  }
  .tile.pop{
    animation: tile-pop 0.16s ease;
  }
  @keyframes tile-appear{
    from{ transform: scale(0.3); opacity: 0; }
    to{ transform: scale(1); opacity: 1; }
  }
  @keyframes tile-pop{
    0%{ transform: scale(1); }
    50%{ transform: scale(1.15); }
    100%{ transform: scale(1); }
  }

  .overlay{
    position:absolute;
    inset: 10px;
    border-radius: 12px;
    background: rgba(90,59,66,0.85);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 20px;
    gap: 14px;
    z-index: 5;
  }
  .overlay.hidden{ display:none; }
  .overlay h2{
    font-family:'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(18px, 5vw, 26px);
    color: #FFF6EC;
    margin:0;
  }
  .overlay p{
    margin:0;
    color: #F3DCE2;
    font-size: 13px;
    line-height:1.6;
    max-width: 260px;
  }
  .btn{
    font-family:'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: #fff;
    background: var(--accent);
    border: none;
    padding: 12px 26px;
    border-radius: 24px;
    cursor:pointer;
    box-shadow: 0 4px 0 #C15776;
    transition: transform 0.08s ease;
  }
  .btn:active{
    transform: translateY(3px);
    box-shadow: 0 1px 0 #C15776;
  }
  .btn:focus-visible{
    outline: 3px solid #fff;
    outline-offset: 2px;
  }
  .btn.secondary{
    background: transparent;
    border: 2px solid rgba(255,255,255,0.6);
    box-shadow: none;
    color: #fff;
  }
  .overlay-buttons{
    display:flex;
    gap: 10px;
  }

  .hint{
    margin-top: 16px;
    font-size: 12px;
    color: var(--ink-soft);
    text-align:center;
    max-width: 420px;
  }
  .hint kbd{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 11px;
    background: var(--tray);
    border-radius: 4px;
    padding: 3px 8px;
    color: var(--ink);
  }

  @media (prefers-reduced-motion: reduce){
    .btn, .music-btn, .tile{ transition: none; animation: none; }
  }
</style>
</head>
<body>

  <div class="marquee">
    <h1>馬卡龍 2048</h1>
    <p>滑動甜點盤，把相同口味的馬卡龍疊在一起，疊出最厲害的一顆！</p>
  </div>

  <div class="box">
    <div class="hud">
      <div class="stat">
        <span class="label">分數 SCORE</span>
        <span class="value" id="score">0</span>
      </div>
      <button class="music-btn" id="musicBtn" aria-label="切換背景音樂" aria-pressed="true">🔊</button>
      <div class="stat right">
        <span class="label">最佳 BEST</span>
        <span class="value" id="best">0</span>
      </div>
    </div>

    <div class="tray-frame" id="trayFrame">
      <div class="grid-bg" id="gridBg"></div>
      <div class="tile-layer" id="tileLayer"></div>

      <div class="overlay" id="startOverlay">
        <h2>準備開動！</h2>
        <p>滑動螢幕或用方向鍵 / WASD 移動所有馬卡龍，相同口味碰在一起會合體升級</p>
        <button class="btn" id="startBtn">開始遊戲</button>
      </div>

      <div class="overlay hidden" id="overOverlay">
        <h2>盤子滿了！</h2>
        <p id="finalScore">本局分數：0</p>
        <button class="btn" id="restartBtn">再來一盤</button>
      </div>

      <div class="overlay hidden" id="winOverlay">
        <h2>疊出 2048 了！🎉</h2>
        <p id="winScore">本局分數：0</p>
        <div class="overlay-buttons">
          <button class="btn secondary" id="continueBtn">繼續挑戰</button>
          <button class="btn" id="winRestartBtn">重新開始</button>
        </div>
      </div>
    </div>
  </div>

  <p class="hint">桌機請按 <kbd>← ↑ → ↓</kbd> 或 <kbd>W A S D</kbd>　手機請直接在盤子上滑動</p>

<script>
(function(){
  "use strict";

  var SIZE = 4;
  var VECTORS = {
    up:    { row: -1, col: 0 },
    down:  { row: 1,  col: 0 },
    left:  { row: 0,  col: -1 },
    right: { row: 0,  col: 1 }
  };

  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var startOverlay = document.getElementById('startOverlay');
  var overOverlay = document.getElementById('overOverlay');
  var winOverlay = document.getElementById('winOverlay');
  var finalScoreEl = document.getElementById('finalScore');
  var winScoreEl = document.getElementById('winScore');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  var continueBtn = document.getElementById('continueBtn');
  var winRestartBtn = document.getElementById('winRestartBtn');
  var gridBg = document.getElementById('gridBg');
  var tileLayer = document.getElementById('tileLayer');
  var trayFrame = document.getElementById('trayFrame');

  var FLAVOR = {
    2:    { bg: '#FCE4EC', fg: '#8A5568' },
    4:    { bg: '#E0F5EC', fg: '#3F7A63' },
    8:    { bg: '#EDE3F5', fg: '#6A4E8C' },
    16:   { bg: '#FCE0C8', fg: '#9A5A28' },
    32:   { bg: '#F6A695', fg: '#ffffff' },
    64:   { bg: '#EF6F8E', fg: '#ffffff' },
    128:  { bg: '#8FCB9B', fg: '#ffffff' },
    256:  { bg: '#A78BC9', fg: '#ffffff' },
    512:  { bg: '#6FB3D2', fg: '#ffffff' },
    1024: { bg: '#E8B84B', fg: '#ffffff' },
    2048: { bg: '#8C3B4A', fg: '#FBEFE9' }
  };
  function flavorFor(v){
    return FLAVOR[v] || { bg: '#4A3229', fg: '#FBEFE9' };
  }

  var best = 0;
  try {
    var stored = localStorage.getItem('macaron2048_best');
    if (stored) best = parseInt(stored, 10) || 0;
  } catch (e) { /* storage unavailable */ }
  bestEl.textContent = best;

  for (var i=0; i<16; i++){
    var c = document.createElement('div');
    c.className = 'cell';
    gridBg.appendChild(c);
  }

  var grid, tiles, nextId, score, running, hasWon, keepPlayingAfterWin;
  var tileElements = {};

  function withinBounds(cell){ return cell.row>=0 && cell.row<SIZE && cell.col>=0 && cell.col<SIZE; }

  function emptyGrid(){
    var g = [];
    for (var r=0; r<SIZE; r++){ g.push([null,null,null,null]); }
    return g;
  }

  function addRandomTile(){
    var empties = [];
    for (var r=0; r<SIZE; r++){
      for (var c=0; c<SIZE; c++){
        if (grid[r][c] === null) empties.push({row:r, col:c});
      }
    }
    if (empties.length === 0) return;
    var spot = empties[Math.floor(Math.random()*empties.length)];
    var id = nextId++;
    var value = Math.random() < 0.9 ? 2 : 4;
    tiles[id] = { id: id, row: spot.row, col: spot.col, value: value, pop:false, isNew:true };
    grid[spot.row][spot.col] = id;
  }

  function resetState(){
    grid = emptyGrid();
    tiles = {};
    tileElements = {};
    tileLayer.innerHTML = '';
    nextId = 1;
    score = 0;
    hasWon = false;
    keepPlayingAfterWin = false;
    scoreEl.textContent = '0';
    addRandomTile();
    addRandomTile();
  }

  function buildTraversal(vector){
    var rowOrder = [0,1,2,3];
    var colOrder = [0,1,2,3];
    if (vector.row === 1) rowOrder = rowOrder.slice().reverse();
    if (vector.col === 1) colOrder = colOrder.slice().reverse();
    return { rowOrder: rowOrder, colOrder: colOrder };
  }

  function move(direction){
    if (!running) return;
    var vector = VECTORS[direction];
    var trav = buildTraversal(vector);
    var moved = false;
    var mergedIds = {};
    var mergedThisMove = [];

    trav.rowOrder.forEach(function(row){
      trav.colOrder.forEach(function(col){
        var id = grid[row][col];
        if (id === null) return;
        var tile = tiles[id];

        var farthest = { row: row, col: col };
        var next;
        while (true){
          next = { row: farthest.row + vector.row, col: farthest.col + vector.col };
          if (!withinBounds(next) || grid[next.row][next.col] !== null) break;
          farthest = next;
        }

        var nextOcc = withinBounds(next) ? grid[next.row][next.col] : null;
        if (nextOcc !== null && !mergedIds[nextOcc]){
          var targetTile = tiles[nextOcc];
          if (targetTile.value === tile.value){
            grid[row][col] = null;
            targetTile.value *= 2;
            targetTile.pop = true;
            mergedIds[nextOcc] = true;
            score += targetTile.value;
            mergedThisMove.push(targetTile.value);
            delete tiles[id];
            var el = tileElements[id];
            if (el && el.parentNode) el.parentNode.removeChild(el);
            delete tileElements[id];
            moved = true;
            return;
          }
        }

        if (farthest.row !== row || farthest.col !== col){
          grid[row][col] = null;
          grid[farthest.row][farthest.col] = id;
          tile.row = farthest.row;
          tile.col = farthest.col;
          moved = true;
        }
      });
    });

    if (!moved) return;

    scoreEl.textContent = score;
    if (score > best){
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('macaron2048_best', String(best)); } catch (e) { /* ignore */ }
    }

    addRandomTile();
    render();

    if (mergedThisMove.length){
      moveSfx();
      mergedThisMove.forEach(function(v){ mergeSfx(v); });
    } else {
      moveSfx();
    }

    if (!hasWon && mergedThisMove.indexOf(2048) !== -1){
      hasWon = true;
      winSfx();
      winScoreEl.textContent = '本局分數：' + score;
      winOverlay.classList.remove('hidden');
      running = false;
      return;
    }

    if (!canMove()){
      gameOver();
    }
  }

  function canMove(){
    for (var r=0; r<SIZE; r++){
      for (var c=0; c<SIZE; c++){
        if (grid[r][c] === null) return true;
      }
    }
    for (var r2=0; r2<SIZE; r2++){
      for (var c2=0; c2<SIZE; c2++){
        var id = grid[r2][c2];
        var v = tiles[id].value;
        if (c2 < SIZE-1 && grid[r2][c2+1] !== null && tiles[grid[r2][c2+1]].value === v) return true;
        if (r2 < SIZE-1 && grid[r2+1][c2] !== null && tiles[grid[r2+1][c2]].value === v) return true;
      }
    }
    return false;
  }

  function getMetrics(){
    var rect = trayFrame.getBoundingClientRect();
    var pad = 10, gap = 10;
    var innerWidth = rect.width - pad*2;
    var size = (innerWidth - gap*(SIZE-1)) / SIZE;
    return { size: size, gap: gap };
  }

  function positionEl(el, row, col, size){
    var x = col * (size + 10);
    var y = row * (size + 10);
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    el.style.fontSize = Math.max(14, size * 0.36) + 'px';
  }

  function render(){
    var m = getMetrics();
    Object.keys(tiles).forEach(function(idStr){
      var id = idStr;
      var tile = tiles[id];
      var el = tileElements[id];
      var flavor = flavorFor(tile.value);
      if (!el){
        el = document.createElement('div');
        el.className = 'tile';
        el.style.background = flavor.bg;
        el.style.color = flavor.fg;
        el.textContent = tile.value;
        positionEl(el, tile.row, tile.col, m.size);
        tileLayer.appendChild(el);
        tileElements[id] = el;
        if (tile.isNew){
          requestAnimationFrame(function(){
            el.classList.add('appear');
            setTimeout(function(){ el.classList.remove('appear'); }, 200);
          });
          tile.isNew = false;
        }
      } else {
        positionEl(el, tile.row, tile.col, m.size);
        el.textContent = tile.value;
        el.style.background = flavor.bg;
        el.style.color = flavor.fg;
        if (tile.pop){
          el.classList.remove('pop');
          void el.offsetWidth;
          el.classList.add('pop');
          setTimeout(function(){ el.classList.remove('pop'); }, 180);
          tile.pop = false;
        }
      }
    });
  }

  function repositionAll(){
    var m = getMetrics();
    Object.keys(tiles).forEach(function(id){
      var tile = tiles[id];
      var el = tileElements[id];
      if (el) positionEl(el, tile.row, tile.col, m.size);
    });
  }

  var audioCtx = null;
  function getAudioCtx(){
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { audioCtx = null; }
    return audioCtx;
  }
  function sfx(freq, dur, type, vol){
    var ac = getAudioCtx();
    if (!ac) return;
    try {
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.value = 0;
      o.connect(g); g.connect(ac.destination);
      var t = ac.currentTime;
      o.start(t);
      g.gain.linearRampToValueAtTime(vol || 0.06, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.stop(t + dur + 0.02);
    } catch (e) { /* ignore */ }
  }
  function moveSfx(){ sfx(300, 0.05, 'sine', 0.025); }
  function mergeSfx(value){
    var base = 440 + Math.min(10, Math.log2(value)) * 40;
    sfx(base, 0.14, 'triangle', 0.06);
  }
  function loseSfx(){ sfx(160, 0.35, 'sawtooth', 0.06); }
  function winSfx(){
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function(f, i){
      setTimeout(function(){ sfx(f, 0.22, 'triangle', 0.06); }, i*100);
    });
  }

  var music = {
    enabled: true,
    timer: null,
    step: 0,
    tempo: 280,
    melody: [523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25, 440.00],
    bass:   [130.81, null,   164.81, null,   130.81, null,   110.00, null],
    loadPref: function(){
      try {
        var v = localStorage.getItem('macaron2048_music');
        if (v !== null) this.enabled = (v === '1');
      } catch (e) { /* ignore */ }
    },
    savePref: function(){
      try { localStorage.setItem('macaron2048_music', this.enabled ? '1' : '0'); } catch (e) { /* ignore */ }
    },
    tone: function(freq, dur, type, vol){
      var ac = getAudioCtx();
      if (!ac || !freq) return;
      try {
        var o = ac.createOscillator();
        var g = ac.createGain();
        o.type = type;
        o.frequency.value = freq;
        g.gain.value = 0;
        o.connect(g); g.connect(ac.destination);
        var t = ac.currentTime;
        o.start(t);
        g.gain.linearRampToValueAtTime(vol, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.stop(t + dur + 0.03);
      } catch (e) { /* ignore */ }
    },
    playStep: function(){
      var m = this.melody[this.step % this.melody.length];
      var b = this.bass[this.step % this.bass.length];
      this.tone(m, 0.3, 'triangle', 0.04);
      if (b) this.tone(b, 0.5, 'sine', 0.045);
      this.step++;
    },
    start: function(){
      this.stop();
      if (!this.enabled) return;
      getAudioCtx();
      this.step = 0;
      this.playStep();
      var self = this;
      this.timer = setInterval(function(){ self.playStep(); }, this.tempo);
    },
    stop: function(){
      if (this.timer){ clearInterval(this.timer); this.timer = null; }
    },
    toggle: function(){
      this.enabled = !this.enabled;
      this.savePref();
      if (this.enabled && running) this.start();
      else this.stop();
      return this.enabled;
    }
  };
  music.loadPref();

  function gameOver(){
    running = false;
    music.stop();
    loseSfx();
    finalScoreEl.textContent = '本局分數：' + score;
    overOverlay.classList.remove('hidden');
  }

  function startGame(){
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    winOverlay.classList.add('hidden');
    resetState();
    render();
    running = true;
    music.start();
  }

  function continuePlaying(){
    winOverlay.classList.add('hidden');
    running = true;
    music.start();
  }

  document.addEventListener('keydown', function(e){
    var dir = null;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') dir = 'up';
    else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') dir = 'down';
    else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dir = 'left';
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dir = 'right';
    if (dir){
      e.preventDefault();
      move(dir);
    }
  });

  var touchStart = null;
  trayFrame.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  trayFrame.addEventListener('touchend', function(e){
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24){
      if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
      else move(dy > 0 ? 'down' : 'up');
    }
    touchStart = null;
  }, { passive: true });

  window.addEventListener('resize', repositionAll);

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
  winRestartBtn.addEventListener('click', startGame);
  continueBtn.addEventListener('click', continuePlaying);

  var musicBtn = document.getElementById('musicBtn');
  function refreshMusicBtn(){
    musicBtn.textContent = music.enabled ? '🔊' : '🔇';
    musicBtn.setAttribute('aria-pressed', String(music.enabled));
  }
  musicBtn.addEventListener('click', function(){
    music.toggle();
    refreshMusicBtn();
  });
  refreshMusicBtn();

  resetState();
  render();
})();
</script>
</body>
</html>
