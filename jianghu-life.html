var S=null,F=null,sg=0;
function newRun(){var m=getMeta();S={day:1,ap:3,coin:20,fame:0,body:3,wit:3+Math.min(3,m.runs||0),inner:0,hp:0,mp:0,sk:{},flags:{},tab:'village',tut:0,hungry:false,rain:false,fights:0,wins:0,labor:0,sits:0,hist:[]};S.hp=maxHP();S.mp=maxMP();}
function lv(id){return S.sk[id]?S.sk[id].lv:0;}
var MAXLV=10;
function eff(id){var l=lv(id);return l<=5?l:5+(l-5)*.5;}
function pw(l){return 1+.18*(Math.min(l,5)-1)+.1*Math.max(0,l-5);}
function maxHP(){return 50+S.body*5+Math.round(eff('tiebu')*12+eff('baijia')*8);}
function maxMP(){return 20+S.inner+Math.round(eff('yijin')*10);}
function dodge(){return eff('tiyun')*.06;}
function mpRegen(){return 3+(lv('yijin')?1+(lv('yijin')>=3?1:0):0);}
function getMeta(){try{return JSON.parse(store('jh_meta'))||{};}catch(e){return {};}}
function setMeta(m){store('jh_meta',JSON.stringify(m));}
function save(){if(S&&!S.over)store('jh_run',JSON.stringify(S));}
function toast(s,ms){var t=$('toast');t.textContent=s;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on');},ms||1800);}
function clampS(){S.hp=Math.max(0,Math.min(S.hp,maxHP()));S.mp=Math.max(0,Math.min(S.mp,maxMP()));}

/* ---------- 時間 ---------- */
function spend(){S.ap--;if(S.ap<=0){setTimeout(endDay,600);}}
function endDay(){
 if(!S||S.over||F)return;
 var msg=[];
 S.coin-=4;if(S.coin<0){S.coin=0;S.hungry=true;msg.push('囊中羞澀,餓著肚子睡下…');}else S.hungry=false;
 S.day++;S.hp=maxHP();S.mp=maxMP();
 var ap=3;if(S.hungry)ap--;S.rain=false;
 if(Math.random()<.32){var ev=nightEvent();if(ev){msg.push(ev.t);if(ev.ap)ap+=ev.ap;}}
 S.ap=Math.max(1,ap);
 sfx.gong();
 msg.unshift('第 '+S.day+' 天,氣血內力已恢復');
 toast(msg.join('\n'),2600);save();render();
}

  function(){var g=ri(15,25);S.coin+=g;return {t:'🍶 一位俠客路過,贈你 '+g+' 兩銀子'};},
  function(){S.fame++;return {t:'📣 村裡人都在誇你,名聲 +1'};},
  function(){if(S.inner>=6){S.wit++;return {t:'💭 夢中頓悟,悟性 +1'};}return {t:'🌙 一夜好眠'};},

 ];

}

function fight(en,cb,final){
 F={en:en,ehp:en.hp,mp:S.mp,stun:0,cb:cb,final:!!final,log:[],t:0,real:'剛',tell:'剛',over:false};
 nextIntent();drawFight();$('fight').classList.add('on');
}
function nextIntent(){var w=F.en.w,r=Math.random(),c=0,t='剛';['剛','柔','巧'].forEach(function(k){c+=w[k];if(r>=c-w[k]&&r<c)t=k;});F.real=t;
 if(Math.random()<F.en.acc)F.tell=t;else{var o=['剛','柔','巧'].filter(function(k){return k!==t;});F.tell=pick(o);}}
function rel(T,E){return BEATS[T]===E?1:BEATS[E]===T?-1:0;}
function moveDmg(id,r){var k=SK[id],l=k.basic?1:lv(id),p=k.p*pw(l)+S.body*.6;return p*(r>0?1.6:r<0?.6:1)*rnd(.9,1.1);}
function playerMove(id){
 if(!F||F.over)return;var k=SK[id];if(F.mp<k.mp)return;F.mp-=k.mp;
 var r=rel(k.t,F.real);if(k.fx==='pierce'&&r<0)r=0;
 var gOn=F.god>0,dmg=Math.round(moveDmg(id,r)*(gOn?1.3:1)),L=[];if(k.fx==='poison'){F.psn=3;F.psnD=Math.max(5,Math.round(k.p*pw(lv(id))*.45));L.push('☠️ 毒鏢命中,對手中毒!');}
 if(k.fx==='god'){F.god=3;F.cast=true;L.push('🙏 請神上身!金光護體');}
 F.ehp=Math.max(0,F.ehp-dmg);
 var txt='你使出「'+k.n+'」,造成 '+dmg+' 傷害';if(r>0)txt+=' <克制!>';else if(r<0)txt+=' (被化解)';L.push(txt);
 flo(dmg+(r>0?'!':''),'enemy',r>0?'#FFD84A':'#fff');fx('eface','hit');r>0?sfx.big():sfx.hit();vib(r>0?25:10);
 if(k.fx==='heal'){var h=Math.round(maxHP()*.08);S.hp=Math.min(maxHP(),S.hp+h);flo('+'+h,'me','#7BE8B0');L.push('回復 '+h+' 氣血');}
 if(F.ehp<=0){F.log=F.log.concat(L);end(true);return;}
 // 敵方出招
 if(k.fx==='stun'){L.push('對手被你絆住,無法出招!');}
 else{
  var er=-rel(k.t,F.real);   // 敵人視角:er>0 敵克我
  var ed=F.en.atk*1.3*rnd(.9,1.1)*(er>0?1.5:er<0?.5:1)-S.body*.3;ed=Math.max(1,Math.round(ed*(1-.05*eff('hushen'))*(k.fx==='sway'?.6:1)*(F.god>0?.5:1)));
  if(Math.random()<dodge()){L.push('🌀 你施展輕功閃過了攻擊!');flo('閃','me','#9BE8FF');}
  else{S.hp=Math.max(0,S.hp-ed);L.push(F.en.n+'的'+F.real+'招打來,你受到 '+ed+' 傷害'+(er>0?' <被剋制!>':er<0?' (被你化解)':''));flo('-'+ed,'me','#FF8A7A');fx('eface','atk');shake();er>0?sfx.big():sfx.blk();vib(15);}

 var lastKey='',noUp=false;
 function apply(v,vh){z=v;if(z===1){b.style.zoom='';b.style.minHeight='';}else{b.style.zoom=String(z);b.style.minHeight=(vh/z)+'px';}}
 function fit(force){
  var desk=mq.matches,bx=box();if(!bx)return;
  var vh=innerHeight,vw=innerWidth,h=(bx.b-bx.t)/z,w=(bx.r-bx.l)/z,key=Math.round(h/8)+','+Math.round(w/8),zmin=desk?.55:.78;
  var over=de.scrollHeight>vh+2&&z>zmin+.01&&!(noUp&&z===1);
  if(!force&&key===lastKey&&!over){place(bx);return;}
  if(key!==lastKey)noUp=false;lastKey=key;
  var nz;
  if(desk){nz=Math.min(noUp?1:1.6,(vh-28)/h,(vw-48)/w);}else{nz=Math.min(1,vh/h);}
  nz=Math.max(zmin,nz);if(Math.abs(nz-1)<(desk?.06:.015))nz=1;
  apply(nz,vh);
  for(var k=0;k<4;k++){var sh=de.scrollHeight;if(sh<=vh+2||z<=zmin)break;apply(Math.max(zmin,z*vh/sh*.995),vh);}
  if(z>1&&de.scrollHeight>vh+2){noUp=true;apply(1,vh);}
  place(box()||bx);
 }
 var tm=0;function soon(f){clearTimeout(tm);n=0;tm=setTimeout(function(){fit(f);},60);}
 addEventListener('resize',function(){soon(true);});addEventListener('orientationchange',function(){soon(true);});
 if(mq.addEventListener)mq.addEventListener('change',function(){soon(true);});
 addEventListener('load',function(){fit(true);setTimeout(fit,500);setTimeout(fit,1600);});
 setInterval(function(){if(!d.hidden&&n<40){n++;fit(false);}},1500);
 fit(true);
 var fs=d.getElementById('dv-fs');
 fs.addEventListener('click',function(){try{if(d.fullscreenElement){d.exitFullscreen();}else{de.requestFullscreen();}}catch(e){}});
 d.addEventListener('fullscreenchange',function(){fs.textContent=d.fullscreenElement?'✕ 離開全螢幕':'⛶ 全螢幕';soon(true);});
})();
</script>
