/* ===== 碰撞移動 ===== */
const HS=.34;
function solidCell(x,z){if(!inB(x,z))return true;if(grid[z][x])return true;const b=bombAt(x,z);return !!(b&&!b.pass);}
function moveAxis(axis,d){
 if(!d)return;const nx=P.x+(axis===0?d:0),nz=P.z+(axis===1?d:0);
 const x0=Math.floor(nx-HS+.5),x1=Math.floor(nx+HS+.5),z0=Math.floor(nz-HS+.5),z1=Math.floor(nz+HS+.5);
 let hit=false;for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++)if(solidCell(x,z))hit=true;
 if(!hit){P.x=nx;P.z=nz;return;}
 if(axis===0){P.x=d>0?x1-.5-HS-.001:x0+.5+HS+.001;}else{P.z=d>0?z1-.5-HS-.001:z0+.5+HS+.001;}
 /* 回推到不卡牆的位置 */
 P.x=Math.max(0,Math.min(W-1,P.x));P.z=Math.max(0,Math.min(H-1,P.z));
}
function updatePlayer(dt){
 const d=inputDir()||autoDir;const sp=3.3+run.spd*.55;P.moving=false;
 if(d){const st=sp*dt;P.moving=true;P.fx=d[0];P.fz=d[1];
  if(d[0]){const cz=Math.round(P.z),dz=cz-P.z;if(Math.abs(dz)>.001)moveAxis(1,Math.sign(dz)*Math.min(Math.abs(dz),st));moveAxis(0,d[0]*st);}
  else{const cx=Math.round(P.x),dx=cx-P.x;if(Math.abs(dx)>.001)moveAxis(0,Math.sign(dx)*Math.min(Math.abs(dx),st));moveAxis(1,d[1]*st);}}
 for(const b of bombs)if(b.pass){if(Math.abs(P.x-b.x)>=.5+HS-.02||Math.abs(P.z-b.z)>=.5+HS-.02)b.pass=false;}
 /* 道具 */
 for(let i=pickups.length-1;i>=0;i--){const p=pickups[i];if(Math.abs(P.x-p.x)<.6&&Math.abs(P.z-p.z)<.6){pickups.splice(i,1);sc.remove(p.mesh);sfx.pick();run.score+=50;
   if(p.k==='fire')run.range=Math.min(7,run.range+1);else if(p.k==='bomb')run.maxB=Math.min(6,run.maxB+1);else if(p.k==='speed')run.spd=Math.min(5,run.spd+1);else run.shield=1;
   banner(PUN[p.k],'#ffe27a');spark(p.x,.6,p.z,new THREE.Color(1,.9,.4),16,2);}}
 /* 火焰 / 敵人 */
 const cx=Math.round(P.x),cz=Math.round(P.z);if(flameAt(cx,cz))hurt();
 for(const e of enemies)if(Math.hypot(e.x-P.x,e.z-P.z)<.58)hurt();
 /* 出口 */
 if(exitShown&&!enemies.length&&!exitOpen){exitOpen=true;sfx.open();banner('傳送門開啟!','#9affc0');const u=exitG.userData;u.r.material.color.setHex(0x4aff8a);u.d.material.color.setHex(0x4aff8a);u.s.material.color.setHex(0x4aff8a);}
 if(exitOpen&&cx===exitC[0]&&cz===exitC[1]&&S==='play')winLevel();
 if(P.inv>0)P.inv-=dt;
}
/* ===== 敵人 ===== */
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function freeE(x,z){return inB(x,z)&&!grid[z][x]&&!bombAt(x,z);}
function bfsNext(sx,sz,tx,tz,lim){const q=[[sx,sz,null]],seen=new Set([sx+','+sz]);let h=0;while(h<q.length){const [x,z,f]=q[h++];if(x===tx&&z===tz)return f;if(q.length>lim*lim)break;for(const d of DIRS){const nx=x+d[0],nz=z+d[1],k=nx+','+nz;if(seen.has(k)||!freeE(nx,nz))continue;seen.add(k);q.push([nx,nz,f||d]);}}return null;}
function chooseDir(e){
 const opts=DIRS.filter(d=>freeE(e.cx+d[0],e.cz+d[1]));if(!opts.length){e.wait=.3;return;}
 let d=null;
 if(e.type==='bat'&&Math.random()<.7)d=bfsNext(e.cx,e.cz,Math.round(P.x),Math.round(P.z),9);
 if(!d){const fw=opts.find(o=>o[0]===e.dx&&o[1]===e.dz);const nb=opts.filter(o=>!(o[0]===-e.dx&&o[1]===-e.dz));d=fw&&Math.random()<.65?fw:(nb.length?pick(nb):pick(opts));}
 e.dx=d[0];e.dz=d[1];e.tx=e.cx+d[0];e.tz=e.cz+d[1];e.moving=true;e.p=0;
}
function updateEnemies(dt){
 for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];
  if(e.moving){e.p+=dt*e.sp;if(e.p>=1){e.cx=e.tx;e.cz=e.tz;e.moving=false;e.p=0;e.wait=0;}else if(bombAt(e.tx,e.tz)&&e.p<.3){/* 被炸彈擋住:退回 */e.tx=e.cx;e.tz=e.cz;e.moving=false;e.p=0;e.wait=.2;}}
  if(!e.moving){e.wait-=dt;if(e.wait<=0)chooseDir(e);}
  const p=e.moving?e.p:0;e.x=e.cx+(e.tx-e.cx)*p;e.z=e.cz+(e.tz-e.cz)*p;
  e.ph+=dt*(e.type==='bat'?14:7);const m=e.mesh,u=m.userData;m.position.set(e.x,e.type==='bat'?.15+Math.sin(e.ph*.5)*.12:0,e.z);
  if(e.type==='bat'){u.wl.rotation.z=Math.sin(e.ph)*.7;u.wr.rotation.z=-Math.sin(e.ph)*.7;}else{const q=1+Math.sin(e.ph)*.12;u.body.scale.set(.36/q,.3*q,.36/q);u.o.scale.copy(u.body.scale).multiplyScalar(1.1);}
  m.rotation.y+=((Math.atan2(e.dx,e.dz)-m.rotation.y+Math.PI*3)%(Math.PI*2)-Math.PI)*Math.min(1,dt*10);
  e.blob.position.set(e.x,.015,e.z);
  if(flameAt(Math.round(e.x),Math.round(e.z))){sc.remove(e.mesh);sc.remove(e.blob);enemies.splice(i,1);const sc2=e.type==='bat'?200:100;run.score+=sc2;sfx.kill();spark(e.x,.5,e.z,e.type==='bat'?new THREE.Color(.7,.4,1):new THREE.Color(.4,1,.5),22,2.4);floatTxt(e.x,.8,e.z,'+'+sc2);}
 }
}
/* ===== 流程 ===== */
function unlocked(){let u=0;for(let i=0;i<NL;i++)if(SV.stars[i])u=i+1;return Math.min(NL-1,u);}
function openMenu(){S='menu';$('over').classList.remove('on');$('pause').classList.remove('on');const el=$('lvs');el.innerHTML='';const u=unlocked();let tot=0;
 for(let i=0;i<NL;i++){const b=document.createElement('button');b.className='lv'+(i===lv?' cur':'');const s=SV.stars[i]||0;tot+=s;b.disabled=i>u;b.innerHTML='<b>'+(i+1)+'</b><i>'+(s?'★'.repeat(s):'')+'</i><em>'+THEMES[i].n+'</em>';b.onclick=()=>{lv=i;SV.cur=i;save();openMenu();};el.appendChild(b);}
 $('tot').textContent='累積星星 '+tot+' / '+NL*3+' ・ 最高分 '+SV.hi;$('start').textContent='開始:第 '+(Math.min(lv,u)+1)+' 關';$('menu').classList.add('on');lv=Math.min(lv,u);genLevel(lv);tLeft=TIME;uiHud();}
function startLevel(i,fresh){initAudio();lv=Math.max(0,Math.min(NL-1,i));SV.cur=lv;save();
 if(fresh!==false){run={lives:3,score:0,maxB:1,range:2,spd:0,shield:0,lostThisLevel:0};}else run.lostThisLevel=0;
 genLevel(lv);tLeft=TIME;S='ready';sT=1.4;banner('第 '+(lv+1)+' 關 ・ '+T.n,'#fff');
 $('menu').classList.remove('on');$('over').classList.remove('on');$('pause').classList.remove('on');uiHud();}
let pauseFrom=null;function togglePause(){if(S==='play'||S==='ready'){pauseFrom=S;S='pause';$('pause').classList.add('on');}else if(S==='pause'){S=pauseFrom||'play';$('pause').classList.remove('on');}}
$('start').onclick=()=>startLevel(Math.min(lv,unlocked()),true);$('restart').onclick=()=>startLevel(lv,true);$('toMenu').onclick=openMenu;$('pauseBtn').onclick=togglePause;$('resume').onclick=togglePause;
$('oR').onclick=()=>startLevel(lv,true);$('oN').onclick=()=>startLevel(lv+1,false);$('oM').onclick=openMenu;
$('sndBtn').onclick=()=>{SV.snd=SV.snd?0:1;save();initAudio();$('sndBtn').textContent=SV.snd?'🔊':'🔇';};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(S==='play'||S==='ready'))togglePause();});
let _h='';function uiHud(){
 const t=Math.max(0,Math.ceil(tLeft)),h=['♥'.repeat(Math.max(0,run.lives))+'<span style="opacity:.3">'+'♥'.repeat(Math.max(0,3-run.lives))+'</span>'];
 $('hHeart').innerHTML=h[0];$('hLv').textContent='第 '+(lv+1)+' 關 ・ '+run.score;$('hFoe').textContent='👾 '+enemies.length;$('hTime').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');$('hTime').style.color=tLeft<20?'#ff8a8a':'';
 const c='<span class="chip">💣 '+run.maxB+'</span><span class="chip">🔥 '+run.range+'</span><span class="chip">👟 '+run.spd+'</span>'+(run.shield?'<span class="chip">🛡️</span>':'');if(c!==_h){_h=c;$('stat').innerHTML=c;}}
/* ===== 全螢幕與版面 ===== */
const FSI_IN='<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',FSI_OUT='<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>';
function standalone(){return !!(navigator.standalone||(window.matchMedia&&(matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches)));}
function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.body.classList.contains('pfs'));}
function layout(){const Wd=innerWidth,Hd=innerHeight;let w,h;if(Wd/Hd<=9/16){w=Wd;h=Hd;}else{h=Hd;w=Hd*9/16;}wrap.style.width=w+'px';wrap.style.height=h+'px';wrap.style.maxHeight='none';wrap.style.fontSize=(w/360*14)+'px';const full=isFS();wrap.style.borderRadius=(full||Wd/Hd<=9/16)?'0':'18px';$('fsI').innerHTML=full?FSI_OUT:FSI_IN;$('fsBtn').style.display=standalone()?'none':'';}
let toastT=0;function toast(m){const e=$('toast');e.innerHTML=m;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{e.style.display='none';},6000);}
function pfsOn(){document.body.classList.add('pfs');size();if(/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))toast('iPhone 的 Safari 不支援網頁全螢幕。<br>點下方「分享」→「加入主畫面」,<br>之後從桌面圖示開啟就是全螢幕。');else toast('此瀏覽器不支援全螢幕,已盡量撐滿畫面。');}
function toggleFS(){const el=document.documentElement;
 if(isFS()){document.body.classList.remove('pfs');const x=document.exitFullscreen||document.webkitExitFullscreen;if(x&&(document.fullscreenElement||document.webkitFullscreenElement)){try{const r=x.call(document);if(r&&r.catch)r.catch(()=>{});}catch(e){}}size();return;}
 const rq=el.requestFullscreen||el.webkitRequestFullscreen;
 if(rq){try{const r=rq.call(el);if(r&&r.then)r.then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(()=>{});}catch(e){}}).catch(()=>pfsOn());}catch(e){pfsOn();}}
 else pfsOn();}
$('fsBtn').onclick=toggleFS;
const ctr=new THREE.Vector3((W-1)/2,0,(H-1)/2+.8);
function fitCam(){const asp=cam.aspect,fov=cam.fov*Math.PI/180,tn=Math.tan(fov/2);let d=(W+2.6)/(2*tn*asp);d=Math.max(d,(H*.9+3.5)/(2*tn));const tilt=72*Math.PI/180;cam.position.set(ctr.x,d*Math.sin(tilt),ctr.z+d*Math.cos(tilt));cam.lookAt(ctr);}
function size(){layout();const r=wrap.getBoundingClientRect();rd.setPixelRatio(Math.min(2,devicePixelRatio||1));rd.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix();fitCam();}
addEventListener('resize',size);['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,size));
/* ===== 更新 ===== */
let hudT=0;
function update(dt){
 if(S==='ready'){sT-=dt;if(sT<=0)S='play';}
 const play=S==='play';
 if(play){tLeft-=dt;if(tLeft<=0){tLeft=60;P.inv=0;hurt();if(S==='play')banner('時間到!扣一條命','#ff9a9a');}
  updatePlayer(dt);updateEnemies(dt);
  for(let i=bombs.length-1;i>=0;i--){const b=bombs[i];b.t-=dt;if(b.t<=0)explode(b);}
  if(!enemies.length&&!exitShown){hintT-=dt;if(hintT<=0){hintT=7;banner('怪物清光了!炸開箱子找出口','#ffe27a');}}
 }
 /* 火焰 */
 for(const f of flames){const u=f.userData;if(!u.on)continue;u.t-=dt;if(u.t<=0){u.on=false;f.visible=false;continue;}const k=u.t/.55;u.b.scale.set(1,.4+k*1.2,1);u.b.material.opacity=Math.min(1,k*1.6);u.s.material.opacity=Math.min(1,k*1.4);u.s.scale.setScalar(1.4+k*1.4);}
 /* 炸彈外觀 */
 for(const b of bombs){const u=b.mesh.userData,k=Math.max(0,b.t),f=k<1?18:8,pu=1+Math.sin((2.3-k)*f)*.08*(k<1?2:1);b.mesh.scale.setScalar(pu);const bl=Math.sin((2.3-k)*(k<1?22:9))>.2;u.mat.emissive.setHex(bl&&k<1.2?0xaa2010:0);u.sp.scale.setScalar(.4+Math.random()*.25);}
 /* 道具外觀 */
 for(const p of pickups){p.ph+=dt*3;p.s.position.y=.6+Math.sin(p.ph)*.1;}
 if(exitG.visible){const u=exitG.userData;u.r.rotation.y+=dt*2;u.s.material.opacity=.6+Math.sin(performance.now()/200)*.3;u.d.scale.setScalar(.9+Math.sin(performance.now()/260)*.1);}
 /* 貓 */
 {const u=catG.userData;P.walk+=dt*(P.moving?14:0);u.body.position.y=P.moving?Math.abs(Math.sin(P.walk))*.1:Math.sin(performance.now()/400)*.012;u.tail.rotation.z=Math.sin(performance.now()/(P.moving?90:280))*.4;u.head.rotation.z=P.moving?Math.sin(P.walk)*.08:0;
  catG.position.set(P.x,0,P.z);catBlob.position.set(P.x,.015,P.z);
  const ta=Math.atan2(P.fx,P.fz);catG.rotation.y+=((ta-catG.rotation.y+Math.PI*3)%(Math.PI*2)-Math.PI)*Math.min(1,dt*14);
  catG.visible=!(P.inv>0&&Math.floor(P.inv*10)%2===0&&S==='play');if(S==='menu'||S==='end')catG.visible=true;}
 /* 粒子 */
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue;}p.vy-=6*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.y<.05){p.y=.05;p.vy*=-.3;}}
 for(let i=0;i<PMAX;i++){const p=parts[i];if(p){pPos[i*3]=p.x;pPos[i*3+1]=p.y;pPos[i*3+2]=p.z;const q=Math.min(1,p.l*2.4);pCol[i*3]=p.c.r*q;pCol[i*3+1]=p.c.g*q;pCol[i*3+2]=p.c.b*q;}else{pPos[i*3+1]=-50;pCol[i*3]=pCol[i*3+1]=pCol[i*3+2]=0;}}
 pG.attributes.position.needsUpdate=true;pG.attributes.color.needsUpdate=true;
 for(let i=debris.length-1;i>=0;i--){const p=debris[i];p.l-=dt;if(p.l<=0){debris.splice(i,1);continue;}p.vy-=12*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.y<.05){p.y=.05;p.vy*=-.3;p.vx*=.6;p.vz*=.6;}}
 for(let i=0;i<DMAX;i++){const p=debris[i];if(p){dPos[i*3]=p.x;dPos[i*3+1]=p.y;dPos[i*3+2]=p.z;dCol[i*3]=p.c.r;dCol[i*3+1]=p.c.g;dCol[i*3+2]=p.c.b;}else{dPos[i*3+1]=-50;}}
 dG.attributes.position.needsUpdate=true;dG.attributes.color.needsUpdate=true;
 /* 相機震動 */
 if(shake>0){shake=Math.max(0,shake-dt*2.2);}
 fitCam();if(shake>0){cam.position.x+=(Math.random()-.5)*shake*.35;cam.position.y+=(Math.random()-.5)*shake*.25;}
 hudT-=dt;if(hudT<=0){hudT=.15;uiHud();}
}

let last=performance.now();
function loop(ms){const dt=Math.max(0,Math.min(.05,(ms-last)/1000));last=ms;if(S!=='pause'&&dt>0)update(dt*TS);rd.render(sc,cam);requestAnimationFrame(loop);}
size();openMenu();try{rd.compile(sc,cam);}catch(e){}requestAnimationFrame(loop);
window.__BB={state:()=>S,info:()=>({S,lv,tLeft,lives:run.lives,score:run.score,foes:enemies.length,bombs:bombs.length,px:+P.x.toFixed(2),pz:+P.z.toFixed(2),exit:exitC,shown:exitShown,open:exitOpen,range:run.range,maxB:run.maxB,crates:grid.flat().filter(v=>v===2).length}),start:startLevel,ts:v=>{TS=v;},dir:v=>{autoDir=v;},bomb:placeBomb,kill:()=>{for(const e of enemies){sc.remove(e.mesh);sc.remove(e.blob);}enemies.length=0;},reveal:()=>{destroyCrate(exitC[0],exitC[1]);},tp:(x,z)=>{P.x=x;P.z=z;},grid:()=>grid,hurt:()=>{P.inv=0;hurt();},SV};
})();}catch(e){console.warn(e);$('nogl').style.display='flex';}
