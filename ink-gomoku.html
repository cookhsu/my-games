<body>
  <div class="marquee">
    <h1>水墨<span>五子棋</span></h1>
    <p>你執墨黑先行，電腦執朱紅。橫、直、斜任一方向先連成五子者勝。</p>
  </div>

  <div class="board">
    <div class="hud">
      <div class="stat"><span class="label">現在輪到</span><span class="value" id="turn"><i class="dot ink"></i>你</span></div>
      <button class="icon-btn" id="musicBtn" aria-label="切換背景音樂" aria-pressed="true">🔊</button>
      <div class="stat right"><span class="label">手數</span><span class="value" id="moves">0</span></div>
    </div>

    <div class="frame">
      <canvas id="cv" aria-label="五子棋棋盤，點擊交叉點落子"></canvas>

      <div class="overlay" id="startOverlay">
        <h2>落子無悔</h2>
        <p>點棋盤上的交叉點落子。選好電腦的強度，就可以開始對弈。</p>
        <button class="btn" id="startBtn">開始對弈</button>
      </div>

      <div class="overlay hidden" id="endOverlay">
        <h2 id="endTitle"></h2>
        <p id="endText"></p>
        <button class="btn" id="againBtn">再下一局</button>
      </div>
    </div>

    <div class="controls">
      <div class="seg" role="group" aria-label="電腦強度">
        <button type="button" data-lv="easy" aria-pressed="false">簡單</button>
        <button type="button" data-lv="normal" aria-pressed="true">普通</button>
        <button type="button" data-lv="hard" aria-pressed="false">困難</button>
      </div>
      <div class="actions">
        <button class="btn ghost" id="undoBtn" type="button">悔棋</button>
        <button class="btn" id="newBtn" type="button">新局</button>
      </div>
    </div>
    <div class="record" id="record"></div>
  </div>

  <p class="hint">電腦版滑鼠移到交叉點會出現預覽。悔棋會同時收回你和電腦的上一手。</p>

<script>
(function(){
  "use strict";
  var N = 13, SIZE = 390, PAD = 24, GAP = (SIZE - PAD * 2) / (N - 1);
  var DIRS = [[0,1],[1,0],[1,1],[1,-1]];
  var W = [0, 1, 10, 100, 1000, 100000];

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  cv.width = SIZE * dpr; cv.height = SIZE * dpr;
  ctx.scale(dpr, dpr);

  var turnEl = document.getElementById('turn');
  var movesEl = document.getElementById('moves');
  var recordEl = document.getElementById('record');
  var startOverlay = document.getElementById('startOverlay');
  var endOverlay = document.getElementById('endOverlay');
  var endTitle = document.getElementById('endTitle');
  var endText = document.getElementById('endText');
  var musicBtn = document.getElementById('musicBtn');

  var board, moves, over, active, thinking, level = 'normal', winLine, hover, aiTimer;
  var stats = { win: 0, lose: 0, draw: 0 };
  try { var sv = JSON.parse(localStorage.getItem('inkgomoku_stats') || 'null'); if (sv) stats = sv; } catch (e) { /* ignore */ }
  var musicOn = true;
  try { var mv = localStorage.getItem('inkgomoku_music'); if (mv !== null) musicOn = (mv === '1'); } catch (e) { /* ignore */ }

  var ac = null;
  function getAc(){
    try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; }
    return ac;
  }
  function tone(f, d, type, v, delay){
    var a = getAc(); if (!a) return;
    try {
      var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.03);
    } catch (e) { /* ignore */ }
  }
  var music = {
    timer: null, step: 0,
    seq: [293.66, 0, 392.00, 0, 440.00, 392.00, 0, 329.63, 0, 293.66, 0, 0, 392.00, 0, 493.88, 0],
    start: function(){ this.stop(); if (!musicOn) return; this.step = 0; var s = this; this.timer = setInterval(function(){ s.play(); }, 520); },
    play: function(){ var f = this.seq[this.step % this.seq.length]; if (f) tone(f, 1.1, 'triangle', 0.05); if (this.step % 8 === 0) tone(146.83, 2, 'sine', 0.035); this.step++; },
    stop: function(){ if (this.timer){ clearInterval(this.timer); this.timer = null; } }

  function inb(r, c){ return r >= 0 && r < N && c >= 0 && c < N; }

  function fiveLine(r, c, p){
    for (var d = 0; d < 4; d++){
      var dr = DIRS[d][0], dc = DIRS[d][1], line = [[r, c]], k;
      for (k = 1; inb(r + dr * k, c + dc * k) && board[r + dr * k][c + dc * k] === p; k++) line.push([r + dr * k, c + dc * k]);
      for (k = 1; inb(r - dr * k, c - dc * k) && board[r - dr * k][c - dc * k] === p; k++) line.push([r - dr * k, c - dc * k]);
      if (line.length >= 5) return line;
    }
    return null;
  }

  function evalCell(r, c, p){
    var total = 0, opp = 3 - p;
    for (var d = 0; d < 4; d++){
      var dr = DIRS[d][0], dc = DIRS[d][1], cellsArr = [];

        var rr = r + dr * k, cc = c + dc * k;
        cellsArr.push(k === 0 ? p : (inb(rr, cc) ? board[rr][cc] : opp));

        var own = 0, bad = 0;
        for (var i = s; i < s + 5; i++){ if (cellsArr[i] === p) own++; else if (cellsArr[i] === opp) bad++; }

  }

  function candidates(){
    var list = [], seen = {}, any = false;
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++){
      if (!board[r][c]) continue;
      any = true;
      for (var dr = -2; dr <= 2; dr++) for (var dc = -2; dc <= 2; dc++){
        var rr = r + dr, cc = c + dc;
        if (inb(rr, cc) && !board[rr][cc] && !seen[rr * N + cc]){ seen[rr * N + cc] = 1; list.push([rr, cc]); }
      }
    }
    if (!any) list.push([6, 6]);
    return list;
  }

  function aiMove(){
    var cands = candidates(), i, best = null;
    for (i = 0; i < cands.length; i++) if (evalCell(cands[i][0], cands[i][1], 2) >= 100000) return cands[i];
    for (i = 0; i < cands.length; i++) if (evalCell(cands[i][0], cands[i][1], 1) >= 100000) return cands[i];
    var def = level === 'easy' ? 0.55 : level === 'normal' ? 1 : 1.05;
    var scored = cands.map(function(m){
      var s = evalCell(m[0], m[1], 2) + def * evalCell(m[0], m[1], 1);
      if (level === 'easy') s *= 0.5 + Math.random();
      return { m: m, s: s };
    });
    scored.sort(function(a, b){ return b.s - a.s; });
    if (level === 'hard'){
      var top = scored.slice(0, 6), bestV = -Infinity;
      top.forEach(function(t){
        board[t.m[0]][t.m[1]] = 2;
        var oppBest = 0;
        candidates().forEach(function(o){ var v = evalCell(o[0], o[1], 1); if (v > oppBest) oppBest = v; });
        board[t.m[0]][t.m[1]] = 0;
        var v = t.s - 0.8 * oppBest;
        if (v > bestV){ bestV = v; best = t.m; }
      });
      return best;
    }
    return scored[0].m;
  }

  function setTurn(p){
    turnEl.innerHTML = p === 1 ? '<i class="dot ink"></i>你' : '<i class="dot red"></i>電腦思考中';
  }
  function updateRecord(){
    recordEl.textContent = '戰績　勝 ' + stats.win + '　負 ' + stats.lose + '　和 ' + stats.draw;
  }
  function saveStats(){ try { localStorage.setItem('inkgomoku_stats', JSON.stringify(stats)); } catch (e) { /* ignore */ } }

  function finish(kind, line){
    over = true; thinking = false; turnEl.innerHTML = kind === 'win' ? '<i class="dot ink"></i>你勝了' : kind === 'lose' ? '<i class="dot" style="background:#C8372D"></i>電腦勝' : '和局'; winLine = line || null; music.stop(); draw(); kick();
    var title, text;
    if (kind === 'win'){ stats.win++; title = '你贏了'; text = '連成五子，漂亮。可以把強度調高再挑戰一次。'; [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){ tone(f, 0.25, 'triangle', 0.07, i * 0.1); }); }
    else if (kind === 'lose'){ stats.lose++; title = '電腦贏了'; text = '朱紅連成五子。試試悔棋，或降低強度再來。'; tone(120, 0.5, 'sawtooth', 0.07); }
    else { stats.draw++; title = '和局'; text = '棋盤已經下滿，雙方不分勝負。'; }
    saveStats(); updateRecord();
    setTimeout(function(){ endTitle.textContent = title; endText.textContent = text; endOverlay.classList.remove('hidden'); }, 700);
  }

  function place(r, c, p){
    board[r][c] = p; moves.push({ r: r, c: c, p: p });
    movesEl.textContent = moves.length; clack(p); dropT = performance.now();
    var line = fiveLine(r, c, p);
    draw(); kick();
    if (line){ finish(p === 1 ? 'win' : 'lose', line); return true; }
    if (moves.length === N * N){ finish('draw'); return true; }
    return false;
  }

  function playerMove(r, c){
    if (!active || over || thinking || board[r][c]) return;
    if (place(r, c, 1)) return;
    thinking = true; setTurn(2);
    aiTimer = setTimeout(function(){
      var m = aiMove();
      thinking = false;
      if (!m || over) return;
      if (!place(m[0], m[1], 2)){ setTurn(1); }
    }, 380);
  }

  function pos(e){
    var rect = cv.getBoundingClientRect(), s = SIZE / rect.width;
    var x = (e.clientX - rect.left) * s, y = (e.clientY - rect.top) * s;
    var c = Math.round((x - PAD) / GAP), r = Math.round((y - PAD) / GAP);
    return inb(r, c) ? [r, c] : null;
  }

  var bgCache = null, dropT = 0, dropAt = null, raf = 0;
  function buildBg(){
    var c = document.createElement('canvas'); c.width = SIZE * dpr; c.height = SIZE * dpr; var g = c.getContext('2d'); g.scale(dpr, dpr);
    g.fillStyle = '#241A14'; g.fillRect(0, 0, SIZE, SIZE);
    var pg = g.createLinearGradient(0, 0, SIZE, SIZE); pg.addColorStop(0, '#F0E4C6'); pg.addColorStop(.5, '#E8DABA'); pg.addColorStop(1, '#DCCBA3');
    g.fillStyle = pg; g.beginPath(); g.roundRect ? g.roundRect(5, 5, SIZE - 10, SIZE - 10, 6) : g.rect(5, 5, SIZE - 10, SIZE - 10); g.fill();

    // ink wash mist
