<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script>
(function(){
  try{
    var a=document.createElement('audio');
    a.setAttribute('loop','');
    a.setAttribute('playsinline','');
    a.volume=0;
    a.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(a);});
    var unlocked=false;
    function unlock(){
      if(unlocked) return; unlocked=true;
      a.play().catch(function(){});
      if(window.__GD_AC && window.__GD_AC.state==='suspended'){ window.__GD_AC.resume().catch(function(){}); }
    }
    ['touchstart','mousedown','keydown'].forEach(function(ev){ window.addEventListener(ev, unlock, {once:false, passive:true}); });
  }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>引力迷航</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060912; --bg2:#0c1222; --ink:#EAF2FF; --muted:#8FA3C8;
    --cyan:#4CC9F0; --pink:#F15BB5; --gold:#FFD23F; --red:#FF4D6D; --purple:#9B5DE5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:#000; height:100%; overflow:hidden; overscroll-behavior:none;}
  body{
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Sans TC','Fredoka',sans-serif; color:var(--ink);
    min-height:100vh; min-height:100dvh;
    background:radial-gradient(ellipse at 50% 0%, #11193a 0%, #060912 60%);
  }
  .wrap{ position:relative; width:360px; height:640px; max-width:100vw; max-height:100vh;
    aspect-ratio:360/640; background:var(--bg); border-radius:0; overflow:hidden;
    box-shadow:0 0 60px rgba(76,201,240,.08); }
  @media (max-width:360px), (max-height:640px){
    .wrap{ width:100vw; height:100vh; height:100dvh; }
  }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  .hud{ position:absolute; top:0; left:0; right:0; padding:10px 14px 0;
    display:flex; align-items:center; justify-content:space-between; pointer-events:none;
    font-family:'Fredoka',sans-serif; }
  .hud .pill{ background:rgba(10,14,30,.55); border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(4px); padding:5px 11px; border-radius:999px; font-size:13px; letter-spacing:.3px; }
  .hud .pill b{ color:var(--gold); font-weight:700; }
  .hud .shots{ display:flex; gap:4px; }
  .hud .shots i{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.18); display:inline-block; }
  .hud .shots i.on{ background:var(--cyan); box-shadow:0 0 6px var(--cyan); }

  .menuBtn{ position:absolute; top:10px; right:14px; width:34px; height:34px; border-radius:50%;
    background:rgba(10,14,30,.55); border:1px solid rgba(255,255,255,.1); color:var(--ink);
    font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:5; }

  .ov{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px; background:rgba(5,8,18,.72); backdrop-filter:blur(6px); z-index:10; gap:14px; }
  .ov.hidden{ display:none; }
  .ov h1{ font-family:'Fredoka',sans-serif; font-size:30px; margin:0; letter-spacing:1px;
    background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .ov h2{ font-family:'Fredoka',sans-serif; font-size:22px; margin:0; color:var(--ink); }
  .ov p.sub{ margin:0; color:var(--muted); font-size:13.5px; line-height:1.7; max-width:280px; }
  .ov .stat{ font-size:14px; color:var(--muted); }
  .ov .stat b{ color:var(--gold); font-size:18px; }
  .btn{ font-family:'Fredoka',sans-serif; font-size:16px; font-weight:600; color:#061018;
    background:linear-gradient(135deg,var(--cyan),#7fe0ff); border:none; padding:13px 34px; border-radius:999px;
    cursor:pointer; box-shadow:0 6px 18px rgba(76,201,240,.35); letter-spacing:.5px; }
  .btn.alt{ background:rgba(255,255,255,.08); color:var(--ink); box-shadow:none; border:1px solid rgba(255,255,255,.18); }
  .btn:active{ transform:scale(.96); }
  .btnrow{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <canvas id="c" width="360" height="640"></canvas>

  <div class="hud" id="hud">
    <div class="pill">第 <b id="lvTxt">1</b> 關</div>
    <div class="shots" id="shotsWrap"></div>
    <div class="pill">分數 <b id="scTxt">0</b></div>
  </div>
  <div class="menuBtn" id="menuBtn">☰</div>

  <div class="ov" id="ovMenu">
    <h1>引力迷航</h1>
    <p class="sub">拖曳發射探測器，讓它借助行星重力彎出弧線，閃開黑洞、收集星塵，飛進傳送門過關。<br>每關只有 3 次發射機會！</p>
    <div class="stat">最高紀錄 <b id="bestTxt">0</b></div>
    <button class="btn" id="btnStart">開始遊戲</button>
  </div>

  <div class="ov hidden" id="ovClear">
    <h2>🌀 第 <span id="clearLv"></span> 關 · 成功抵達！</h2>
    <p class="sub" id="clearInfo"></p>
    <div class="btnrow">
      <button class="btn" id="btnNext">下一關 →</button>
    </div>
  </div>

  <div class="ov hidden" id="ovLose">
    <h2>💥 探測器失聯了</h2>
    <p class="sub">發射次數用完了，再試一次這一關吧。</p>
    <div class="btnrow">
      <button class="btn" id="btnRetry">重新挑戰</button>
      <button class="btn alt" id="btnMenu1">返回選單</button>
    </div>
  </div>

  <div class="ov hidden" id="ovPause">
    <h2>已暫停</h2>
    <div class="btnrow">
      <button class="btn" id="btnResume">繼續遊戲</button>
      <button class="btn alt" id="btnMenu2">返回選單</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=360,H=640;
var $=function(id){return document.getElementById(id);};

// ---------- audio ----------
var AC=null;
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); window.__GD_AC=AC; }catch(e){} }
  return AC;
}
var soundOn=true;
function beep(freq,dur,type,vol,sweepTo){
  if(!soundOn) return;
  var c=ac(); if(!c) return;
  try{
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,c.currentTime);
    if(sweepTo) o.frequency.linearRampToValueAtTime(sweepTo, c.currentTime+dur);
    g.gain.setValueAtTime((vol||0.18), c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
  }catch(e){}
}
function sfxLaunch(){ beep(520,0.28,'sawtooth',0.12,160); }
function sfxStar(){ beep(880,0.12,'sine',0.16,1320); }
function sfxCrash(){ beep(140,0.4,'square',0.18,40); }
function sfxWin(){ beep(660,0.14,'sine',0.18,880); setTimeout(function(){beep(990,0.22,'sine',0.18,1320);},120); }
function sfxLose(){ beep(220,0.5,'triangle',0.16,60); }

// ---------- rng ----------
function mulberry32(seed){
  return function(){
    seed|=0; seed=(seed+0x6D2B79F5)|0;
    var t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function dist(x1,y1,x2,y2){ var dx=x2-x1,dy=y2-y1; return Math.sqrt(dx*dx+dy*dy); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

// ---------- starfield bg ----------
var bgStars=[];
(function(){
  var r=mulberry32(7);
  for(var i=0;i<90;i++){
    bgStars.push({x:r()*W,y:r()*H,r:r()*1.4+0.3,a:r()*0.6+0.2,tw:r()*2+1});
  }
})();

// ---------- game state ----------
var PAD={x:W/2,y:H-64};
var BALL_R=7, PORTAL_R=24;
var MAX_PULL=118, LAUNCH_K=0.1, MAX_SPEED=11;
var G_STR=2600;

var S={
  level:1, score:0, best:0, shots:3, phase:'menu',
  planets:[], stars:[], portal:null,
  ball:{x:PAD.x,y:PAD.y,vx:0,vy:0,flying:false},
  trail:[], particles:[],
  dragging:false, dragX:PAD.x, dragY:PAD.y,
  preview:[]
};
try{ S.best=parseInt(localStorage.getItem('gd_best')||'0',10)||0; }catch(e){}

function genLevel(n){
  var rng=mulberry32(1000+n*977);
  var planetCount=clamp(2+Math.floor(n/2),2,6);
  var planets=[];
  var tries=0;
  while(planets.length<planetCount && tries<300){
    tries++;
    var pr=18+rng()*16;
    var px=pr+20+rng()*(W-2*pr-40);
    var py=90+rng()*(H-280);
    var ok=dist(px,py,PAD.x,PAD.y)>120;
    for(var i=0;i<planets.length;i++){
      if(dist(px,py,planets[i].x,planets[i].y) < pr+planets[i].r+46){ ok=false; break; }
    }
    if(ok) planets.push({x:px,y:py,r:pr,mass:pr*7,hue:140+rng()*180});
  }
  // portal: place away from pad, avoid planets
  var portal=null; tries=0;
  while(!portal && tries<300){
    tries++;
    var qx=PORTAL_R+16+rng()*(W-2*PORTAL_R-32);
    var qy=60+rng()*110;
    var ok=true;
    for(var i=0;i<planets.length;i++){
      if(dist(qx,qy,planets[i].x,planets[i].y) < PORTAL_R+planets[i].r+26){ ok=false; break; }
    }
    if(ok) portal={x:qx,y:qy,r:PORTAL_R};
  }
  if(!portal) portal={x:W/2,y:70,r:PORTAL_R};
  // stars
  var starCount=3+Math.floor(rng()*2);
  var stars=[];
  tries=0;
  while(stars.length<starCount && tries<300){
    tries++;
    var sx=24+rng()*(W-48), sy=120+rng()*(H-320);
    var ok=dist(sx,sy,PAD.x,PAD.y)>70 && dist(sx,sy,portal.x,portal.y)>40;
    for(var i=0;i<planets.length;i++){ if(dist(sx,sy,planets[i].x,planets[i].y)<planets[i].r+22){ ok=false; break; } }
    for(var i=0;i<stars.length;i++){ if(dist(sx,sy,stars[i].x,stars[i].y)<28){ ok=false; break; } }
    if(ok) stars.push({x:sx,y:sy,got:false,ph:rng()*6.28});
  }
  return {planets:planets, stars:stars, portal:portal};
}

function startLevel(n){
  var lvl=genLevel(n);
  S.level=n; S.planets=lvl.planets; S.stars=lvl.stars; S.portal=lvl.portal;
  S.shots=3; S.phase='aim';
  resetBall();
  renderShots(); renderHUD();
}
function resetBall(){
  S.ball.x=PAD.x; S.ball.y=PAD.y; S.ball.vx=0; S.ball.vy=0; S.ball.flying=false;
  S.trail=[];
}
function renderHUD(){
  $('lvTxt').textContent=S.level;
  $('scTxt').textContent=S.score;
  $('bestTxt').textContent=S.best;
}
function renderShots(){
  var wrap=$('shotsWrap'); wrap.innerHTML='';
  for(var i=0;i<3;i++){
    var d=document.createElement('i');
    if(i<S.shots) d.className='on';
    wrap.appendChild(d);
  }
}
function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }

function accelAt(x,y){
  var ax=0,ay=0;
  for(var i=0;i<S.planets.length;i++){
    var p=S.planets[i];
    var dx=p.x-x, dy=p.y-y;
    var d2=dx*dx+dy*dy;
    var d=Math.sqrt(d2);
    if(d<1) d=1;
    var a=(G_STR*p.mass)/Math.max(d2, 900);
    ax += a*dx/d; ay += a*dy/d;
  }
  return [ax,ay];
}

function planetHit(x,y){
  for(var i=0;i<S.planets.length;i++){
    var p=S.planets[i];
    if(dist(x,y,p.x,p.y) <= p.r+BALL_R) return true;
  }
  return false;
}
function outOfBounds(x,y){
  return x<-20||x>W+20||y<-20||y>H+20;
}

function spawnBurst(x,y,color,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, sp=1+Math.random()*3;
    S.particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
  }
}

function stepFlight(){
  var b=S.ball;
  var acc=accelAt(b.x,b.y);
  b.vx+=acc[0]*0.016*60*0.016; b.vy+=acc[1]*0.016*60*0.016;
  // simpler fixed-step integration tuned for 60fps feel
  b.vx=clamp(b.vx,-MAX_SPEED*2,MAX_SPEED*2);
  b.vy=clamp(b.vy,-MAX_SPEED*2,MAX_SPEED*2);
  b.x+=b.vx; b.y+=b.vy;
  S.trail.push({x:b.x,y:b.y});
  if(S.trail.length>60) S.trail.shift();

  // star pickup
  for(var i=0;i<S.stars.length;i++){
    var s=S.stars[i];
    if(!s.got && dist(b.x,b.y,s.x,s.y) < 15){
      s.got=true; S.score+=10; renderHUD(); sfxStar();
      spawnBurst(s.x,s.y,'#FFD23F',10);
    }
  }
  // portal
  if(dist(b.x,b.y,S.portal.x,S.portal.y) < S.portal.r){
    S.phase='clear'; b.flying=false;
    sfxWin();
    spawnBurst(S.portal.x,S.portal.y,'#4CC9F0',22);
    var collected=S.stars.filter(function(s){return s.got;}).length;
    S.score += 50;
    renderHUD();
    if(S.score>S.best){ S.best=S.score; try{localStorage.setItem('gd_best',String(S.best));}catch(e){} }
    $('clearLv').textContent=S.level;
    $('clearInfo').textContent='收集了 '+collected+' / '+S.stars.length+' 顆星塵，分數 +50';
    show('ovClear');
    return;
  }
  // planet crash
  if(planetHit(b.x,b.y)){
    sfxCrash();
    spawnBurst(b.x,b.y,'#FF4D6D',16);
    shotUsed();
    return;
  }
  // out of bounds
  if(outOfBounds(b.x,b.y)){
    shotUsed();
    return;
  }
}
function shotUsed(){
  S.shots--;
  renderShots();
  resetBall();
  if(S.shots<=0){
    S.phase='lose';
    sfxLose();
    show('ovLose');
  }else{
    S.phase='aim';
  }
}

function launch(vx,vy){
  if(S.phase!=='aim') return;
  S.ball.vx=vx; S.ball.vy=vy; S.ball.flying=true;
  S.phase='flying';
  sfxLaunch();
}

function simulatePreview(vx,vy){
  var pts=[]; var x=PAD.x,y=PAD.y,vX=vx,vY=vy;
  for(var i=0;i<140;i++){
    var acc=accelAt(x,y);
    vX+=acc[0]*0.016*60*0.016; vY+=acc[1]*0.016*60*0.016;
    vX=clamp(vX,-MAX_SPEED*2,MAX_SPEED*2); vY=clamp(vY,-MAX_SPEED*2,MAX_SPEED*2);
    x+=vX; y+=vY;
    if(i%3===0) pts.push({x:x,y:y});
    if(planetHit(x,y) || outOfBounds(x,y) || dist(x,y,S.portal.x,S.portal.y)<S.portal.r) break;
  }
  return pts;
}

// ---------- input ----------
function localPos(e){
  var r=cv.getBoundingClientRect();
  var t=(e.touches&&e.touches[0])||e;
  return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) };
}
function onDown(e){
  if(S.phase!=='aim') return;
  var p=localPos(e);
  if(dist(p.x,p.y,PAD.x,PAD.y) > MAX_PULL+40) return;
  S.dragging=true;
  updateDrag(p);
  e.preventDefault();
}
function onMove(e){
  if(!S.dragging) return;
  updateDrag(localPos(e));
  e.preventDefault();
}
function onUp(e){
  if(!S.dragging) return;
  S.dragging=false;
  var dx=S.dragX-PAD.x, dy=S.dragY-PAD.y;
  var d=Math.sqrt(dx*dx+dy*dy);
  if(d>14){
    var vx=-dx*LAUNCH_K, vy=-dy*LAUNCH_K;
    launch(vx,vy);
  }
  S.preview=[];
}
function updateDrag(p){
  var dx=p.x-PAD.x, dy=p.y-PAD.y;
  var d=Math.sqrt(dx*dx+dy*dy);
  if(d>MAX_PULL){ dx=dx/d*MAX_PULL; dy=dy/d*MAX_PULL; }
  S.dragX=PAD.x+dx; S.dragY=PAD.y+dy;
  var vx=-dx*LAUNCH_K, vy=-dy*LAUNCH_K;
  S.preview=simulatePreview(vx,vy);
}
cv.addEventListener('mousedown',onDown);
cv.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
cv.addEventListener('touchstart',onDown,{passive:false});
cv.addEventListener('touchmove',onMove,{passive:false});
cv.addEventListener('touchend',onUp,{passive:false});

// ---------- UI buttons ----------
$('btnStart').addEventListener('click',function(){ hide('ovMenu'); S.score=0; renderHUD(); startLevel(1); });
$('btnNext').addEventListener('click',function(){ hide('ovClear'); startLevel(S.level+1); });
$('btnRetry').addEventListener('click',function(){ hide('ovLose'); startLevel(S.level); });
$('btnMenu1').addEventListener('click',function(){ hide('ovLose'); S.phase='menu'; show('ovMenu'); });
$('btnMenu2').addEventListener('click',function(){ hide('ovPause'); S.phase='menu'; show('ovMenu'); });
$('btnResume').addEventListener('click',function(){ hide('ovPause'); S.phase='aim'; });
$('menuBtn').addEventListener('click',function(){
  if(S.phase!=='aim') return;
  S.phase='paused';
  S.dragging=false;
  show('ovPause');
});
$('btnResume').addEventListener('click',function(){
  if(S.phase==='paused') S.phase='aim';
});

// ---------- draw ----------
var t0=performance.now();
function draw(ts){
  var time=(ts-t0)/1000;
  ctx.clearRect(0,0,W,H);
  // bg
  var grd=ctx.createRadialGradient(W/2,H*0.15,20,W/2,H*0.15,H*0.9);
  grd.addColorStop(0,'#101934'); grd.addColorStop(1,'#060912');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
  for(var i=0;i<bgStars.length;i++){
    var s=bgStars[i];
    var a=s.a*(0.6+0.4*Math.sin(time*s.tw+i));
    ctx.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.3); ctx.fill();
  }

  if(S.phase!=='menu'){
    // portal
    if(S.portal){
      var pr=S.portal.r+Math.sin(time*2.2)*3;
      var pg=ctx.createRadialGradient(S.portal.x,S.portal.y,2,S.portal.x,S.portal.y,pr+14);
      pg.addColorStop(0,'rgba(76,201,240,.9)'); pg.addColorStop(0.5,'rgba(155,93,229,.45)'); pg.addColorStop(1,'rgba(76,201,240,0)');
      ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(S.portal.x,S.portal.y,pr+14,0,6.3); ctx.fill();
      ctx.strokeStyle='#CFF7FF'; ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.arc(S.portal.x,S.portal.y,pr,0,6.3); ctx.stroke();
    }
    // planets
    for(var i=0;i<S.planets.length;i++){
      var p=S.planets[i];
      var g=ctx.createRadialGradient(p.x-p.r*0.3,p.y-p.r*0.3,p.r*0.1,p.x,p.y,p.r);
      g.addColorStop(0,'hsl('+p.hue+',75%,62%)');
      g.addColorStop(1,'hsl('+p.hue+',55%,22%)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.3); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r+5,0,6.3); ctx.stroke();
    }
    // stars
    for(var i=0;i<S.stars.length;i++){
      var st=S.stars[i];
      if(st.got) continue;
      var bob=Math.sin(time*2+st.ph)*3;
      drawStar(st.x,st.y+bob,9,'#FFD23F');
    }
    // trail
    for(var i=0;i<S.trail.length;i++){
      var tp=S.trail[i], al=(i/S.trail.length);
      ctx.fillStyle='rgba(76,201,240,'+(al*0.5).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(tp.x,tp.y,2.4*al+0.6,0,6.3); ctx.fill();
    }
    // preview
    if(S.dragging && S.preview.length){
      for(var i=0;i<S.preview.length;i++){
        var pa=1-i/S.preview.length*0.75;
        ctx.fillStyle='rgba(255,210,63,'+pa.toFixed(3)+')';
        ctx.beginPath(); ctx.arc(S.preview[i].x,S.preview[i].y,3.4,0,6.3); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,'+(pa*0.9).toFixed(3)+')';
        ctx.beginPath(); ctx.arc(S.preview[i].x,S.preview[i].y,1.4,0,6.3); ctx.fill();
      }
    }
    // pad
    ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(PAD.x,PAD.y,16,0,6.3); ctx.stroke();
    // aim line
    if(S.dragging){
      ctx.strokeStyle='rgba(255,210,63,.8)'; ctx.lineWidth=2.4; ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.moveTo(PAD.x,PAD.y); ctx.lineTo(S.dragX,S.dragY); ctx.stroke();
      ctx.setLineDash([]);
    }
    // ball
    var bx=S.ball.x,by=S.ball.y;
    var bg2=ctx.createRadialGradient(bx-2,by-2,0.5,bx,by,BALL_R+3);
    bg2.addColorStop(0,'#fff'); bg2.addColorStop(1,'#4CC9F0');
    ctx.fillStyle=bg2;
    ctx.beginPath(); ctx.arc(bx,by,BALL_R,0,6.3); ctx.fill();

    // particles
    for(var i=S.particles.length-1;i>=0;i--){
      var pt=S.particles[i];
      pt.x+=pt.vx; pt.y+=pt.vy; pt.vx*=0.94; pt.vy*=0.94; pt.life-=0.03;
      if(pt.life<=0){ S.particles.splice(i,1); continue; }
      ctx.fillStyle=pt.color; ctx.globalAlpha=Math.max(pt.life,0);
      ctx.beginPath(); ctx.arc(pt.x,pt.y,2.2,0,6.3); ctx.fill();
      ctx.globalAlpha=1;
    }
  }
}
function drawStar(cx,cy,r,color){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.fillStyle=color;
  ctx.shadowColor=color; ctx.shadowBlur=8;
  ctx.beginPath();
  for(var i=0;i<5;i++){
    var a1=-Math.PI/2+i*2*Math.PI/5, a2=a1+Math.PI/5;
    ctx.lineTo(Math.cos(a1)*r,Math.sin(a1)*r);
    ctx.lineTo(Math.cos(a2)*r*0.42,Math.sin(a2)*r*0.42);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function loop(ts){
  if(S.phase==='flying') stepFlight();
  draw(ts);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
renderHUD();

// ---------- debug / test hook ----------
window.__GD = {
  state:S,
  start:function(){ $('btnStart').click(); },
  next:function(){ if(!$('ovClear').classList.contains('hidden')) $('btnNext').click(); },
  retry:function(){ if(!$('ovLose').classList.contains('hidden')) $('btnRetry').click(); },
  launch:function(vx,vy){ if(S.phase==='aim'){ S.dragging=false; launch(vx,vy); } },
  drag:function(px,py){ var p={x:px,y:py}; if(S.phase==='aim'){ S.dragging=true; updateDrag(p); } },
  release:function(){ onUp({preventDefault:function(){}}); }
};
})();
</script>
