<html lang="zh-Hant">
<head>

<style>
  :root{ --bg:#0E1420; --cream:#FFF3DC; --ink:#4A2A1A; }

  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  .card h2{ margin:0; font:900 1.6em 'Noto Sans TC'; color:#D9602A; }
  .card p{ margin:0; font-size:.8em; color:#7A4A38; }
  .grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:.4em; }
  .lv{ border:0; border-radius:.7em; background:linear-gradient(180deg,#FF9A5C,#D9482B); color:#fff; padding:.4em 0 .3em; box-shadow:0 .2em 0 #8E2A14; display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .lv b{ font:700 1.15em 'Fredoka',sans-serif; } .lv i{ font-style:normal; font-size:.6em; color:#FFE27A; min-height:1.1em; }
  .lv:disabled{ background:linear-gradient(180deg,#C9C0B6,#A59D92); box-shadow:0 .2em 0 #7C766C; color:#eee; cursor:default; } .lv:disabled i{ color:#eee; }
  .stars{ font-size:2em; letter-spacing:.1em; color:#F5B731; text-shadow:0 .06em 0 #B07A00; } .stars .off{ color:#D8CDB4; text-shadow:none; }
  .row{ display:flex; gap:.5em; } .row > *{ flex:1; }
  .bigbtn{ border:0; border-radius:.9em; padding:.7em .4em; font:900 .92em 'Noto Sans TC'; letter-spacing:.06em; color:#fff; background:linear-gradient(180deg,#FF9A5C,#D9482B); box-shadow:0 .24em 0 #8E2A14; text-decoration:none; display:block; text-align:center; }
  .bigbtn.b{ background:linear-gradient(180deg,#5FB4E8,#2A78B8); box-shadow:0 .24em 0 #1B4F78; } .bigbtn.g{ background:linear-gradient(180deg,#B9946A,#8A6240); box-shadow:0 .24em 0 #5A3A1C; } .bigbtn.full{ width:100%; }
  .bowl{ font-size:3em; line-height:1.1; }
  .brk{ display:grid; grid-template-columns:repeat(3,1fr); gap:.4em; } .brk div{ background:#fff; border-radius:.7em; padding:.4em .2em; font-size:.72em; } .brk b{ display:block; font:700 1.5em 'Fredoka',sans-serif; color:#D9602A; }

<script>
(()=>{
'use strict';
const W=360,H=640,BX=180,BY=292,K=135/170;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),wrap=$('wrap');
const ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const OPP=[
 {n:'菜鳥小明',e:'🧑',d:'剛入行的酒吧學徒,手還在發抖。'},
 {n:'吧檯阿財',e:'👨‍🍳',d:'一邊調酒一邊射鏢,風來了也不慌。'},
 {n:'醉漢老王',e:'🧔',d:'三杯下肚,準星比你更晃。'},
 {n:'旋轉阿嬤',e:'👵',d:'她的靶永遠在轉,說這樣才有挑戰。'},
 {n:'暗夜蝙蝠',e:'🦇',d:'熄了大半的燈,只剩一圈光。'},
 {n:'牛仔傑克',e:'🤠',d:'靶子會跑,他的鏢不會。'},
 {n:'颱風姊',e:'🌪️',d:'站在她旁邊,風就沒停過。'},
 {n:'雙面忍者',e:'🥷',d:'靶轉得快,身影更快。'},
 {n:'酒吧老闆',e:'👑',d:'小小的靶,一圈圈地跑。'},
 {n:'傳奇冠軍',e:'🏆',d:'暗、小、轉、風全開,終極試煉。'}
];
const STG=[
 {sw:14,nz:24,tw:'暖身賽'},{sw:16,nz:22,wind:7,tw:'有風 ➜ 注意箭頭'},{sw:24,nz:21,tw:'喝醉了:準星晃得更大'},
 {sw:16,nz:19,rot:.5,tw:'旋轉靶'},{sw:16,nz:17,dim:1,tw:'燈光昏暗'},{sw:16,nz:16,slide:55,tw:'移動靶'},
 {sw:19,nz:15,wind:15,tw:'強風'},{sw:22,nz:13,rot:.7,tw:'快速旋轉'},{sw:20,nz:12,sc:.85,wind:8,slide:30,tw:'小靶+移動'},{sw:22,nz:10,sc:.8,rot:.6,dim:1,wind:10,tw:'終極挑戰'}
];
let SV={unlock:0,stars:Array(10).fill(0),best:Array(10).fill(0),bulls:0,snd:1,tut:0};
try{const s=JSON.parse(localStorage.getItem('darts_save')||'null');if(s&&typeof s==='object')SV=Object.assign(SV,s);}catch(e){}
function save(){try{localStorage.setItem('darts_save',JSON.stringify(SV));}catch(e){}}
let AC=null;
function au(){if(!SV.snd)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function beep(f,d,type,vol,to){const a=au();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime);if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);g.gain.setValueAtTime(vol||.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+.02);}catch(e){}}
function vib(n){try{if(navigator.vibrate)navigator.vibrate(n);}catch(e){}}
function mulb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283*v);}
const FT=.28;
const G={i:0,state:'menu',bt:0,S:null,r:0,d:0,me:[],np:[],stuck:[],fl:null,hold:false,hT:0,ax:BX,ay:300,fx:0,fy:0,wind:{x:0,y:0},timer:0,pop:[],fx2:[],ph:[0,0,0,0],rng:null,bulls:0,best:0,npcAim:null,fade:0};
function boardAt(t){const s=G.S||STG[0];return {x:BX+(s.slide?s.slide*Math.sin(t*.9):0),y:BY,th:s.rot?s.rot*t:0,sc:s.sc||1};}
function toLocal(sx,sy,t){const b=boardAt(t),dx=sx-b.x,dy=sy-b.y,c=Math.cos(-b.th),s=Math.sin(-b.th);return [dx*c-dy*s,dx*s+dy*c];}
function toScreen(lx,ly,t){const b=boardAt(t),c=Math.cos(b.th),s=Math.sin(b.th);return [b.x+lx*c-ly*s,b.y+lx*s+ly*c];}
function scoreAt(lx,ly,sc){
 const mm=Math.hypot(lx,ly)/(K*sc);
 if(mm>170)return {p:0,l:'未中'};
 if(mm<=6.35)return {p:50,l:'紅心 50'};
 if(mm<=15.9)return {p:25,l:'25'};
 let a=Math.atan2(lx,-ly);a=(a+Math.PI/20+4*Math.PI)%(2*Math.PI);const n=ORDER[Math.floor(a/(Math.PI/10))%20];
 if(mm>=99&&mm<=107)return {p:n*3,l:'三倍 '+n+' = '+n*3};
 if(mm>=162)return {p:n*2,l:'雙倍 '+n+' = '+n*2};
 return {p:n,l:''+n};
}
function segLocal(n,ring){const i=ORDER.indexOf(n),a=i*Math.PI/10,r=(ring===3?103:ring===2?166:60)*K;return [r*Math.sin(a),-r*Math.cos(a)];}
function sum(a){return a.reduce((x,y)=>x+y,0);}
function totals(){return [sum(G.me.flat()),sum(G.np.flat())];}
function setHUD(){const t=totals();$('sc').textContent=t[0]+' : '+t[1];}
function toast(t,ms){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',ms||1500);}

function update(dt){

 else if(G.state==='gap'){G.timer-=dt;if(G.timer<=0){G.state='npc';startNpc();}}
 else if(G.state==='npc'&&G.npcAim){G.npcAim.t+=dt;if(G.npcAim.t>=G.npcAim.T)npcThrow();}
 else if(G.state==='clear'){G.timer-=dt;G.fade=1-Math.max(0,G.timer);if(G.timer<=0){G.r++;G.d=0;G.stuck=[];G.fade=0;if(G.r>=3){endGame();return;}newWind();G.state='aim';toast('第 '+(G.r+1)+' 輪',900);}}
 for(const s of G.stuck)s.age+=dt;
 for(const q of G.pop){q.y-=18*dt;q.life-=dt;}G.pop=G.pop.filter(q=>q.life>0);
 for(const f of G.fx2){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=420*dt;f.life-=dt*1.2;}G.fx2=G.fx2.filter(f=>f.life>0);
