<!DOCTYPE html>

<script>
(function(){
  try{
    var a=document.createElement('audio');
    a.setAttribute('loop',''); a.setAttribute('playsinline',''); a.volume=0;
    a.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(a);});
    var unlocked=false;
    function unlock(){
      if(unlocked) return; unlocked=true;
      a.play().catch(function(){});
      if(window.__PX_AC && window.__PX_AC.state==='suspended'){ window.__PX_AC.resume().catch(function(){}); }
    }
    ['touchstart','mousedown','keydown'].forEach(function(ev){ window.addEventListener(ev, unlock, {once:false, passive:true}); });
  }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>數棋邏輯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#141022; --ink:#F3EEFF; --muted:#9A8FBE; --gold:#FFC83D; --red:#FF5A6B; --green:#5CE68C; --purple:#A678FF; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; background:#000; height:100%; overflow:hidden; overscroll-behavior:none;}
  body{ display:flex; align-items:center; justify-content:center; font-family:'Noto Sans TC','Fredoka',sans-serif;
    color:var(--ink); min-height:100vh; min-height:100dvh;
    background:radial-gradient(ellipse at 50% 0%, #241c3d 0%, #141022 65%); }
  .wrap{ position:relative; width:360px; height:640px; max-width:100vw; max-height:100vh; aspect-ratio:360/640; background:var(--bg); overflow:hidden; }
  @media (max-width:360px), (max-height:640px){ .wrap{ width:100vw; height:100vh; height:100dvh; } }
  canvas{ display:block; position:absolute; touch-action:none; }

  .topbar{ position:absolute; top:0; left:0; right:0; display:none; flex-direction:column; gap:6px;
    padding:10px 56px 0 14px; font-family:'Fredoka',sans-serif; pointer-events:none; z-index:4; }
  .topbar.on{ display:flex; }
  .topbar .row{ display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap; }
  .topbar .pill{ background:rgba(20,16,34,.7); border:1px solid rgba(255,255,255,.12); padding:5px 10px; border-radius:999px; font-size:12.5px; pointer-events:auto; }
  .topbar .pill b{ color:var(--gold); }
  .topbar .actBtn{ pointer-events:auto; background:rgba(20,16,34,.7); border:1px solid rgba(255,255,255,.14); color:var(--ink);
    padding:5px 12px; border-radius:999px; font-size:12.5px; font-family:'Noto Sans TC',sans-serif; cursor:pointer; }
  .topbar .actBtn:active{ transform:scale(.95); }

  .menuBtn{ position:absolute; top:10px; right:14px; width:32px; height:32px; border-radius:50%;
    background:rgba(20,16,34,.7); border:1px solid rgba(255,255,255,.12); color:var(--ink);
    font-size:15px; display:none; align-items:center; justify-content:center; cursor:pointer; z-index:6; }
  .menuBtn.on{ display:flex; }

  .ov{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; background:rgba(10,8,18,.84); backdrop-filter:blur(6px); z-index:10; gap:12px; overflow-y:auto; }
  .ov.hidden{ display:none; }
  .ov h1{ font-family:'Fredoka',sans-serif; font-size:24px; margin:0; letter-spacing:1px; }
  .ov h2{ font-family:'Fredoka',sans-serif; font-size:20px; margin:0; }
  .ov p.sub{ margin:0; color:var(--muted); font-size:13px; line-height:1.7; max-width:280px; }
  .ov .stat{ font-size:13px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .ov .stat b{ color:var(--gold); font-size:16px; }
  .btn{ font-family:'Fredoka',sans-serif; font-size:15px; font-weight:600; color:#141022;
    background:linear-gradient(135deg,var(--gold),#ffe08a); border:none; padding:12px 28px; border-radius:999px;
    cursor:pointer; box-shadow:0 6px 18px rgba(255,200,61,.3); letter-spacing:.5px; }
  .btn.alt{ background:rgba(255,255,255,.08); color:var(--ink); box-shadow:none; border:1px solid rgba(255,255,255,.18); }
  .btn:active{ transform:scale(.96); }
  .btnrow{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  .levelGrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:280px; margin:6px 0; }
  .lvlCard{ position:relative; width:60px; height:60px; border-radius:14px; background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.14); display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; font-family:'Fredoka',sans-serif; }
  .lvlCard.cleared{ background:rgba(106,219,140,.16); border-color:rgba(106,219,140,.5); }
  .lvlCard .n{ font-size:18px; font-weight:600; }
  .check{ position:absolute; top:3px; right:5px; font-size:11px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <canvas id="c" width="360" height="640"></canvas>

  <div class="topbar" id="topbar">
    <div class="row">
      <div class="pill">第 <b id="lvNoTxt">1</b> 關</div>
      <div class="pill">模式 <b id="modeTxt">🖌️塗色</b></div>
      <button class="actBtn" id="btnModeToggle">切換</button>
      <button class="actBtn" id="btnReset">↺ 清空</button>
    </div>
  </div>
  <div class="menuBtn" id="menuBtn">☰</div>

  <div class="ov" id="ovMenu">
    <h1>🧮 數棋邏輯</h1>
    <p class="sub">依照行列數字線索塗色方格，數字代表連續格數，全部正確就會浮現神秘圖案！點擊切換「塗色／標記」模式。</p>
    <div class="stat">已通關 <b id="clearedCountTxt">0</b> / <b id="totalLevelsTxt">8</b></div>
    <button class="btn" id="btnStart">選擇關卡</button>
  </div>

  <div class="ov hidden" id="ovLevelSelect">
    <h2>選擇關卡</h2>
    <div class="levelGrid" id="levelGrid"></div>
    <button class="btn alt" id="btnBackMenu">返回選單</button>
  </div>

  <div class="ov hidden" id="ovCleared">
    <h2>🎉 圖案完成！</h2>
    <p class="sub" id="clearedDetail"></p>
    <div class="btnrow">
      <button class="btn" id="btnNextLevel">下一關</button>
      <button class="btn alt" id="btnBackSelect1">關卡選擇</button>
    </div>
  </div>

  <div class="ov hidden" id="ovAllClear">
    <h2>🏆 全部通關！</h2>
    <p class="sub" id="allClearDetail"></p>
    <div class="btnrow">
      <button class="btn" id="btnReplay">重新挑戰</button>
      <button class="btn alt" id="btnBackSelect2">關卡選擇</button>
    </div>
  </div>

  <div class="ov hidden" id="ovPause">
    <h2>已暫停</h2>
    <div class="btnrow">
      <button class="btn" id="btnResume">繼續遊戲</button>
      <button class="btn alt" id="btnResetLevel">重設關卡</button>
      <button class="btn alt" id="btnMenu2">返回選單</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=360,H=640;
var $=function(id){return document.getElementById(id);};

var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); window.__PX_AC=AC; }catch(e){} } return AC; }
function playTone(freq,dur,type,vol,sweepTo){
  var c=ac(); if(!c) return;
  try{
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,c.currentTime);
    if(sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo,c.currentTime+dur);
    g.gain.setValueAtTime(vol||0.15,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
  }catch(e){}
}
function sfxFill(){ playTone(380,0.05,'sine',0.08,480); }
function sfxMark(){ playTone(260,0.04,'triangle',0.06); }
function sfxErase(){ playTone(180,0.04,'sawtooth',0.05); }
function sfxLineDone(){ playTone(600,0.07,'triangle',0.1,720); }
function sfxClear(){ playTone(523,0.1,'triangle',0.14); setTimeout(function(){playTone(659,0.1,'triangle',0.14);},90); setTimeout(function(){playTone(784,0.16,'triangle',0.15);},180); }
function sfxAllClear(){ playTone(523,0.1,'triangle',0.14); setTimeout(function(){playTone(659,0.1,'triangle',0.14);},100); setTimeout(function(){playTone(784,0.1,'triangle',0.14);},200); setTimeout(function(){playTone(1047,0.22,'triangle',0.17);},300); }

// Levels: n (grid size) + solution rows as strings of '0'/'1'
var LEVELS=[
  {n:5, rows:['01010','11111','11111','01110','00100']},
  {n:5, rows:['00100','01110','11111','01110','00100']},
  {n:5, rows:['11111','00100','00100','00100','00100']},
  {n:8, rows:['01100110','11111111','11111111','11111111','01111110','00111100','00011000','00000000']},
  {n:8, rows:['00011000','00111100','01111110','00011000','00111100','01111110','11111111','00011000']},
  {n:8, rows:['00111100','01000010','10100101','10000001','10100101','10011001','01000010','00111100']},
  {n:10, rows:['0011001100','0111111110','1111111111','1111111111','1111111111','0111111110','0011111100','0001111000','0000110000','0000000000']},
  {n:10, rows:['0000110000','0001111000','0011111100','0111111110','1111111111','1111111111','0011111100','0011111100','0110000110','1100000011']}
];

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem('px_progress')||'{}'); }catch(e){ return {}; }
}
function saveProgress(p){ try{ localStorage.setItem('px_progress', JSON.stringify(p)); }catch(e){} }

function S0(){
  return {
    phase:'menu',
    prePausePhase:null,
    levelIndex:0,
    n:5,
    solution:[],
    grid:[],
    rowClues:[],
    colClues:[],
    markMode:false,
    progress:loadProgress()
  };
}
var S=S0();

function resetState(){
  var fresh=S0();
  for(var k in S){ if(Object.prototype.hasOwnProperty.call(S,k)) delete S[k]; }
  for(var k2 in fresh){ if(Object.prototype.hasOwnProperty.call(fresh,k2)) S[k2]=fresh[k2]; }
}

function runClue(arr){
  var clue=[]; var run=0;
  for(var i=0;i<arr.length;i++){
    if(arr[i]===1){ run++; } else { if(run>0){ clue.push(run); run=0; } }
  }
  if(run>0) clue.push(run);
  if(clue.length===0) clue=[0];
  return clue;
}

function loadLevel(idx){
  var lv=LEVELS[idx];
  S.levelIndex=idx;
  S.n=lv.n;
  S.solution=lv.rows.map(function(row){ return row.split('').map(Number); });
  S.grid=[];
  for(var r=0;r<S.n;r++){ S.grid.push(new Array(S.n).fill(0)); }
  S.rowClues=S.solution.map(runClue);
  S.colClues=[];
  for(var c=0;c<S.n;c++){
    var col=[];
    for(var r2=0;r2<S.n;r2++) col.push(S.solution[r2][c]);
    S.colClues.push(runClue(col));
  }
  S.markMode=false;
}

function isSolved(){
  for(var r=0;r<S.n;r++){
    for(var c=0;c<S.n;c++){
      var filled = S.grid[r][c]===1;
      var shouldFill = S.solution[r][c]===1;
      if(filled!==shouldFill) return false;
    }
  }
  return true;
}

function rowSatisfied(r){
  var arr=S.grid[r].map(function(v){ return v===1?1:0; });
  var clue=runClue(arr);
  var target=S.rowClues[r];
  if(clue.length!==target.length) return false;
  for(var i=0;i<clue.length;i++){ if(clue[i]!==target[i]) return false; }
  return true;
}
function colSatisfied(c){
  var arr=[];
  for(var r=0;r<S.n;r++) arr.push(S.grid[r][c]===1?1:0);
  var clue=runClue(arr);
  var target=S.colClues[c];
  if(clue.length!==target.length) return false;
  for(var i=0;i<clue.length;i++){ if(clue[i]!==target[i]) return false; }
  return true;
}

function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }

function renderHUD(){
  $('lvNoTxt').textContent=String(S.levelIndex+1);
  $('modeTxt').textContent=S.markMode?'✖️標記':'🖌️塗色';
}

function tapCell(r,c){
  if(S.phase!=='playing') return false;
  if(r<0||c<0||r>=S.n||c>=S.n) return false;
  var cur=S.grid[r][c];
  if(!S.markMode){
    // paint mode: cycle empty -> filled -> empty
    S.grid[r][c] = cur===1 ? 0 : 1;
    if(S.grid[r][c]===1) sfxFill(); else sfxErase();
  } else {
    // mark mode: cycle empty -> marked(2) -> empty  (cannot mark over a filled cell; tapping a filled cell in mark mode does nothing)
    if(cur===1) return false;
    S.grid[r][c] = cur===2 ? 0 : 2;
    if(S.grid[r][c]===2) sfxMark(); else sfxErase();
  }
  var rOk=rowSatisfied(r), cOk=colSatisfied(c);
  if(rOk||cOk) sfxLineDone();
  if(isSolved()) checkWin();
  return true;
}

function checkWin(){
  var idx=S.levelIndex;
  if(!S.progress[idx]){ S.progress[idx]=true; saveProgress(S.progress); }
  sfxClear();
  if(idx>=LEVELS.length-1){
    S.phase='allclear';
    $('topbar').classList.remove('on'); $('menuBtn').classList.remove('on');
    setTimeout(sfxAllClear,200);
    $('allClearDetail').textContent='恭喜完成全部 '+LEVELS.length+' 幅圖案！';
    show('ovAllClear');
  } else {
    S.phase='cleared';
    $('topbar').classList.remove('on'); $('menuBtn').classList.remove('on');
    $('clearedDetail').textContent='第 '+(idx+1)+' 關的圖案完成了！';
    show('ovCleared');
  }
}

function buildLevelGrid(){
  var grid=$('levelGrid');
  grid.innerHTML='';
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var card=document.createElement('div');
      card.className='lvlCard'+(S.progress[i]?' cleared':'');
      card.innerHTML='<span class="n">'+(i+1)+'</span>'+(S.progress[i]?'<span class="check">✅</span>':'');
      card.addEventListener('click',function(){ startLevel(i); });
      grid.appendChild(card);
    })(i);
  }
  var clearedN=Object.keys(S.progress).length;
  $('clearedCountTxt').textContent=String(clearedN);
  $('totalLevelsTxt').textContent=String(LEVELS.length);
}

function startLevel(idx){
  hide('ovMenu'); hide('ovLevelSelect'); hide('ovCleared'); hide('ovAllClear'); hide('ovPause');
  loadLevel(idx);
  S.phase='playing';
  $('topbar').classList.add('on');
  $('menuBtn').classList.add('on');
  renderHUD();
}

function openLevelSelect(){
  hide('ovMenu'); hide('ovCleared'); hide('ovAllClear'); hide('ovPause');
  $('topbar').classList.remove('on'); $('menuBtn').classList.remove('on');
  S.phase='levelselect';
  buildLevelGrid();
  show('ovLevelSelect');
}

function backToMenu(){
  hide('ovLevelSelect'); hide('ovCleared'); hide('ovAllClear'); hide('ovPause');
  S.phase='menu';
  $('topbar').classList.remove('on'); $('menuBtn').classList.remove('on');
  var clearedN=Object.keys(S.progress).length;
  $('clearedCountTxt').textContent=String(clearedN);
  $('totalLevelsTxt').textContent=String(LEVELS.length);
  show('ovMenu');
}

$('btnStart').addEventListener('click',function(){ openLevelSelect(); });
$('btnBackMenu').addEventListener('click',function(){ backToMenu(); });
$('btnNextLevel').addEventListener('click',function(){
  hide('ovCleared');
  var next=S.levelIndex+1;
  if(next<LEVELS.length) startLevel(next); else openLevelSelect();
});
$('btnBackSelect1').addEventListener('click',function(){ openLevelSelect(); });
$('btnBackSelect2').addEventListener('click',function(){ openLevelSelect(); });
$('btnReplay').addEventListener('click',function(){ startLevel(0); });
$('btnModeToggle').addEventListener('click',function(){ S.markMode=!S.markMode; renderHUD(); });
$('btnReset').addEventListener('click',function(){
  for(var r=0;r<S.n;r++) S.grid[r]=new Array(S.n).fill(0);
});
$('btnResetLevel').addEventListener('click',function(){ startLevel(S.levelIndex); });
$('btnMenu2').addEventListener('click',function(){ hide('ovPause'); backToMenu(); });
$('btnResume').addEventListener('click',function(){
  if(S.phase==='paused'){ hide('ovPause'); S.phase=S.prePausePhase||'playing'; }
});
$('menuBtn').addEventListener('click',function(){
  if(S.phase!=='playing') return;
  S.prePausePhase=S.phase;
  S.phase='paused';
  show('ovPause');
});

function maxClueCount(clues){
  var m=0;
  clues.forEach(function(c){ if(c.length>m) m=c.length; });
  return m;
}

function layout(){
  var n=S.n;
  var clueW = Math.max(34, Math.min(60, 14*maxClueCount(S.rowClues)+16));
  var clueH = Math.max(28, Math.min(54, 14*maxClueCount(S.colClues)+14));
  var availW=320-clueW, availH=372-clueH;
  var cs=Math.floor(Math.min(availW/n, availH/n));
  cs=Math.max(16, Math.min(56, cs));
  var boardW=cs*n, boardH=cs*n;
  var ox=(W-(boardW+clueW))/2+clueW, oy=90+clueH+(372-clueH-boardH)/2;
  return {cs:cs, ox:ox, oy:oy, clueW:clueW, clueH:clueH};
}

cv.addEventListener('pointerdown',function(e){
  if(S.phase!=='playing') return;
  var rect=cv.getBoundingClientRect();
  var scaleX=W/rect.width, scaleY=H/rect.height;
  var x=(e.clientX-rect.left)*scaleX, y=(e.clientY-rect.top)*scaleY;
  var L=layout();
  var c=Math.floor((x-L.ox)/L.cs);
  var r=Math.floor((y-L.oy)/L.cs);
  tapCell(r,c);
});

function drawBoard(){
  var L=layout();
  var n=S.n, cs=L.cs;

  // grid cells
  for(var r=0;r<n;r++){
    for(var c=0;c<n;c++){
      var x=L.ox+c*cs, y=L.oy+r*cs;
      var v=S.grid[r][c];
      ctx.fillStyle = v===1 ? '#A678FF' : 'rgba(255,255,255,.05)';
      ctx.fillRect(x+1,y+1,cs-2,cs-2);
      if(v===2){
        ctx.strokeStyle='rgba(255,255,255,.4)';
        ctx.lineWidth=1.5;
        var pad=cs*0.28;
        ctx.beginPath();
        ctx.moveTo(x+pad,y+pad); ctx.lineTo(x+cs-pad,y+cs-pad);
        ctx.moveTo(x+cs-pad,y+pad); ctx.lineTo(x+pad,y+cs-pad);
        ctx.stroke();
      }
      // 5x5 block guide lines every 5 cells
      ctx.strokeStyle='rgba(255,255,255,.08)';
      ctx.lineWidth=1;
      ctx.strokeRect(x,y,cs,cs);
    }
  }
  // thicker lines every 5
  ctx.strokeStyle='rgba(255,255,255,.22)';
  ctx.lineWidth=2;
  for(var gr=0; gr<=n; gr+=5){ ctx.beginPath(); ctx.moveTo(L.ox,L.oy+gr*cs); ctx.lineTo(L.ox+n*cs,L.oy+gr*cs); ctx.stroke(); }
  for(var gc=0; gc<=n; gc+=5){ ctx.beginPath(); ctx.moveTo(L.ox+gc*cs,L.oy); ctx.lineTo(L.ox+gc*cs,L.oy+n*cs); ctx.stroke(); }
  ctx.strokeRect(L.ox,L.oy,n*cs,n*cs);

  // row clues
  ctx.font='600 '+Math.max(10,cs*0.34)+'px Fredoka, sans-serif';
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(var r2=0;r2<n;r2++){
    var ok=rowSatisfied(r2);
    ctx.fillStyle= ok ? 'rgba(106,219,140,.85)' : 'rgba(255,255,255,.85)';
    var txt=S.rowClues[r2].join(' ');
    ctx.fillText(txt, L.ox-6, L.oy+r2*cs+cs/2);
  }
  // col clues (stacked)
  ctx.textAlign='center';
  for(var c2=0;c2<n;c2++){
    var okc=colSatisfied(c2);
    ctx.fillStyle= okc ? 'rgba(106,219,140,.85)' : 'rgba(255,255,255,.85)';
    var clue=S.colClues[c2];
    var lineH=Math.max(11,cs*0.32);
    var startY=L.oy-6-(clue.length-1)*lineH;
    for(var i=0;i<clue.length;i++){
      ctx.fillText(String(clue[i]), L.ox+c2*cs+cs/2, startY+i*lineH);
    }
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#241c3d'); bg.addColorStop(1,'#141022');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  if(S.phase==='playing' || S.phase==='paused' || S.phase==='cleared' || S.phase==='allclear'){
    drawBoard();
  }
}

function loop(){
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
renderHUD();

window.__PX = {
  state:S,
  start:function(){ $('btnStart').click(); },
  startLevel:function(i){ startLevel(i); },
  tapCell:tapCell,
  setMarkMode:function(v){ S.markMode=v; renderHUD(); },
  isSolved:isSolved,
  levelCount:LEVELS.length,
  retry:function(){ startLevel(S.levelIndex); },
  retryWin:function(){ startLevel(0); },
  solveInstant:function(){ for(var r=0;r<S.n;r++){ for(var c=0;c<S.n;c++){ S.grid[r][c]=S.solution[r][c]; } } checkWin(); },
  advance:function(seconds){ /* turn-based puzzle, no continuous physics */ }
};
})();
</script>
