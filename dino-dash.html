<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>暴龍大逃亡</title>
<style>
:root{--bg:#0b1020;--card:#1b2340;--line:rgba(255,255,255,.16);--txt:#FFFDF4;--dim:#B9C3E8;--acc:#FFB22E;--grn:#53D86A}

.wrap{position:relative;width:min(100vw,calc(100vh*.5625));aspect-ratio:9/16;max-height:100vh;overflow:hidden;border-radius:18px;background:#7fd8ff;box-shadow:0 24px 70px rgba(0,0,0,.6);font-size:calc(min(100vw,100vh*.5625)/360*14px)}

.pill{font:800 .9em 'Space Grotesk','Noto Sans TC',sans-serif;background:rgba(14,20,44,.62);border:1px solid var(--line);border-radius:1.2em;padding:.38em .85em;color:var(--txt);text-decoration:none;white-space:nowrap;backdrop-filter:blur(4px)}

#dist{position:absolute;left:0;right:0;top:3.7em;z-index:4;text-align:center;pointer-events:none;font:900 2.6em 'Space Grotesk',sans-serif;color:#fff;text-shadow:0 .06em .3em rgba(0,0,0,.5)}

.row2{position:absolute;left:0;right:0;top:3.9em;z-index:4;display:flex;justify-content:space-between;padding:0 1em;pointer-events:none}
.stat{font:800 1em 'Space Grotesk',sans-serif;text-shadow:0 .1em .3em rgba(0,0,0,.5);display:flex;flex-direction:column;gap:.2em}

#pw{position:absolute;left:0;right:0;top:8.4em;z-index:4;display:flex;justify-content:center;gap:.5em;pointer-events:none}
.chip{font:800 .8em 'Noto Sans TC',sans-serif;padding:.3em .7em;border-radius:1em;background:rgba(14,20,44,.7);border:1px solid var(--line)}
#bn{position:absolute;left:0;right:0;top:32%;text-align:center;z-index:6;pointer-events:none;font:900 1.7em 'Noto Sans TC',sans-serif;color:#fff;letter-spacing:.12em;text-shadow:0 .08em .4em rgba(0,0,0,.65);opacity:0;transform:scale(.8)}
#bn.on{animation:bn 1.8s ease-out}
@keyframes bn{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.05)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}

#hint{position:absolute;left:0;right:0;bottom:2.4em;text-align:center;z-index:4;pointer-events:none;font-size:.85em;color:#fff;text-shadow:0 .1em .4em rgba(0,0,0,.7);opacity:0;transition:opacity .4s}

.ov.mid{align-items:center;background:rgba(5,8,20,.7);backdrop-filter:blur(3px)}
.ov.on{display:flex}
.card{width:100%;max-width:22em;background:var(--card);border:1px solid var(--line);border-radius:1.3em;padding:1.1em;display:flex;flex-direction:column;gap:.75em;text-align:center;box-shadow:0 1.2em 3em rgba(0,0,0,.5)}

.card p{margin:0;color:#DDE3FA;font-size:.88em;line-height:1.6}
.sub{color:var(--dim);font-size:.8em}

.btn.g{background:#2a3566;color:var(--txt);box-shadow:0 .24em 0 #11183a;border:1px solid var(--line)}
.btn:active{transform:translateY(.12em)}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em}

.wrap.menu #dist,.wrap.menu .row2,.wrap.menu #pw{display:none}
.row{display:flex;gap:.6em}.row>*{flex:1}

#nogl{display:none;position:absolute;inset:0;z-index:30;align-items:center;justify-content:center;text-align:center;padding:2em;background:#0b1020;color:var(--dim);line-height:1.7}
html,body{position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none}
</style>
</head>

</div>

 if(lines){g.fillStyle='rgba(60,40,10,.28)';for(const x of[128/3,256/3]){for(let y=0;y<128;y+=64)g.fillRect(x-1.5,y,3,34);}}

function layout(){const Wd=innerWidth,Hd=innerHeight;let w,h;if(Wd/Hd<=9/16){w=Wd;h=Hd;}else{h=Hd;w=Hd*9/16;}wrap.style.width=w+'px';wrap.style.height=h+'px';wrap.style.maxHeight='none';wrap.style.fontSize=(w/360*14)+'px';const full=isFS();wrap.style.borderRadius=(full||Wd/Hd<=9/16)?'0':'18px';$('fsI').innerHTML=full?FSI_OUT:FSI_IN;$('fsBtn').style.display=standalone()?'none':'';}
let toastT=0;function toast(m){const e=$('toast');e.innerHTML=m;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{e.style.display='none';},6000);}
function pfsOn(){document.body.classList.add('pfs');size();if(/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))toast('iPhone 的 Safari 不支援網頁全螢幕。<br>點下方「分享」→「加入主畫面」,<br>之後從桌面圖示開啟就是全螢幕。');else toast('此瀏覽器不支援全螢幕,已盡量撐滿畫面。');}
function toggleFS(){const el=document.documentElement;
 if(isFS()){document.body.classList.remove('pfs');const x=document.exitFullscreen||document.webkitExitFullscreen;if(x&&(document.fullscreenElement||document.webkitFullscreenElement)){try{const r=x.call(document);if(r&&r.catch)r.catch(()=>{});}catch(e){}}size();return;}
 const rq=el.requestFullscreen||el.webkitRequestFullscreen;
 if(rq){try{const r=rq.call(el);if(r&&r.then)r.then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(()=>{});}catch(e){}}).catch(()=>pfsOn());}catch(e){pfsOn();}}
 else pfsOn();}
$('fsBtn').onclick=toggleFS;
function size(){layout();const r=wrap.getBoundingClientRect();rd.setPixelRatio(Math.min(2,devicePixelRatio||1));rd.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.fov=cam.aspect<.7?66:54;cam.updateProjectionMatrix();}
addEventListener('resize',size);['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,size));
/* ===== 自動駕駛(主選單展示與測試) ===== */
function autopilot(){
 const H=speed*.62,th=[[],[],[]];
 for(const o of obs){const dd=o.d-dist;if(dd<-1.5||dd>H+4)continue;const lanes=o.w>LANE*2.5?[0,1,2]:[0,1,2].filter(l=>Math.abs(LX(l)-o.x)<o.w/2+.3);
  for(const l of lanes)th[l].push({o,dd,ty:o.type});}
 for(const l of[0,1,2])th[l].sort((a,b)=>a.dd-b.dd);
 const cur=th[P.lane][0];
 const hard=l=>th[l].some(q=>q.ty==='rock'||q.ty==='meteor'||(q.ty==='lava'&&q.dd<H*.9));
 if(cur&&(cur.ty==='rock'||cur.ty==='meteor')&&cur.dd<H){const c=[P.lane-1,P.lane+1].filter(l=>l>=0&&l<=2).sort((a,b)=>th[a].length-th[b].length);if(c.length&&!hard(c[0])){doLane(c[0]-P.lane);}else if(c.length>1&&!hard(c[1]))doLane(c[1]-P.lane);}
 else if(cur&&cur.ty==='lava'&&cur.dd<H*.9){const c=[P.lane-1,P.lane+1].filter(l=>l>=0&&l<=2&&!hard(l)&&!th[l].length);if(c.length&&Math.random()<.5)doLane(c[0]-P.lane);else if(cur.dd<speed*.3&&P.ground)bufJump=.1;}
 else if(cur&&(cur.ty==='log')&&cur.dd<speed*.3&&P.ground)bufJump=.1;
 else if(cur&&(cur.ty==='branch'||cur.ty==='ptero')&&cur.dd<speed*.3&&P.slide<=0)doSlide();
}
/* ===== 碰撞 ===== */
function hitObs(o){
 if(pw.dash>0||god){burst(o.x,1,-0,cc(0xffb02a),0,1);return 'smash';}
 return 'hit';
}
function takeHit(o){
 if(inv>0)return;
 if(pw.shield){pw.shield=false;inv=1.3;sfx.crash();burst(LX(P.lane),1,0,cc(0x4ad8ff),30,2);cam.userData.shake=.4;ui();return;}
 hearts--;inv=1.9;P.stumble=.5;speed*=.6;sfx.hit();cam.userData.shake=.7;burst(P.x,1,0,cc(0xffffff),26,2);ui();
 if(hearts<=0)die();
}
/* ===== 更新 ===== */
function applyBiome(dt){
 const b=Math.max(0,dist||0)/BIOME,i=Math.floor(b),f=b-i,a=PALS[i%3],n=PALS[(i+1)%3],k=f>.88?(f-.88)/.12:0;
 const L=(p)=>tmpC.setHex(a[p]).lerp(new THREE.Color(n[p]),k);
 const sky=L('sky').clone();sc.background.copy(sky);sc.fog.color.copy(sky);
 groundM.color.copy(L('gr'));trackM.color.copy(L('tr'));foM.color.copy(L('fo'));mtM.color.copy(L('mt'));
 const lv=a.lava*(1-k)+n.lava*k;lavaGlow.material.opacity=lv*.6;lavaTop.material.color.setHex(lv>.5?0xff6a1a:0x6a5a4a);
 sunS.material.opacity=1-lv*.85;sc.fog.near=40-lv*12;sc.fog.far=125-lv*35;
 hemiSet(lv);
 if(i!==lastBiome&&S==='play'){lastBiome=i;banner(BN[i%3]);sfx.biome();}else if(i!==lastBiome)lastBiome=i;
}
const hemi=sc.children.find(c=>c.isHemisphereLight);function hemiSet(lv){hemi.intensity=1.15-lv*.35;sun.color.setHex(lv>.5?0xff9a6a:0xfff0d0);}
function update(dt){
 if(!(dt>0))return;
 t+=dt;
 const play=S==='play',run=play||S==='menu'||S==='dying';
 const base=12+Math.min(15,dist*.0065);
 if(S==='ready'){sTime-=dt;const n=Math.ceil(sTime-.5);$('cd').textContent=sTime>.5?n:(sTime>0?'衝!':'');if(sTime<=0){S='play';$('cd').textContent='';}}
 if(play||S==='menu'){
  const tgt=(pw.dash>0?base*1.55:base);speed+=(tgt-speed)*Math.min(1,dt*(speed<tgt?1.4:3));
  if(S==='menu')speed=12;
  dist+=speed*dt;
  if(play){if(pw.magnet>0){pw.magnet-=dt;if(pw.magnet<=0){pw.magnet=0;ui();}}if(pw.dash>0){pw.dash-=dt;if(pw.dash<=0){pw.dash=0;inv=Math.max(inv,1);ui();}}if(inv>0)inv-=dt;}
  if(auto&&(play||S==='menu'))autopilot();
 }else if(S==='ready'){P.phase+=dt*3;}
 /* 玩家物理 */
 if(play||S==='menu'||S==='ready'){
  const gx=LX(P.lane);P.x+=(gx-P.x)*Math.min(1,dt*13);P.tilt+=((gx-P.x)*-.18-P.tilt)*Math.min(1,dt*10);
  if(play||S==='menu'){
   if(P.ground)P.coy=.09;else P.coy-=dt;
   if(bufJump>0){bufJump-=dt;if(P.coy>0&&P.slide<=0||(P.coy>0)){P.vy=13;P.ground=false;P.coy=0;bufJump=0;P.slide=0;sfx.jump();burst(P.x,.1,0,cc(0xe8dcc0),8,.8,.4);}}
   P.vy-=40*dt;P.y+=P.vy*dt;if(P.y<=0){if(!P.ground&&P.vy<-8){burst(P.x,.1,0,cc(0xe8dcc0),10,1,.4);}P.y=0;P.vy=0;P.ground=true;}else P.ground=false;
   if(P.slide>0)P.slide-=dt;
   P.phase+=dt*speed*.5;
   const sn=Math.sin(P.phase);if(P.ground&&P.slide<=0&&((sn>0)!==(P.lastStep>0))){if(play)sfx.step();burst(P.x,.1,.4,cc(0xe8dcc0),2,.5,.3);}P.lastStep=sn;
  }
  if(P.stumble>0)P.stumble-=dt;
 }
 if(S==='dying'){P.dead-=dt;}
 /* 世界捲動 */
 const d=run&&S!=='dying'?speed*dt:0;
 grassT.offset.y+=d/5;trackT.offset.y+=d/5;
 /* 生成與回收 */
 if(play||S==='menu'){while(nextD<dist+130)spawnRow(nextD);
  for(const o of scen){if(o.d<dist-12)placeScen(o,dist+120+Math.random()*10);}
 }
 for(const o of scen){o.g.position.set(o.x,0,-(o.d-dist));if(o.k)o.g.position.y=.2*o.sc;}
 for(let i=obs.length-1;i>=0;i--){const o=obs[i];
  if(o.fly&&(play||S==='menu'))o.d-=7*dt;
  const dd=o.d-dist;o.mesh.position.set(o.x,0,-dd);
  if(o.type==='ptero'){o.wings[0].rotation.z=Math.sin(t*14)*.5;o.wings[1].rotation.z=-Math.sin(t*14)*.5;o.mesh.position.y=1.3+Math.sin(t*3)*.1;}
  if(o.type==='meteor'){const win=speed*1.15;if(dd<win&&!o.fall){o.fall=true;sfx.meteor();}const u=Math.max(0,Math.min(1,dd/win));o.ball.position.y=o.fall?.9+u*u*14:15;o.ring.scale.setScalar(1+.15*Math.sin(t*14));o.ball.visible=o.fall;}
  if(o.type==='lava'){o.gl.material.opacity=.55+.2*Math.sin(t*6+o.d);}
  if(dd<-10){sc.remove(o.mesh);obs.splice(i,1);continue;}
  if(play&&!o.done&&Math.abs(dd)<o.depth/2+.45){
   const px=P.x,ph=P.slide>0?.6:1.4;
   if(Math.abs(px-o.x)<o.w/2+.38){
    const hitY=P.y<o.yMax&&P.y+ph>o.yMin;
    let hit=hitY;if(o.type==='meteor')hit=hitY&&o.fall&&o.ball.position.y<1.8&&Math.abs(dd)<1.2;
    if(hit){
     if(o.type==='meteor'&&o.ball.position.y>=1.8){}
     else{const r=hitObs(o);o.done=true;if(r==='smash'){burst(o.x,1,-dd,cc(0xffb02a),24,2);sfx.crash();dist+=0;o.mesh.visible=false;}else takeHit(o);}
    }
   }
  }
 }
 for(let i=picks.length-1;i>=0;i--){const p=picks[i];
  let dd=p.d-dist;
  if(play&&pw.magnet>0&&p.k==='egg'&&dd<9&&dd>-2&&Math.abs(p.x-P.x)<6){p.x+=(P.x-p.x)*Math.min(1,dt*8);p.d+=(dist-p.d)*Math.min(1,dt*6)*.6;p.y+=(1-p.y)*Math.min(1,dt*6);dd=p.d-dist;}
  p.mesh.position.set(p.x,p.y+(p.big?Math.sin(t*4)*.12:0),-dd);p.mesh.rotation.y=t*3;
  if(dd<-8){sc.remove(p.mesh);picks.splice(i,1);continue;}
  if(play&&!p.got&&Math.abs(dd)<.9&&Math.abs(p.x-P.x)<1.0&&Math.abs(p.y-(P.y+.7))<1.2){p.got=true;sc.remove(p.mesh);picks.splice(i,1);
   if(p.k==='egg'){eggs++;sfx.egg();burst(p.x,p.y,0,cc(0xffe07a),6,1);}
   else{sfx.power();burst(p.x,p.y,0,cc(p.k==='shield'?0x4ad8ff:p.k==='magnet'?0xff4a5a:0xffb02a),26,2);if(p.k==='shield')pw.shield=true;else if(p.k==='magnet')pw.magnet=9;else{pw.dash=4;inv=5;banner('衝刺!');}}
   ui();}
 }
 if(play&&Math.floor(t*10)!==Math.floor((t-dt)*10))ui();
 applyBiome(dt);
 /* 恐龍姿態 */
 const sn=P.phase,ground=P.ground&&S!=='dying';
 const lA=ground?Math.sin(sn)*.9:-.7,rA=ground?Math.sin(sn+Math.PI)*.9:-.5;
 legs[0].hip.rotation.x=lA;legs[1].hip.rotation.x=rA;
 legs[0].knee.rotation.x=ground?(Math.cos(sn)*.5+.6):.9;legs[1].knee.rotation.x=ground?(Math.cos(sn+Math.PI)*.5+.6):.9;
 arms[0].rotation.x=Math.sin(sn+Math.PI)*.6;arms[1].rotation.x=Math.sin(sn)*.6;
 tailG.rotation.y=Math.sin(sn*.5)*.35;tailG.rotation.x=ground?-.05:.4;
 headG.rotation.x=Math.sin(sn*2)*.05+(ground?0:-.15);
 { const g=Math.max(0,Math.sin(t*.7)-.82)*5.5;headG.rotation.y=Math.min(1,g)*.95;headG.rotation.z=Math.min(1,g)*.18;
   const bl=(Math.floor(t*10)%37===0)?1:0;lids[0].scale.y=lids[1].scale.y=bl?1:.001;
   for(let i=0;i<flaps.length;i++){flaps[i].rotation.x=.18+Math.sin(t*9-i*1.1)*.3*(S==='play'||S==='menu'?1:.3);flaps[i].rotation.y=Math.sin(t*6-i)*.15;} }
 const sl=P.slide>0&&S!=='dying';
 const bob=ground&&!sl&&S!=='ready'?Math.abs(Math.sin(sn))*.08:0;
 root.position.y=(sl?.05:bob);root.rotation.x+=((sl?-.95:(ground?0:.12))-root.rotation.x)*Math.min(1,dt*18);
 root.scale.y+=((sl?.78:1)-root.scale.y)*Math.min(1,dt*18);
 dino.position.set(P.x,P.y,0);dino.rotation.z=P.tilt;dino.rotation.y=Math.sin(P.stumble*20)*.2*(P.stumble>0?1:0);
 if(S==='dying'){const k=1-P.dead/1.2;dino.rotation.z=k*5;dino.rotation.x=k*1.2;dino.position.y=Math.max(0,Math.sin(k*3.1)*1.2);}
 if(S==='ready'||S==='menu'){}
 const flick=inv>0&&pw.dash<=0&&!pw.shield&&S==='play'&&Math.floor(t*14)%2===0;dino.visible=!flick;
 shield.visible=pw.shield;shield.rotation.y=t;shield.material.opacity=.22+.08*Math.sin(t*6);
 blob.position.set(P.x,.015,0);blob.scale.setScalar(1-Math.min(.5,P.y*.18));
 /* 衝刺火焰 */
 if(pw.dash>0&&play){burst(P.x,.9,.8,cc(0xff8a2a),3,.8,.4);}
 for(const s of streaks){const on=pw.dash>0&&S==='play';s.material.opacity=on?.45:0;s.position.z+=(speed*1.6)*dt*(on?1:0);if(s.position.z>9){s.position.set((Math.random()-.5)*14,.3+Math.random()*6,-48-Math.random()*8);}}
 /* 粒子 */
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue;}p.vy-=7*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=(p.vz+speed*.5*(S==='play'?1:0))*dt;if(p.y<.05){p.y=.05;p.vy*=-.3;}}
 for(let i=0;i<PMAX;i++){const p=parts[i];if(p){pPos[i*3]=p.x;pPos[i*3+1]=p.y;pPos[i*3+2]=p.z;const q=Math.min(1,p.l*2.4);pCol[i*3]=p.c.r*q;pCol[i*3+1]=p.c.g*q;pCol[i*3+2]=p.c.b*q;}else{pPos[i*3+1]=-50;pCol[i*3]=pCol[i*3+1]=pCol[i*3+2]=0;}}
 pG.attributes.position.needsUpdate=true;pG.attributes.color.needsUpdate=true;
 for(const c of clouds){c.g.position.x+=c.v*dt;if(c.g.position.x>90)c.g.position.x=-90;}
 /* 相機 */
 const menu=S==='menu';camMode+=((menu?1:0)-camMode)*Math.min(1,dt*3);
 const sh=cam.userData.shake||0;if(sh>0)cam.userData.shake=Math.max(0,sh-dt*1.6);
 const fovT=(cam.aspect<.7?66:54)+(pw.dash>0?10:0)+Math.min(6,(speed-12)*.3);cam.fov+=(fovT-cam.fov)*Math.min(1,dt*4);cam.updateProjectionMatrix();
 const hx=P.x*.55,hy=3.55+P.y*.25;
 cam.position.set(hx*(1-camMode)+(P.x+6.4)*camMode+(Math.random()-.5)*sh*.5,hy*(1-camMode)+2.4*camMode+(Math.random()-.5)*sh*.5,6.1*(1-camMode)+(-3.6)*camMode);
 cam.lookAt(P.x*.3*(1-camMode)+P.x*camMode,1.2*(1-camMode)+(.35)*camMode,(-7)*(1-camMode)+(-.6)*camMode);
 sun.position.set(-8,14,8);
}
/* ===== 主迴圈 ===== */
let last=performance.now();
function loop(ms){const dt=Math.max(0,Math.min(.05,(ms-last)/1000));last=ms;if(S!=='pause')update(dt*TS);rd.render(sc,cam);requestAnimationFrame(loop);}
applySkin(SV.skin);size();openMenu();requestAnimationFrame(loop);
window.__DD={state:()=>S,info:()=>({dist,speed,eggs,hearts,inv,pw,obs:obs.length,picks:picks.length,y:P.y,lane:P.lane}),auto:v=>{auto=v;},god:v=>{god=v;},ts:v=>{TS=v;},start:startGame,doLane,doJump,doSlide,setDist:v=>{dist=v;},SV};
})();}catch(e){console.warn(e);$('nogl').style.display='flex';}
</script>
