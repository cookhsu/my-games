 {n:'魔王',e:'👑',d:'所有的強牌他都有,終極考驗。',deck:{dragon:2,giant:2,bolt:3,fire:3,poison:2,holy:2,wall:2,knight:2,rage:1,idea:2},hp:26,arm:2,dr:0,ping:1}
];
let SV={stars:Array(10).fill(0),best:Array(10).fill(0),snd:1,tut:0};
try{const s=JSON.parse(localStorage.getItem('cards_save')||'null');if(s&&typeof s==='object')SV=Object.assign(SV,s);}catch(e){}
function save(){try{localStorage.setItem('cards_save',JSON.stringify(SV));}catch(e){}}
const unlockedStage=()=>{let u=0;for(let i=0;i<10;i++){if(SV.stars[i]>0)u=i+1;else break;}return u;};
const unlockedCards=(n)=>{const k=n==null?SV.stars.filter(x=>x>0).length:n;return BASE.concat(REW.slice(0,Math.min(REW.length,k)));};
/* audio */
let AC=null;
function au(){if(!SV.snd)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function beep(f,d,type,vol,to){const a=au();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime);if(to)o.frequency.exponentialRampToValueAtTime(to,a.currentTime+d);g.gain.setValueAtTime(vol||.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+.02);}catch(e){}}
function mulb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ===== pure game logic ===== */
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pdeck(ids){const out=[];for(const id of ids){const c=CARDS[id].c;const n=id==='med'?1:c<=3?2:1;for(let k=0;k<n;k++)out.push(id);}return out;}
function odeck(o){const out=[];for(const id in o.deck)for(let k=0;k<o.deck[id];k++)out.push(id);return out;}
function side(deck,hp,r,nm,em){return {hp,max:hp,arm:0,en:0,mx:0,deck:shuffle(deck,r),disc:[],hand:[],bd:[],nm,em};}
function newGame(i,seed,unl){
 const r=mulb(seed||(Date.now()&0xffff)),o=OPP[i];
 const st={r,i,turn:0,pt:0,cur:'p',over:null,ev:[],log:'',p:side(pdeck(unlockedCards(unl)),30,r,'你','🧑'),o:side(odeck(o),o.hp,r,o.n,o.e)};
 draw(st,'p',3);draw(st,'o',3);return st;
}
function draw(st,w,n){const s=st[w];for(let k=0;k<n;k++){if(!s.deck.length){s.deck=shuffle(s.disc,st.r);s.disc=[];}if(!s.deck.length)return;const c=s.deck.pop();if(s.hand.length<6)s.hand.push(c);else s.disc.push(c);}}
const foe=w=>w==='p'?'o':'p';
function chk(st){if(st.over)return;if(st.o.hp<=0)st.over='p';else if(st.p.hp<=0)st.over='o';}
function hitHero(st,w,v,pierce){const s=st[w];let d=v;if(!pierce&&s.arm>0){const a=Math.min(s.arm,d);s.arm-=a;d-=a;}s.hp-=d;st.ev.push({t:'dmg',w,i:-1,v:v});chk(st);}
function hitMin(st,w,i,v){const m=st[w].bd[i];if(!m)return;m.h-=v;st.ev.push({t:'dmg',w,i,v});}
function sweep(st){for(const w of ['p','o']){st[w].bd=st[w].bd.filter(m=>m.h>0);}}
function startTurn(st,w){
 const s=st[w],o=OPP[st.i];
 st.cur=w;s.mx=Math.min(6,s.mx+1);s.en=s.mx;s.arm=0;
 if(w==='p')st.pt++;
 st.turn++;
 const fat=st.pt-9;if(fat>0){hitHero(st,w,fat,true);if(st.over)return;}
 draw(st,w,2+(w==='o'?o.dr:0));
 if(w==='o'){if(o.arm)s.arm=o.arm;if(o.ping){hitHero(st,'p',o.ping,true);}}
 if(st.over)return;
 // minion attacks
 const E=st[foe(w)];
 for(const m of s.bd.slice()){
  if(st.over)break;if(m.h<=0)continue;
  const ti=E.bd.findIndex(x=>x.h>0);
  if(ti>=0){const t=E.bd[ti];t.h-=m.a;st.ev.push({t:'dmg',w:foe(w),i:ti,v:m.a});if(!m.r){m.h-=t.a;st.ev.push({t:'dmg',w,i:s.bd.indexOf(m),v:t.a});}}
  else hitHero(st,foe(w),m.a);
 }
 sweep(st);chk(st);
}
function canPlay(st,w,hi){const s=st[w],id=s.hand[hi];if(id==null)return false;const c=CARDS[id];if(c.c>s.en)return false;if(c.t==='min'&&s.bd.length>=3)return false;return true;}
function play(st,w,hi,tgt){ // tgt: -1 hero, >=0 enemy minion idx
 if(st.over||!canPlay(st,w,hi))return false;
 const s=st[w],E=st[foe(w)],id=s.hand[hi],c=CARDS[id];
 if(c.tg){if(tgt==null)return false;if(tgt>=0&&!E.bd[tgt])return false;}
 s.hand.splice(hi,1);s.disc.push(id);s.en-=c.c;
 st.log=(w==='p'?'你':s.nm)+'使用 '+c.e+c.n;
 if(c.t==='atk'){if(tgt<0)hitHero(st,foe(w),c.v);else hitMin(st,foe(w),tgt,c.v);}
 else if(c.t==='aoe'){hitHero(st,foe(w),c.v);E.bd.forEach((m,i)=>hitMin(st,foe(w),i,c.v));}
 else if(c.t==='blk'){s.arm+=c.v;st.ev.push({t:'blk',w,v:c.v});}
 else if(c.t==='heal'){const h=Math.min(c.v,s.max-s.hp);s.hp+=h;st.ev.push({t:'heal',w,v:h});}
 else if(c.t==='draw'){draw(st,w,c.v);}
 else if(c.t==='en'){s.en+=c.v;}
 else if(c.t==='rage'){s.bd.forEach(m=>m.a+=c.v);}
 else if(c.t==='min'){s.bd.push({id,a:c.a,h:c.h,r:c.r||0});if(c.bc)hitHero(st,foe(w),c.bc);}
 sweep(st);chk(st);return true;
}
/* AI (used for the opponent, and as the test-bot for the player) */
function aiPick(st,w){
 const s=st[w],E=st[foe(w)];let best=null,bs=-1;
 const eatk=E.bd.reduce((a,m)=>a+m.a,0);
 s.hand.forEach((id,hi)=>{
  if(!canPlay(st,w,hi))return;const c=CARDS[id];let sc=0,tg=null;
  if(c.t==='atk'){
   const lethal=c.v>=E.hp+E.arm;
   if(lethal){sc=1000;tg=-1;}
   else{
    let bm=-1,bv=-1;E.bd.forEach((m,i)=>{if(c.v>=m.h){const v=m.a+m.h+2;if(v>bv){bv=v;bm=i;}}});
    if(bm>=0&&bv>=4){sc=6+bv;tg=bm;}else{sc=3+c.v*.9+(E.hp<=c.v*2.5?4:0);tg=-1;if(E.bd.length&&!bv<0){}}
   }
  }else if(c.t==='aoe'){sc=2+E.bd.filter(m=>m.h<=c.v).length*4+E.bd.length*1.5+(E.hp<=8?3:0);}
  else if(c.t==='min'){sc=7+c.a+c.h*.6+(c.bc?2:0);if(s.bd.length===0)sc+=3;}
  else if(c.t==='blk'){const thr=eatk+(E.bd.length?0:0);sc=thr>0?3+Math.min(c.v,thr)*.8:(s.hp<=10?3:.5);}
  else if(c.t==='heal'){const miss=s.max-s.hp;sc=miss>=c.v?4+(s.hp<=10?6:0):miss>0?1.5:-1;}
  else if(c.t==='draw'){sc=s.hand.length<=3?5:2;}
  else if(c.t==='en'){sc=s.hand.some((x,j)=>j!==hi&&CARDS[x].c===s.en+1)?6:-1;}
  else if(c.t==='rage'){sc=s.bd.length>=2?5+s.bd.length:s.bd.length===1?2:-1;}
  sc+=c.c*.3; // prefer using more energy
  if(sc>bs&&sc>0){bs=sc;best={hi,tg};}
 });
 return best;
}
function aiTurnSync(st,w){startTurn(st,w);let g=0;while(!st.over&&g++<12){const a=aiPick(st,w);if(!a)break;play(st,w,a.hi,a.tg);}}
function simGame(i,seed,unl){const st=newGame(i,seed,unl);let g=0;while(!st.over&&g++<80){aiTurnSync(st,'p');if(st.over)break;aiTurnSync(st,'o');if(st.pt>=30){st.over=st.p.hp>=st.o.hp?'p':'o';}}return {win:st.over==='p',pt:st.pt,hp:st.p.hp};}

/* ===== UI ===== */
const sleep=ms=>new Promise(r=>setTimeout(r,UI.fast?0:ms));
const UI={st:null,sel:-1,busy:false,fast:false,mode:'menu'};
function el(h){const d=document.createElement('div');d.innerHTML=h;return d.firstChild;}
function heroHtml(w,s,showEnd){
 const hp=Math.max(0,s.hp);
 return `<span class="av">${s.em}</span><div class="mid"><b>${s.nm}</b><div class="hp"><i style="width:${hp/s.max*100}%"></i></div><small>❤ ${hp} / ${s.max}${s.arm?'  🛡️'+s.arm:''}</small></div>`+
  (w==='p'?`<span class="tag2">⚡ ${s.en}/${s.mx}</span><button id="endb" ${UI.busy||UI.st.over?'disabled':''}>結束回合</button>`:`<span class="tag2">🂠${s.hand.length} ⚡${s.mx}</span>`);
}
function boardHtml(w,s){
 let h='';for(let i=0;i<3;i++){const m=s.bd[i];h+=`<div class="slot" data-w="${w}" data-i="${i}">`+(m?`<div class="min ${w==='o'&&UI.sel>=0&&CARDS[UI.st.p.hand[UI.sel]]&&CARDS[UI.st.p.hand[UI.sel]].tg?'tgt':''}" id="${w}-m${i}" data-w="${w}" data-i="${i}"><span class="em">${CARDS[m.id].e}</span><span class="nm">${CARDS[m.id].n}</span><span class="a">${m.a}</span><span class="h">${m.h}</span></div>`:'')+'</div>';}
 return h;
}
function cardVal(c){return c.t==='min'?c.a+'/'+c.h:c.t==='atk'||c.t==='aoe'||c.t==='blk'||c.t==='heal'||c.t==='draw'||c.t==='en'||c.t==='rage'?(c.t==='blk'?'+'+c.v:c.v):'';}
function render(){
 const st=UI.st;if(!st)return;
 $('oh').innerHTML=heroHtml('o',st.o);$('ph').innerHTML=heroHtml('p',st.p);
 const sc=UI.sel>=0&&CARDS[st.p.hand[UI.sel]]&&CARDS[st.p.hand[UI.sel]].tg;
 $('oh').classList.toggle('tgt',!!sc);
 $('ob').innerHTML=boardHtml('o',st.o);$('pb').innerHTML=boardHtml('p',st.p);
 $('hand').innerHTML=st.p.hand.map((id,i)=>{const c=CARDS[id],ok=canPlay(st,'p',i)&&!UI.busy&&!st.over;return `<button class="c2 ${c.t==='atk'||c.t==='aoe'?'atk':c.t==='blk'?'blk':c.t==='heal'?'heal':c.t==='min'?'min':'ut'} ${UI.sel===i?'sel':''} ${ok?'':'no'}" data-h="${i}"><span class="co">${c.c}</span><span class="em">${c.e}</span><span class="nm">${c.n}</span><span class="vl">${cardVal(c)}</span></button>`;}).join('');
 const sel=UI.sel>=0?CARDS[st.p.hand[UI.sel]]:null;
 $('dt').textContent=sel?sel.e+' '+sel.n+'('+sel.c+'⚡):'+sel.x+(sel.tg?' ➜ 點敵人出牌':' ➜ 再點一次出牌'):(UI.busy?'對手回合…':'點手牌選取、再點出牌;攻擊牌選好後點敵人。可用能量 ⚡'+st.p.en);
 $('lg').textContent=st.log||'—';$('sc').textContent='第 '+Math.max(1,st.pt)+' 回合';
}
function popups(){
 const st=UI.st;const evs=st.ev;st.ev=[];
 for(const e of evs){
  const t=e.t==='dmg'||e.t==='blk'||e.t==='heal'?(e.i>=0?$((e.w)+'-m'+e.i):$(e.w==='p'?'ph':'oh')):null;if(!t)continue;
  if(e.t==='dmg'&&e.v<=0)continue;
  const f=el(`<span class="fl" style="color:${e.t==='dmg'?'#FF6B5A':e.t==='heal'?'#7CFFB0':'#7FD6FF'}">${e.t==='dmg'?'−':'+'}${e.v}</span>`);t.style.position='relative';t.appendChild(f);setTimeout(()=>f.remove(),900);
  if(e.t==='dmg'){t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),300);beep(e.i>=0?240:180,.09,'square',.08,120);}
  else if(e.t==='heal')beep(780,.12,'sine',.1);else beep(520,.08,'triangle',.08);
 }
}
async function flush(ms){render();popups();await sleep(ms||600);}
function pClick(e){
 const st=UI.st;if(!st||UI.busy||st.over||UI.mode!=='play')return;
 const c=e.target.closest('.c2');
 if(c){const i=+c.dataset.h;
  if(UI.sel===i){const cd=CARDS[st.p.hand[i]];if(!cd.tg&&canPlay(st,'p',i)){doPlay(i,null);}else UI.sel=-1;}
  else{UI.sel=i;beep(500,.04,'triangle',.06);}
  if(!SV.tut){SV.tut=1;save();$('hint').style.display='none';}
  render();return;}
 if(e.target.closest('#endb')){endTurn();return;}
 if(UI.sel>=0){const cd=CARDS[st.p.hand[UI.sel]];
  if(cd&&cd.tg){const m=e.target.closest('.min[data-w="o"]');
   if(m){doPlay(UI.sel,+m.dataset.i);return;}
   if(e.target.closest('#oh')){doPlay(UI.sel,-1);return;}}
  UI.sel=-1;render();}
}
async function doPlay(hi,tg){
 const st=UI.st;if(!canPlay(st,'p',hi)){UI.sel=-1;render();return;}
 UI.sel=-1;play(st,'p',hi,tg);await flush(450);if(st.over)finish();
}
async function endTurn(){
 const st=UI.st;if(UI.busy||st.over)return;UI.busy=true;UI.sel=-1;render();
 await sleep(250);
 startTurn(st,'o');st.log='對手回合';await flush(800);
 let g=0;while(!st.over&&g++<12){const a=aiPick(st,'o');if(!a)break;play(st,'o',a.hi,a.tg);await flush(850);}
 if(!st.over){if(st.pt>=30){st.over=st.p.hp>=st.o.hp?'p':'o';}else{startTurn(st,'p');st.log='你的回合';await flush(800);}}
 UI.busy=false;render();if(st.over)finish();
}
function load(i,seed){
 UI.st=newGame(i,seed);UI.sel=-1;UI.busy=false;UI.mode='play';UI.i=i;
 $('sp').textContent=(i+1)+'. '+OPP[i].n;
 ['menu','res','col'].forEach(x=>$(x).classList.remove('show'));
 startTurn(UI.st,'p');UI.st.log='對手:'+OPP[i].e+OPP[i].n+'  ・  你先攻';render();
 const h=$('hint');if(!SV.tut){h.innerHTML='<b>點手牌</b>選取,<b>再點一次</b>出牌;<br>攻擊牌選取後,點<b>敵人</b>出牌。<br>用完能量就按<b>結束回合</b>。';h.style.display='block';}else h.style.display='none';
}
function finish(){
 const st=UI.st,i=UI.i,win=st.over==='p';UI.mode='over';
 let stars=0;if(win){stars=st.pt<=9&&st.p.hp>=15?3:st.pt<=12?2:1;}
 const first=win&&!(SV.stars[i]>0);
 if(win){SV.stars[i]=Math.max(SV.stars[i]||0,stars);SV.best[i]=SV.best[i]?Math.min(SV.best[i],st.pt):st.pt;}save();
 $('rt').textContent=win?(i===9?'魔王倒下!':'勝利!'):'敗北…';$('rb').textContent=win?'🏆':OPP[i].e;
 $('rs').textContent=OPP[i].e+OPP[i].n+'  ・  '+(win?['','險勝','乾淨俐落','完美決鬥!'][stars]:'再調整一下策略');
 $('rst').innerHTML=[1,2,3].map(k=>k<=stars?'★':'<span class="off">★</span>').join('');
 $('rk').innerHTML=`<div>回合<b>${st.pt}</b></div><div>剩餘生命<b>${Math.max(0,st.p.hp)}</b></div><div>對手生命<b>${Math.max(0,st.o.hp)}</b></div>`;
 const rc=first&&i<REW.length?CARDS[REW[i]]:null;$('rw').textContent=rc?'🎁 獲得新卡 '+rc.e+rc.n+':'+rc.x:(win?'3★:9 回合內獲勝且生命 ≥ 15 ・ 2★:12 回合內獲勝':'');
 $('rn').style.display=(win&&i<9)?'block':'none';
 render();setTimeout(()=>$('res').classList.add('show'),UI.fast?0:600);
 beep(win?660:200,.3,'sine',.15);if(win)setTimeout(()=>beep(880,.3,'sine',.15),160);
}
function openMenu(){
 UI.mode='menu';$('hint').style.display='none';
 const g=$('grid');g.innerHTML='';let tot=0;const un=unlockedStage();
 for(let i=0;i<10;i++){tot+=SV.stars[i]||0;const b=document.createElement('button');b.className='lv';b.disabled=i>un;
  b.innerHTML='<b>'+(i+1)+'</b><i>'+(i>un?'🔒':'★'.repeat(SV.stars[i]||0)||'·')+'</i>';b.onclick=()=>load(i);g.appendChild(b);}
 $('mst').textContent='★ '+tot+' / 30 ・ 卡牌 '+unlockedCards().length+' / 16';
 $('res').classList.remove('show');$('col').classList.remove('show');$('menu').classList.add('show');
}
function openCol(){
 const un=unlockedCards(),ids=Object.keys(CARDS);
 $('cg').innerHTML=ids.map(id=>{const c=CARDS[id],ok=un.indexOf(id)>=0;return `<div class="cc ${ok?'':'no'}"><span class="e">${c.e}</span><span><b>${ok?c.n+' ('+c.c+'⚡)':'???'}</b><small>${ok?c.x:'擊敗更多對手解鎖'}</small></span></div>`;}).join('');
 $('colp').textContent='已收集 '+un.length+' / '+ids.length+' 張卡牌';$('col').classList.add('show');
}
$('mb').onclick=openMenu;$('cont').onclick=()=>load(Math.min(9,unlockedStage()));
$('rn').onclick=()=>load(Math.min(9,UI.i+1));$('rr').onclick=()=>load(UI.i);$('rm').onclick=openMenu;
$('bc').onclick=openCol;$('colx').onclick=()=>$('col').classList.remove('show');
$('snd').onclick=()=>{SV.snd=SV.snd?0:1;save();$('snd').textContent='音效:'+(SV.snd?'開':'關');if(SV.snd)beep(600,.1);};
$('snd').textContent='音效:'+(SV.snd?'開':'關');
$('wrap').addEventListener('click',pClick);
addEventListener('keydown',e=>{if(UI.mode!=='play'||UI.busy)return;if(e.key==='Enter'||e.key==='e')endTurn();else if(e.key>='1'&&e.key<='6'){const i=+e.key-1;if(UI.st.p.hand[i]!=null){UI.sel=UI.sel===i?-1:i;render();}}});
UI.st=newGame(0,1);openMenu();
window.__CD={UI,SV,CARDS,OPP,newGame,startTurn,play,aiPick,aiTurnSync,simGame,load,unlockedCards,render,endTurn,doPlay,finish};
})();
