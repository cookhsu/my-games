<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script>
(function(){
  try{
    var a=document.createElement('audio');
    a.setAttribute('loop',''); a.setAttribute('playsinline',''); a.volume=0;
    a.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(a);});
    var unlocked=false;
    function unlock(){
      if(unlocked) return; unlocked=true;
      a.play().catch(function(){});
      if(window.__RS_AC && window.__RS_AC.state==='suspended'){ window.__RS_AC.resume().catch(function(){}); }
    }
    ['touchstart','mousedown','keydown'].forEach(function(ev){ window.addEventListener(ev, unlock, {once:false, passive:true}); });
  }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>彩虹旋門</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#10141F; --ink:#F2F4FF; --muted:#9AA3C0; --gold:#FFC83D; --red:#FF5A6B; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; background:#000; height:100%; overflow:hidden; overscroll-behavior:none;}
  body{ display:flex; align-items:center; justify-content:center; font-family:'Noto Sans TC','Fredoka',sans-serif;
    color:var(--ink); min-height:100vh; min-height:100dvh;
    background:radial-gradient(ellipse at 50% 0%, #1b2236 0%, #10141F 65%); }
  .wrap{ position:relative; width:360px; height:640px; max-width:100vw; max-height:100vh; aspect-ratio:360/640; background:var(--bg); overflow:hidden; }
  @media (max-width:360px), (max-height:640px){ .wrap{ width:100vw; height:100vh; height:100dvh; } }
  canvas{ display:block; position:absolute; touch-action:none; }

  .topbar{ position:absolute; top:0; left:0; right:0; display:none; flex-direction:column; gap:6px;
    padding:10px 56px 0 14px; font-family:'Fredoka',sans-serif; pointer-events:none; z-index:4; }
  .topbar.on{ display:flex; }
  .topbar .row{ display:flex; align-items:center; justify-content:space-between; }
  .topbar .pill{ background:rgba(10,14,24,.6); border:1px solid rgba(255,255,255,.12); padding:5px 11px; border-radius:999px; font-size:13px; }
  .topbar .pill b{ color:var(--gold); }

  .menuBtn{ position:absolute; top:10px; right:14px; width:32px; height:32px; border-radius:50%;
    background:rgba(10,14,24,.6); border:1px solid rgba(255,255,255,.12); color:var(--ink);
    font-size:15px; display:none; align-items:center; justify-content:center; cursor:pointer; z-index:6; }
  .menuBtn.on{ display:flex; }

  .hint{ position:absolute; left:0; right:0; bottom:26px; text-align:center; font-size:13px; color:var(--muted);
    display:none; z-index:4; pointer-events:none; }
  .hint.on{ display:block; }

  .ov{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px; background:rgba(8,10,18,.76); backdrop-filter:blur(6px); z-index:10; gap:14px; }
  .ov.hidden{ display:none; }
  .ov h1{ font-family:'Fredoka',sans-serif; font-size:29px; margin:0; letter-spacing:1px;
    background:linear-gradient(90deg,#FF5A6B,#FFC83D,#5CE68C,#4DD0FF); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .ov h2{ font-family:'Fredoka',sans-serif; font-size:21px; margin:0; }
  .ov p.sub{ margin:0; color:var(--muted); font-size:13.5px; line-height:1.7; max-width:280px; }
  .ov .stat{ font-size:13.5px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .ov .stat b{ color:var(--gold); font-size:16px; }
  .btn{ font-family:'Fredoka',sans-serif; font-size:16px; font-weight:600; color:#10141f;
    background:linear-gradient(135deg,var(--gold),#ffe08a); border:none; padding:13px 32px; border-radius:999px;
    cursor:pointer; box-shadow:0 6px 18px rgba(255,200,61,.3); letter-spacing:.5px; }
  .btn.alt{ background:rgba(255,255,255,.08); color:var(--ink); box-shadow:none; border:1px solid rgba(255,255,255,.18); }
  .btn:active{ transform:scale(.96); }
  .btnrow{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <canvas id="c" width="360" height="640"></canvas>

  <div class="topbar" id="topbar">
    <div class="row">
      <div class="pill">分數 <b id="scoreTxt">0</b></div>
      <div class="pill">最佳 <b id="bestTxt2">0</b></div>
    </div>
  </div>
  <div class="menuBtn" id="menuBtn">☰</div>
  <div class="hint" id="hint">按住減速・放開加速，對準顏色穿越旋門</div>

  <div class="ov" id="ovMenu">
    <h1>彩虹旋門</h1>
    <p class="sub">球會自動下墜，按住畫面可以減速煞車，放開恢復正常速度。小球只能穿過顏色相同的旋門區塊，抓準時機通過越多道旋門分數越高！</p>
    <div class="stat">最佳紀錄 <b id="bestTxt">0</b> 道</div>
    <button class="btn" id="btnStart">開始挑戰</button>
  </div>

  <div class="ov hidden" id="ovLose">
    <h2>💥 撞到旋門了</h2>
    <p class="sub" id="loseDetail"></p>
    <div class="btnrow">
      <button class="btn" id="btnRetry">再玩一次</button>
      <button class="btn alt" id="btnMenu1">返回選單</button>
    </div>
  </div>

  <div class="ov hidden" id="ovPause">
    <h2>已暫停</h2>
    <div class="btnrow">
      <button class="btn" id="btnResume">繼續遊戲</button>
      <button class="btn alt" id="btnMenu2">返回選單</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=360,H=640;
var $=function(id){return document.getElementById(id);};

function mulberry32(seed){
  return function(){
    seed|=0; seed=(seed+0x6D2B79F5)|0;
    var t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
var rng=mulberry32(Date.now()|0);

var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); window.__RS_AC=AC; }catch(e){} } return AC; }
function playTone(freq,dur,type,vol,sweepTo){
  var c=ac(); if(!c) return;
  try{
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,c.currentTime);
    if(sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo,c.currentTime+dur);
    g.gain.setValueAtTime(vol||0.14,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
  }catch(e){}
}
function sfxPass(){ playTone(520,0.1,'sine',0.12,760); }
function sfxCrash(){ playTone(160,0.35,'sawtooth',0.18,55); }
function sfxMilestone(){ playTone(660,0.12,'triangle',0.14,990); setTimeout(function(){playTone(880,0.14,'triangle',0.12);},80); }

var COLORS=['#FF5A6B','#FFC83D','#5CE68C','#4DD0FF'];
var COLOR_NAMES=['紅','黃','綠','藍'];

var PASS_Y=230;
var BALL_R=15;
var RING_R_OUT=72;
var RING_R_IN=46;
var RING_GAP=215;
var BASE_FALL=132;
var HOLD_MULT=0.42;
var BASE_ROT=0.85;
var ROT_STEP=0.045;
var ROT_CAP=2.6;

function S0(){
  var best=0;
  try{ var v=localStorage.getItem('rs_best'); if(v) best=parseInt(v,10)||0; }catch(e){}
  return {
    phase:'menu',
    prePausePhase:null,
    holding:false,
    ball:{color:0},
    score:0,
    best:best,
    rings:[],
    nextSpawnY:0,
    elapsed:0
  };
}
var S=S0();

function markerColorIdx(ring){
  var TWO_PI=Math.PI*2;
  var a=((-Math.PI/2 - ring.angle) % TWO_PI + TWO_PI) % TWO_PI;
  var idx=Math.floor(a/(Math.PI/2)) % 4;
  return ring.colors[idx];
}

function makeRing(index,y){
  var cols=[0,1,2,3];
  // seeded shuffle
  for(var i=cols.length-1;i>0;i--){
    var j=Math.floor(rng()*(i+1));
    var tmp=cols[i]; cols[i]=cols[j]; cols[j]=tmp;
  }
  return {
    y:y,
    colors:cols,
    angle:rng()*Math.PI*2,
    dir: rng()<0.5 ? 1 : -1,
    rotSpeed: Math.min(ROT_CAP, BASE_ROT + index*ROT_STEP),
    passed:false
  };
}

function spawnInitialRings(){
  S.rings=[];
  var y=H+160;
  for(var i=0;i<6;i++){
    S.rings.push(makeRing(i,y));
    y+=RING_GAP;
  }
  S.nextSpawnY=y;
  S.nextRingIndex=6;
}

function resetState(){
  var fresh=S0();
  for(var k in S){ if(Object.prototype.hasOwnProperty.call(S,k)) delete S[k]; }
  for(var k2 in fresh){ if(Object.prototype.hasOwnProperty.call(fresh,k2)) S[k2]=fresh[k2]; }
}

function startGame(){
  rng=mulberry32(Date.now()|0);
  resetState();
  S.phase='playing';
  spawnInitialRings();
  $('topbar').classList.add('on');
  $('menuBtn').classList.add('on');
  $('hint').classList.add('on');
  renderHUD();
}

function renderHUD(){
  $('scoreTxt').textContent=String(S.score);
  $('bestTxt2').textContent=String(S.best);
  $('bestTxt').textContent=String(S.best);
}

function fallSpeed(){
  var base=BASE_FALL + Math.min(90, S.score*1.6);
  return S.holding ? base*HOLD_MULT : base;
}

function update(dt){
  if(S.phase!=='playing') return;
  S.elapsed+=dt;
  var spd=fallSpeed();
  for(var i=0;i<S.rings.length;i++){
    var r=S.rings[i];
    r.angle += r.dir*r.rotSpeed*dt;
    var prevY=r.y;
    r.y -= spd*dt;
    if(!r.passed && prevY>PASS_Y && r.y<=PASS_Y){
      r.passed=true;
      var reqColor=markerColorIdx(r);
      if(reqColor===S.ball.color){
        S.score++;
        sfxPass();
        if(S.score%10===0) sfxMilestone();
        // assign next required color (random, can repeat)
        S.ball.color=Math.floor(rng()*4);
        renderHUD();
      }else{
        endGame();
        return;
      }
    }
  }
  // spawn more rings as needed
  while(S.rings.length && S.rings[S.rings.length-1].y < H+160-RING_GAP*0.2 && S.rings.length<8){
    S.rings.push(makeRing(S.nextRingIndex, S.nextSpawnY));
    S.nextSpawnY+=RING_GAP;
    S.nextRingIndex++;
  }
  // drop off-screen passed rings
  while(S.rings.length && S.rings[0].y < -140){
    S.rings.shift();
  }
}

function endGame(){
  S.phase='lose';
  sfxCrash();
  if(S.score>S.best){ S.best=S.score; try{localStorage.setItem('rs_best',String(S.best));}catch(e){} }
  $('topbar').classList.remove('on');
  $('menuBtn').classList.remove('on');
  $('hint').classList.remove('on');
  $('loseDetail').textContent='通過了 '+S.score+' 道旋門，最佳紀錄 '+S.best+' 道。';
  show('ovLose');
  renderHUD();
}

function backToMenu(){
  S.phase='menu';
  $('topbar').classList.remove('on');
  $('menuBtn').classList.remove('on');
  $('hint').classList.remove('on');
  show('ovMenu');
}

function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }

$('btnStart').addEventListener('click',function(){ hide('ovMenu'); startGame(); });
$('btnRetry').addEventListener('click',function(){ hide('ovLose'); startGame(); });
$('btnMenu1').addEventListener('click',function(){ hide('ovLose'); backToMenu(); });
$('btnMenu2').addEventListener('click',function(){ hide('ovPause'); backToMenu(); });
$('btnResume').addEventListener('click',function(){
  if(S.phase==='paused'){ hide('ovPause'); S.phase=S.prePausePhase||'playing'; }
});
$('menuBtn').addEventListener('click',function(){
  if(S.phase!=='playing') return;
  S.prePausePhase=S.phase;
  S.phase='paused';
  show('ovPause');
});

function setHold(v){
  S.holding=v;
}
cv.addEventListener('pointerdown',function(e){ e.preventDefault(); if(S.phase==='playing') setHold(true); },{passive:false});
window.addEventListener('pointerup',function(){ setHold(false); });
window.addEventListener('pointercancel',function(){ setHold(false); });
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });

function draw(){
  ctx.clearRect(0,0,W,H);
  var grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#1b2236'); grd.addColorStop(1,'#10141F');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);

  // falling star trail background
  ctx.save();
  ctx.globalAlpha=0.35;
  for(var s=0;s<14;s++){
    var sx=(s*53+ (S.elapsed*30)%360 )%360;
    var sy=(s*97 + (S.elapsed*60))%H;
    ctx.fillStyle='#fff';
    ctx.fillRect(sx,sy,2,2);
  }
  ctx.restore();

  // rings
  for(var i=0;i<S.rings.length;i++){
    drawRing(S.rings[i]);
  }

  // ball
  var bx=W/2, by=PASS_Y;
  ctx.save();
  ctx.shadowColor=COLORS[S.ball.color];
  ctx.shadowBlur = S.holding? 6:16;
  ctx.fillStyle=COLORS[S.ball.color];
  ctx.beginPath(); ctx.arc(bx,by,BALL_R,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(bx,by,BALL_R,0,Math.PI*2); ctx.stroke();

  // pass line marker (subtle)
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,PASS_Y); ctx.lineTo(W,PASS_Y); ctx.stroke();
}

function drawRing(r){
  if(r.y< -130 || r.y>H+130) return;
  var cx=W/2, cy=r.y;
  for(var q=0;q<4;q++){
    var a0=r.angle+q*(Math.PI/2);
    var a1=a0+Math.PI/2;
    ctx.beginPath();
    ctx.fillStyle=COLORS[r.colors[q]];
    ctx.moveTo(cx+Math.cos(a0)*RING_R_IN, cy+Math.sin(a0)*RING_R_IN);
    ctx.arc(cx,cy,RING_R_OUT,a0,a1,false);
    ctx.arc(cx,cy,RING_R_IN,a1,a0,true);
    ctx.closePath();
    ctx.fill();
  }
  // dividing lines
  ctx.strokeStyle='rgba(10,14,24,.55)'; ctx.lineWidth=3;
  for(var q2=0;q2<4;q2++){
    var a=r.angle+q2*(Math.PI/2);
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*RING_R_IN, cy+Math.sin(a)*RING_R_IN);
    ctx.lineTo(cx+Math.cos(a)*RING_R_OUT, cy+Math.sin(a)*RING_R_OUT);
    ctx.stroke();
  }
  // outer/inner ring outline
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(cx,cy,RING_R_OUT,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,RING_R_IN,0,Math.PI*2); ctx.stroke();
  // marker notch at top (12 o'clock, fixed screen position)
  var mx=cx, my=cy-((RING_R_OUT+RING_R_IN)/2);
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.moveTo(mx-6,my-8); ctx.lineTo(mx+6,my-8); ctx.lineTo(mx,my+2);
  ctx.closePath(); ctx.fill();
}

var lastT=null;
function loop(ts){
  if(lastT===null) lastT=ts;
  var dt=Math.min(0.05,(ts-lastT)/1000);
  lastT=ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
renderHUD();

window.__RS = {
  state:S,
  colors:COLORS,
  start:function(){ $('btnStart').click(); },
  retry:function(){ if(!$('ovLose').classList.contains('hidden')) $('btnRetry').click(); },
  press:function(){ setHold(true); },
  release:function(){ setHold(false); },
  advance:function(seconds){
    var steps=Math.round(seconds/0.016);
    for(var i=0;i<steps;i++) update(0.016);
  },
  markerColorIdx:markerColorIdx
};
})();
</script>
</body>
</html>
