<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script>
(function(){
  try{
    var a=document.createElement('audio');
    a.setAttribute('loop',''); a.setAttribute('playsinline',''); a.volume=0;
    a.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(a);});
    var unlocked=false;
    function unlock(){
      if(unlocked) return; unlocked=true;
      a.play().catch(function(){});
      if(window.__CF_AC && window.__CF_AC.state==='suspended'){ window.__CF_AC.resume().catch(function(){}); }
    }
    ['touchstart','mousedown','keydown'].forEach(function(ev){ window.addEventListener(ev, unlock, {once:false, passive:true}); });
  }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>色彩漫延</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#10141F; --ink:#F2F4FF; --muted:#9AA3C0; --gold:#FFC83D; --red:#FF5A6B; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; background:#000; height:100%; overflow:hidden; overscroll-behavior:none;}
  body{ display:flex; align-items:center; justify-content:center; font-family:'Noto Sans TC','Fredoka',sans-serif;
    color:var(--ink); min-height:100vh; min-height:100dvh;
    background:radial-gradient(ellipse at 50% 0%, #1b2236 0%, #10141F 65%); }
  .wrap{ position:relative; width:360px; height:640px; max-width:100vw; max-height:100vh; aspect-ratio:360/640; background:var(--bg); overflow:hidden; }
  @media (max-width:360px), (max-height:640px){ .wrap{ width:100vw; height:100vh; height:100dvh; } }
  canvas{ display:block; position:absolute; touch-action:none; }

  .topbar{ position:absolute; top:0; left:0; right:0; display:none; flex-direction:column; gap:6px;
    padding:10px 56px 0 14px; font-family:'Fredoka',sans-serif; pointer-events:none; z-index:4; }
  .topbar.on{ display:flex; }
  .topbar .row{ display:flex; align-items:center; justify-content:space-between; }
  .topbar .pill{ background:rgba(10,14,24,.6); border:1px solid rgba(255,255,255,.12); padding:5px 11px; border-radius:999px; font-size:13px; }
  .topbar .pill b{ color:var(--gold); }

  .menuBtn{ position:absolute; top:10px; right:14px; width:32px; height:32px; border-radius:50%;
    background:rgba(10,14,24,.6); border:1px solid rgba(255,255,255,.12); color:var(--ink);
    font-size:15px; display:none; align-items:center; justify-content:center; cursor:pointer; z-index:6; }
  .menuBtn.on{ display:flex; }

  .swatches{ position:absolute; left:0; right:0; bottom:28px; display:none; justify-content:center; gap:10px; z-index:4; }
  .swatches.on{ display:flex; }
  .sw{ width:44px; height:44px; border-radius:12px; border:3px solid rgba(255,255,255,.15); cursor:pointer; }
  .sw.cur{ border-color:#fff; box-shadow:0 0 14px 2px rgba(255,255,255,.5); }

  .ov{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px; background:rgba(8,10,18,.76); backdrop-filter:blur(6px); z-index:10; gap:14px; }
  .ov.hidden{ display:none; }
  .ov h1{ font-family:'Fredoka',sans-serif; font-size:29px; margin:0; letter-spacing:1px;
    background:linear-gradient(90deg,#4DD0FF,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .ov h2{ font-family:'Fredoka',sans-serif; font-size:21px; margin:0; }
  .ov p.sub{ margin:0; color:var(--muted); font-size:13.5px; line-height:1.7; max-width:280px; }
  .ov .stat{ font-size:13.5px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .ov .stat b{ color:var(--gold); font-size:16px; }
  .btn{ font-family:'Fredoka',sans-serif; font-size:16px; font-weight:600; color:#10141f;
    background:linear-gradient(135deg,var(--gold),#ffe08a); border:none; padding:13px 32px; border-radius:999px;
    cursor:pointer; box-shadow:0 6px 18px rgba(255,200,61,.3); letter-spacing:.5px; }
  .btn.alt{ background:rgba(255,255,255,.08); color:var(--ink); box-shadow:none; border:1px solid rgba(255,255,255,.18); }
  .btn:active{ transform:scale(.96); }
  .btnrow{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <canvas id="c" width="360" height="640"></canvas>

  <div class="topbar" id="topbar">
    <div class="row">
      <div class="pill">步數 <b id="movesTxt">0</b>/<b id="maxMovesTxt">0</b></div>
      <div class="pill">進度 <b id="pctTxt">0%</b></div>
    </div>
  </div>
  <div class="menuBtn" id="menuBtn">☰</div>
  <div class="swatches" id="swatches"></div>

  <div class="ov" id="ovMenu">
    <h1>色彩漫延</h1>
    <p class="sub">從左上角開始，點選色塊讓你的地盤換成那個顏色，把相鄰同色的格子吃進來，在步數用完前把整個棋盤變成同一種顏色！</p>
    <div class="stat">最佳步數 <b id="bestTxt">—</b></div>
    <button class="btn" id="btnStart">開始挑戰</button>
  </div>

  <div class="ov hidden" id="ovWin">
    <h2>🎉 全部染色成功！</h2>
    <p class="sub" id="winDetail"></p>
    <div class="btnrow">
      <button class="btn" id="btnRetryWin">再玩一次</button>
      <button class="btn alt" id="btnMenuWin">返回選單</button>
    </div>
  </div>

  <div class="ov hidden" id="ovLose">
    <h2>⏳ 步數用完了</h2>
    <p class="sub" id="loseDetail"></p>
    <div class="btnrow">
      <button class="btn" id="btnRetry">再玩一次</button>
      <button class="btn alt" id="btnMenu1">返回選單</button>
    </div>
  </div>

  <div class="ov hidden" id="ovPause">
    <h2>已暫停</h2>
    <div class="btnrow">
      <button class="btn" id="btnResume">繼續遊戲</button>
      <button class="btn alt" id="btnMenu2">返回選單</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=360,H=640;
var $=function(id){return document.getElementById(id);};

function mulberry32(seed){
  return function(){
    seed|=0; seed=(seed+0x6D2B79F5)|0;
    var t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
var rng=mulberry32(Date.now()|0);

var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); window.__CF_AC=AC; }catch(e){} } return AC; }
function playTone(freq,dur,type,vol,sweepTo){
  var c=ac(); if(!c) return;
  try{
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,c.currentTime);
    if(sweepTo) o.frequency.linearRampToValueAtTime(sweepTo, c.currentTime+dur);
    g.gain.setValueAtTime(vol||0.16, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur+0.02);
  }catch(e){}
}
function sfxPick(){ playTone(440,0.08,'sine',0.14,560); }
function sfxWin(){ playTone(520,0.14,'sine',0.2,780); setTimeout(function(){playTone(780,0.2,'sine',0.2,1040);},90); }
function sfxLose(){
  var c=ac(); if(!c) return;
  try{
    var o=c.createOscillator(), g=c.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(140,c.currentTime); o.frequency.exponentialRampToValueAtTime(45,c.currentTime+0.4);
    g.gain.setValueAtTime(0.22,c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.4);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+0.41);
  }catch(e){}
}

var GRID_N=12, MAX_MOVES=24;
var COLORS=['#FF5A6B','#FFC83D','#5CE68C','#4DD0FF','#8A4FD1','#FF9A3D'];
var GRID_PX=320, CELL=GRID_PX/GRID_N, GRID_X=(W-GRID_PX)/2, GRID_Y=70;

var S={
  phase:'menu', grid:[], territory:null, moves:0, maxMoves:MAX_MOVES, best:null
};
try{ var b=localStorage.getItem('cf_best'); S.best = b?parseInt(b,10):null; }catch(e){}

function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }
function renderHUD(){
  $('movesTxt').textContent=S.moves;
  $('maxMovesTxt').textContent=S.maxMoves;
  var pct = S.territory ? Math.round(S.territory.size/(GRID_N*GRID_N)*100) : 0;
  $('pctTxt').textContent=pct+'%';
  $('bestTxt').textContent = S.best===null ? '—' : S.best;
  var curColor = (S.grid && S.grid[0]) ? S.grid[0][0] : -1;
  document.querySelectorAll('.sw').forEach(function(el){
    el.classList.toggle('cur', parseInt(el.dataset.c,10)===curColor);
  });
}

function genGrid(){
  var g=[];
  for(var y=0;y<GRID_N;y++){
    var row=[];
    for(var x=0;x<GRID_N;x++) row.push(Math.floor(rng()*COLORS.length));
    g.push(row);
  }
  return g;
}
function computeTerritory(grid){
  var color=grid[0][0];
  var seen=new Set();
  var stack=[[0,0]];
  seen.add('0,0');
  while(stack.length){
    var cur=stack.pop();
    var x=cur[0], y=cur[1];
    var neigh=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
    for(var i=0;i<neigh.length;i++){
      var nx=neigh[i][0], ny=neigh[i][1];
      if(nx<0||ny<0||nx>=GRID_N||ny>=GRID_N) continue;
      var key=nx+','+ny;
      if(seen.has(key)) continue;
      if(grid[ny][nx]===color){ seen.add(key); stack.push([nx,ny]); }
    }
  }
  return seen;
}

function buildSwatches(){
  var el=$('swatches'); el.innerHTML='';
  COLORS.forEach(function(c,i){
    var b=document.createElement('button');
    b.className='sw'; b.style.background=c; b.dataset.c=i;
    b.addEventListener('click', function(){ pickColor(i); });
    el.appendChild(b);
  });
}
buildSwatches();

function startGame(){
  S.grid=genGrid();
  S.territory=computeTerritory(S.grid);
  S.moves=0; S.maxMoves=MAX_MOVES;
  S.phase='playing';
  $('topbar').classList.add('on');
  $('menuBtn').classList.add('on');
  $('swatches').classList.add('on');
  renderHUD();
}
function pickColor(newColor){
  if(S.phase!=='playing') return;
  var curColor=S.grid[0][0];
  if(newColor===curColor) return;
  S.territory.forEach(function(key){
    var parts=key.split(','); var x=parseInt(parts[0],10), y=parseInt(parts[1],10);
    S.grid[y][x]=newColor;
  });
  S.territory=computeTerritory(S.grid);
  S.moves++;
  sfxPick();
  renderHUD();
  if(S.territory.size===GRID_N*GRID_N){
    winGame();
  }else if(S.moves>=S.maxMoves){
    loseGame();
  }
}
function winGame(){
  S.phase='win';
  sfxWin();
  if(S.best===null || S.moves<S.best){ S.best=S.moves; try{localStorage.setItem('cf_best',String(S.best));}catch(e){} }
  $('topbar').classList.remove('on');
  $('menuBtn').classList.remove('on');
  $('swatches').classList.remove('on');
  $('winDetail').textContent='用了 '+S.moves+' 步完成，最佳紀錄 '+S.best+' 步。';
  show('ovWin');
}
function loseGame(){
  S.phase='lose';
  sfxLose();
  $('topbar').classList.remove('on');
  $('menuBtn').classList.remove('on');
  $('swatches').classList.remove('on');
  var pct=Math.round(S.territory.size/(GRID_N*GRID_N)*100);
  $('loseDetail').textContent='只染到 '+pct+'% 的棋盤，再試一次吧！';
  show('ovLose');
}
function backToMenu(){
  S.phase='menu';
  $('topbar').classList.remove('on');
  $('menuBtn').classList.remove('on');
  $('swatches').classList.remove('on');
  show('ovMenu');
}

$('btnStart').addEventListener('click',function(){ hide('ovMenu'); startGame(); });
$('btnRetry').addEventListener('click',function(){ hide('ovLose'); startGame(); });
$('btnRetryWin').addEventListener('click',function(){ hide('ovWin'); startGame(); });
$('btnMenu1').addEventListener('click',function(){ hide('ovLose'); backToMenu(); });
$('btnMenuWin').addEventListener('click',function(){ hide('ovWin'); backToMenu(); });
$('btnMenu2').addEventListener('click',function(){ hide('ovPause'); backToMenu(); });
$('btnResume').addEventListener('click',function(){ if(S.phase==='paused'){ hide('ovPause'); S.phase='playing'; } });
$('menuBtn').addEventListener('click',function(){
  if(S.phase!=='playing') return;
  S.phase='paused';
  show('ovPause');
});

function draw(){
  ctx.clearRect(0,0,W,H);
  var grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#1b2236'); grd.addColorStop(1,'#10141F');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
  if(!S.grid.length) return;
  for(var y=0;y<GRID_N;y++){
    for(var x=0;x<GRID_N;x++){
      ctx.fillStyle=COLORS[S.grid[y][x]];
      ctx.fillRect(GRID_X+x*CELL, GRID_Y+y*CELL, CELL-1.5, CELL-1.5);
    }
  }
  if(S.territory){
    ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=2;
    ctx.strokeRect(GRID_X-1,GRID_Y-1,GRID_PX+2,GRID_PX+2);
  }
}
function loop(){
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
renderHUD();

window.__CF = {
  state:S,
  colors:COLORS,
  gridN:GRID_N,
  start:function(){ $('btnStart').click(); },
  retry:function(){ if(!$('ovLose').classList.contains('hidden')) $('btnRetry').click(); },
  pick:function(c){ pickColor(c); },
  setGrid:function(grid){ S.grid=grid; S.territory=computeTerritory(S.grid); renderHUD(); },
  setMaxMoves:function(n){ S.maxMoves=n; renderHUD(); }
};
})();
</script>
</body>
</html>
