<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>燈籠節拍 Lantern Rhythm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0C1B1E; --night-2:#12292D; --panel:#17343A; --edge:#25505A;
    --cream:#F5EBD8; --muted:#9FB6B8; --amber:#FFC145; --amber-dark:#C98E1E;
    --shadow:rgba(2,10,12,0.6);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--night); color:var(--cream); font-family:'Noto Sans TC',system-ui,sans-serif; min-height:100%; }
  body{ display:flex; flex-direction:column; align-items:center; padding:28px 16px 56px; background:radial-gradient(ellipse at 50% -10%, rgba(255,193,69,0.12), transparent 55%), var(--night); }
  .marquee{ text-align:center; margin-bottom:18px; }
  .marquee h1{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:clamp(26px,6.5vw,40px); margin:0 0 8px; color:var(--amber); letter-spacing:2px; }
  .marquee p{ margin:0; color:var(--muted); font-size:14px; max-width:420px; }
  .board{ background:linear-gradient(180deg,var(--panel),var(--night-2)); border:1px solid var(--edge); border-radius:20px; padding:16px; box-shadow:0 20px 50px var(--shadow); width:100%; max-width:400px; }
  .hud{ display:flex; justify-content:space-between; align-items:center; padding:2px 8px 12px; }
  .hud .stat{ text-align:left; } .hud .stat.right{ text-align:right; }
  .hud .label{ display:block; font-size:11px; letter-spacing:2px; color:var(--muted); margin-bottom:2px; }
  .hud .value{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:22px; color:var(--cream); }
  .music-btn{ width:40px; height:40px; border-radius:50%; background:var(--night-2); border:1px solid var(--edge); color:var(--amber); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .music-btn:active{ background:var(--edge); }
  .music-btn:focus-visible, .btn:focus-visible{ outline:3px solid var(--amber); outline-offset:2px; }
  .screen-frame{ position:relative; border-radius:12px; padding:6px; background:var(--night); border:1px solid var(--edge); }
  canvas{ display:block; width:100%; height:auto; border-radius:8px; touch-action:none; cursor:pointer; background:#0A1517; }
  .overlay{ position:absolute; inset:6px; border-radius:8px; background:rgba(8,20,22,0.9); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; gap:14px; }
  .overlay.hidden{ display:none; }
  .overlay h2{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:clamp(22px,6vw,30px); color:var(--amber); margin:0; }
  .overlay p{ margin:0; color:var(--cream); font-size:14px; line-height:1.7; max-width:280px; }
  .grade{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:72px; line-height:1; color:var(--amber); }
  .btn{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:16px; color:var(--night); background:var(--amber); border:none; padding:12px 28px; border-radius:24px; cursor:pointer; box-shadow:0 4px 0 var(--amber-dark); }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--amber-dark); }
  .hint{ margin-top:16px; font-size:12px; color:var(--muted); text-align:center; max-width:420px; line-height:1.7; }
  .hint kbd{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:11px; background:var(--panel); border:1px solid var(--edge); border-radius:4px; padding:2px 8px; color:var(--amber); }
  @media (prefers-reduced-motion:reduce){ .btn{ transition:none; } }
/* ===== UI v2 (template) ===== */
body{ position:relative; }
.marquee{ margin-top:18px; }
.marquee h1{ letter-spacing:.06em; text-shadow:0 2px 0 rgba(255,255,255,.35), 0 6px 18px rgba(0,0,0,.18); }
.marquee h1::after{ content:""; display:block; width:56px; height:4px; margin:10px auto 0; border-radius:4px; background:currentColor; opacity:.35; }
.marquee p{ opacity:.9; line-height:1.7; }
.board,.box{ box-shadow:0 26px 54px rgba(0,0,0,.38), 0 3px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.14) !important; }
.hud .stat{ padding:7px 12px 8px; border-radius:12px; background:rgba(0,0,0,.14); box-shadow:inset 0 1px 0 rgba(0,0,0,.12), 0 1px 0 rgba(255,255,255,.25); min-width:84px; }
.hud .value{ font-variant-numeric:tabular-nums; text-shadow:0 1px 0 rgba(255,255,255,.25); }
.music-btn,.icon-btn{ box-shadow:0 3px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.6) !important; transition:transform .1s, box-shadow .1s; }
.music-btn:active,.icon-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.25) !important; }
.screen-frame,.frame,.field-frame,.table-frame,.tray-frame{ position:relative; box-shadow:inset 0 0 0 2px rgba(0,0,0,.18), inset 0 6px 16px rgba(0,0,0,.28), 0 1px 0 rgba(255,255,255,.3); }
.screen-frame::after,.frame::after,.field-frame::after,.table-frame::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, transparent 62%, rgba(0,0,0,.28)); z-index:1; }
.overlay{ z-index:3; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); animation:tplIn .32s ease; }
@keyframes tplIn{ from{ opacity:0; transform:scale(.97);} to{ opacity:1; transform:none; } }
.overlay>*{ animation:tplUp .45s ease backwards; } .overlay>*:nth-child(2){ animation-delay:.06s } .overlay>*:nth-child(3){ animation-delay:.12s } .overlay>*:nth-child(4){ animation-delay:.18s }
@keyframes tplUp{ from{ opacity:0; transform:translateY(12px);} }
.overlay h2{ letter-spacing:.08em; text-shadow:0 3px 0 rgba(0,0,0,.28), 0 8px 20px rgba(0,0,0,.3); }
.overlay p{ line-height:1.75; }
.overlay p[id]{ font-size:17px; font-weight:800; padding:10px 20px; border-radius:14px; background:rgba(255,255,255,.12); box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); max-width:none; }
.btn{ position:relative; overflow:hidden; letter-spacing:.08em; padding-left:30px; padding-right:30px; transition:transform .1s ease, box-shadow .1s ease, filter .15s; }
.btn::after{ content:""; position:absolute; left:14%; right:14%; top:3px; height:34%; border-radius:99px; background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0)); pointer-events:none; }
#startBtn,#restartBtn,.overlay .btn:first-of-type{ animation:tplPulse 2s ease-in-out infinite; }
@keyframes tplPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.05);} }
#startBtn::before,#restartBtn::before{ content:""; position:absolute; top:0; bottom:0; left:-45%; width:28%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent); transform:skewX(-20deg); animation:tplShine 3s ease-in-out infinite; }
@keyframes tplShine{ 0%{ left:-45%; } 55%,100%{ left:140%; } }
.hint kbd{ box-shadow:0 2px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.5); border:1px solid rgba(0,0,0,.12); }
@media (prefers-reduced-motion:reduce){ .overlay,.overlay>*,#startBtn,#restartBtn,.overlay .btn:first-of-type,#startBtn::before,#restartBtn::before{ animation:none !important; } }
</style>
</head>
<body>
  <div class="marquee">
    <h1>燈籠節拍</h1>
    <p>燈籠順著節奏落下，在它碰到光圈的那一刻點下去，就能彈出屬於你的旋律。</p>
  </div>

  <div class="board">
    <div class="hud">
      <div class="stat"><span class="label">分數</span><span class="value" id="score">0</span></div>
      <button class="music-btn" id="musicBtn" aria-label="切換背景伴奏" aria-pressed="true">🔊</button>
      <div class="stat right"><span class="label">最高</span><span class="value" id="best">0</span></div>
    </div>

    <div class="screen-frame">
      <canvas id="game" width="360" height="540" aria-label="燈籠節拍遊戲畫面"></canvas>

      <div class="overlay" id="startOverlay">
        <h2>準備開演</h2>
        <p>四條軌道對應 D F J K 四個鍵，手機請直接點該軌道。燈籠落到光圈時按下，越準分數越高，連擊還有加成。</p>
        <button class="btn" id="startBtn">開始演奏</button>
      </div>

      <div class="overlay hidden" id="endOverlay">
        <div class="grade" id="grade">S</div>
        <p id="endStats"></p>
        <button class="btn" id="restartBtn">再奏一次</button>
      </div>
    </div>
  </div>

  <p class="hint">電腦請按 <kbd>D</kbd> <kbd>F</kbd> <kbd>J</kbd> <kbd>K</kbd>，手機直接點對應軌道（支援多指同時點）。<br>你的每一次命中都會彈出旋律，伴奏會自動播放。</p>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var LANES = 4, LANE_W = W / LANES, HIT_Y = 440, FALL = 1.5;
  var PERFECT_WIN = 0.07, GOOD_WIN = 0.14;
  var BPM = 112, BEAT = 60 / BPM, STEP = BEAT / 2;
  var LEAD_IN = 2.4;
  var COLORS = ['#FF8A5B', '#FFC145', '#7ED3B2', '#B79CED'];
  var KEYS = ['d', 'f', 'j', 'k'];
  var SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
  var ROOTS = [130.81, 174.61, 196.00, 130.81];
  var PH = {
    A: [0,-1,2,3,-1,4,3,2],
    B: [4,-1,5,4,3,-1,2,0],
    C: [2,3,4,-1,5,6,5,-1],
    D: [7,-1,5,4,5,-1,3,2]
  };
  var LANE_MAP = [0, 1, 0, 1, 2, 3, 2, 3];
  var SEQ = 'AABACCDBABCDBBACDCBDACBA'.split('');
  var TOTAL_STEPS = SEQ.length * 8;

  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var startOverlay = document.getElementById('startOverlay');
  var endOverlay = document.getElementById('endOverlay');
  var gradeEl = document.getElementById('grade');
  var endStatsEl = document.getElementById('endStats');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  var musicBtn = document.getElementById('musicBtn');

  var best = 0;
  try { var sv = localStorage.getItem('lanternrhythm_best'); if (sv) best = parseInt(sv, 10) || 0; } catch (e) { /* ignore */ }
  bestEl.textContent = best;

  var musicOn = true;
  try { var mv = localStorage.getItem('lanternrhythm_music'); if (mv !== null) musicOn = (mv === '1'); } catch (e) { /* ignore */ }

  var ac = null, master = null, backGain = null;
  function getAudio(){
    try {
      if (!ac){
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = 1; master.connect(ac.destination);
        backGain = ac.createGain(); backGain.gain.value = musicOn ? 1 : 0; backGain.connect(master);
      }
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
    return ac;
  }
  function tone(freq, dur, type, vol, when, dest){
    if (!ac) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, when);
      g.gain.linearRampToValueAtTime(vol, when + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      o.connect(g); g.connect(dest || master);
      o.start(when); o.stop(when + dur + 0.02);
    } catch (e) { /* ignore */ }
  }
  function kick(when){
    if (!ac) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(140, when);
      o.frequency.exponentialRampToValueAtTime(45, when + 0.12);
      g.gain.setValueAtTime(0.2, when);
      g.gain.exponentialRampToValueAtTime(0.001, when + 0.16);
      o.connect(g); g.connect(backGain);
      o.start(when); o.stop(when + 0.2);
    } catch (e) { /* ignore */ }
  }
  function scheduleStep(i, when){
    var bar = Math.floor(i / 8), slot = i % 8;
    if (slot % 2 === 0) tone(ROOTS[bar % 4], 0.45, 'sine', 0.1, when, backGain);
    if (slot === 0 || slot === 4) kick(when);
    if (slot % 2 === 1) tone(5200, 0.03, 'square', 0.012, when, backGain);
    if (slot === 0) tone(ROOTS[bar % 4] * 2.5, 0.9, 'triangle', 0.035, when, backGain);
  }

  var notes, t0, running, score, combo, maxCombo, counts, judge, flash, nextStep, schedTimer, rafId, total, lastTime;

  function buildNotes(){
    var list = [];
    for (var b = 0; b < SEQ.length; b++){
      var ph = PH[SEQ[b]];
      for (var s = 0; s < 8; s++){
        var idx = ph[s];
        if (idx < 0) continue;
        list.push({ time: (b * 8 + s) * STEP, lane: LANE_MAP[idx], freq: SCALE[idx], state: 0 });
      }
    }
    return list;
  }

  function songTime(){ return ac.currentTime - t0; }

  function setJudge(text, color){ judge = { text: text, color: color, start: performance.now(), until: performance.now() + 450 }; }

  function pressLane(l){
    if (!running || !ac) return;
    var now = songTime();
    flash[l] = performance.now() + 120;
    var target = null, bestDelta = 9;
    for (var i = 0; i < notes.length; i++){
      var n = notes[i];
      if (n.state !== 0 || n.lane !== l) continue;
      var d = Math.abs(n.time - now);
      if (d <= GOOD_WIN && d < bestDelta){ target = n; bestDelta = d; }
      if (n.time - now > GOOD_WIN) break;
    }
    if (!target) return;
    target.state = 1;
    var perfect = bestDelta <= PERFECT_WIN;
    var base = perfect ? 100 : 60;
    score += Math.round(base * (1 + Math.min(Math.floor(combo / 10), 5) * 0.1));
    combo += 1;
    if (combo > maxCombo) maxCombo = combo;
    if (perfect){ counts.perfect++; setJudge('完美', '#FFC145'); } else { counts.good++; setJudge('不錯', '#7ED3B2'); }
    tone(target.freq, 0.4, 'triangle', 0.16, ac.currentTime, master); spawnHit(l, perfect);
    scoreEl.textContent = score;
  }

  function update(){
    var now = songTime();
    for (var i = 0; i < notes.length; i++){
      var n = notes[i];
      if (n.state === 0 && now > n.time + GOOD_WIN){
        n.state = 2; counts.miss++; if (combo >= 5) shakeUntil = performance.now() + 180; combo = 0; setJudge('漏掉', '#FF8A5B');
      }
    }
    if (now > notes[notes.length - 1].time + 1.6) finish();
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var parts = [], rings = [], beam = [0,0,0,0], shakeUntil = 0, bgCache = null, fw = [];
  function hexA(h, a){ var n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
  function buildBg(){
    var c = document.createElement('canvas'); c.width = W; c.height = H; var g = c.getContext('2d');
    var gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#070F1C'); gr.addColorStop(.55, '#102A33'); gr.addColorStop(1, '#0B1C1E'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    var seed = 7; function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var i = 0; i < 70; i++){ g.fillStyle = 'rgba(255,245,220,' + (.2 + rnd() * .6) + ')'; g.beginPath(); g.arc(rnd() * W, rnd() * H * .6, rnd() * 1.3 + .3, 0, 6.3); g.fill(); }
    var mg = g.createRadialGradient(290, 70, 4, 290, 70, 70); mg.addColorStop(0, 'rgba(255,240,200,.95)'); mg.addColorStop(.25, 'rgba(255,230,170,.35)'); mg.addColorStop(1, 'rgba(255,230,170,0)'); g.fillStyle = mg; g.fillRect(200, 0, 160, 160);
    g.fillStyle = '#FFF1C8'; g.beginPath(); g.arc(290, 70, 17, 0, 6.3); g.fill();
    // far rooftops
    g.fillStyle = '#0A1A1F'; for (var x = -10; x < W; x += 54){ var hh = 40 + ((x * 7) % 31); g.beginPath(); g.moveTo(x, H * .42); g.lineTo(x, H * .42 - hh * .5); g.lineTo(x + 27, H * .42 - hh); g.lineTo(x + 54, H * .42 - hh * .5); g.lineTo(x + 54, H * .42); g.fill(); }
    g.fillRect(0, H * .42, W, H);
    // lane columns
    for (var l = 0; l < LANES; l++){
      var lg = g.createLinearGradient(0, 0, 0, H); lg.addColorStop(0, hexA(COLORS[l], .02)); lg.addColorStop(.8, hexA(COLORS[l], .11)); lg.addColorStop(1, hexA(COLORS[l], .18));
      g.fillStyle = lg; g.fillRect(l * LANE_W + 2, 0, LANE_W - 4, H);
      g.fillStyle = 'rgba(255,255,255,.04)'; g.fillRect(l * LANE_W + 2, 0, 1, H);
    }
    // hit zone bar
    var hz = g.createLinearGradient(0, HIT_Y - 44, 0, HIT_Y + 44); hz.addColorStop(0, 'rgba(255,193,69,0)'); hz.addColorStop(.5, 'rgba(255,193,69,.14)'); hz.addColorStop(1, 'rgba(255,193,69,0)'); g.fillStyle = hz; g.fillRect(0, HIT_Y - 44, W, 88);
    g.fillStyle = 'rgba(255,215,140,.55)'; g.fillRect(0, HIT_Y - 1, W, 2);
    // floor
    var fl = g.createLinearGradient(0, HIT_Y + 40, 0, H); fl.addColorStop(0, '#2A1A10'); fl.addColorStop(1, '#150C07'); g.fillStyle = fl; g.fillRect(0, HIT_Y + 44, W, H);
    g.fillStyle = 'rgba(255,200,120,.25)'; g.fillRect(0, HIT_Y + 44, W, 2);
    return c;
  }
  function stringLights(now){
    ctx.strokeStyle = 'rgba(245,235,216,.35)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, 14);
    for (var x = 0; x <= W; x += 8) ctx.lineTo(x, 14 + Math.sin(x / W * Math.PI) * 14); ctx.stroke();
    for (var i = 0; i < 9; i++){ var x2 = 20 + i * 40, y2 = 14 + Math.sin(x2 / W * Math.PI) * 14 + 6, col = COLORS[i % 4], tw = .6 + .4 * Math.sin(now * 3 + i * 1.7);
      ctx.fillStyle = hexA(col, tw); ctx.shadowColor = col; ctx.shadowBlur = 10 * tw; ctx.beginPath(); ctx.arc(x2, y2, 3.5, 0, 6.3); ctx.fill(); ctx.shadowBlur = 0; }
  }
  function drawLantern(cx, y, color, alpha, glow){
    ctx.save(); ctx.globalAlpha = alpha;
    // soft glow
    var gg = ctx.createRadialGradient(cx, y, 4, cx, y, 54); gg.addColorStop(0, hexA(color, .34 * glow)); gg.addColorStop(1, hexA(color, 0)); ctx.fillStyle = gg; ctx.fillRect(cx - 54, y - 54, 108, 108);
    ctx.strokeStyle = '#F5EBD8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, y - 30); ctx.lineTo(cx, y - 19); ctx.stroke();
    ctx.fillStyle = '#E8B84B'; roundRect(cx - 12, y - 21, 24, 7, 2); ctx.fill();
    var bg = ctx.createRadialGradient(cx - 8, y - 6, 3, cx, y, 30); bg.addColorStop(0, '#FFF3CF'); bg.addColorStop(.25, color); bg.addColorStop(1, hexA(color, .75));
    ctx.shadowColor = color; ctx.shadowBlur = 14 * glow; ctx.fillStyle = bg; ctx.beginPath(); ctx.ellipse(cx, y, 27, 20, 0, 0, 6.3); ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(12,27,30,.38)'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.ellipse(cx, y, 14, 20, 0, 0, 6.3); ctx.stroke(); ctx.beginPath(); ctx.ellipse(cx, y, 6, 20, 0, 0, 6.3); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx, y - 20); ctx.lineTo(cx, y + 20); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(cx - 13, y - 8, 5, 8, -.4, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#E8B84B'; roundRect(cx - 12, y + 14, 24, 7, 2); ctx.fill();
    ctx.strokeStyle = '#E8B84B'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, y + 21); ctx.lineTo(cx, y + 30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 4, y + 38); ctx.lineTo(cx, y + 30); ctx.lineTo(cx + 4, y + 38); ctx.stroke();
    ctx.restore();
  }
  function spawnHit(l, perfect){
    var cx = l * LANE_W + LANE_W / 2, col = COLORS[l]; beam[l] = performance.now() + 260;
    rings.push({ x: cx, y: HIT_Y, c: col, t0: performance.now(), p: perfect });
    var n = perfect ? 16 : 9;
    for (var i = 0; i < n; i++){ var an = -Math.PI * (.1 + Math.random() * .8), v = 90 + Math.random() * 190; parts.push({ x: cx, y: HIT_Y, vx: Math.cos(an) * v, vy: Math.sin(an) * v, life: .75, max: .75, r: 2 + Math.random() * 2.6, c: i % 3 ? col : '#FFF1C8' }); }
    if (perfect && combo % 10 === 0 && combo > 0){ for (var k = 0; k < 28; k++){ var a2 = Math.random() * 6.283, v2 = 60 + Math.random() * 140, fx0 = 60 + Math.random() * (W - 120); fw.push({ x: fx0, y: 120 + Math.random() * 60, vx: Math.cos(a2) * v2, vy: Math.sin(a2) * v2, life: 1, max: 1, c: COLORS[k % 4] }); } }
  }
  function stepParts(dt){
    parts.forEach(function(p){ p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.life -= dt; }); parts = parts.filter(function(p){ return p.life > 0; });
    fw.forEach(function(p){ p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; p.vx *= .985; p.life -= dt; }); fw = fw.filter(function(p){ return p.life > 0; });
    rings = rings.filter(function(r){ return performance.now() - r.t0 < 420; });
  }
  var lastDraw = 0;
  function draw(){
    var now = ac ? songTime() : -LEAD_IN;
    var tms = performance.now(), dt = Math.min(.05, (tms - (lastDraw || tms)) / 1000); lastDraw = tms; stepParts(dt);
    if (!bgCache) bgCache = buildBg();
    ctx.save();
    if (shakeUntil > tms){ var k0 = (shakeUntil - tms) / 180; ctx.translate((Math.random() - .5) * 5 * k0, (Math.random() - .5) * 5 * k0); }
    ctx.drawImage(bgCache, 0, 0);
    stringLights(tms / 1000);
    for (var l = 0; l < LANES; l++){
      if (flash[l] > tms){ ctx.fillStyle = hexA(COLORS[l], .16); ctx.fillRect(l * LANE_W, 0, LANE_W, H); }
      if (beam[l] > tms){ var bk = (beam[l] - tms) / 260, bg2 = ctx.createLinearGradient(0, HIT_Y - 260, 0, HIT_Y); bg2.addColorStop(0, hexA(COLORS[l], 0)); bg2.addColorStop(1, hexA(COLORS[l], .5 * bk)); ctx.fillStyle = bg2; ctx.fillRect(l * LANE_W + 6, HIT_Y - 260, LANE_W - 12, 260); }
    }
    for (var kk = 0; kk < LANES; kk++){
      var cx = kk * LANE_W + LANE_W / 2, pr = flash[kk] > tms ? 1 : 0, pulse = .5 + .5 * Math.sin(tms / 260 + kk);
      ctx.shadowColor = COLORS[kk]; ctx.shadowBlur = 10 + pr * 14; ctx.strokeStyle = hexA(COLORS[kk], .75 + .25 * pulse); ctx.lineWidth = 3 + pr * 2;
      ctx.beginPath(); ctx.arc(cx, HIT_Y, 30 - pr * 2, 0, 6.3); ctx.stroke(); ctx.shadowBlur = 0;
      ctx.fillStyle = hexA(COLORS[kk], .1 + pr * .25); ctx.beginPath(); ctx.arc(cx, HIT_Y, 28, 0, 6.3); ctx.fill();
      // keycap
      var ky = HIT_Y + 52 + pr * 2; ctx.fillStyle = 'rgba(0,0,0,.45)'; roundRect(cx - 21, ky - 8 + 3, 42, 30, 8); ctx.fill();
      var kg = ctx.createLinearGradient(0, ky - 8, 0, ky + 22); kg.addColorStop(0, pr ? COLORS[kk] : '#F5EBD8'); kg.addColorStop(1, pr ? hexA(COLORS[kk], .7) : '#CDBF9F'); ctx.fillStyle = kg; roundRect(cx - 21, ky - 8, 42, 28, 8); ctx.fill();
      ctx.fillStyle = '#2B1A0E'; ctx.font = "900 16px 'Noto Serif TC', serif"; ctx.textAlign = 'center'; ctx.fillText(KEYS[kk].toUpperCase(), cx, ky + 12);
    }
    if (notes){
      for (var i = 0; i < notes.length; i++){
        var n = notes[i]; if (n.state === 1) continue;
        var y = HIT_Y * (1 - (n.time - now) / FALL);
        if (y < -50 || y > H + 50) continue;
        var near = Math.max(0, 1 - Math.abs(y - HIT_Y) / 90);
        drawLantern(n.lane * LANE_W + LANE_W / 2, y, COLORS[n.lane], n.state === 2 ? .28 : 1, .6 + near * .8);
      }
    }
    rings.forEach(function(r){ var t = (tms - r.t0) / 420; ctx.strokeStyle = hexA(r.c, 1 - t); ctx.lineWidth = 4 * (1 - t) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, 30 + t * (r.p ? 46 : 30), 0, 6.3); ctx.stroke(); });
    parts.forEach(function(p){ var a = p.life / p.max; ctx.fillStyle = hexA(p.c.length === 7 ? p.c : '#FFF1C8', a); ctx.shadowColor = p.c; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (.4 + a * .6), 0, 6.3); ctx.fill(); ctx.shadowBlur = 0; });
    fw.forEach(function(p){ var a = p.life / p.max; ctx.fillStyle = hexA(p.c, a); ctx.shadowColor = p.c; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 6.3); ctx.fill(); ctx.shadowBlur = 0; });
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    if (now < 0){
      ctx.font = "900 74px 'Noto Serif TC', serif"; ctx.lineWidth = 8; ctx.strokeStyle = '#3A2300'; ctx.strokeText(String(Math.ceil(-now)), W / 2, 240); ctx.fillStyle = '#FFC145'; ctx.fillText(String(Math.ceil(-now)), W / 2, 240);
    } else {
      // song progress
      var pg = Math.max(0, Math.min(1, now / (TOTAL_STEPS * STEP))); ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(14, 4, W - 28, 3); ctx.fillStyle = '#FFC145'; ctx.fillRect(14, 4, (W - 28) * pg, 3);
      if (combo >= 2){
        var bump = judge ? Math.max(0, 1 - (tms - judge.start) / 160) : 0; ctx.save(); ctx.translate(W / 2, 112); ctx.scale(1 + bump * .22, 1 + bump * .22);
        ctx.font = "900 46px 'Noto Serif TC', serif"; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(String(combo), 0, 0); ctx.fillStyle = combo >= 30 ? '#FFC145' : '#F5EBD8'; ctx.fillText(String(combo), 0, 0);
        ctx.font = "700 12px 'Noto Sans TC', sans-serif"; ctx.fillStyle = '#9FB6B8'; ctx.lineWidth = 0; ctx.fillText('連擊 COMBO', 0, 20); ctx.restore();
      }
      if (judge && judge.until > tms){
        var jt = 1 - (judge.until - tms) / 450, sc = 1 + Math.max(0, .5 - jt * 3) * .6;
        ctx.save(); ctx.globalAlpha = Math.min(1, (1 - jt) * 2); ctx.translate(W / 2, HIT_Y - 92 - jt * 14); ctx.scale(sc, sc);
        ctx.font = "900 30px 'Noto Serif TC', serif"; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(10,20,22,.85)'; ctx.strokeText(judge.text, 0, 0); ctx.fillStyle = judge.color; ctx.fillText(judge.text, 0, 0); ctx.restore();
      }
    }
    ctx.restore();
    var vg = ctx.createRadialGradient(W / 2, H / 2, H * .4, W / 2, H / 2, H * .85); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  function loop(){
    if (!running) return;
    var now = songTime();
    while (nextStep < TOTAL_STEPS && t0 + nextStep * STEP < ac.currentTime + 0.3){
      var when = t0 + nextStep * STEP;
      if (when >= ac.currentTime - 0.05) scheduleStep(nextStep, when);
      nextStep++;
    }
    update();
    if (!running) return;
    draw();
    rafId = requestAnimationFrame(loop);
  }

  function finish(){
    running = false;
    cancelAnimationFrame(rafId);
    var acc = (counts.perfect + counts.good * 0.6) / total;
    var grade = acc >= 0.95 ? 'S' : acc >= 0.85 ? 'A' : acc >= 0.7 ? 'B' : 'C';
    if (score > best){
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('lanternrhythm_best', String(best)); } catch (e) { /* ignore */ }
    }
    gradeEl.textContent = grade;
    endStatsEl.innerHTML = '分數 ' + score + '　最高連擊 ' + maxCombo + '<br>完美 ' + counts.perfect + '　不錯 ' + counts.good + '　漏掉 ' + counts.miss;
    endOverlay.classList.remove('hidden');
  }

  function startGame(){
    getAudio();
    if (!ac) return;
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    notes = buildNotes();
    total = notes.length;
    score = 0; combo = 0; maxCombo = 0;
    counts = { perfect: 0, good: 0, miss: 0 };
    judge = null; flash = [0, 0, 0, 0]; parts = []; rings = []; fw = []; beam = [0, 0, 0, 0]; shakeUntil = 0;
    scoreEl.textContent = '0';
    t0 = ac.currentTime + LEAD_IN;
    nextStep = 0;
    running = true;
    rafId = requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', function(e){
    if (e.repeat) return;
    var i = KEYS.indexOf(e.key.toLowerCase());
    if (i >= 0){ e.preventDefault(); pressLane(i); }
  });
  function laneFromX(clientX){
    var r = canvas.getBoundingClientRect();
    return Math.max(0, Math.min(3, Math.floor((clientX - r.left) / r.width * LANES)));
  }
  canvas.addEventListener('mousedown', function(e){ pressLane(laneFromX(e.clientX)); });
  canvas.addEventListener('touchstart', function(e){
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) pressLane(laneFromX(e.changedTouches[i].clientX));
  }, { passive: false });

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  function refreshMusicBtn(){
    musicBtn.textContent = musicOn ? '🔊' : '🔇';
    musicBtn.setAttribute('aria-pressed', String(musicOn));
  }
  musicBtn.addEventListener('click', function(){
    musicOn = !musicOn;
    try { localStorage.setItem('lanternrhythm_music', musicOn ? '1' : '0'); } catch (e) { /* ignore */ }
    if (backGain) backGain.gain.value = musicOn ? 1 : 0;
    refreshMusicBtn();
  });
  refreshMusicBtn();

  flash = [0, 0, 0, 0];
  draw();
})();
</script>
