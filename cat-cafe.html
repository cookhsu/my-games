var acc=0, floatAcc=0, lastTick=0;
function update(dt){
  clockT+=dt; tapKick=Math.max(0,tapKick-dt*5);
  var cps=calcCps();
  earn(cps*dt);
  // buffs
  if(BUFF.nip>0){ BUFF.nip-=dt; }
  // visual coin ticks
  floatAcc+=dt; if(floatAcc>=1.2&&cps>0){ floatAcc=0; var shown=S.staff.map(function(l,i){ return l>0?i:-1; }).filter(function(i){ return i>=0; }).slice(-5); var k=Math.floor(Math.random()*shown.length); var p=staffPos(k); emitFloat('+'+fmt(cps*1.2,1),p[0],p[1]-30,'#FFE9A8',11); }
  // customers
  var maxC=Math.min(6,2+Math.floor(lvTotal(S)/12));
  if(custs.filter(function(c){ return !c.vip; }).length<maxC&&Math.random()<dt*.5) spawnCust(false);
  custs.forEach(function(c){
    if(c.state==='walk'){ var d=c.tx-c.x; c.x+=Math.sign(d)*70*dt; c.dir=d>=0?1:-1; if(Math.abs(d)<3){ c.state='wait'; c.dir=1; } }
    else if(c.state==='wait'){ c.wait-=dt; if(c.vip){ c.life-=dt; if(c.life<=0){ c.state='leave'; c.vip=false; } } else if(c.wait<=0){ c.state='leave'; if(Math.random()<.35) sfx.bell(); emitCoins(c.x,c.y-20,2); } }
    else if(c.state==='leave'){ var dir=c.x<SW/2?-1:1; c.x+=dir*80*dt; c.dir=dir; }
  });
  custs=custs.filter(function(c){ return c.x>-30&&c.x<SW+30; });
  // events
  nextVip-=dt; if(nextVip<=0){ nextVip=rnd(28,55); spawnCust(true); }
  nextNip-=dt; if(nextNip<=0&&!event){ nextNip=rnd(80,130); event={k:'nip',x:rnd(60,300),y:rnd(70,120),life:9}; }
  if(event){ event.life-=dt; if(event.life<=0) event=null; }
  parts.forEach(function(p){ p.t+=dt; p.vy+=260*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }); parts=parts.filter(function(p){ return p.t<p.life; });
  floats.forEach(function(f){ f.life-=dt*1.1; f.y-=26*dt; }); floats=floats.filter(function(f){ return f.life>0; });
  steam.forEach(function(s){ s.t+=dt; s.y-=26*dt; s.x+=s.vx*dt; }); steam=steam.filter(function(s){ return s.t<s.life; });
}
