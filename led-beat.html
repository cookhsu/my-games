let C=null,notes=[],state='menu',songT=0,TS=1,auto=false,lvIdx=SV.cur||0,score=0,combo=0,maxCombo=0,hp=100,cnt={p:0,g:0,m:0},nextBeat=0,lastBeat=-1,flash=[0,0,0,0],beatPulse=0,endT=0,jdT=0;
const SPEED=14,LEAD=3.2,WP=.075,WG=.15;
function clearNotes(){while(noteRoot.children.length)noteRoot.remove(noteRoot.children[0]);}
function go(i){
 lvIdx=Math.max(0,Math.min(NL-1,i));SV.cur=lvIdx;save();
 C=chart(lvIdx);clearNotes();
 notes=C.notes.map(n=>{const m=new THREE.Mesh(noteG,noteMats[n.l]);const s=new THREE.Sprite(noteGl[n.l]);s.scale.set(2.2,2.2,1);s.position.y=.25;m.add(s);m.visible=false;noteRoot.add(m);return{t:n.t,l:n.l,beat:n.beat,done:false,m};});
 score=0;combo=0;maxCombo=0;hp=100;cnt={p:0,g:0,m:0};nextBeat=0;lastBeat=-1;songT=-.5;endT=notes.length?notes[notes.length-1].t+1.4:3;
 $('win').classList.remove('on');$('menu').classList.remove('on');state='play';ui();
}
function ui(){$('sc').textContent=score;$('hp').style.width=Math.max(0,hp)+'%';$('lvl').textContent='第 '+(lvIdx+1)+' 首「'+NAMES[lvIdx]+'」 ・ '+BPM[lvIdx]+' BPM';const e=$('cb');if(combo>=3){e.innerHTML=combo+'<small>COMBO</small>';e.style.opacity=1;}else e.style.opacity=0;}
/* ===== 音效 ===== */
let AC=null,master=null,noiseBuf=null;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=SV.snd?.9:0;master.connect(AC.destination);const n=AC.sampleRate*.5;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,at,d,ty,v,sl){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,at);if(sl)o.frequency.exponentialRampToValueAtTime(sl,at+d);g.gain.setValueAtTime(v,at);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g);g.connect(master);o.start(at);o.stop(at+d+.02);}catch(e){}}
function noise(at,d,v,hp){if(!AC)return;try{const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,at);g.gain.exponentialRampToValueAtTime(.0001,at+d);s.connect(f);f.connect(g);g.connect(master);s.start(at,Math.random()*.2);s.stop(at+d+.02);}catch(e){}}
function playBeat(b,at){
 if(!AC)return;const bt=C.beat;
 if(b<4){tone(b===0?1200:900,at,.06,'square',.12);return;}
 tone(150,at,.16,'sine',.55,45);noise(at+bt/2,.04,.07,7000);
 if(b%4===1||b%4===3)noise(at,.12,.12,1800);
 const rf=ROOT[Math.floor(b/4)%4];tone(rf,at,bt*.45,'sawtooth',.11);tone(rf*(b%2?2:1),at+bt/2,bt*.4,'sawtooth',.08);
}
function hitSound(n){const f=SCALE[(n.l*2+(Math.floor(n.beat)%2))%8];const at=AC?AC.currentTime:0;tone(f,at,.28,'triangle',.22);tone(f*2,at,.14,'sine',.07);}
function sched(){if(!AC)return;while(nextBeat<C.total&&nextBeat*C.beat<songT+.25){const bt=nextBeat*C.beat;if(bt>=songT-.05)playBeat(nextBeat,AC.currentTime+Math.max(0,(bt-songT)/TS));nextBeat++;}}
/* ===== 判定 ===== */
const JT={p:['PERFECT','#ffd93b'],g:['GOOD','#3bd8ff'],m:['MISS','#ff4d6d']};
function judge(k){const e=$('jd');e.textContent=JT[k][0];e.style.color=JT[k][1];e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');}
function press(l){
 if(state!=='play')return;initAudio();flash[l]=1;
 let best=null;for(const n of notes){if(n.done||n.l!==l)continue;const d=Math.abs(n.t-songT);if(d<=WG&&(!best||d<Math.abs(best.t-songT)))best=n;}
 if(!best){return;}
 const d=Math.abs(best.t-songT),perfect=d<=WP;best.done=true;best.m.visible=false;
 if(perfect){cnt.p++;score+=Math.round(100*(1+Math.min(combo,100)/25));}else{cnt.g++;score+=Math.round(50*(1+Math.min(combo,100)/25));}
 combo++;maxCombo=Math.max(maxCombo,combo);hp=Math.min(100,hp+(perfect?2:1));
 hitSound(best);spawn(LX(l),.3,0,new THREE.Color(LC[l]),perfect?26:14,perfect?1.2:.8);judge(perfect?'p':'g');ui();
}
function miss(n){n.done=true;n.m.visible=false;cnt.m++;combo=0;hp-=10;judge('m');tone(90,AC?AC.currentTime:0,.2,'sawtooth',.12,60);ui();if(hp<=0)finish(false);}
function finish(ok){
 if(state!=='play')return;state='end';
 const tot=notes.length,acc=tot?(cnt.p+.6*cnt.g)/tot:0,s=!ok?0:acc>=.9?3:acc>=.75?2:1;
 if(s>(SV.stars[lvIdx]||0))SV.stars[lvIdx]=s;if(ok&&score>(SV.best[lvIdx]||0))SV.best[lvIdx]=score;save();
 if(ok)[523,659,784,1047].forEach((f,i)=>setTimeout(()=>{if(AC)tone(f,AC.currentTime,.25,'triangle',.2);},i*110));
 setTimeout(()=>{$('wT').textContent=ok?(lvIdx===NL-1?'全部通關!':'通關!'):'燈滅了…';$('wS').innerHTML=ok?'<b>'+'★'.repeat(s)+'</b>'+'★'.repeat(3-s):'<b></b>★★★';
  $('wD').innerHTML='<div>分數<b>'+score+'</b></div><div>最高連擊<b>'+maxCombo+'</b></div><div>PERFECT<b>'+cnt.p+'</b></div><div>GOOD<b>'+cnt.g+'</b></div><div>MISS<b>'+cnt.m+'</b></div><div>準確率<b>'+Math.round(acc*100)+'%</b></div>';
  $('wN').style.display=ok&&lvIdx<NL-1?'':'none';$('win').classList.add('on');},ok?700:300);
}
/* ===== 介面 ===== */
function unlocked(){let u=0;for(let i=0;i<NL;i++)if(SV.stars[i])u=i+1;return Math.min(NL-1,u);}
function openMenu(){state='menu';const el=$('lvs');el.innerHTML='';const u=unlocked();let tot=0;for(let i=0;i<NL;i++){const b=document.createElement('button');b.className='lv'+(i===lvIdx?' cur':'');const s=SV.stars[i]||0;tot+=s;b.innerHTML=(i+1)+'<i>'+(s?'★'.repeat(s):'')+'</i><em>'+BPM[i]+'</em>';b.disabled=i>u;b.onclick=()=>{initAudio();SV.seen=1;go(i);};el.appendChild(b);}$('tot').textContent='累積星星 '+tot+' / '+NL*3;$('play').textContent=SV.seen?'繼續(第 '+(Math.min(lvIdx,u)+1)+' 首)':'開始遊戲';$('menu').classList.add('on');$('win').classList.remove('on');}
$('menuBtn').onclick=openMenu;
$('play').onclick=()=>{initAudio();SV.seen=1;go(Math.min(lvIdx,unlocked()));};
$('wR').onclick=()=>{initAudio();go(lvIdx);};$('wN').onclick=()=>{initAudio();go(lvIdx+1);};$('wM').onclick=openMenu;
const padEls=[...document.querySelectorAll('.pad')];
padEls.forEach(p=>{const l=+p.dataset.l;p.addEventListener('pointerdown',e=>{e.preventDefault();p.classList.add('on');press(l);});const up=()=>p.classList.remove('on');p.addEventListener('pointerup',up);p.addEventListener('pointerleave',up);p.addEventListener('pointercancel',up);});
const KM={d:0,f:1,j:2,k:3,arrowleft:0,arrowdown:1,arrowup:2,arrowright:3};
addEventListener('keydown',e=>{if(e.repeat)return;const l=KM[e.key.toLowerCase()];if(l===undefined)return;padEls[l].classList.add('on');press(l);});
addEventListener('keyup',e=>{const l=KM[e.key.toLowerCase()];if(l!==undefined)padEls[l].classList.remove('on');});
/* ===== 相機 ===== */
function size(){layout();const r=wrap.getBoundingClientRect();rd.setPixelRatio(Math.min(2,devicePixelRatio||1));rd.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.position.set(0,5.4,8.2);cam.lookAt(0,0,-7.5);const d=cam.position.length(),tv=3.15/(d*cam.aspect);cam.fov=Math.min(80,2*Math.atan(tv)*180/Math.PI);cam.updateProjectionMatrix();}
addEventListener('resize',size);
/* ===== 主迴圈 ===== */
const col=new THREE.Color(),tmp=new THREE.Color(),LCc=LC.map(c=>new THREE.Color(c));
let last=performance.now();
function loop(ms){
 const dt=Math.max(0,Math.min(.25,(ms-last)/1000));last=ms;const now=ms/1000;
 if(state==='play'){
  songT+=dt*TS;sched();
  const bp=songT/C.beat,bf=Math.floor(bp);if(bf!==lastBeat){lastBeat=bf;beatPulse=1;}
  if(auto)for(const n of notes)if(!n.done&&n.t<=songT)press(n.l);
  for(const n of notes){if(n.done)continue;if(songT-n.t>WG){miss(n);if(state!=='play')break;continue;}const z=-(n.t-songT)*SPEED;n.m.visible=z>-LEAD*SPEED-2&&z<2;n.m.position.set(LX(n.l),.14,z);}
  const cd=Math.ceil(-songT/C.beat-.0001+ (4*C.beat+songT)/C.beat*0);
  const beatsLeft=4-bp;$('cnt').textContent=bp<0?'':(bp<4?Math.ceil(beatsLeft):'');
  if(state==='play'&&songT>endT)finish(true);
 }else $('cnt').textContent='';
 beatPulse=Math.max(0,beatPulse-dt*3.5);
 /* 燈條上色 */
 const vis=[[],[],[],[]];if(state==='play')for(const n of notes)if(!n.done){const z=-(n.t-songT)*SPEED;if(z>-46&&z<2)vis[n.l].push(z);}
 let ii=0;
 for(let l=0;l<4;l++){const lc=LCc[l],fl=flash[l];for(let s=0;s<2;s++)for(let k=0;k<NZ;k++){const zd=ZN+k*ZS;let g=.1+beatPulse*.05;let a=0;for(const z of vis[l]){const d=Math.abs(z-zd);if(d<2){const q=1-d/2;a+=q*q;}}
  tmp.copy(lc).multiplyScalar(g+Math.min(1.6,a*1.4));if(fl>0&&zd>-3.5){const w=fl*(1-Math.abs(zd)/3.5);tmp.r+=w*.6;tmp.g+=w*.6;tmp.b+=w*.6;}
  strip.setColorAt(ii++,tmp);}}
 strip.instanceColor.needsUpdate=true;
 ii=0;for(let s=0;s<2;s++)for(let k=0;k<NZ;k++){const zd=ZN+k*ZS,h=(now*.08+zd*.012+(s?.5:0))%1;col.setHSL(h,.9,.5);const w=.25+.75*Math.max(0,Math.sin(zd*.5-songT*C_BPS()*3.14))*beatPulse+beatPulse*.4;tmp.copy(col).multiplyScalar(.12+w*.9);rail.setColorAt(ii++,tmp);}
 rail.instanceColor.needsUpdate=true;
 for(let l=0;l<4;l++){flash[l]=Math.max(0,flash[l]-dt*5);padG[l].material.opacity=flash[l]*.9;hitL[l].scale.set(1+flash[l]*.15,1,1+flash[l]*1.6);}
 far.material.opacity=.25+beatPulse*.25;
 /* 粒子 */
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue;}p.vy-=6*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.y<.05){p.y=.05;p.vy*=-.3;}}
 for(let i=0;i<PMAX;i++){const p=parts[i];if(p){pPos[i*3]=p.x;pPos[i*3+1]=p.y;pPos[i*3+2]=p.z;const f=Math.min(1,p.l*2.2);pCol[i*3]=p.c.r*f;pCol[i*3+1]=p.c.g*f;pCol[i*3+2]=p.c.b*f;}else{pPos[i*3+1]=-50;pCol[i*3]=pCol[i*3+1]=pCol[i*3+2]=0;}}
 partG.attributes.position.needsUpdate=true;partG.attributes.color.needsUpdate=true;
 rd.render(sc,cam);requestAnimationFrame(loop);
}
function C_BPS(){return C?C.bpm/60:1.6;}
C=chart(lvIdx);size();
for(let i=0;i<4*2*NZ;i++)strip.setColorAt(i,col.set(0x111111));for(let i=0;i<2*NZ;i++)rail.setColorAt(i,col.set(0x111111));
openMenu();requestAnimationFrame(loop);
window.__LB={auto:v=>auto=v,ts:v=>TS=v,go,state:()=>state,info:()=>({score,combo,maxCombo,hp,cnt,n:notes.length,songT,endT}),press,SV};
})();}catch(e){console.warn(e);$('nogl').style.display='flex';}
</script>
