<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>夜蔓 NIGHT VINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2B1B33; --bg-deep:#1E1226; --panel:#3A2545; --panel-edge:#4E3159;
    --gold:#F4A623; --gold-dim:#B67C1C; --teal:#2DD4BF; --teal-dim:#1F9B8B;
    --cream:#FDF6EC; --cream-dim:#C9BDD6; --danger:#F45B5B; --shadow:rgba(10,4,14,.55);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg-deep); color:var(--cream); font-family:'Nunito',system-ui,sans-serif; min-height:100%; }
  body{ display:flex; flex-direction:column; align-items:center; padding:28px 16px 60px; background:radial-gradient(ellipse at 50% -10%, rgba(244,166,35,.10), transparent 55%), var(--bg-deep); }
  .marquee{ text-align:center; margin-bottom:22px; }
  .marquee h1{ font-family:'Press Start 2P',monospace; font-size:clamp(20px,5.5vw,34px); color:var(--gold); letter-spacing:2px; margin:0 0 8px; text-shadow:0 3px 0 var(--gold-dim), 0 8px 18px rgba(244,166,35,.25); }
  .marquee p{ margin:0 auto; color:var(--cream-dim); font-size:14px; max-width:440px; line-height:1.7; }
  .cabinet{ background:linear-gradient(180deg,var(--panel),var(--bg)); border:3px solid var(--panel-edge); border-radius:22px; padding:18px; box-shadow:0 20px 50px var(--shadow), inset 0 1px 0 rgba(255,255,255,.05); width:100%; max-width:480px; }
  .hud{ display:flex; justify-content:space-between; align-items:center; padding:4px 6px 14px; }
  .hud .stat.right{ text-align:right; }
  .hud .label{ font-family:'Press Start 2P',monospace; font-size:9px; color:var(--teal); letter-spacing:1px; display:block; margin-bottom:4px; }
  .hud .value{ font-family:'Press Start 2P',monospace; font-size:18px; color:var(--cream); }
  .tools{ display:flex; gap:8px; }
  .icon-btn{ width:40px; height:40px; border-radius:50%; background:var(--panel); border:1px solid var(--panel-edge); color:var(--gold); font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-btn:active{ background:var(--gold-dim); }
  .icon-btn:focus-visible, .btn:focus-visible, .seg button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  .screen-frame{ position:relative; border-radius:12px; padding:10px; background:var(--bg-deep); border:2px solid var(--panel-edge); }
  canvas{ display:block; width:100%; height:auto; border-radius:6px; background:#150C1C; touch-action:none; }
  .overlay{ position:absolute; inset:10px; border-radius:6px; background:rgba(21,12,28,.9); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:18px; gap:12px; }
  .overlay.hidden{ display:none; }
  .overlay h2{ font-family:'Press Start 2P',monospace; font-size:clamp(14px,4vw,20px); color:var(--gold); margin:0; line-height:1.5; }
  .overlay p{ margin:0; color:var(--cream-dim); font-size:13px; line-height:1.7; max-width:320px; }
  .legend{ display:grid; grid-template-columns:auto 1fr; gap:6px 10px; text-align:left; font-size:12.5px; color:var(--cream); max-width:320px; }
  .legend i{ display:inline-block; width:14px; height:14px; border-radius:50%; margin-top:3px; }
  .btn{ font-family:'Press Start 2P',monospace; font-size:12px; color:var(--bg-deep); background:var(--teal); border:none; padding:12px 20px; border-radius:8px; cursor:pointer; box-shadow:0 4px 0 var(--teal-dim); }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--teal-dim); }
  .seg{ display:flex; border:2px solid var(--panel-edge); border-radius:8px; overflow:hidden; }
  .seg button{ font:700 13px 'Nunito',sans-serif; color:var(--cream-dim); background:transparent; border:none; padding:8px 14px; cursor:pointer; }
  .seg button[aria-pressed="true"]{ background:var(--gold); color:var(--bg-deep); }
  .controls{ margin-top:18px; display:flex; justify-content:center; }
  .dpad{ display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(3,56px); gap:6px; }
  .dpad button{ background:var(--panel); border:1px solid var(--panel-edge); border-radius:10px; color:var(--cream); font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .dpad button:active{ background:var(--gold-dim); }
  .dpad .up{ grid-column:2; grid-row:1; } .dpad .left{ grid-column:1; grid-row:2; } .dpad .right{ grid-column:3; grid-row:2; } .dpad .down{ grid-column:2; grid-row:3; }
  .hint{ margin-top:16px; font-size:12px; color:var(--cream-dim); text-align:center; max-width:440px; line-height:1.8; }
  .hint kbd{ font-family:'Press Start 2P',monospace; font-size:9px; background:var(--panel); border:1px solid var(--panel-edge); border-radius:4px; padding:3px 6px; color:var(--teal); }
  @media (min-width:640px){ .controls{ display:none; } }
</style>
</head>
<body>
  <div class="marquee">
    <h1>夜蔓 NIGHT VINE</h1>
    <p>在暗夜花園裡引路。吃果實連擊、搶限時的金果與月光花，躲開越來越多的岩石。</p>
  </div>

  <div class="cabinet">
    <div class="hud">
      <div class="stat"><span class="label">分數</span><span class="value" id="score">0</span></div>
      <div class="tools">
        <button class="icon-btn" id="pauseBtn" aria-label="暫停" title="暫停（P）">⏸</button>
        <button class="icon-btn" id="musicBtn" aria-label="切換背景音樂" aria-pressed="true">🔊</button>
      </div>
      <div class="stat right"><span class="label">最高</span><span class="value" id="best">0</span></div>
    </div>

    <div class="screen-frame">
      <canvas id="game" width="400" height="400" aria-label="貪食蛇遊戲畫面"></canvas>

      <div class="overlay" id="startOverlay">
        <h2>夜蔓出發</h2>
        <div class="legend">
          <i style="background:#F45B8A"></i><span>果實：+10，連續吃會連擊加成（最高 ×5）</span>
          <i style="background:#F4A623"></i><span>金果：限時出現，+50 並長長一節</span>
          <i style="background:#7FF0E0"></i><span>月光花：時間變慢 6 秒</span>
          <i style="background:#7A6A8A"></i><span>岩石：每吃 5 顆升一級並多出現</span>
        </div>
        <div class="seg" role="group" aria-label="模式">
          <button type="button" data-mode="classic" aria-pressed="true">經典（撞牆結束）</button>
          <button type="button" data-mode="wrap" aria-pressed="false">穿牆模式</button>
        </div>
        <button class="btn" id="startBtn">開始遊戲</button>
      </div>

      <div class="overlay hidden" id="pauseOverlay">
        <h2>暫停中</h2>
        <button class="btn" id="resumeBtn">繼續</button>
      </div>

      <div class="overlay hidden" id="overOverlay">
        <h2>遊戲結束</h2>
        <p id="finalText"></p>
        <button class="btn" id="restartBtn">再玩一次</button>
      </div>
    </div>

    <div class="controls">
      <div class="dpad" role="group" aria-label="方向控制">
        <button class="up" aria-label="上">▲</button>
        <button class="left" aria-label="左">◀</button>
        <button class="right" aria-label="右">▶</button>
        <button class="down" aria-label="下">▼</button>
      </div>
    </div>
  </div>

  <p class="hint">方向鍵 / <kbd>W A S D</kbd> 移動，<kbd>P</kbd> 或空白鍵暫停。手機可在畫面上滑動，快速連轉彎也會被記住。</p>

<script>
(function(){
  "use strict";
  var GRID = 20, CELL = 20, SIZE = 400;
  var canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  var startOverlay = document.getElementById('startOverlay'), overOverlay = document.getElementById('overOverlay'), pauseOverlay = document.getElementById('pauseOverlay');
  var finalText = document.getElementById('finalText'), musicBtn = document.getElementById('musicBtn'), pauseBtn = document.getElementById('pauseBtn');

  var mode = 'classic';
  try { var mm = localStorage.getItem('nightvine_mode'); if (mm === 'wrap' || mm === 'classic') mode = mm; } catch (e) { /* ignore */ }
  var bests = { classic: 0, wrap: 0 };
  try { var b1 = localStorage.getItem('nightvine_best'); if (b1) bests.classic = parseInt(b1, 10) || 0; var b2 = localStorage.getItem('nightvine_best_wrap'); if (b2) bests.wrap = parseInt(b2, 10) || 0; } catch (e) { /* ignore */ }
  var musicOn = true;
  try { var mv = localStorage.getItem('nightvine_music'); if (mv !== null) musicOn = (mv === '1'); } catch (e) { /* ignore */ }

  var ac = null;
  function getAc(){
    try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; }
    return ac;
  }
  function tone(f, d, type, v, delay){
    var a = getAc(); if (!a) return;
    try {
      var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.03);
    } catch (e) { /* ignore */ }
  }
  var music = {
    timer: null, step: 0,
    mel: [220.00, 261.63, 293.66, 329.63, 293.66, 261.63, 220.00, 196.00],
    bass: [110.00, 0, 146.83, 0, 110.00, 0, 98.00, 0],
    start: function(){ this.stop(); if (!musicOn) return; this.step = 0; var s = this; this.play(); this.timer = setInterval(function(){ s.play(); }, 260); },
    play: function(){ tone(this.mel[this.step % 8], 0.3, 'triangle', 0.05); var b = this.bass[this.step % 8]; if (b) tone(b, 0.55, 'sine', 0.05); this.step++; },
    stop: function(){ if (this.timer){ clearInterval(this.timer); this.timer = null; } }
  };

  var snake, prev, dir, queue, fruit, golden, moon, rocks, score, eaten, level, combo, lastEat, gameTime, slowUntil;
  var particles, floats, shake, acc, interval, running, paused, dead, raf, lastTs, pulse;

  function rnd(a, b){ return a + Math.random() * (b - a); }
  function cp(p){ return { x: p.x, y: p.y }; }
  function baseInterval(){ return Math.max(72, 138 - (level - 1) * 6); }
  function curInterval(){ return baseInterval() * (gameTime < slowUntil ? 1.6 : 1); }

  function occupied(x, y){
    if (snake.some(function(s){ return s.x === x && s.y === y; })) return true;
    if (rocks.some(function(r){ return r.x === x && r.y === y; })) return true;
    if (fruit && fruit.x === x && fruit.y === y) return true;
    if (golden && golden.x === x && golden.y === y) return true;
    if (moon && moon.x === x && moon.y === y) return true;
    return false;
  }
  function freeCell(minHeadDist){
    for (var i = 0; i < 200; i++){
      var x = Math.floor(Math.random() * GRID), y = Math.floor(Math.random() * GRID);
      if (occupied(x, y)) continue;
      if (minHeadDist && Math.abs(x - snake[0].x) + Math.abs(y - snake[0].y) < minHeadDist) continue;
      return { x: x, y: y };
    }
    return null;
  }

  function resetState(){
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    prev = snake.map(cp); dir = { x: 1, y: 0 }; queue = [];
    rocks = []; golden = null; moon = null; fruit = null;
    score = 0; eaten = 0; level = 1; combo = 0; lastEat = -99999; gameTime = 0; slowUntil = 0;
    particles = []; floats = []; shake = 0; acc = 0; pulse = 0; dead = false;
    fruit = freeCell(0);
    scoreEl.textContent = '0';
  }

  function burst(x, y, color, n){
    for (var i = 0; i < n; i++){
      var a = Math.random() * Math.PI * 2, sp = rnd(40, 150);
      particles.push({ x: x * CELL + CELL / 2, y: y * CELL + CELL / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.35, 0.7), max: 0.7, color: color });
    }
  }
  function floatText(x, y, text, color){ floats.push({ x: x * CELL + CELL / 2, y: y * CELL, text: text, color: color, life: 0.9 }); }

  function die(){
    dead = true; running = false; music.stop(); shake = 0.35;
    tone(150, 0.4, 'sawtooth', 0.09); tone(90, 0.5, 'sawtooth', 0.08, 0.1);
    var m = mode;
    var newBest = score > bests[m];
    if (newBest){
      bests[m] = score; bestEl.textContent = score;
      try { localStorage.setItem(m === 'wrap' ? 'nightvine_best_wrap' : 'nightvine_best', String(score)); } catch (e) { /* ignore */ }
    }
    finalText.innerHTML = '分數 ' + score + '　等級 ' + level + '<br>' + (m === 'wrap' ? '穿牆模式' : '經典模式') + (newBest ? '<br>刷新最高分了！' : '');
    setTimeout(function(){ overOverlay.classList.remove('hidden'); }, 600);
  }

  function step(){
    if (queue.length) dir = queue.shift();
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (mode === 'wrap'){ head.x = (head.x + GRID) % GRID; head.y = (head.y + GRID) % GRID; }
    else if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID){ die(); return; }

    var eatFruit = fruit && head.x === fruit.x && head.y === fruit.y;
    var eatGold = golden && head.x === golden.x && head.y === golden.y;
    var eatMoon = moon && head.x === moon.x && head.y === moon.y;
    var grow = eatFruit || eatGold;

    var body = grow ? snake : snake.slice(0, -1);
    if (body.some(function(s){ return s.x === head.x && s.y === head.y; }) || rocks.some(function(r){ return r.x === head.x && r.y === head.y; })){ die(); return; }

    prev = snake.map(cp);
    snake.unshift(head);
    if (grow) prev.push(cp(prev[prev.length - 1])); else snake.pop();

    if (eatFruit){
      combo = (gameTime - lastEat < 2600) ? Math.min(combo + 1, 5) : 1;
      lastEat = gameTime;
      var gain = 10 * combo;
      score += gain; eaten++;
      floatText(head.x, head.y, '+' + gain + (combo > 1 ? ' ×' + combo : ''), combo > 1 ? '#F4A623' : '#FDF6EC');
      burst(head.x, head.y, '#F45B8A', 12);
      tone(440 + combo * 70, 0.1, 'square', 0.06);
      fruit = freeCell(0);
      if (!golden && Math.random() < 0.22){ var g = freeCell(3); if (g){ golden = { x: g.x, y: g.y, exp: gameTime + 7000 }; tone(988, 0.08, 'triangle', 0.05, 0.12); } }
      if (!moon && gameTime >= slowUntil && Math.random() < 0.16){ var m2 = freeCell(3); if (m2) moon = { x: m2.x, y: m2.y, exp: gameTime + 8000 }; }
      var newLevel = 1 + Math.floor(eaten / 5);
      if (newLevel > level){
        level = newLevel;
        for (var r = 0; r < 2 && rocks.length < 14; r++){ var rc = freeCell(6); if (rc) rocks.push(rc); }
        floatText(5, 1, '第 ' + level + ' 級！', '#2DD4BF');
        [523, 659, 784].forEach(function(f, i){ tone(f, 0.12, 'triangle', 0.07, i * 0.08); });
      }
    } else if (eatGold){
      score += 50; golden = null; lastEat = gameTime;
      floatText(head.x, head.y, '+50', '#F4A623'); burst(head.x, head.y, '#F4A623', 18);
      [784, 988, 1175].forEach(function(f, i){ tone(f, 0.12, 'triangle', 0.08, i * 0.06); });
    } else if (eatMoon){
      slowUntil = gameTime + 6000; moon = null;
      floatText(head.x, head.y, '時間變慢', '#7FF0E0'); burst(head.x, head.y, '#7FF0E0', 16);
      tone(330, 0.3, 'sine', 0.08); tone(220, 0.4, 'sine', 0.07, 0.1);
    }
    scoreEl.textContent = score;
    if (golden && gameTime > golden.exp) golden = null;
    if (moon && gameTime > moon.exp) moon = null;
  }

  function lerpPos(i, t){
    var a = prev[i] || snake[i], b = snake[i];
    if (Math.abs(b.x - a.x) > 1 || Math.abs(b.y - a.y) > 1) return { x: b.x, y: b.y };
    return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
  }

  function ring(cx, cy, frac, color){
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 12, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
  }

  function draw(t){
    ctx.save();
    if (shake > 0) ctx.translate(rnd(-4, 4) * shake * 3, rnd(-4, 4) * shake * 3);
    var x, y;
    for (y = 0; y < GRID; y++) for (x = 0; x < GRID; x++){
      ctx.fillStyle = (x + y) % 2 === 0 ? '#150C1C' : '#1B1024'; ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
    if (mode === 'classic'){ ctx.strokeStyle = 'rgba(244,166,35,.35)'; ctx.lineWidth = 2; ctx.strokeRect(1, 1, SIZE - 2, SIZE - 2); }

    rocks.forEach(function(r){
      ctx.fillStyle = '#5E4F70'; ctx.beginPath(); ctx.moveTo(r.x * CELL + 3, r.y * CELL + 16); ctx.lineTo(r.x * CELL + 5, r.y * CELL + 5); ctx.lineTo(r.x * CELL + 14, r.y * CELL + 3); ctx.lineTo(r.x * CELL + 18, r.y * CELL + 12); ctx.lineTo(r.x * CELL + 14, r.y * CELL + 18); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(r.x * CELL + 6, r.y * CELL + 6, 5, 3);
    });

    var pr = 1 + Math.sin(pulse * 5) * 0.08;
    if (fruit){
      ctx.shadowColor = '#F45B8A'; ctx.shadowBlur = 12; ctx.fillStyle = '#F45B8A';
      ctx.beginPath(); ctx.arc(fruit.x * CELL + 10, fruit.y * CELL + 10, 6.5 * pr, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#2DD4BF'; ctx.fillRect(fruit.x * CELL + 9, fruit.y * CELL + 1, 2, 4);
    }
    if (golden){
      var gl = Math.max(0, (golden.exp - gameTime) / 7000), gx = golden.x * CELL + 10, gy = golden.y * CELL + 10;
      ctx.shadowColor = '#F4A623'; ctx.shadowBlur = 14; ctx.fillStyle = '#F4A623'; ctx.beginPath();
      for (var k = 0; k < 10; k++){ var rr = k % 2 ? 3.5 : 8 * pr, an = -Math.PI / 2 + k * Math.PI / 5; ctx.lineTo(gx + Math.cos(an) * rr, gy + Math.sin(an) * rr); }
      ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0; ring(gx, gy, gl, '#F4A623');
    }
    if (moon){
      var ml = Math.max(0, (moon.exp - gameTime) / 8000), mx = moon.x * CELL + 10, my = moon.y * CELL + 10;
      ctx.shadowColor = '#7FF0E0'; ctx.shadowBlur = 12; ctx.fillStyle = '#7FF0E0';
      for (var p = 0; p < 5; p++){ var pa = p * Math.PI * 2 / 5 + pulse; ctx.beginPath(); ctx.arc(mx + Math.cos(pa) * 5, my + Math.sin(pa) * 5, 3.4, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#FDF6EC'; ctx.beginPath(); ctx.arc(mx, my, 3, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; ring(mx, my, ml, '#7FF0E0');
    }

    var n = snake.length, pts = [], i;
    for (i = 0; i < n; i++){ var q = lerpPos(i, t); pts.push({ x: q.x * CELL + 10, y: q.y * CELL + 10 }); }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (i = n - 1; i > 0; i--){
      if (Math.abs(pts[i].x - pts[i - 1].x) > CELL * 1.6 || Math.abs(pts[i].y - pts[i - 1].y) > CELL * 1.6) continue;
      var w = 8 + 8 * (1 - i / n);
      ctx.strokeStyle = gameTime < slowUntil ? '#7FF0E0' : '#2DD4BF'; ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[i - 1].x, pts[i - 1].y); ctx.stroke();
      ctx.strokeStyle = 'rgba(21,12,28,.28)'; ctx.lineWidth = w * 0.3;
      ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[i - 1].x, pts[i - 1].y); ctx.stroke();
    }
    var h = pts[0], d = dir;
    ctx.fillStyle = '#F4A623'; ctx.beginPath(); ctx.arc(h.x, h.y, 9, 0, Math.PI * 2); ctx.fill();
    var ex = -d.y * 4, ey = d.x * 4;
    ctx.fillStyle = '#1E1226';
    ctx.beginPath(); ctx.arc(h.x + d.x * 3 + ex, h.y + d.y * 3 + ey, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(h.x + d.x * 3 - ex, h.y + d.y * 3 - ey, 2, 0, Math.PI * 2); ctx.fill();

    particles.forEach(function(pt){ ctx.globalAlpha = Math.max(0, pt.life / pt.max); ctx.fillStyle = pt.color; ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4); });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.font = "700 13px 'Nunito', sans-serif";
    floats.forEach(function(f){ ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.6)); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y); });
    ctx.globalAlpha = 1;

    ctx.textAlign = 'left'; ctx.font = "9px 'Press Start 2P', monospace"; ctx.fillStyle = 'rgba(253,246,236,.75)';
    ctx.fillText('LV ' + level, 10, 18);
    if (combo > 1 && gameTime - lastEat < 2600){ ctx.fillStyle = '#F4A623'; ctx.fillText('COMBO ×' + combo, 10, 34); ctx.fillRect(10, 40, 70 * (1 - (gameTime - lastEat) / 2600), 3); }
    if (gameTime < slowUntil){ ctx.fillStyle = '#7FF0E0'; ctx.fillText('SLOW', SIZE - 62, 18); }
    ctx.restore();
  }

  function loop(ts){
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
    pulse += dt;
    if (running && !paused){
      gameTime += dt * 1000; acc += dt * 1000;
      var iv = curInterval(), guard = 0;
      while (acc >= iv && running && guard++ < 4){ acc -= iv; step(); iv = curInterval(); }
      if (golden && gameTime > golden.exp) golden = null;
      if (moon && gameTime > moon.exp) moon = null;
    }
    for (var i = particles.length - 1; i >= 0; i--){ var p = particles[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.life <= 0) particles.splice(i, 1); }
    for (var j = floats.length - 1; j >= 0; j--){ floats[j].life -= dt; floats[j].y -= 28 * dt; if (floats[j].life <= 0) floats.splice(j, 1); }
    if (shake > 0) shake -= dt;
    draw(running ? Math.min(1, acc / curInterval()) : 1);
    raf = requestAnimationFrame(loop);
  }

  function setDir(nx, ny){
    if (!running || paused) return;
    var ref = queue.length ? queue[queue.length - 1] : dir;
    if (nx === ref.x && ny === ref.y) return;
    if (nx === -ref.x && ny === -ref.y) return;
    if (queue.length < 2) queue.push({ x: nx, y: ny });
  }
  function setPaused(p){
    if (!running || dead) return;
    paused = p; pauseOverlay.classList.toggle('hidden', !p);
    pauseBtn.textContent = p ? '▶' : '⏸';
    if (p) music.stop(); else music.start();
  }

  function startGame(){
    getAc();
    startOverlay.classList.add('hidden'); overOverlay.classList.add('hidden'); pauseOverlay.classList.add('hidden');
    resetState(); bestEl.textContent = bests[mode];
    running = true; paused = false; pauseBtn.textContent = '⏸';
    music.start();
  }

  document.addEventListener('keydown', function(e){
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W'){ setDir(0, -1); e.preventDefault(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S'){ setDir(0, 1); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A'){ setDir(-1, 0); e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D'){ setDir(1, 0); e.preventDefault(); }
    else if (k === 'p' || k === 'P' || k === ' '){ if (running){ e.preventDefault(); setPaused(!paused); } }
  });
  document.addEventListener('visibilitychange', function(){ if (document.hidden && running && !paused) setPaused(true); });
  document.querySelector('.dpad .up').addEventListener('click', function(){ setDir(0, -1); });
  document.querySelector('.dpad .down').addEventListener('click', function(){ setDir(0, 1); });
  document.querySelector('.dpad .left').addEventListener('click', function(){ setDir(-1, 0); });
  document.querySelector('.dpad .right').addEventListener('click', function(){ setDir(1, 0); });

  var ts0 = null;
  canvas.addEventListener('touchstart', function(e){ var t = e.changedTouches[0]; ts0 = { x: t.clientX, y: t.clientY }; }, { passive: true });
  canvas.addEventListener('touchend', function(e){
    if (!ts0) return;
    var t = e.changedTouches[0], dx = t.clientX - ts0.x, dy = t.clientY - ts0.y;
    if (Math.abs(dx) > Math.abs(dy)){ if (Math.abs(dx) > 18) setDir(dx > 0 ? 1 : -1, 0); }
    else if (Math.abs(dy) > 18) setDir(0, dy > 0 ? 1 : -1);
    ts0 = null;
  }, { passive: true });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
  document.getElementById('resumeBtn').addEventListener('click', function(){ setPaused(false); });
  pauseBtn.addEventListener('click', function(){ if (running) setPaused(!paused); });
  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){
      mode = b.dataset.mode;
      try { localStorage.setItem('nightvine_mode', mode); } catch (e) { /* ignore */ }
      document.querySelectorAll('.seg button').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      bestEl.textContent = bests[mode];
    });
  });
  function refreshMusicBtn(){ musicBtn.textContent = musicOn ? '🔊' : '🔇'; musicBtn.setAttribute('aria-pressed', String(musicOn)); }
  musicBtn.addEventListener('click', function(){
    musicOn = !musicOn;
    try { localStorage.setItem('nightvine_music', musicOn ? '1' : '0'); } catch (e) { /* ignore */ }
    if (musicOn && running && !paused) music.start(); else music.stop();
    refreshMusicBtn();
  });

  document.querySelectorAll('.seg button').forEach(function(x){ x.setAttribute('aria-pressed', String(x.dataset.mode === mode)); });
  refreshMusicBtn();
  running = false; paused = false;
  resetState(); bestEl.textContent = bests[mode];
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
