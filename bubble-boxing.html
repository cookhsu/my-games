<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=360,H=640;
var $=function(id){return document.getElementById(id);};

var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); window.__BX_AC=AC; }catch(e){} } return AC; }
function playTone(freq,dur,type,vol,sweepTo){
  var c=ac(); if(!c) return;
  try{
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,c.currentTime);
    if(sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo,c.currentTime+dur);
    g.gain.setValueAtTime(vol||0.15,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
  }catch(e){}
}
function sfxPop(){ playTone(600,0.07,'triangle',0.1,900); }
function sfxBomb(){ playTone(140,0.18,'sawtooth',0.12,90); }
function sfxMiss(){ playTone(220,0.05,'sine',0.05); }
function sfxEnd(){ playTone(523,0.1,'triangle',0.14); setTimeout(function(){playTone(659,0.1,'triangle',0.14);},100); setTimeout(function(){playTone(784,0.18,'triangle',0.15);},200); }

function loadBest(){ try{ return parseInt(localStorage.getItem('bx_best')||'0',10)||0; }catch(e){ return 0; } }
function saveBest(v){ try{ localStorage.setItem('bx_best', String(v)); }catch(e){} }

var ROUND_TIME=45;

function S0(){
  return {
    phase:'menu',
    prePausePhase:null,
    demo:false,
    stream:null,
    timeLeft:ROUND_TIME,
    score:0,
    combo:0,
    bestCombo:0,
    bubbles:[], // {x,y,r,type:'good'|'bomb',bornT,life,popped,missed}
    particles:[],
    nextSpawnAt:0,
    elapsed:0,
    best:loadBest(),
    t:0,
    demoTimers:[]
  };
}
var S=S0();

function resetState(){
  var fresh=S0();
  fresh.best=S.best;
  for(var k in S){ if(Object.prototype.hasOwnProperty.call(S,k)) delete S[k]; }
  for(var k2 in fresh){ if(Object.prototype.hasOwnProperty.call(fresh,k2)) S[k2]=fresh[k2]; }
}

function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }

function difficultyTier(){
  if(S.elapsed<15) return 0;
  if(S.elapsed<30) return 1;
  return 2;
}
var TIER_CFG=[
  { spawnGap:1.05, life:1.7, bombChance:0.0, maxOnScreen:1 },
  { spawnGap:0.8,  life:1.4, bombChance:0.22, maxOnScreen:2 },
  { spawnGap:0.6,  life:1.15, bombChance:0.32, maxOnScreen:2 }
];

function renderHUD(){
  $('timeTxt').textContent=String(Math.max(0,Math.ceil(S.timeLeft)));
  $('scoreTxt').textContent=String(S.score);
  $('comboTxt').textContent=String(S.combo);
}

function spawnBubble(){
  var cfg=TIER_CFG[difficultyTier()];
  var alive=S.bubbles.filter(function(b){return !b.popped && !b.missed;}).length;
  if(alive>=cfg.maxOnScreen) return;
  var r=30;
  var x = r+20 + Math.random()*(W-2*(r+20));
  var y = 130 + Math.random()*(H-300);
  var isBomb = Math.random()<cfg.bombChance;
  S.bubbles.push({ x:x, y:y, r:r, type:isBomb?'bomb':'good', bornT:S.t, life:cfg.life, popped:false, missed:false });
}

function spawnParticles(x,y,color){
  for(var i=0;i<14;i++){
    var a=Math.random()*Math.PI*2, sp=60+Math.random()*120;
    S.particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0.5, age:0, color:color });
  }
}

function tryPopAt(x,y){
  if(S.phase!=='playing') return null;
  for(var i=S.bubbles.length-1;i>=0;i--){
    var b=S.bubbles[i];
    if(b.popped || b.missed) continue;
    var dx=x-b.x, dy=y-b.y;
    if(Math.sqrt(dx*dx+dy*dy) <= b.r+14){
      b.popped=true;
      if(b.type==='good'){
        S.combo++;
        if(S.combo>S.bestCombo) S.bestCombo=S.combo;
        var mult=1+Math.floor(S.combo/5)*0.5;
        var pts=Math.round(10*mult);
        S.score+=pts;
        sfxPop();
        spawnParticles(b.x,b.y,'#4FA8FF');
      } else {
        S.combo=0;
        S.score=Math.max(0,S.score-5);
        sfxBomb();
        spawnParticles(b.x,b.y,'#FF5A6B');
      }
      renderHUD();
      return b;
    }
  }
  return null;
}

// ---- motion detection (frame diff) ----
var SW=36, SH=64;
var smallCv=document.createElement('canvas'); smallCv.width=SW; smallCv.height=SH;
var smallCtx=smallCv.getContext('2d', {willReadFrequently:true});
var prevGray=null;
var video=document.createElement('video');
video.setAttribute('playsinline',''); video.muted=true;

function drawCameraFrame(){
  if(!video.videoWidth) return false;
  var vw=video.videoWidth, vh=video.videoHeight;
  var scale=Math.max(W/vw, H/vh);
  var dw=vw*scale, dh=vh*scale;
  var dx=(W-dw)/2, dy=(H-dh)/2;
  ctx.save();
  ctx.translate(W,0); ctx.scale(-1,1);
  ctx.drawImage(video, dx, dy, dw, dh);
  ctx.restore();
  return true;
}

function computeMotionGrid(){
  // downsample current canvas (which already has the mirrored camera frame drawn) for motion diff
  smallCtx.drawImage(cv,0,0,SW,SH);
  var data=smallCtx.getImageData(0,0,SW,SH).data;
  var gray=new Float32Array(SW*SH);
  for(var i=0;i<SW*SH;i++){
    var o=i*4;
    gray[i]=0.299*data[o]+0.587*data[o+1]+0.114*data[o+2];
  }
  var diff=null;
  if(prevGray){
    diff=new Float32Array(SW*SH);
    for(var j=0;j<SW*SH;j++){ diff[j]=Math.abs(gray[j]-prevGray[j]); }
  }
  prevGray=gray;
  return diff;
}

function motionEnergyAt(x,y,r,diff){
  if(!diff) return 0;
  var sx=x/W*SW, sy=y/H*SH, sr=Math.max(2,r/W*SW);
  var x0=Math.max(0,Math.floor(sx-sr)), x1=Math.min(SW-1,Math.ceil(sx+sr));
  var y0=Math.max(0,Math.floor(sy-sr)), y1=Math.min(SH-1,Math.ceil(sy+sr));
  var sum=0, n=0;
  for(var yy=y0;yy<=y1;yy++){
    for(var xx=x0;xx<=x1;xx++){
      sum+=diff[yy*SW+xx]; n++;
    }
  }
  return n>0 ? sum/n : 0;
}

var MOTION_THRESHOLD=18;

function checkMotionHits(diff){
  if(!diff) return;
  for(var i=0;i<S.bubbles.length;i++){
    var b=S.bubbles[i];
    if(b.popped || b.missed) continue;
    var e=motionEnergyAt(b.x,b.y,b.r,diff);
    if(e>MOTION_THRESHOLD){
      tryPopAt(b.x,b.y);
    }
  }
}

function startCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.reject({name:'NoMedia'});
  return navigator.mediaDevices.getUserMedia({ video:{facingMode:'user', width:{ideal:480}, height:{ideal:640}}, audio:false })
    .then(function(s){ S.stream=s; video.srcObject=s; return video.play().catch(function(){}); });
}
function stopCamera(){
  if(S.stream){ S.stream.getTracks().forEach(function(t){t.stop();}); S.stream=null; }
}

function checkWin(){} // continuous arcade game, no per-level win; kept for convention parity

function endRound(){
  S.phase='cleared';
  $('topbar').classList.remove('on'); $('menuBtn').classList.remove('on');
  stopCamera();
  S.demoTimers.forEach(function(id){ clearTimeout(id); });
  S.demoTimers=[];
  if(S.score>S.best){ S.best=S.score; saveBest(S.best); }
  sfxEnd();
  $('finalScoreTxt').textContent=String(S.score);
  $('clearedDetail').textContent='最高連擊 '+S.bestCombo+' 次！'+(S.score>=S.best?' 🎉創下新紀錄！':'');
  show('ovCleared');
}

function startPlaying(useDemo){
  hide('ovMenu'); hide('ovCleared'); hide('ovPause');
  $('camErr').classList.add('hidden');
  S.demo=!!useDemo;
  S.timeLeft=ROUND_TIME;
  S.score=0; S.combo=0; S.bestCombo=0;
  S.bubbles=[]; S.particles=[];
  S.elapsed=0; S.nextSpawnAt=0.4;
  prevGray=null;

  if(S.demo){
    beginPlayingPhase();
    scheduleDemoAutopilot();
  } else {
    $('btnStartCam').textContent='開啟相機中…';
    startCamera().then(function(){
      beginPlayingPhase();
    }).catch(function(err){
      $('btnStartCam').textContent='📷 開啟鏡頭開始';
      var m = (err&&err.name==='NotAllowedError') ? '沒有取得相機權限，請允許存取相機，或改用示範模式。' : '無法開啟相機，可改用示範模式體驗遊戲。';
      $('camErr').textContent=m;
      $('camErr').classList.remove('hidden');
    });
  }
}

function beginPlayingPhase(){
  S.phase='playing';
  $('topbar').classList.add('on');
  $('menuBtn').classList.add('on');
  renderHUD();
}

function scheduleDemoAutopilot(){
  // demo mode: no real camera, so we simulate a virtual player popping good bubbles reliably
  // and avoiding bombs, by directly calling tryPopAt shortly after each bubble spawns.
  function tick(){
    if(S.phase!=='playing') return;
    for(var i=0;i<S.bubbles.length;i++){
      var b=S.bubbles[i];
      if(b.popped||b.missed) continue;
      if(!b._demoScheduled){
        b._demoScheduled=true;
        var delay=250+Math.random()*450;
        var id=setTimeout((function(bb){ return function(){
          if(S.phase==='playing' && !bb.popped && !bb.missed){
            if(bb.type==='bomb'){
              // demo autopilot mostly avoids bombs, occasionally "misses" them on purpose (let them expire)
            } else {
              tryPopAt(bb.x,bb.y);
            }
          }
        };})(b), delay);
        S.demoTimers.push(id);
      }
    }
    var id2=setTimeout(tick, 120);
    S.demoTimers.push(id2);
  }
  tick();
}

function updateGame(dt){
  S.elapsed+=dt;
  S.timeLeft-=dt;
  if(S.timeLeft<=0){ S.timeLeft=0; renderHUD(); endRound(); return; }

  S.nextSpawnAt-=dt;
  if(S.nextSpawnAt<=0){
    spawnBubble();
    S.nextSpawnAt=TIER_CFG[difficultyTier()].spawnGap;
  }

  for(var i=0;i<S.bubbles.length;i++){
    var b=S.bubbles[i];
    if(b.popped||b.missed) continue;
    if(S.t-b.bornT>b.life){
      b.missed=true;
      if(b.type==='good'){ S.combo=0; sfxMiss(); }
    }
  }
  S.bubbles=S.bubbles.filter(function(b){ return S.t-b.bornT < b.life+0.4; });

  for(var p=S.particles.length-1;p>=0;p--){
    var pt=S.particles[p];
    pt.age+=dt;
    pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=300*dt;
    if(pt.age>=pt.life) S.particles.splice(p,1);
  }

  renderHUD();
}

function drawBubble(b){
  var ageT=(S.t-b.bornT)/b.life;
  var scale=1;
  if(b.popped) return;
  if(ageT>1) return;
  if(b.missed) scale=Math.max(0,1-(S.t-b.bornT-b.life)*3);

  var cx=b.x, cy=b.y;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.scale(scale,scale);

  var grad=ctx.createRadialGradient(-8,-8,4,0,0,b.r);
  if(b.type==='bomb'){ grad.addColorStop(0,'#FF8F8F'); grad.addColorStop(1,'#B8202E'); }
  else { grad.addColorStop(0,'#9FD4FF'); grad.addColorStop(1,'#2E7FD6'); }
  ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2);
  ctx.fillStyle=grad; ctx.fill();
  ctx.lineWidth=3;
  ctx.strokeStyle='rgba(255,255,255,.5)';
  ctx.stroke();

  // countdown ring
  ctx.beginPath();
  ctx.arc(0,0,b.r+6,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-Math.min(1,ageT)));
  ctx.strokeStyle = b.type==='bomb' ? 'rgba(255,90,107,.9)' : 'rgba(255,200,61,.9)';
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.font='28px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(b.type==='bomb'?'💣':'🥊', 0, 2);
  ctx.restore();
}

function draw(){
  var haveFrame=false;
  if(S.phase==='playing' || S.phase==='paused'){
    if(!S.demo){ haveFrame=drawCameraFrame(); }
  }
  if(!haveFrame){
    var bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#241730'); bg.addColorStop(1,'#140C18');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    if(S.demo && (S.phase==='playing'||S.phase==='paused')){
      ctx.font='13px "Noto Sans TC",sans-serif';
      ctx.fillStyle='rgba(255,255,255,.35)';
      ctx.textAlign='center';
      ctx.fillText('🎬 示範模式（未使用鏡頭）', W/2, 70);
    }
  }

  if(!(S.phase==='playing' || S.phase==='paused')) return;

  for(var i=0;i<S.bubbles.length;i++){ drawBubble(S.bubbles[i]); }
  for(var p=0;p<S.particles.length;p++){
    var pt=S.particles[p];
    var alpha=1-pt.age/pt.life;
    ctx.save();
    ctx.globalAlpha=Math.max(0,alpha);
    ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

var lastTs=0;
function loop(ts){
  var dtRaw=(ts-lastTs)/1000;
  lastTs=ts;
  var dt=Math.min(0.05, isNaN(dtRaw)?0:dtRaw);
  S.t=(ts||0)/1000;

  draw();

  if(S.phase==='playing'){
    if(!S.demo){
      var diff=computeMotionGrid();
      checkMotionHits(diff);
    }
    updateGame(dt);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

$('btnStartCam').addEventListener('click',function(){ startPlaying(false); });
$('btnStartDemo').addEventListener('click',function(){ startPlaying(true); });
$('btnReplay').addEventListener('click',function(){ startPlaying(S.demo); });
$('btnBackMenu1').addEventListener('click',function(){ backToMenu(); });
$('btnMenu2').addEventListener('click',function(){ hide('ovPause'); backToMenu(); });
$('btnResume').addEventListener('click',function(){
  if(S.phase==='paused'){ hide('ovPause'); S.phase=S.prePausePhase||'playing'; }
});
$('menuBtn').addEventListener('click',function(){
  if(S.phase!=='playing') return;
  S.prePausePhase=S.phase;
  S.phase='paused';
  show('ovPause');
});

function backToMenu(){
  hide('ovCleared'); hide('ovPause');
  stopCamera();
  S.demoTimers.forEach(function(id){ clearTimeout(id); });
  S.demoTimers=[];
  S.phase='menu';
  $('topbar').classList.remove('on'); $('menuBtn').classList.remove('on');
  $('bestScoreTxt').textContent=String(S.best);
  show('ovMenu');
}
$('bestScoreTxt').textContent=String(S.best);

// pointer tap also allows manual popping (accessibility / mouse testing without motion)
var downPt=null;
function pointerXY(e){
  var rect=cv.getBoundingClientRect();
  var scaleX=W/rect.width, scaleY=H/rect.height;
  return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
}
cv.addEventListener('pointerdown',function(e){ downPt=pointerXY(e); });
cv.addEventListener('pointerup',function(e){
  if(!downPt) return;
  var p=pointerXY(e);
  downPt=null;
  if(S.phase==='playing'){ tryPopAt(p.x,p.y); }
});

window.__BX = {
  state:S,
  startCam:function(){ startPlaying(false); },
  startDemo:function(){ startPlaying(true); },
  tryPopAt:tryPopAt,
  spawnBubble:spawnBubble,
  isSolved:function(){ return S.phase==='cleared'; },
  retry:function(){ startPlaying(true); },
  retryWin:function(){ startPlaying(true); },
  forceEnd:function(){ if(S.phase==='playing'){ S.timeLeft=0; } },
  advance:function(seconds){
    var steps=Math.ceil(seconds/0.05);
    for(var i=0;i<steps;i++){ updateGame(0.05); S.t+=0.05; }
  }
};
})();
</script>
