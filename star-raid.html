<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星艦突襲 STAR RAID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060814; --panel:#0F1538; --edge:#2B3878; --txt:#EAEEFF; --dim:#8E9AD0;
    --neon:#58E1FF; --pink:#FF5FA8; --gold:#FFD45E;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ background:var(--bg); }
  html,body{ margin:0; color:var(--txt); font-family:'Noto Sans TC',system-ui,sans-serif; min-height:100%; }
  body{ display:flex; flex-direction:column; align-items:center; padding:20px 12px 50px; position:relative; overflow-x:hidden;
    background:radial-gradient(ellipse at 80% -10%, rgba(255,95,168,.20), transparent 50%), radial-gradient(ellipse at 10% 5%, rgba(88,225,255,.18), transparent 48%), radial-gradient(ellipse at 50% 115%, rgba(120,80,255,.18), transparent 55%), var(--bg); }
  body::before{ content:''; position:fixed; inset:-30%; z-index:0; pointer-events:none; filter:blur(80px); animation:spin 60s linear infinite;
    background:conic-gradient(from 0deg, rgba(88,225,255,.09), rgba(255,95,168,.08), rgba(120,80,255,.10), rgba(88,225,255,.09)); }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  body > *{ position:relative; z-index:1; }
  h1{ margin:0 0 2px; font-family:'Orbitron',sans-serif; font-weight:900; font-size:clamp(24px,7vw,34px); letter-spacing:4px; background:linear-gradient(90deg,#7FEBFF,#B8A2FF 50%,#FF7FBE); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 14px rgba(120,160,255,.45)); }
  .sub{ margin:0 0 12px; color:var(--dim); font-size:12.5px; letter-spacing:1px; }
  .cab{ width:100%; max-width:420px; padding:12px; border-radius:22px; border:1px solid rgba(255,255,255,.10); background:linear-gradient(160deg, rgba(32,42,98,.72), rgba(12,17,48,.84)); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 24px 60px rgba(0,0,0,.6), 0 0 60px rgba(88,120,255,.10), inset 0 1px 0 rgba(255,255,255,.10); }
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:10px; }
  .stat{ position:relative; background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.22)); border:1px solid rgba(255,255,255,.09); border-radius:11px; padding:6px 4px 8px; text-align:center; overflow:hidden; }
  .stat::after{ content:''; position:absolute; left:22%; right:22%; bottom:0; height:2px; border-radius:2px; background:var(--neon); box-shadow:0 0 10px var(--neon); }
  .stat .l{ display:block; font-size:10px; color:var(--dim); letter-spacing:1.5px; }
  .stat .v{ font-family:'Orbitron',sans-serif; font-weight:700; font-size:15px; text-shadow:0 0 12px rgba(160,190,255,.5); white-space:nowrap; }
  .screen{ position:relative; border-radius:12px; overflow:hidden; border:2px solid var(--neon); background:#04050F; box-shadow:0 0 26px rgba(88,225,255,.4), inset 0 0 30px rgba(0,0,0,.6); }
  canvas{ display:block; width:100%; height:auto; touch-action:none; cursor:none; }
  .overlay{ position:absolute; inset:0; background:radial-gradient(ellipse at 50% 30%, rgba(30,40,100,.88), rgba(5,7,20,.95)); backdrop-filter:blur(3px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:11px; text-align:center; padding:14px; overflow:auto; }
  .overlay.hidden{ display:none; }
  .overlay h2{ margin:0; font-family:'Orbitron',sans-serif; font-size:clamp(19px,5.6vw,27px); letter-spacing:3px; background:linear-gradient(90deg,#7FEBFF,#FF7FBE); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 10px rgba(120,160,255,.5)); }
  .overlay p{ margin:0; color:var(--dim); font-size:12.5px; line-height:1.7; }
  .legend{ display:grid; grid-template-columns:auto 1fr; gap:5px 9px; text-align:left; font-size:12px; background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:9px 13px; }
  .legend i{ width:20px; height:20px; border-radius:50%; font-style:normal; font:900 11px 'Orbitron',sans-serif; display:flex; align-items:center; justify-content:center; color:#06101A; }
  .btn{ font:900 14px 'Orbitron','Noto Sans TC',sans-serif; letter-spacing:2px; color:#05141C; background:linear-gradient(180deg,#8DF0FF,#38C0EA); border:none; padding:12px 28px; border-radius:999px; cursor:pointer; box-shadow:0 4px 0 #1E8CAD, 0 0 22px rgba(88,225,255,.45); }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #1E8CAD, 0 0 14px rgba(88,225,255,.4); }
  .btn:focus-visible, .tool:focus-visible, .bomb:focus-visible{ outline:3px solid var(--neon); outline-offset:2px; }
  .row{ display:flex; gap:8px; margin-top:10px; align-items:center; }
  .tool{ width:46px; height:46px; flex:none; font-size:17px; color:var(--txt); background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.03)); border:1px solid rgba(255,255,255,.14); border-radius:14px; cursor:pointer; }
  .tool:hover{ border-color:var(--neon); }
  .bomb{ flex:1; height:46px; font:900 15px 'Noto Sans TC',sans-serif; letter-spacing:2px; color:#2A0A14; background:linear-gradient(180deg,#FF9AC8,#FF5FA8); border:none; border-radius:14px; cursor:pointer; box-shadow:0 3px 0 #B02A6E, 0 0 16px rgba(255,95,168,.35); }
  .bomb:active{ transform:translateY(2px); box-shadow:0 1px 0 #B02A6E; }
  .bomb:disabled{ opacity:.4; box-shadow:none; }
  .hint{ margin-top:14px; font-size:12px; color:var(--dim); text-align:center; line-height:1.8; max-width:420px; }
  .hint kbd{ font:700 10px 'Orbitron',sans-serif; background:linear-gradient(180deg,#2A3680,#1B2456); border:1px solid #3D4D9E; border-radius:5px; padding:2px 6px; color:#9FEFFF; }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
  <h1>星艦突襲</h1>
  <p class="sub">STAR RAID・擊落敵艦、撿道具、打倒巨型母艦</p>
  <div class="cab">
    <div class="stats">
      <div class="stat"><span class="l">分數</span><span class="v" id="score">0</span></div>
      <div class="stat"><span class="l">波次</span><span class="v" id="wave">1</span></div>
      <div class="stat"><span class="l">生命</span><span class="v" id="lives">♥♥♥</span></div>
      <div class="stat"><span class="l">最高</span><span class="v" id="best">0</span></div>
    </div>
    <div class="screen">
      <canvas id="game" width="360" height="560" aria-label="太空射擊遊戲畫面"></canvas>
      <div class="overlay" id="startOv">
        <h2>STAR RAID</h2>
        <div class="legend">
          <i style="background:#FFD45E">W</i><span>武器升級：子彈越來越多（最高 5 級）</span>
          <i style="background:#58E1FF">S</i><span>護盾：擋下一次撞擊</span>
          <i style="background:#FF5FA8">B</i><span>炸彈：清空子彈、重創全場</span>
          <i style="background:#6DFFB0">+</i><span>補一條生命</span>
        </div>
        <p>自動連射，專心閃躲就好。<br>每 5 波會有巨型母艦出現！</p>
        <button class="btn" id="startBtn">出擊</button>
      </div>
      <div class="overlay hidden" id="pauseOv"><h2>暫停</h2><button class="btn" id="resumeBtn">繼續</button></div>
      <div class="overlay hidden" id="overOv"><h2>MISSION FAILED</h2><p id="overText"></p><button class="btn" id="againBtn">再戰一次</button></div>
    </div>
    <div class="row">
      <button class="tool" id="pauseBtn" aria-label="暫停">⏸</button>
      <button class="bomb" id="bombBtn" aria-label="使用炸彈">💥 炸彈 ×<span id="bombN">1</span></button>
      <button class="tool" id="musicBtn" aria-label="切換背景音樂" aria-pressed="true">🔊</button>
    </div>
  </div>
  <p class="hint">手機：手指在畫面上拖曳移動戰機。電腦：滑鼠移動，或用 <kbd>方向鍵</kbd>/<kbd>WASD</kbd>。<br><kbd>空白</kbd> 或「炸彈」按鈕引爆炸彈，<kbd>P</kbd> 暫停。</p>

<script>
(function(){
  "use strict";
  var VW = 360, VH = 560;
  var $ = function(id){ return document.getElementById(id); };
  var cv = $('game'), ctx = cv.getContext('2d');
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = VW * DPR; cv.height = VH * DPR;
  var scoreEl = $('score'), waveEl = $('wave'), livesEl = $('lives'), bestEl = $('best'), bombN = $('bombN'), bombBtn = $('bombBtn');
  var startOv = $('startOv'), pauseOv = $('pauseOv'), overOv = $('overOv'), pauseBtn = $('pauseBtn'), musicBtn = $('musicBtn');

  var best = 0, musicOn = true;
  try { best = parseInt(localStorage.getItem('sr_best'), 10) || 0; var mv = localStorage.getItem('sr_music'); if (mv !== null) musicOn = (mv === '1'); } catch (e) { /* ignore */ }
  bestEl.textContent = best;

  // ---------- 音效 / 音樂 ----------
  var ac = null, master = null, noiseBuf = null, lastShot = 0;
  function getAc(){
    try {
      if (!ac){
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
    return ac;
  }
  function tone(f, d, type, v, delay, slideTo){
    var a = getAc(); if (!a) return;
    try {
      var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
      o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + d);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v || 0.05, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
    } catch (e) { /* ignore */ }
  }
  function boom(d, v, hp){
    var a = getAc(); if (!a || !noiseBuf) return;
    try {
      var t = a.currentTime, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(hp || 1800, t); f.frequency.exponentialRampToValueAtTime(120, t + d);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d + 0.02);
    } catch (e) { /* ignore */ }
  }
  function sfx(n){
    if (n === 'shoot'){ var now = Date.now(); if (now - lastShot < 90) return; lastShot = now; tone(900, 0.05, 'square', 0.012, 0, 400); }
    else if (n === 'hit') tone(220, 0.04, 'square', 0.02);
    else if (n === 'kill'){ boom(0.22, 0.12, 2200); tone(180, 0.15, 'sawtooth', 0.04, 0, 60); }
    else if (n === 'big'){ boom(0.7, 0.3, 1600); tone(90, 0.6, 'sawtooth', 0.09, 0, 35); }
    else if (n === 'hurt'){ boom(0.4, 0.25, 900); tone(160, 0.3, 'sawtooth', 0.08, 0, 50); }
    else if (n === 'pickup') [660, 880, 1175].forEach(function(f, i){ tone(f, 0.1, 'triangle', 0.06, i * 0.05); });
    else if (n === 'life') [523, 659, 784, 1047].forEach(function(f, i){ tone(f, 0.14, 'triangle', 0.07, i * 0.07); });
    else if (n === 'shield') { tone(1200, 0.15, 'sine', 0.06, 0, 400); }
    else if (n === 'bomb'){ boom(1.0, 0.4, 1400); tone(70, 0.8, 'sawtooth', 0.12, 0, 28); tone(1500, 0.4, 'triangle', 0.05, 0, 200); }
    else if (n === 'warn') [220, 0, 220, 0, 220].forEach(function(f, i){ if (f) tone(f, 0.18, 'sawtooth', 0.06, i * 0.2); });
    else if (n === 'wave') [523, 659, 784].forEach(function(f, i){ tone(f, 0.12, 'triangle', 0.05, i * 0.07); });
    else if (n === 'over') [330, 294, 262, 196, 131].forEach(function(f, i){ tone(f, 0.35, 'sawtooth', 0.05, i * 0.18); });
  }
  // 合成器風配樂：低音 8 分音符 + 琶音 + 旋律，Boss 戰換暗黑和弦並加速
  var NOTE = { C2: 65.41, D2: 73.42, E2: 82.41, F2: 87.31, G2: 98, A2: 110, B2: 123.47, C3: 130.81, E3: 164.81, G3: 196, A3: 220, B3: 246.94, C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99 };
  var ROOTS = ['A2', 'F2', 'C3', 'G2'];
  var CH = [['A3', 'C4', 'E4'], ['F3', 'A3', 'C4'], ['C4', 'E4', 'G4'], ['G3', 'B3', 'D4']];
  CH[1] = ['A3', 'C4', 'F4'];
  var MEL = [
    ['E5', 0, 'C5', 0, 'A4', 0, 'C5', 'E5'],
    ['F4', 0, 'A4', 0, 'C5', 0, 'A4', 0],
    ['G4', 0, 'C5', 0, 'E5', 0, 'G5', 'E5'],
    ['D5', 0, 'B4', 0, 'G4', 0, 'B4', 'D5']
  ];
  var BOSSROOT = ['E2', 'E2', 'F2', 'D2'];
  var music = {
    timer: null, nextTime: 0, step: 0,
    sd: function(){ var bpm = bossAlive ? 150 : Math.min(150, 118 + wave * 2); return 60 / bpm / 2; },
    sched: function(){
      if (!ac) return;
      while (this.nextTime < ac.currentTime + 0.25){
        var dl = this.nextTime - ac.currentTime, sd = this.sd(), bar = Math.floor(this.step / 8), s8 = this.step % 8, ch = bar % 4;
        var root = bossAlive ? BOSSROOT[ch] : ROOTS[ch];
        tone(NOTE[root], sd * 0.9, 'sawtooth', 0.045, dl);
        if (s8 === 0 || s8 === 4) tone(NOTE[root] * 2, sd * 1.5, 'square', 0.015, dl);
        tone(NOTE[CH[ch][s8 % 3]], sd * 0.8, 'square', 0.012, dl);
        var m = MEL[ch][s8];
        if (m && !bossAlive) tone(NOTE[m], sd * 1.6, 'triangle', 0.04, dl);
        if (s8 === 0 || s8 === 4) tone(110, 0.1, 'sine', 0.09, dl, 42);
        if (s8 % 2 === 1) { var a = ac, t = this.nextTime; try { var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 6500; g.gain.setValueAtTime(0.03, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + 0.06); } catch (e) { /* ignore */ } }
        this.nextTime += sd; this.step++;
      }
    },
    start: function(){ this.stop(); if (!musicOn || !getAc()) return; this.step = 0; this.nextTime = ac.currentTime + 0.08; var self = this; this.sched(); this.timer = setInterval(function(){ self.sched(); }, 60); },
    stop: function(){ if (this.timer){ clearInterval(this.timer); this.timer = null; } }
  };

  // ---------- 狀態 ----------
  var ship, bullets, ebullets, enemies, pups, parts, rings, floats, stars;
  var score, wave, lives, bombs, combo, comboT, spawnQ, spawnT, bossAlive, banner, nextWaveT, shake, running, paused, over, pulse, raf, lastTs, clock, flashT;
  var keys = { l: false, r: false, u: false, d: false };
  var pointer = { active: false, x: 180, y: 480 };

  function rnd(a, b){ return a + Math.random() * (b - a); }
  function dist2(ax, ay, bx, by){ var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }

  function initStars(){
    stars = [];
    for (var i = 0; i < 70; i++) stars.push({ x: Math.random() * VW, y: Math.random() * VH, z: Math.random(), });
  }
  initStars();

  function resetState(){
    ship = { x: 180, y: 480, tx: 180, ty: 480, inv: 0, shield: false, weapon: 1, fireT: 0, vx: 0 };
    bullets = []; ebullets = []; enemies = []; pups = []; parts = []; rings = []; floats = [];
    score = 0; wave = 0; lives = 3; bombs = 1; combo = 0; comboT = 0; spawnQ = []; spawnT = 0; bossAlive = false; banner = null; nextWaveT = 0.6; shake = 0; flashT = 0; clock = 0;
    over = false; paused = false; pulse = 0;
    pointer.active = false;
    updateHud();
  }
  function updateHud(){
    scoreEl.textContent = score; waveEl.textContent = Math.max(1, wave);
    var h = ''; for (var i = 0; i < Math.max(lives, 0); i++) h += '♥';
    livesEl.textContent = h || '—'; livesEl.style.color = lives <= 1 ? '#FF6B7E' : '';
    bombN.textContent = bombs; bombBtn.disabled = bombs <= 0 || !running || paused;
  }

  // ---------- 敵人 ----------
  var TYPES = {
    drone:    { hp: 1, r: 12, score: 10,  color: '#FF5F7E' },
    weave:    { hp: 2, r: 13, score: 20,  color: '#FFB347' },
    asteroid: { hp: 3, r: 18, score: 15,  color: '#8A93B8' },
    rammer:   { hp: 2, r: 13, score: 30,  color: '#FF6B3D' },
    gunner:   { hp: 4, r: 16, score: 40,  color: '#B36BE8' },
    tank:     { hp: 10, r: 22, score: 100, color: '#5B7CF2' },
    boss:     { hp: 60, r: 52, score: 1000, color: '#FF3D6E' }
  };
  function spawnEnemy(type, x, y, extra){
    var d = TYPES[type], spd = 1 + 0.035 * wave;
    var e = { type: type, x: x, y: y, hp: d.hp, max: d.hp, r: d.r, score: d.score, color: d.color, t: Math.random() * 6, fireT: rnd(0.6, 1.6), flash: 0, vx: 0, vy: 0, x0: x, spd: spd, rot: Math.random() * 6, small: false };
    if (type === 'asteroid'){ e.pts = []; for (var i = 0; i < 9; i++) e.pts.push(0.78 + Math.random() * 0.4); e.vx = rnd(-30, 30); e.vy = rnd(70, 110) * spd; e.spin = rnd(-2, 2); }
    if (type === 'boss'){ e.hp = e.max = 60 + wave * 8; e.phase = 0; e.atkT = 2; e.atk = 0; e.entering = true; }
    if (extra) for (var k in extra) e[k] = extra[k];
    enemies.push(e); return e;
  }
  function buildWave(w){
    var q = [], n = 8 + w * 2, pool = ['drone'];
    if (w >= 2){ pool.push('weave'); pool.push('asteroid'); }
    if (w >= 3) pool.push('rammer');
    if (w >= 4) pool.push('gunner');
    if (w >= 6 && w % 5 !== 1) pool.push('tank');
    for (var i = 0; i < n; i++){
      var t = pool[Math.floor(Math.random() * pool.length)];
      if (t === 'tank' && Math.random() < 0.5) t = 'gunner';
      var x = rnd(30, VW - 30);
      if (t === 'drone' && Math.random() < 0.3){ for (var j = 0; j < 4; j++) q.push({ type: 'drone', x: Math.min(VW - 24, Math.max(24, x + (j - 1.5) * 40)), wait: j === 0 ? 0 : 0.01 }); }
      else q.push({ type: t, x: x, wait: 0 });
    }
    return q;
  }
  function startWave(){
    wave++;
    if (wave % 5 === 0){
      bossAlive = true; banner = { text: '⚠ WARNING ⚠', sub: '巨型母艦接近', t: 2.4 }; sfx('warn');
      spawnQ = []; setTimeout(function(){ if (running && !over) spawnEnemy('boss', VW / 2, -80); }, 1400);
    } else {
      spawnQ = buildWave(wave); banner = { text: 'WAVE ' + wave, sub: '', t: 1.5 }; sfx('wave');
    }
    spawnT = 0.5; updateHud();
  }

  // ---------- 動作 ----------
  function fireBullets(){
    var w = ship.weapon, x = ship.x, y = ship.y - 16;
    function b(dx, ang, dmg){ bullets.push({ x: x + dx, y: y, vx: Math.sin(ang) * 560, vy: -Math.cos(ang) * 560, dmg: dmg || 1 }); }
    if (w === 1) b(0, 0);
    else if (w === 2){ b(-7, 0); b(7, 0); }
    else if (w === 3){ b(0, 0); b(-9, -0.12); b(9, 0.12); }
    else if (w === 4){ b(-6, 0); b(6, 0); b(-12, -0.16); b(12, 0.16); }
    else { b(0, 0, 1.4); b(-8, -0.1); b(8, 0.1); b(-14, -0.24); b(14, 0.24); }
    sfx('shoot');
  }
  function addPart(x, y, color, n, sp){
    for (var i = 0; i < n; i++){ var a = Math.random() * 6.283, v = rnd(30, sp || 170); parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.3, 0.8), max: 0.8, color: color, s: rnd(1.5, 3.5) }); }
  }
  function addFloat(x, y, text, color){ floats.push({ x: x, y: y, text: text, color: color || '#fff', life: 0.9 }); }
  function dropPup(x, y, chance){
    if (Math.random() > chance) return;
    var r = Math.random(), t = r < 0.40 ? 'W' : (r < 0.62 ? 'S' : (r < 0.88 ? 'B' : 'H'));
    if (t === 'H' && lives >= 5) t = 'S';

    if (banner){
      ctx.globalAlpha = Math.min(1, banner.t * 2); ctx.textAlign = 'center';
      ctx.font = "900 30px 'Orbitron',sans-serif"; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(5,7,20,.9)'; ctx.strokeText(banner.text, VW / 2, 200);
      ctx.fillStyle = banner.text.indexOf('WARN') >= 0 ? '#FF5F7E' : '#58E1FF'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 16; ctx.fillText(banner.text, VW / 2, 200); ctx.shadowBlur = 0;
      if (banner.sub){ ctx.font = "700 15px 'Noto Sans TC',sans-serif"; ctx.fillStyle = '#fff'; ctx.fillText(banner.sub, VW / 2, 232); }
      ctx.globalAlpha = 1;
    }
    if (flashT > 0){ ctx.fillStyle = 'rgba(255,255,255,' + (flashT * 1.6).toFixed(2) + ')'; ctx.fillRect(-12, -12, VW + 24, VH + 24); }
    ctx.restore();
  }

  // ---------- 主迴圈 ----------
  function loop(ts){
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts; pulse += dt;
    if (running && !paused && !over) update(dt);
    else if (!running){ clock += dt; for (var i = parts.length - 1; i >= 0; i--){ parts[i].life -= dt; if (parts[i].life <= 0) parts.splice(i, 1); } if (shake > 0) shake -= dt; }
    draw();
    raf = requestAnimationFrame(loop);
  }

  // ---------- 控制 ----------
  function setPaused(p){
    if (!running || over) return;
    paused = p; pauseOv.classList.toggle('hidden', !p); pauseBtn.textContent = p ? '▶' : '⏸';
    if (p) music.stop(); else music.start();
    updateHud();
  }
  function startGame(){
    getAc();
    startOv.classList.add('hidden'); overOv.classList.add('hidden'); pauseOv.classList.add('hidden');
    resetState(); running = true; pauseBtn.textContent = '⏸'; music.start(); updateHud();
  }
  function canvasPos(e){
    var r = cv.getBoundingClientRect(), s = VW / r.width;
    return { x: (e.clientX - r.left) * s, y: (e.clientY - r.top) * s };
  }
  var drag = null;
  cv.addEventListener('pointerdown', function(e){
    if (!running || paused) return;
    var p = canvasPos(e);
    if (e.pointerType === 'mouse'){ pointer.active = true; pointer.x = p.x; pointer.y = p.y; }
    else { drag = { px: p.x, py: p.y, sx: ship.x, sy: ship.y }; pointer.active = true; pointer.x = ship.x; pointer.y = ship.y; }
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
  });
  cv.addEventListener('pointermove', function(e){
    if (!running || paused) return;
    var p = canvasPos(e);
    if (e.pointerType === 'mouse'){ pointer.active = true; pointer.x = p.x; pointer.y = p.y; }
    else if (drag){ pointer.x = drag.sx + (p.x - drag.px); pointer.y = drag.sy + (p.y - drag.py) - 0; }
  });
  ['pointerup', 'pointercancel'].forEach(function(n){ cv.addEventListener(n, function(){ drag = null; }); });
  document.addEventListener('keydown', function(e){
    var k = e.key, used = true;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = true;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = true;
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.u = true;
    else if (k === 'ArrowDown' || k === 's' || k === 'S') keys.d = true;
    else if (k === ' ' ){ if (running && !e.repeat) useBomb(); else if (!running && !over) startGame(); }
    else if (k === 'p' || k === 'P' || k === 'Escape'){ if (running) setPaused(!paused); }
    else if (k === 'Enter' && !running){ startGame(); }
    else used = false;
    if (used && running) e.preventDefault();
  });
  document.addEventListener('keyup', function(e){
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false;
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.u = false;
    else if (k === 'ArrowDown' || k === 's' || k === 'S') keys.d = false;
  });
  window.addEventListener('blur', function(){ keys.l = keys.r = keys.u = keys.d = false; });
  document.addEventListener('visibilitychange', function(){ if (document.hidden && running && !paused) setPaused(true); });
  $('startBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);
  $('resumeBtn').addEventListener('click', function(){ setPaused(false); });
  pauseBtn.addEventListener('click', function(){ if (running) setPaused(!paused); });
  bombBtn.addEventListener('click', useBomb);
  function refreshMusicBtn(){ musicBtn.textContent = musicOn ? '🔊' : '🔇'; musicBtn.setAttribute('aria-pressed', String(musicOn)); }
  musicBtn.addEventListener('click', function(){
    musicOn = !musicOn;
    try { localStorage.setItem('sr_music', musicOn ? '1' : '0'); } catch (e) { /* ignore */ }
    if (musicOn && running && !paused) music.start(); else music.stop();
    refreshMusicBtn();
  });

  refreshMusicBtn();
  running = false; over = false; paused = false;
  resetState();
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
