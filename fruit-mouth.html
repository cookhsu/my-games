 // mouth cavity
 cx.beginPath();cx.ellipse(0,0,w*.5,oh*.55+4,0,0,7);cx.fillStyle='#5a0f1c';cx.fill();cx.lineWidth=6;cx.strokeStyle='#c2304a';cx.stroke();
 if(o>.15){cx.save();cx.beginPath();cx.ellipse(0,0,w*.5-3,oh*.55+1,0,0,7);cx.clip();cx.fillStyle='#ff7a8a';cx.beginPath();cx.ellipse(0,oh*.55,w*.32,oh*.32,0,0,7);cx.fill();cx.fillStyle='#fff';cx.fillRect(-w*.34,-oh*.6,w*.68,Math.min(14,oh*.22));cx.restore();}
 cx.restore();}
/* end */
function endGame(){phase='over';const rk=score>=1200?'S':score>=800?'A':score>=400?'B':'C';const nb=score>best&&!daily;if(nb){best=score;try{localStorage.setItem('fm_best',best);}catch(e){}}
 if(window.FUN){FUN.xp(10+Math.round(score/40));FUN.unlock('m1');if(eaten>=25)FUN.unlock('m2');if(bestCombo>=12)FUN.unlock('m3');if(golds>=3)FUN.unlock('m4');if(lives===3&&tLeft<=0)FUN.unlock('m5');if(score>=1000)FUN.unlock('m6');if(cfg.lvl===3&&score>=800)FUN.unlock('m7');if(daily&&FUN.dailyDone()){FUN.unlock('m8');FUN.dailyLabel('每日挑戰');}}
 (rk==='S'||rk==='A')?SFX.win():SFX.over();
 $('resCard').innerHTML='<h2>'+(lives<=0?'肚子炸了…':'時間到!')+'</h2><div class="rank">'+rk+'</div><p class="res-big">'+score+' 分'+(nb?' 🎉新紀錄':'')+'</p><div class="res-stat"><div><b>'+eaten+'</b>吃到水果</div><div><b>'+bestCombo+'</b>最高連擊</div><div><b>'+best+'</b>個人最佳</div></div><button class="btn" id="rAgain">再玩一次</button><button class="btn g" id="rSet">換設定</button><button class="btn g" id="rLobby">回遊戲大廳</button>';
 $('res').classList.add('on');$('rAgain').onclick=()=>{$('res').classList.remove('on');begin(daily);};$('rSet').onclick=()=>{$('res').classList.remove('on');toMenu();};$('rLobby').onclick=()=>{location.href='index.html';};}
function toMenu(){phase='menu';$('hud').classList.remove('on');$('start').classList.add('on');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.style.display='';items=[];}
/* UI */
function seg(id,key,cv){const bs=document.querySelectorAll('#'+id+' button');const set=()=>bs.forEach(b=>b.classList.toggle('on',cv(b.dataset.v)===cfg[key]));bs.forEach(b=>b.onclick=()=>{cfg[key]=cv(b.dataset.v);set();try{localStorage.setItem('fm_cfg',JSON.stringify(cfg));}catch(e){}});set();}
seg('sMode','mode',String);seg('sLvl','lvl',Number);
$('startBtn').onclick=()=>begin(false);$('howBtn').onclick=()=>$('how').classList.add('on');$('howOk').onclick=()=>$('how').classList.remove('on');
$('back').onclick=()=>{location.href='index.html';};
$('menuBtn').onclick=()=>{paused=true;$('menu').classList.add('on');};$('mResume').onclick=()=>{paused=false;$('menu').classList.remove('on');};
$('mHow').onclick=()=>{$('menu').classList.remove('on');$('how').classList.add('on');};$('mRestart').onclick=()=>{$('menu').classList.remove('on');paused=false;begin(daily);};$('mLobby').onclick=()=>{location.href='index.html';};
cv.addEventListener('pointerdown',e=>{touchDown=true;ptX=e.clientX/W;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||touchDown)ptX=e.clientX/W;});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{touchDown=false;}));
addEventListener('keydown',e=>{if(e.code==='Space')touchDown=true;if(e.code==='ArrowLeft')ptX=Math.max(0,ptX-.06);if(e.code==='ArrowRight')ptX=Math.min(1,ptX+.06);});addEventListener('keyup',e=>{if(e.code==='Space')touchDown=false;});
if(window.FUN)FUN.mount({daily:{label:'每日挑戰',onclick:()=>begin(true)}});
if(window.GMB)try{GMB.init({style:'cute',button:true,key:'fm_bgm_off'});}catch(e){}
let last=performance.now();
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(paused)dt=0;detect(now);update(dt,now);draw(dt);requestAnimationFrame(frame);}
requestAnimationFrame(frame);setTimeout(()=>{$('loading').style.display='none';},300);
window.__fm={get:()=>({phase,score,combo,lives,tLeft,eaten,items:items.length,open:M.open,x:M.x}),M,cfg:()=>cfg,setCfg:o=>Object.assign(cfg,o),begin,setPt:(x,d)=>{ptX=x;touchDown=d;},items:()=>items,end:()=>endGame()};

</script>
