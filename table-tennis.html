<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>極速桌球</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0B1A24; --cream:#FFF4E0; --ink:#2A3A48; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); font-family:'Noto Sans TC',system-ui,sans-serif; overflow:hidden; color:var(--ink); }
  body{ display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 0%, #1D4560 0%, #07121A 75%); }
  .wrap{ position:relative; width:min(100vw, calc(100vh * 0.5625)); aspect-ratio:360/640; max-height:100vh; border-radius:18px; overflow:hidden; background:#10222E; box-shadow:0 24px 70px rgba(0,0,0,.6), 0 0 0 3px rgba(255,160,60,.28); user-select:none; -webkit-user-select:none; touch-action:none; font-size:calc(min(100vw, 100vh*.5625)/360*16px); }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  button{ font-family:inherit; cursor:pointer; }
  #menuBtn{ position:absolute; left:1.4%; top:1.8%; width:2.1em; height:2.1em; border:0; border-radius:50%; background:rgba(0,0,0,.4); color:#FFE9C8; font:900 1em 'Fredoka',sans-serif; z-index:5; box-shadow:0 .12em 0 rgba(0,0,0,.35); }
  .ov{ position:absolute; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:1.2em; background:rgba(5,14,20,.82); backdrop-filter:blur(2px); text-align:center; }
  .ov.on{ display:flex; animation:fin .25s ease; } @keyframes fin{ from{ opacity:0; transform:scale(.97);} to{ opacity:1; transform:none; } }
  .card{ width:100%; max-width:21.5em; background:var(--cream); border-radius:1.1em; padding:1.1em 1em 1em; box-shadow:0 .35em 0 #C9A56A, 0 1em 2em rgba(0,0,0,.5); display:flex; flex-direction:column; align-items:center; gap:.55em; max-height:96%; overflow:auto; }
  .card h2{ margin:0; font:900 1.6em 'Noto Sans TC'; color:#E0702C; letter-spacing:.1em; }
  .card h2 small{ display:block; font-size:.42em; color:#9A7650; letter-spacing:.2em; margin-top:.2em; }
  .card p{ margin:0; font-size:.8em; line-height:1.7; color:#6B4A30; text-align:left; } .card p b{ color:#C9561C; }
  .card .stat{ font:700 .78em 'Noto Sans TC'; color:#2A5A78; line-height:1.6; }
  .lbl{ font:900 .78em 'Noto Sans TC'; color:#9A7650; text-align:left; width:100%; letter-spacing:.06em; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:.45em; width:100%; }
  .bigbtn{ border:0; border-radius:.9em; padding:.7em .4em; font:900 .92em 'Noto Sans TC'; letter-spacing:.06em; color:#fff; background:linear-gradient(180deg,#5FB4E8,#2A78B8); box-shadow:0 .26em 0 #1B4F78; text-decoration:none; display:block; text-align:center; }
  .bigbtn small{ display:block; font:600 .7em 'Noto Sans TC'; opacity:.9; margin-top:.15em; letter-spacing:.02em; }
  .bigbtn:active{ transform:translateY(.2em); box-shadow:0 .06em 0 #1B4F78; }
  .bigbtn.o{ background:linear-gradient(180deg,#FFB26B,#E0702C); box-shadow:0 .26em 0 #A04A12; } .bigbtn.g{ background:linear-gradient(180deg,#B9946A,#8A6240); box-shadow:0 .26em 0 #5A3A1C; }
  .bigbtn.m{ background:linear-gradient(180deg,#6FD6B2,#2FA07C); box-shadow:0 .26em 0 #1C6E54; } .bigbtn.r{ background:linear-gradient(180deg,#FF7A7A,#D93A3A); box-shadow:0 .26em 0 #8E1F1F; }
  .full{ width:100%; } .row{ display:flex; gap:.45em; width:100%; } .row>*{ flex:1; }
  #spinBar{ position:absolute; left:.6em; right:.6em; bottom:.55em; display:flex; gap:.35em; z-index:4; }
  #spinBar button{ flex:1; border:0; padding:.5em 0; border-radius:999px; background:rgba(0,0,0,.45); color:#CFE3EE; font:900 .78em 'Noto Sans TC'; letter-spacing:.06em; box-shadow:0 .12em 0 rgba(0,0,0,.4); touch-action:manipulation; }
  #spinBar button.on{ color:#fff; background:linear-gradient(180deg,#FFB26B,#E0702C); box-shadow:0 .12em 0 #A04A12; }
  #spinBar button[data-s=top].on{ background:linear-gradient(180deg,#FF9A6A,#E0502C); } #spinBar button[data-s=back].on{ background:linear-gradient(180deg,#8FD6FF,#2A78D8); } #spinBar button[data-s=side].on{ background:linear-gradient(180deg,#D3A8FF,#8A4AD8); }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <canvas id="cv" aria-label="桌球桌"></canvas>
  <button id="menuBtn" aria-label="選單">☰</button>
  <div id="spinBar"><button data-s="auto" class="on">自動</button><button data-s="top">上旋</button><button data-s="back">下旋</button><button data-s="side">側旋</button></div>
  <div class="ov on" id="menu"><div class="card">
    <h2>極速桌球<small>TABLE TENNIS</small></h2>
    <div class="stat" id="stat"></div>
    <div class="lbl">對戰 AI(11 分制,領先 2 分才贏)</div>
    <div class="grid"><button class="bigbtn m" data-d="easy">簡單<small>練手感</small></button><button class="bigbtn" data-d="normal">普通<small>有來有往</small></button><button class="bigbtn o" data-d="hard">困難<small>會殺球</small></button><button class="bigbtn r" data-d="legend">傳說<small>幾乎不失誤</small></button></div>
    <button class="bigbtn g full" data-d="rally">無盡對拉<small>對手永遠回球,看你能連續幾拍</small></button>
    <p><b>玩法:</b>手指在畫面下半部拖曳球拍,球彈起後碰到球拍就會自動回擊。<br><b>球感:</b>球拍往前<b>揮得越快</b>,球越快越深;<b>左右揮</b>可以打角度;球在高處又快速向前揮就是<b>殺球</b>。<br><b>變化球:</b>下方可選<b>上旋</b>(球飛得快、落地會往前衝)、<b>下旋</b>(球短又低、落地會「死」)、<b>側旋</b>(球會拐彎、落地橫跳);選「自動」則依揮拍:前揮=上旋、往後拉=下旋、橫揮=側旋。對手也會打旋球,看球上的彩色記號:橘=上旋、藍=下旋、紫=側旋。<br><b>規則:</b>球要先過網並在對方桌面落地;球在你這邊落地兩次就失分。輪流發球,每 2 分換發球。</p>
    <div class="row"><button class="bigbtn m" id="resume" style="display:none">繼續</button><button class="bigbtn" id="snd">🔊 音效</button></div>
    <a class="bigbtn g full" href="index.html">回遊戲大廳</a>
  </div></div>
  <div class="ov" id="over"><div class="card">
    <h2 id="oT">你贏了!</h2><p id="oS" style="text-align:center"></p>
    <div class="row"><button class="bigbtn" id="again">再來一局</button><button class="bigbtn g" id="toMenu">回選單</button></div>
  </div></div>
</div>
<script>
(function(){
"use strict";
var W=360,H=640,G=900,RB=2,TZ=76,NETZ=91.25,TW=76,TL=137,NETW=91;
var CAMY=330,CAMZ=250,F=430,HZ=110;
function $(id){ return document.getElementById(id); }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function gauss(){ var u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v); }
function P(x,y,z){ var dd=Math.max(25,CAMY-y),s=F/dd; return {x:180+x*s,y:HZ+(CAMZ-z)*s,s:s}; }

var DIFFS={
 easy:{spin:0.15,spinErr:24,n:'簡單',sp:150,react:.35,sig:20,R:16,T:[.85,1.05],smash:0,place:.1,col:'#7FD6B2'},
 normal:{spin:0.35,spinErr:14,n:'普通',sp:230,react:.22,sig:11,R:18,T:[.72,.92],smash:.15,place:.35,col:'#5FB4E8'},
 hard:{spin:0.55,spinErr:8,n:'困難',sp:330,react:.12,sig:6,R:20,T:[.58,.8],smash:.4,place:.6,col:'#FFA24A'},
 legend:{spin:0.75,spinErr:4,n:'傳說',sp:400,react:.07,sig:4,R:21,T:[.5,.7],smash:.5,place:.8,col:'#FF6A6A'},
 rally:{spin:0,spinErr:0,n:'無盡對拉',sp:900,react:0,sig:2,R:30,T:[.8,.95],smash:0,place:0,col:'#FFC83D'}
};
/* ---------- audio ---------- */
var AC=null,sndOn=store('tt_snd')!=='0';
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f,d,type,v,slide,delay){ if(!AC||!sndOn) return; var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); }
var sfx={ hit:function(p){ tone(420+p*300,.07,'square',.05,150); tone(1400,.03,'triangle',.05); },
  smash:function(){ tone(240,.18,'sawtooth',.07,70); tone(1800,.05,'square',.05); },
  bounce:function(v){ tone(900+Math.random()*120,.04,'triangle',clamp(v/700,.02,.07)); },
  net:function(){ tone(160,.12,'sine',.07,90); },
  win:function(){ [523,659,784,1047].forEach(function(f,i){ tone(f,.2,'triangle',.07,null,i*.08); }); },
  lose:function(){ [392,330,262].forEach(function(f,i){ tone(f,.22,'triangle',.06,null,i*.1); }); },
  spin:function(){ tone(700,.12,'sine',.04,1200); },
  pt:function(){ tone(880,.1,'triangle',.06); tone(1175,.14,'triangle',.06,null,.08); }, miss:function(){ tone(220,.2,'sawtooth',.04,140); } };
function vib(n){ try{ if(navigator.vibrate) navigator.vibrate(n); }catch(e){} }

/* ---------- state ---------- */
var S=null,b=null,pp=null,ai=null,bot=false,sparks=[],pops=[];
function D(){ return DIFFS[S.d]; }
function other(w){ return w==='p'?'o':'p'; }
function newGame(d){
  S={d:d,mode:d==='rally'?'rally':'match',score:{p:0,o:0},total:0,first:Math.random()<.5?'p':'o',state:'ready',timer:1,rally:0,best:0,msg:'',msgT:0,pulse:0,hint:'',over:null,shake:0};
  if(S.mode==='rally') S.first='o';
  pp={x:0,y:170,tx:0,ty:170,vx:0,vy:0,swing:0,cool:0};
  ai={x:0,y:-150,tx:0,ty:-150,delay:0,swing:0,cool:0,face:0};
  b=null; sparks=[]; pops=[]; startServe(); $('over').classList.remove('on');
}
function serverOf(t){ var k=(Math.floor(Math.min(t,20)/2)+Math.max(0,t-20))%2; return k===0?S.first:other(S.first); }
function startServe(){
  S.state='ready'; S.timer=1.1; S.rally=0; S.server=serverOf(S.total);
  b={x:0,y:0,z:300,vx:0,vy:0,vz:0,toward:S.server,bn:0,cool:0,over:false,net:false,trail:[],live:false,top:0,side:0,rot:0};
  S.hint=S.server==='p'?'你發球:把球拍移到球下方,球彈起後碰到球拍就會發出':'對手發球…';
}
function launchServe(){
  var s=S.server; b.live=true; S.state='play'; b.top=0; b.side=0;
  b.x=s==='p'?clamp(pp.x,-40,40):rnd(-35,35); b.y=s==='p'?122:-122; b.z=125; b.vx=0; b.vy=0; b.vz=0; b.toward=s; b.bn=0;
  if(s==='o') aiPlan(true);
}
/* ---------- rules ---------- */
function reasonText(loser,kind){ var who=loser==='p'?'你':'對手'; return who+({out:'打出界',net:'掛網',miss:'沒接到',double:'來不及接'}[kind]||''); }
function endPoint(winner,kind){
  if(b.over) return; b.over=true;
  if(S.mode==='rally'&&winner==='p'){ S.msg='對手失誤,重新發球'; S.msgT=1.2; S.state='point'; S.timer=1.2; S.again=true; return; }
  var loser=other(winner); S.state='point'; S.timer=1.5; S.again=false; S.total++;
  if(S.mode==='rally'){ S.best=Math.max(S.best,S.rally); S.msg='連續 '+S.rally+' 拍'; S.msgT=1.5; sfx.lose(); vib(40); S.over={winner:'o',reason:reasonText('p',kind)}; return; }
  S.score[winner]++; S.msg=(winner==='p'?'得分!':'失分…')+' '+reasonText(loser,kind); S.msgT=1.5; winner==='p'?sfx.pt():sfx.miss();
  var a=S.score.p,c=S.score.o; if((a>=11||c>=11)&&Math.abs(a-c)>=2){ S.over={winner:a>c?'p':'o',reason:'比數 '+a+' : '+c}; }
}
function onBounce(court){
  if(b.over) return;
  if(court===b.toward){ b.bn++; if(b.bn>=2) endPoint(other(b.toward),'double'); else if(b.toward==='o') aiPlan(false); }
  else endPoint(b.toward,b.net?'net':'out');
}
function floorHit(){ if(b.over) return; if(b.bn>=1) endPoint(other(b.toward),'miss'); else endPoint(b.toward,b.net?'net':'out'); }

/* ---------- hit solver ---------- */
/* ---- spin physics: top>0 上旋(下墜、落地前衝), top<0 下旋(飄浮、落地變慢), side 側旋(拐彎、落地橫跳) ---- */
var K1=420,K2=220,K3=90;
function flight(c,h){
  var vh=Math.sqrt(c.vx*c.vx+c.vy*c.vy),k=vh/400,ox=c.vx,oy=c.vy;
  c.vz-=(G+K1*c.top*k)*h;
  if(vh>1&&c.side){ var a=K2*c.side*k*h/vh; c.vx=ox-oy*a; c.vy=oy+ox*a; }
  var dk=1-.25*h; c.top*=dk; c.side*=dk;
}
function bounceFx(c){
  var vv=-c.vz,vh=Math.sqrt(c.vx*c.vx+c.vy*c.vy),ox=c.vx,oy=c.vy,f=.985+.2*c.top;
  c.vz=vv*(.86-.08*c.top); c.vx=ox*f; c.vy=oy*f;
  if(vh>1&&c.side){ c.vx+=-oy/vh*K3*c.side; c.vy+=ox/vh*K3*c.side; }
  c.top*=.7; c.side*=.8;
}
function simLand(x,y,z,vx,vy,vz,top,side){
  var c={x:x,y:y,z:z,vx:vx,vy:vy,vz:vz,top:top,side:side},t=0,h=.008,netz=null,px,py,pz;
  for(var i=0;i<260;i++){
    px=c.x; py=c.y; pz=c.z; flight(c,h); c.x+=c.vx*h; c.y+=c.vy*h; c.z+=c.vz*h; t+=h;
    if(netz===null&&((py>0&&c.y<=0)||(py<0&&c.y>=0))) netz=c.z;
    if(c.vz<0&&c.z<=TZ+RB&&t>.04){ var f=(pz-(TZ+RB))/Math.max(1e-6,pz-c.z); return {x:px+(c.x-px)*f,y:py+(c.y-py)*f,t:t-h+h*f,netz:netz===null?999:netz}; }
  } return null;
}
function solveSpin(x,y,z,tx,ty,T,top,side){
  var best=null;
  for(var outer=0;outer<10;outer++){
    var vx=(tx-x)/T,vy=(ty-y)/T,vh=Math.sqrt(vx*vx+vy*vy),ge=G+K1*top*vh/400,vz=(TZ+RB-z+.5*ge*T*T)/T,r=null;
    for(var it=0;it<4;it++){ r=simLand(x,y,z,vx,vy,vz,top,side); if(!r) break; vx+=(tx-r.x)/r.t; vy+=(ty-r.y)/r.t; vz+=(T-r.t)*G/2; }
    r=simLand(x,y,z,vx,vy,vz,top,side); best={vx:vx,vy:vy,vz:vz};
    if(r&&r.netz>NETZ+RB+3) return best; T+=.06;
  }
  return best;
}
var SPIN_NAME=function(top,side){ if(Math.abs(top)>=Math.abs(side)) return top>0?'上旋':'下旋'; return '側旋'; };
function applyHit(who,tx,ty,T,smash,top,side){
  top=top||0; side=side||0;
  var v,f,fs=[1,.55,0],r0;
  for(var fi=0;fi<3;fi++){ f=fs[fi]; v=solveSpin(b.x,b.y,b.z,tx,ty,T,top*f,side*f); r0=simLand(b.x,b.y,b.z,v.vx,v.vy,v.vz,top*f,side*f); if(r0&&Math.hypot(r0.x-tx,r0.y-ty)<18&&r0.netz>NETZ+RB+2) break; }
  top*=f; side*=f;
  b.vx=v.vx; b.vy=v.vy; b.vz=v.vz; b.top=top; b.side=side; b.toward=other(who); b.bn=0; b.cool=.12; S.rally++; b.net=false;
  var spd=Math.sqrt(v.vx*v.vx+v.vy*v.vy),mag=Math.max(Math.abs(top),Math.abs(side));
  var q=P(b.x,b.y,b.z),col=smash?'#FFB04A':(mag>.3?(Math.abs(top)>=Math.abs(side)?(top>0?'#FF8A5A':'#6FC8FF'):'#C58BFF'):'#fff');
  for(var k=0;k<(smash?16:8);k++) sparks.push({x:q.x,y:q.y,vx:rnd(-120,120),vy:rnd(-140,60),l:.4,c:col});
  if(smash){ sfx.smash(); vib(30); pops.push({t:'SMASH!',x:180,y:300,l:1,c:'#FFB04A',s:26}); S.shake=.25; } else { sfx.hit(clamp(spd/700,0,1)); vib(10); }
  if(mag>.3&&!smash){ pops.push({t:SPIN_NAME(top,side)+(mag>.8?'!':''),x:180,y:who==='p'?515:225,l:1,c:col,s:20}); sfx.spin(); }
  if(who==='p') aiPlan(true);
}
var spinMode='auto';
function playerHit(){
  var R=20,ox=clamp((b.x-pp.x)/R,-1,1);
  var fwd=clamp(-pp.vy,0,900),back=clamp(pp.vy,0,600),lat=clamp(pp.vx,-700,700);
  var tx=clamp(b.x*.35+lat*.07+ox*30,-62,62), ty=-(45+fwd*.11), T=clamp(.95-fwd/1300,.46,1), smash=false, top=0, side=0, mode=spinMode;
  if(mode==='auto'){ if(fwd>260) mode='top'; else if(back>140) mode='back'; else if(Math.abs(lat)>380) mode='side'; else mode='flat'; }
  if(b.z>=112&&fwd>420&&mode!=='back'){ smash=true; mode='flat'; T=.4; ty=-(75+Math.abs(lat)*.05); }
  else if(mode==='top'){ top=.5+Math.min(.5,fwd/700); T*=.92; ty-=6; }
  else if(mode==='back'){ top=-(.6+Math.min(.4,back/400+fwd/1400)); T=T*1.1+.05; ty=-(28+fwd*.05); }
  else if(mode==='side'){ side=(Math.abs(lat)>60?(lat>0?1:-1):(ox>=0?1:-1))*(.55+Math.min(.45,Math.abs(lat)/600)); }
  // 來球的旋轉會影響回球:上旋球容易回長、下旋球容易回短、側旋球容易偏
  ty-=14*b.top; tx+=b.side*8*(b.vy>0?-1:1);
  var sg=2+Math.abs(ox)*5+fwd*.01+(Math.abs(b.top)+Math.abs(b.side))*2; tx+=gauss()*sg; ty=clamp(ty,-118,-22)+gauss()*sg*.9;
  pp.swing=.18; applyHit('p',tx,ty,T,smash,top,side);
}
function aiHit(){
  var d=D(),tx,ty,T=rnd(d.T[0],d.T[1]),smash=false,top=0,side=0;
  if(S.mode==='rally'){ tx=rnd(-30,30); ty=rnd(60,100); }
  else { if(Math.random()<d.place) tx=-Math.sign(pp.x||(Math.random()-.5))*rnd(30,64); else tx=rnd(-58,58); ty=rnd(40,118);
    if(b.z>108&&Math.random()<d.smash){ smash=true; T=.4; ty=rnd(60,100); tx=(Math.random()<.5?-1:1)*rnd(35,62); }
    else if(Math.random()<d.spin){ var r=Math.random(); if(r<.45){ top=rnd(.5,1); T*=.92; } else if(r<.75){ top=-rnd(.55,1); T=T*1.1+.05; ty=rnd(36,70); } else side=(Math.random()<.5?-1:1)*rnd(.55,1); } }
  var inMag=Math.abs(b.top)+Math.abs(b.side);
  ty+=14*b.top; tx+=gauss()*(d.sig*.9+inMag*d.spinErr); ty+=gauss()*(d.sig+inMag*d.spinErr);
  ai.swing=.2; applyHit('o',tx,ty,T,smash,top,side);
}
/* ---------- AI ---------- */
function predict(){
  var c={x:b.x,y:b.y,z:b.z,vx:b.vx,vy:b.vy,vz:b.vz,top:b.top,side:b.side},bn=b.bn,h=.01;
  for(var i=0;i<400;i++){ flight(c,h); c.x+=c.vx*h; c.y+=c.vy*h; c.z+=c.vz*h;
