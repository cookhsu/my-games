const ORDER=(()=>{const a=[...Array(N).keys()],r=mulb(20261102);for(let i=N-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;})();
const dayNum=()=>Math.floor((Date.now()+8*3600e3)/864e5);
function makePad(idx){
 const ans=[...ID[idx][0]],r=mulb(idx*7919+13);
 const pool=[];ID.forEach((x,i)=>{if(i!==idx)[...x[0]].forEach(c=>{if(!ans.includes(c)&&!pool.includes(c))pool.push(c);});});
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
 const set=[...new Set(ans)];const need=12-set.length;const pad=set.concat(pool.slice(0,need));
 for(let i=pad.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pad[i],pad[j]]=[pad[j],pad[i]];}
 return pad;
}
function evalG(g,a){
 const G=[...g],A=[...a],res=Array(4).fill('x'),used=Array(4).fill(false);
 for(let i=0;i<4;i++)if(G[i]===A[i]){res[i]='g';used[i]=true;}
 for(let i=0;i<4;i++){if(res[i]==='g')continue;const j=A.findIndex((c,k)=>!used[k]&&c===G[i]);if(j>=0){res[i]='y';used[j]=true;}}
 return res;
}
const S={mode:'daily',idx:0,pad:[],rows:[],cur:[],hint:null,done:false,won:false,newRow:false};
const EM={g:'🟩',y:'🟨',x:'⬜'};
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',1600);}

function start(mode,force){
 S.mode=mode;
 $('mD').classList.toggle('on',mode==='daily');$('mF').classList.toggle('on',mode==='free');
 let idx;
 if(mode==='daily'){idx=ORDER[dayNum()%N];}
 else{do{idx=Math.floor(Math.random()*N);}while(idx===S.idx&&N>1);}
 S.idx=idx;S.pad=makePad(idx);S.rows=[];S.cur=[];S.hint=null;S.done=false;S.won=false;S.newRow=false;
 if(mode==='daily'&&SV.daily&&SV.daily.day===dayNum()&&SV.daily.idx===idx){
  S.rows=SV.daily.rows.slice();S.hint=SV.daily.hint;S.done=!!SV.daily.done;S.won=!!SV.daily.won;
 }

}
function padState(){
 const m={};const rk={g:3,y:2,x:1};
 S.rows.forEach(g=>{const r=evalG(g,ID[S.idx][0]);[...g].forEach((c,i)=>{if(!m[c]||rk[r[i]]>rk[m[c]])m[c]=r[i];});});
 return m;
}
function render(){
 const A=ID[S.idx][0];
 const b=$('board');b.innerHTML='';
 for(let r=0;r<MAXT;r++){
  const row=document.createElement('div');row.className='r';row.id='row'+r;
  let chars=null,res=null;
  if(r<S.rows.length){chars=[...S.rows[r]];res=evalG(S.rows[r],A);}
  else if(r===S.rows.length&&!S.done){chars=S.cur;}
  for(let i=0;i<4;i++){
   const t=document.createElement('div');t.className='t';
   if(chars&&chars[i]){t.textContent=chars[i];if(res){t.classList.add(res[i]);if(S.newRow&&r===S.rows.length-1){t.classList.add('flip');t.style.animationDelay=(i*.18)+'s';}}else t.classList.add('f');}
   row.appendChild(t);
  }
  b.appendChild(row);

 const st=padState(),p=$('pad');p.innerHTML='';

 $('hh').textContent=S.hint!=null?'💡 第 '+(S.hint+1)+' 個字是「'+[...A][S.hint]+'」':'';
 $('bH').disabled=S.hint!=null||S.done;$('bD').disabled=S.done;$('bS').disabled=S.done;
}
function addChar(c){if(S.done||S.cur.length>=4)return;S.cur.push(c);render();}
function del(){if(S.done||!S.cur.length)return;S.cur.pop();render();}
function persist(){

}
function submit(){
 if(S.done)return;
 if(S.cur.length<4){const r=$('row'+S.rows.length);if(r){r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake');}toast('要選滿 4 個字喔');return;}

 const A=ID[S.idx][0];
 if(g===A){S.done=true;S.won=true;}
 else if(S.rows.length>=MAXT){S.done=true;S.won=false;}
 if(S.done&&S.mode==='daily'){
  SV.played++;if(S.won){SV.won++;SV.streak++;SV.best=Math.max(SV.best,SV.streak);SV.dist[S.rows.length-1]++;}else SV.streak=0;
 }

 if(S.done)setTimeout(showRes,1100);
}
function hintFn(){
 if(S.done||S.hint!=null)return;
 const A=[...ID[S.idx][0]];
 let cand=[0,1,2,3].filter(i=>!S.rows.some(g=>[...g][i]===A[i]));
 if(!cand.length)cand=[0,1,2,3];
 S.hint=cand[Math.floor(Math.random()*cand.length)];persist();render();
}
function statsFill(a,b,c,d){$(a).textContent=SV.played;$(b).textContent=SV.played?Math.round(SV.won/SV.played*100)+'%':'0%';$(c).textContent=SV.streak;$(d).textContent=SV.best;}
function showRes(){
 const A=ID[S.idx];
 $('rt').textContent=S.won?(S.rows.length===1?'一擊命中!':'答對了!'):'可惜,差一點!';
 $('ri').textContent=A[0];$('rm').textContent=A[1]+(S.won?'  ・  用了 '+S.rows.length+' 次':'');

 $('res').classList.add('show');
}
function shareText(){
 const A=ID[S.idx][0];
 const head='四字密碼 '+(S.mode==='daily'?'每日 #'+(dayNum()-20400):'練習')+' '+(S.won?S.rows.length:'X')+'/'+MAXT;
 return head+'\n'+S.rows.map(g=>evalG(g,A).map(r=>EM[r]).join('')).join('\n');

$('bD').onclick=del;$('bS').onclick=submit;$('bH').onclick=hintFn;
$('mD').onclick=()=>start('daily');$('mF').onclick=()=>start('free');
$('rClose').onclick=()=>$('res').classList.remove('show');

$('bHelp').onclick=()=>$('help').classList.add('show');$('hx').onclick=()=>$('help').classList.remove('show');

  place(box()||bx);
 }
