<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script>
(function(){
  try{
    var a=document.createElement('audio');
    a.setAttribute('loop',''); a.setAttribute('playsinline',''); a.volume=0;
    a.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(a);});
    var unlocked=false;
    function unlock(){
      if(unlocked) return; unlocked=true;
      a.play().catch(function(){});
      if(window.__NB_AC && window.__NB_AC.state==='suspended'){ window.__NB_AC.resume().catch(function(){}); }
    }
    ['touchstart','mousedown','keydown'].forEach(function(ev){ window.addEventListener(ev, unlock, {once:false, passive:true}); });
  }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>數字炸彈拆除</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#141018; --ink:#FFF0E8; --muted:#B39A9A; --gold:#FFC83D; --red:#FF5A6B; --green:#5CE68C; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; background:#000; height:100%; overflow:hidden; overscroll-behavior:none;}
  body{ display:flex; align-items:center; justify-content:center; font-family:'Noto Sans TC','Fredoka',sans-serif;
    color:var(--ink); min-height:100vh; min-height:100dvh;
    background:radial-gradient(ellipse at 50% 0%, #241824 0%, #141018 65%); }
  .wrap{ position:relative; width:360px; height:640px; max-width:100vw; max-height:100vh; aspect-ratio:360/640; background:var(--bg); overflow:hidden; }
  @media (max-width:360px), (max-height:640px){ .wrap{ width:100vw; height:100vh; height:100dvh; } }

  .topbar{ position:absolute; top:0; left:0; right:0; display:none; flex-direction:column; gap:6px;
    padding:10px 56px 0 14px; z-index:4; }
  .topbar.on{ display:flex; }
  .topbar .row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .topbar .pill{ background:rgba(10,14,24,.6); border:1px solid rgba(255,255,255,.12); padding:5px 10px; border-radius:999px; font-size:12px; white-space:nowrap; }
  .topbar .pill b{ color:var(--gold); }
  .timeWrap{ height:10px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; border:1px solid rgba(255,255,255,.1); }
  .timeFill{ height:100%; background:linear-gradient(90deg,#5CE68C,#FFC83D,#FF5A6B); transition:width .15s linear; }

  .menuBtn{ position:absolute; top:10px; right:14px; width:32px; height:32px; border-radius:50%;
    background:rgba(10,14,24,.6); border:1px solid rgba(255,255,255,.12); color:var(--ink);
    font-size:15px; display:none; align-items:center; justify-content:center; cursor:pointer; z-index:6; }
  .menuBtn.on{ display:flex; }

  .field{ position:absolute; left:10px; right:10px; top:78px; bottom:20px; border-radius:14px;
    background:#0e0b12; border:1px solid rgba(255,255,255,.08); overflow:hidden; }
  .numBtn{ position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka',sans-serif; font-weight:600; color:#1a1016;
    background:linear-gradient(150deg,#FFE08A,var(--gold)); box-shadow:0 4px 10px rgba(0,0,0,.4);
    cursor:pointer; transition:transform .08s, opacity .18s; }
  .numBtn.found{ opacity:0; transform:scale(.3); pointer-events:none; }
  .numBtn.wrong{ animation:shake .3s; background:linear-gradient(150deg,#FF8A8A,var(--red)); }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

  .flashTxt{ position:absolute; left:0; right:0; top:44%; text-align:center; font-family:'Fredoka',sans-serif;
    font-size:22px; font-weight:700; opacity:0; pointer-events:none; z-index:7; transition:opacity .15s; text-shadow:0 2px 10px rgba(0,0,0,.6); }
  .flashTxt.show{ opacity:1; }
  .flashTxt.good{ color:var(--green); }
  .flashTxt.bad{ color:var(--red); }

  .ov{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px; background:rgba(8,10,18,.8); backdrop-filter:blur(6px); z-index:10; gap:14px; }
  .ov.hidden{ display:none; }
  .ov h1{ font-family:'Fredoka',sans-serif; font-size:26px; margin:0; letter-spacing:1px; }
  .ov h2{ font-family:'Fredoka',sans-serif; font-size:21px; margin:0; }
  .ov p.sub{ margin:0; color:var(--muted); font-size:13px; line-height:1.7; max-width:280px; }
  .ov .stat{ font-size:13.5px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .ov .stat b{ color:var(--gold); font-size:16px; }
  .btn{ font-family:'Fredoka',sans-serif; font-size:16px; font-weight:600; color:#141018;
    background:linear-gradient(135deg,var(--gold),#ffe08a); border:none; padding:13px 32px; border-radius:999px;
    cursor:pointer; box-shadow:0 6px 18px rgba(255,200,61,.3); letter-spacing:.5px; }
  .btn.alt{ background:rgba(255,255,255,.08); color:var(--ink); box-shadow:none; border:1px solid rgba(255,255,255,.18); }
  .btn:active{ transform:scale(.96); }
  .btnrow{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="topbar" id="topbar">
    <div class="row">
      <div class="pill">關卡 <b id="levelTxt">1</b>/<span id="levelMaxTxt">3</span></div>
      <div class="pill">下一個 <b id="expectTxt">1</b></div>
      <div class="pill">剩餘 <b id="timeTxt">60</b>s</div>
    </div>
    <div class="timeWrap"><div class="timeFill" id="timeFill" style="width:100%"></div></div>
  </div>
  <div class="menuBtn" id="menuBtn">☰</div>

  <div class="field" id="field"></div>
  <div class="flashTxt" id="flashTxt"></div>

  <div class="ov" id="ovMenu">
    <h1>💣 數字炸彈拆除</h1>
    <p class="sub">畫面上散布著打亂順序的數字，依照 1、2、3...的順序盡快點下去拆彈！點錯會扣時間，時間歸零炸彈就爆炸，共 3 關，數字越來越多。</p>
    <div class="stat">最佳關卡 <b id="bestTxt">0</b></div>
    <button class="btn" id="btnStart">開始拆彈</button>
  </div>

  <div class="ov hidden" id="ovLose">
    <h2>💥 爆炸了</h2>
    <p class="sub" id="loseDetail"></p>
    <div class="btnrow">
      <button class="btn" id="btnRetry">再試一次</button>
      <button class="btn alt" id="btnMenu1">返回選單</button>
    </div>
  </div>

  <div class="ov hidden" id="ovWin">
    <h2>✅ 成功拆彈！</h2>
    <p class="sub" id="winDetail"></p>
    <div class="btnrow">
      <button class="btn" id="btnRetryWin">再玩一次</button>
      <button class="btn alt" id="btnMenu3">返回選單</button>
    </div>
  </div>

  <div class="ov hidden" id="ovPause">
    <h2>已暫停</h2>
    <div class="btnrow">
      <button class="btn" id="btnResume">繼續遊戲</button>
      <button class="btn alt" id="btnMenu2">返回選單</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};

var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); window.__NB_AC=AC; }catch(e){} } return AC; }
function playTone(freq,dur,type,vol,sweepTo){
  var c=ac(); if(!c) return;
  try{
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,c.currentTime);
    if(sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo,c.currentTime+dur);
    g.gain.setValueAtTime(vol||0.15,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
  }catch(e){}
}
function sfxTap(){ playTone(480,0.06,'sine',0.12,620); }
function sfxWrong(){ playTone(170,0.18,'sawtooth',0.15,70); }
function sfxLevel(){ playTone(523,0.09,'triangle',0.14); setTimeout(function(){playTone(659,0.1,'triangle',0.14);},80); }
function sfxWin(){ playTone(523,0.1,'triangle',0.14); setTimeout(function(){playTone(659,0.1,'triangle',0.14);},90); setTimeout(function(){playTone(784,0.16,'triangle',0.15);},180); }
function sfxLose(){ playTone(220,0.35,'sawtooth',0.15,60); }

var LEVELS=[{count:10},{count:14},{count:18}];
var TIME_BUDGET=60;
var WRONG_PENALTY=2;

function mulberry32(seed){
  return function(){
    seed|=0; seed=(seed+0x6D2B79F5)|0;
    var t=Math.imul(seed^(seed>>>15),1|seed);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
var rng=mulberry32(Date.now()&0xffffffff);

function S0(){
  var best=0;
  try{ var v=localStorage.getItem('nb_best'); if(v) best=parseInt(v,10)||0; }catch(e){}
  return {
    phase:'menu',
    prePausePhase:null,
    level:0,
    expected:1,
    timeLeft:TIME_BUDGET,
    best:best,
    numbers:[]
  };
}
var S=S0();

function resetState(){
  var fresh=S0();
  for(var k in S){ if(Object.prototype.hasOwnProperty.call(S,k)) delete S[k]; }
  for(var k2 in fresh){ if(Object.prototype.hasOwnProperty.call(fresh,k2)) S[k2]=fresh[k2]; }
}

var fieldEl=$('field');

function genLevel(levelIdx){
  var count=LEVELS[levelIdx].count;
  var fw=fieldEl.clientWidth || 340, fh=fieldEl.clientHeight || 420;
  var cols=Math.ceil(Math.sqrt(count*fw/fh));
  var rows=Math.ceil(count/cols);
  var cellW=fw/cols, cellH=fh/rows;
  var size=Math.max(30, Math.min(54, Math.min(cellW,cellH)*0.78));
  var cells=[];
  for(var r=0;r<rows;r++) for(var c=0;c<cols;c++) cells.push({r:r,c:c});
  // shuffle cells
  for(var i=cells.length-1;i>0;i--){
    var j=Math.floor(rng()*(i+1));
    var t=cells[i]; cells[i]=cells[j]; cells[j]=t;
  }
  var chosen=cells.slice(0,count);
  var values=[];
  for(var v=1;v<=count;v++) values.push(v);
  for(var i2=values.length-1;i2>0;i2--){
    var j2=Math.floor(rng()*(i2+1));
    var t2=values[i2]; values[i2]=values[j2]; values[j2]=t2;
  }
  var nums=[];
  var jitterX=Math.max(0,(cellW-size)*0.6), jitterY=Math.max(0,(cellH-size)*0.6);
  for(var k=0;k<count;k++){
    var cell=chosen[k];
    var cx=cell.c*cellW + cellW/2 + (rng()-0.5)*jitterX;
    var cy=cell.r*cellH + cellH/2 + (rng()-0.5)*jitterY;
    cx=Math.max(size/2+2, Math.min(fw-size/2-2, cx));
    cy=Math.max(size/2+2, Math.min(fh-size/2-2, cy));
    nums.push({value:values[k], x:cx-size/2, y:cy-size/2, size:size, found:false});
  }
  S.numbers=nums;
  S.expected=1;
  renderField();
}

function renderField(){
  fieldEl.innerHTML='';
  S.numbers.forEach(function(n,idx){
    var el=document.createElement('div');
    el.className='numBtn'+(n.found?' found':'');
    el.style.left=n.x+'px';
    el.style.top=n.y+'px';
    el.style.width=n.size+'px';
    el.style.height=n.size+'px';
    el.style.fontSize=(n.size*0.42)+'px';
    el.textContent=n.value;
    el.addEventListener('pointerdown',(function(i){ return function(e){ e.preventDefault(); tapNumber(i); }; })(idx));
    fieldEl.appendChild(el);
  });
}

function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }

function flash(kind,text){
  var el=$('flashTxt');
  el.className='flashTxt show '+kind;
  el.textContent=text;
  clearTimeout(flash._t);
  flash._t=setTimeout(function(){ el.classList.remove('show'); },360);
}

function renderHUD(){
  $('levelTxt').textContent=String(S.level+1);
  $('levelMaxTxt').textContent=String(LEVELS.length);
  $('expectTxt').textContent=String(S.expected);
  $('timeTxt').textContent=String(Math.max(0,Math.ceil(S.timeLeft)));
  $('timeFill').style.width=Math.max(0,(S.timeLeft/TIME_BUDGET*100))+'%';
  $('bestTxt').textContent=String(S.best);
}

function tapNumber(idx){
  if(S.phase!=='playing') return;
  var n=S.numbers[idx];
  if(!n || n.found) return;
  if(n.value===S.expected){
    n.found=true;
    sfxTap();
    var els=fieldEl.children;
    if(els[idx]) els[idx].classList.add('found');
    S.expected++;
    if(S.expected>LEVELS[S.level].count){
      if(S.level>LEVELS.length-1) {} // unreachable
      if(S.level+1 > S.best){ S.best=S.level+1; try{localStorage.setItem('nb_best',String(S.best));}catch(e){} }
      if(S.level>=LEVELS.length-1){
        winGame();
        return;
      } else {
        sfxLevel();
        flash('good','過關！');
        S.level++;
        genLevel(S.level);
      }
    }
  } else {
    sfxWrong();
    S.timeLeft=Math.max(0,S.timeLeft-WRONG_PENALTY);
    flash('bad','順序錯了！-2秒');
    var els2=fieldEl.children;
    if(els2[idx]){
      els2[idx].classList.add('wrong');
      setTimeout(function(){ if(els2[idx]) els2[idx].classList.remove('wrong'); },300);
    }
    if(S.timeLeft<=0){ loseGame(); return; }
  }
  renderHUD();
}

function update(dt){
  if(S.phase!=='playing') return;
  S.timeLeft-=dt;
  if(S.timeLeft<=0){
    S.timeLeft=0;
    renderHUD();
    loseGame();
    return;
  }
  renderHUD();
}

function startGame(){
  resetState();
  S.phase='playing';
  $('topbar').classList.add('on');
  $('menuBtn').classList.add('on');
  genLevel(0);
  renderHUD();
}

function winGame(){
  S.phase='win';
  $('topbar').classList.remove('on');
  $('menuBtn').classList.remove('on');
  sfxWin();
  $('winDetail').textContent='全部 '+LEVELS.length+' 關都拆彈成功！剩餘時間 '+Math.ceil(S.timeLeft)+' 秒。';
  show('ovWin');
}

function loseGame(){
  S.phase='lose';
  $('topbar').classList.remove('on');
  $('menuBtn').classList.remove('on');
  sfxLose();
  $('loseDetail').textContent='炸彈在第 '+(S.level+1)+' 關爆炸了，最佳紀錄第 '+S.best+' 關。';
  show('ovLose');
}

function backToMenu(){
  S.phase='menu';
  $('topbar').classList.remove('on');
  $('menuBtn').classList.remove('on');
  show('ovMenu');
}

$('btnStart').addEventListener('click',function(){ hide('ovMenu'); startGame(); });
$('btnRetry').addEventListener('click',function(){ hide('ovLose'); startGame(); });
$('btnRetryWin').addEventListener('click',function(){ hide('ovWin'); startGame(); });
$('btnMenu1').addEventListener('click',function(){ hide('ovLose'); backToMenu(); });
$('btnMenu3').addEventListener('click',function(){ hide('ovWin'); backToMenu(); });
$('btnMenu2').addEventListener('click',function(){ hide('ovPause'); backToMenu(); });
$('btnResume').addEventListener('click',function(){
  if(S.phase==='paused'){ hide('ovPause'); S.phase=S.prePausePhase||'playing'; }
});
$('menuBtn').addEventListener('click',function(){
  if(S.phase!=='playing') return;
  S.prePausePhase=S.phase;
  S.phase='paused';
  show('ovPause');
});

var lastT=null;
function loop(ts){
  if(lastT===null) lastT=ts;
  var dt=Math.min(0.05,(ts-lastT)/1000);
  lastT=ts;
  update(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
renderHUD();

window.__NB = {
  state:S,
  start:function(){ $('btnStart').click(); },
  retry:function(){ if(!$('ovLose').classList.contains('hidden')) $('btnRetry').click(); },
  retryWin:function(){ if(!$('ovWin').classList.contains('hidden')) $('btnRetryWin').click(); },
  tapNumber:function(idx){ tapNumber(idx); },
  tapValue:function(val){
    for(var i=0;i<S.numbers.length;i++){ if(S.numbers[i].value===val && !S.numbers[i].found){ tapNumber(i); return; } }
  },
  advance:function(seconds){
    var steps=Math.round(seconds/0.016);
    for(var i=0;i<steps;i++) update(0.016);
  }
};
})();
</script>
</body>
</html>
