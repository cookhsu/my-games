<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>迷你 ERP 進銷存</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#fff; --ink:#1c2733; --mute:#6b7886; --line:#e3e8ee; --soft:#f0f3f6;
  --brand:#0f766e; --brand-ink:#fff; --brand-soft:#d9f2ee; --warn:#b45309; --warn-soft:#fdecc8;
  --bad:#b42318; --bad-soft:#fde2df; --ok:#15803d; --ok-soft:#dcf5e3; --info:#1d4ed8; --info-soft:#dfe8fd;
  --side:#16212b; --side-ink:#c9d4de; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f161d; --panel:#18222c; --ink:#e6edf3; --mute:#92a1af; --line:#2a3744; --soft:#1f2b36;
  --brand:#2dd4bf; --brand-ink:#06201c; --brand-soft:#123a36; --warn:#fbbf24; --warn-soft:#3b2d0e;
  --bad:#f87171; --bad-soft:#3d1a18; --ok:#4ade80; --ok-soft:#10301c; --info:#7aa2ff; --info-soft:#16264d; --side:#0b1218;}}
:root[data-theme=dark]{
  --bg:#0f161d; --panel:#18222c; --ink:#e6edf3; --mute:#92a1af; --line:#2a3744; --soft:#1f2b36;
  --brand:#2dd4bf; --brand-ink:#06201c; --brand-soft:#123a36; --warn:#fbbf24; --warn-soft:#3b2d0e;
  --bad:#f87171; --bad-soft:#3d1a18; --ok:#4ade80; --ok-soft:#10301c; --info:#7aa2ff; --info-soft:#16264d; --side:#0b1218;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
#side{background:var(--side);color:var(--side-ink);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;color:#fff;font-weight:700;font-size:16px}
.logo i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2dd4bf,#0f766e);display:grid;place-items:center;font-style:normal;color:#06201c;font-weight:800}
.grp{font-size:11px;letter-spacing:.12em;color:#7d8d9c;padding:14px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--side-ink);padding:8px 10px;border-radius:8px;cursor:pointer}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:rgba(45,212,191,.16);color:#fff}
.nav .n{margin-left:auto;background:#e11d48;color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.sidefoot{margin-top:auto;padding:12px 8px 0;font-size:12px;color:#8fa0af;border-top:1px solid rgba(255,255,255,.08)}
#main{padding:22px 28px 60px;min-width:0;max-width:1280px;width:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.top h1{font-size:21px;margin:0}
.top .sp{flex:1}
#menuBtn{display:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn.bad{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:3px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--mute);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.kpi .v{font-size:25px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--mute);margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2.eq,.grid3.two{grid-template-columns:1fr 1fr}
.frm4{grid-template-columns:repeat(4,1fr)}.s2{grid-column:span 2}.s3{grid-column:span 3}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tools input,.tools select,.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;min-width:0}
.tools input[type=search]{width:240px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);border-color:var(--brand)}
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:7px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);font-weight:600;color:var(--mute);font-size:12.5px;position:sticky;top:0;cursor:default}
th[data-act=sort]{cursor:pointer}
th[data-act=sort]:hover{color:var(--ink)}
tr:last-child td{border-bottom:0}
tbody tr[data-row]:hover{background:var(--soft);cursor:pointer}
.r{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:34px;text-align:center;color:var(--mute)}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600}
.t-draft{background:var(--soft);color:var(--mute)}.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-warn{background:var(--warn-soft);color:var(--warn)}.t-bad{background:var(--bad-soft);color:var(--bad)}.t-info{background:var(--info-soft);color:var(--info)}
.mute{color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:14px;height:190px;padding:8px 4px 0}
.bg{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bg .pair{display:flex;gap:4px;align-items:flex-end;height:150px;width:100%;justify-content:center}
.bg .b{width:34%;max-width:30px;border-radius:5px 5px 0 0;min-height:2px}
.bg .b.s{background:var(--brand)}.bg .b.p{background:#94a3b8}
.bg small{color:var(--mute);font-size:11.5px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.list{display:flex;flex-direction:column}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
#modal{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
#modal[hidden]{display:none}
.dlg{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:min(560px,100%);padding:20px 22px}
.dlg.wide{width:min(980px,100%)}
.dlg h2{margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:10px}
.dlg .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;color:var(--mute)}
.fld label b{color:var(--bad)}
.fld input,.fld select,.fld textarea{width:100%}
.fld small{color:var(--mute);font-size:12px}
.lt input,.lt select{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 7px}
.lt td{padding:5px 6px}
.lt th{padding:6px}
.tot{margin-left:auto;width:280px;margin-top:12px}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .g{font-size:17px;font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:7px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);animation:ti .2s}
.toast.bad{background:var(--bad);color:#fff}
@keyframes ti{from{opacity:0;transform:translateY(10px)}}
.note{background:var(--info-soft);color:var(--info);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.chip{border:1px solid rgba(255,255,255,.18);background:none;color:#cfe0ea;border-radius:99px;padding:3px 11px;font-size:12px;cursor:pointer;margin-bottom:8px}
.chip.ok{color:#7df3e2;border-color:#1f9b8b}.chip.ask{color:#fbbf24;border-color:#b45309}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;align-items:start}
#printArea{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;z-index:40;width:240px;transform:translateX(-100%);transition:transform .2s}
  body.menu #side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  #menuBtn{display:inline-block}
  #main{padding:14px 12px 60px}
  .grid2,.grid3,.grid2.eq,.grid3.two{grid-template-columns:1fr}
  .frm,.frm4{grid-template-columns:1fr}.s2,.s3{grid-column:auto}
  .tools input[type=search]{width:100%}
}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%;color:#000;background:#fff;padding:18mm 14mm}
  .pd h1{font-size:22px;margin:0 0 4px}.pd table{margin-top:14px}.pd th{background:#eee!important;color:#000;position:static}
  .pd td,.pd th{padding:6px 8px;border:1px solid #999}
  .sig{display:flex;gap:30px;margin-top:50px}.sig div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}
}
</style>
</head>
<body>
<div id="app"><aside id="side"></aside><main id="main"></main></div>
<div id="modal" hidden></div><div id="toasts"></div><div id="printArea"></div>
<script>
'use strict';
/* =================== 工具 =================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const fmt=(n,d=0)=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>'NT$ '+fmt(Math.round(n||0));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5);
const monthStart=o=>{const d=new Date();return iso(new Date(d.getFullYear(),d.getMonth()+o,1))};
const monthEnd=o=>{const d=new Date();return iso(new Date(d.getFullYear(),d.getMonth()+o+1,0))};
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),bad?4200:2400)}
function csvOut(rows,name){
  const body=rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+body],{type:'text/csv'}));a.download=name+'-'+today()+'.csv';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400);
}

/* =================== 資料與計算 =================== */
const KEY='mini_erp_v1';
let DB=null, STK={}, UI={page:'dash',q:'',tab:{},sort:{},st:'all',ed:null,rp:null,mq:''};
const HAD_LOCAL=(()=>{try{return !!localStorage.getItem(KEY)}catch(e){return false}})();
function blank(){return {v:1,savedAt:0,demo:false,co:{name:'我的公司',taxId:'',phone:'',addr:'',tax:5,negStock:false},products:[],partners:[],orders:[],moves:[],pays:[],orderNo:{}}}
function rebuild(){STK={};for(const m of DB.moves)STK[m.pid]=(STK[m.pid]||0)+m.qty}
const stock=pid=>STK[pid]||0;
const P=id=>DB.products.find(p=>p.id===id), PA=id=>DB.partners.find(p=>p.id===id), O=id=>DB.orders.find(o=>o.id===id);
const lineAmt=l=>Math.round(l.qty*l.price*(1-(l.disc||0)/100));
function calc(o){
  const raw=o.lines.reduce((s,l)=>s+lineAmt(l),0), r=DB.co.tax/100;
  if(o.taxMode==='none'){o.sub=raw;o.taxAmt=0;o.total=raw}
  else if(o.taxMode==='in'){o.total=raw;o.sub=Math.round(raw/(1+r));o.taxAmt=raw-o.sub}
  else{o.sub=raw;o.taxAmt=Math.round(raw*r);o.total=raw+o.taxAmt}
  o.raw=raw;return o;
}
const paidOf=o=>DB.pays.filter(p=>p.oid===o.id).reduce((s,p)=>s+p.amt,0);
const balOf=o=>o.status==='confirmed'?o.total-paidOf(o):0;
function nextNo(type,date){
  const pre=(type==='S'?'SO':'PO')+date.replace(/-/g,'');
  let n=0;for(const o of DB.orders)if(o.no.startsWith(pre))n=Math.max(n,parseInt(o.no.slice(pre.length+1))||0);
  return pre+'-'+pad(n+1).padStart(3,'0');
}
function payState(o){
  if(o.status!=='confirmed')return null;
  const b=balOf(o),pd=paidOf(o);
  if(b<=0)return {t:'已結清',c:'t-ok'};
  if(o.due&&o.due<today())return {t:'逾期'+diffDays(today(),o.due)+'天',c:'t-bad'};
  return pd>0?{t:'部分',c:'t-warn'}:{t:o.type==='S'?'未收款':'未付款',c:'t-info'};
}
function lineNet(o,l){return o.raw?lineAmt(l)*o.sub/o.raw:0}

/* ---- 單據操作 ---- */
function confirmOrder(o,silent){
  calc(o);
  if(!o.lines.length)throw new Error('請至少新增一筆明細');
  if(!o.partnerId)throw new Error('請選擇'+(o.type==='S'?'客戶':'供應商'));
  for(const l of o.lines){if(!l.pid)throw new Error('有明細尚未選擇商品');if(l.qty<=0)throw new Error('數量必須大於 0')}
  if(o.type==='S'&&!DB.co.negStock){
    const need={};o.lines.forEach(l=>need[l.pid]=(need[l.pid]||0)+l.qty);
    const bad=Object.keys(need).filter(id=>need[id]>stock(id));
    if(bad.length)throw new Error('庫存不足:'+bad.map(id=>P(id).name+'(庫存 '+stock(id)+',需要 '+need[id]+')').join('、'));
  }
  for(const l of o.lines){
    const p=P(l.pid);
    if(o.type==='S'){
      l.cost=p.cost;
      DB.moves.push({id:uid(),date:o.date,pid:p.id,qty:-l.qty,cost:p.cost,ref:o.no,kind:'sale',note:''});
      STK[p.id]=stock(p.id)-l.qty;
    }else{
      const unit=o.raw?lineNet(o,l)/l.qty:l.price;
      const have=stock(p.id);
      p.cost=have>0?Math.round(((have*p.cost+l.qty*unit)/(have+l.qty))*100)/100:Math.round(unit*100)/100;
      l.cost=Math.round(unit*100)/100;
      DB.moves.push({id:uid(),date:o.date,pid:p.id,qty:l.qty,cost:l.cost,ref:o.no,kind:'purchase',note:''});
      STK[p.id]=have+l.qty;
    }
  }
  o.status='confirmed';o.confirmedAt=Date.now();
}
function voidOrder(o){
  if(o.status!=='confirmed')throw new Error('只有已確認的單據可以作廢');
  if(DB.pays.some(p=>p.oid===o.id))throw new Error('此單據已有收付款紀錄,請先刪除收付款後再作廢');
  if(o.type==='P'){
    const need={};o.lines.forEach(l=>need[l.pid]=(need[l.pid]||0)+l.qty);
    const bad=Object.keys(need).filter(id=>need[id]>stock(id));
    if(bad.length)throw new Error('這些商品已出貨一部分,庫存不足以沖回:'+bad.map(id=>P(id).name).join('、'));
  }
  for(const l of o.lines){
    DB.moves.push({id:uid(),date:today(),pid:l.pid,qty:o.type==='S'?l.qty:-l.qty,cost:l.cost||0,ref:o.no,kind:'void',note:'單據作廢沖回'});
  }
  o.status='void';rebuild();
}
function addPay(o,amt,date,method,note){
  if(o.status!=='confirmed')throw new Error('只有已確認的單據可以收付款');
  if(!(amt>0))throw new Error('金額必須大於 0');
  if(amt>balOf(o))throw new Error('金額超過未結餘額 '+fmt(balOf(o)));
  DB.pays.push({id:uid(),oid:o.id,date,amt,method,note});
}
function adjustStock(p,actual,note){
  const d=actual-stock(p.id);if(!d)return false;
  DB.moves.push({id:uid(),date:today(),pid:p.id,qty:d,cost:p.cost,ref:'盤點',kind:'adjust',note:note||''});
  STK[p.id]=actual;return true;
}
function newOrder(type){
  const o={id:uid(),type,no:'',partnerId:'',date:today(),due:'',taxMode:'ex',status:'draft',lines:[],note:''};
  return o;
}
function dueFor(o){const pa=PA(o.partnerId);return addDays(o.date,pa?num(pa.terms):0)}

/* =================== 儲存(瀏覽器 + 電腦檔案)=================== */
const FS={h:null,ok:false,timer:0,busy:false,last:0,err:''};
const FS_OK=!!(window.showSaveFilePicker&&window.showOpenFilePicker&&window.indexedDB);
function persist(){
  DB.savedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('瀏覽器儲存空間不足,請盡快匯出備份',true)}
  clearTimeout(FS.timer);if(FS.h&&FS.ok)FS.timer=setTimeout(fsWrite,600);
}
function commit(keepDemo){if(!keepDemo)DB.demo=false;rebuild();persist();render()}
function idb(mode,fn){return new Promise((res,rej)=>{
  const rq=indexedDB.open('mini_erp_files',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');rq.onerror=()=>rej(rq.error);
  rq.onsuccess=()=>{const db=rq.result,tx=db.transaction('kv',mode),r=fn(tx.objectStore('kv'));tx.oncomplete=()=>{db.close();res(r&&r.result)};tx.onerror=()=>rej(tx.error)}})}
function fsWrite(force){
  if(!FS.h||!FS.ok||FS.busy)return Promise.resolve(false);FS.busy=true;
  return readFileDB(FS.h).catch(()=>null).then(F=>{
    if(!force&&F&&FS.known!=null&&(F.savedAt||0)>FS.known+1){FS.busy=false;openConflict(F);return false}   // 檔案在別處被更新過:不要覆蓋
    const stamp=DB.savedAt;
    return FS.h.createWritable().then(w=>w.write(JSON.stringify(DB)).then(()=>w.close())).then(()=>{FS.busy=false;FS.known=stamp;FS.last=Date.now();FS.err='';fsUi();return true});
  }).catch(e=>{FS.busy=false;FS.err=String(e&&e.name||e);if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))FS.ok=false;fsUi();return false});
}
function readFileDB(h){return h.getFile().then(f=>f.text()).then(t=>{const o=JSON.parse(t);if(!o||!Array.isArray(o.products)||!Array.isArray(o.orders))throw new Error('bad');return o})}
function fsUi(){
  const c=$('#fsChip');if(c){const st=!FS_OK?'na':!FS.h?'none':FS.ok?'ok':'ask';c.className='chip '+st;
    c.textContent=st==='ok'?'💾 已連結電腦檔案':st==='ask'?'💾 點此重新連結':st==='na'?'💾 此瀏覽器不支援':'💾 未連結電腦檔案'}
  if(UI.page==='set')render();
}
/* 與電腦檔案對帳:檔案較新時讓使用者選 */
function openConflict(F){
  if(UI.pendingFile)return;UI.pendingFile=F;
  const dt=t=>new Date(t).toLocaleString('zh-TW');

function reconcile(F){
  if(!F){FS.known=null;return fsWrite()}
  if(!HAD_LOCAL&&DB.demo){DB=F;FS.known=F.savedAt||0;rebuild();localStorage.setItem(KEY,JSON.stringify(DB));render();toast('已從電腦檔案還原資料');return}

  FS.known=F.savedAt||0;return fsWrite();
}

  [['星辰資訊有限公司','C',30,'王小姐','02-2345-6789'],['綠葉設計工作室','C',30,'陳先生','0912-345-678'],['大安文具行','C',0,'林老闆','02-2700-1234'],['晨光行銷股份有限公司','C',45,'黃經理','02-8791-0000'],['海岸咖啡館','C',30,'張店長','03-123-4567'],
   ['宏達電腦批發','S',30,'李業務','02-2222-3333'],['新視界國際貿易','S',45,'周業務','02-2555-6666'],['百川配件供應','S',30,'吳業務','04-2233-4455']]
   .forEach(r=>DB.partners.push({id:uid(),name:r[0],type:r[1],terms:r[2],contact:r[3],phone:r[4],email:'',taxId:'',addr:'',note:'',active:true}));
  const cs=DB.partners.filter(p=>p.type==='C'),ss=DB.partners.filter(p=>p.type==='S'),t0=today();
  const mk=(type,pa,date,lines,taxMode)=>{const o=newOrder(type);o.partnerId=pa.id;o.date=date;o.due=addDays(date,pa.terms);o.taxMode=taxMode||'ex';o.lines=lines;o.no=nextNo(type,date);calc(o);DB.orders.push(o);return o};
  rebuild();

    const pl=DB.products.map(p=>({pid:p.id,qty:m===-5?ri(35,60):ri(10,26),price:Math.round(p.cost*(0.97+rnd()*.06)),disc:0}));
    const po=mk('P',sup,pdate,pl,'ex');confirmOrder(po);
    const n=ri(8,12);const days=[];
    for(let i=0;i<n;i++){const d=m===0?addDays(base,ri(0,Math.max(0,diffDays(t0,base)))):addDays(base,ri(4,27));if(d<=t0)days.push(d)}
    days.sort();
    for(const d of days){
      const k=ri(1,3),used={};const ls=[];
      for(let j=0;j<k;j++){const p=DB.products[ri(0,9)];if(used[p.id])continue;used[p.id]=1;
        const q=Math.min(ri(1,p.price>3000?2:6),stock(p.id));if(q<=0)continue;ls.push({pid:p.id,qty:q,price:p.price,disc:rnd()<.2?5:0})}
      if(!ls.length)continue;
      const so=mk('S',cs[ri(0,cs.length-1)],d,ls,rnd()<.15?'in':'ex');confirmOrder(so);
    }

    }else if(age>25||r<.4){addPay(o,o.total,addDays(o.date,Math.min(age,ri(10,40))),'匯款','')}

}

function formModal(title,fields,val,onSave,extra){

    f.type==='select'?`<select id="f_${f.k}">${f.opts.map(o=>`<option value="${o[0]}" ${String(val[f.k])===String(o[0])?'selected':''}>${o[1]}</option>`).join('')}</select>`:
    f.type==='textarea'?`<textarea id="f_${f.k}" rows="2">${esc(val[f.k]||'')}</textarea>`:
    `<input id="f_${f.k}" type="${f.type||'text'}" ${f.type==='number'?'step="any"':''} value="${esc(val[f.k]==null?'':val[f.k])}" ${f.ph?`placeholder="${f.ph}"`:''}>`}${f.h?`<small>${f.h}</small>`:''}</div>`).join('');

  $('#formOk').onclick=()=>{

function editProduct(id){

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t){if(e.target.id==='modal'&&UI.ed==null)closeModal();return}
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='nav'){UI.page=id;UI.q='';UI.st='all';UI.pf='all';document.body.classList.remove('menu');render();scrollTo(0,0)}
  else if(a==='menu')document.body.classList.toggle('menu');
  else if(a==='theme'){const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem('erp_theme',d.dataset.theme)}catch(x){}}
  else if(a==='tab'){UI.tab[id]=t.dataset.v;UI.q='';render()}
  else if(a==='sort'){const s=UI.sort[id];UI.sort[id]=s&&s.t===t.dataset.t?{t:s.t,d:-s.d}:{t:t.dataset.t,d:1};render()}
  else if(a==='newOrder'){UI.page=id==='S'?'sales':'purchase';render();openEditor(newOrder(id))}
  else if(a==='openOrder'){const o=O(id);if(o)openEditor(o)}
  else if(a==='addLine'){syncEd();UI.ed.lines.push({pid:'',qty:1,price:0,disc:0});renderEditor()}
  else if(a==='rmLine'){syncEd();UI.ed.lines.splice(+id,1);renderEditor()}
  else if(a==='saveDraft'){if(saveEd(false)){closeModal();toast('已儲存草稿')}}
  else if(a==='confirmEd'){if(saveEd(true)){const o=O(UI.ed.id);closeModal();toast((o.type==='S'?'已出貨,庫存已扣除':'已入庫,庫存已增加')+':'+o.no)}}
  else if(a==='delOrder'){if(confirm('確定刪除這張草稿?')){DB.orders=DB.orders.filter(o=>o.id!==UI.ed.id);closeModal();commit();toast('已刪除')}}
  else if(a==='voidOrder'){const o=O(UI.ed.id);if(!confirm('作廢後庫存會沖回,確定要作廢 '+o.no+' 嗎?'))return;try{voidOrder(o)}catch(x){return toast(x.message,true)}closeModal();commit();toast('已作廢 '+o.no)}
  else if(a==='printOrder'){const o=UI.ed.status==='draft'?UI.ed:O(UI.ed.id);printOrder(o)}
  else if(a==='pay'){const o=O(id);if(o)payModal(o)}
  else if(a==='delPay'){if(confirm('刪除這筆收付款紀錄?')){const p=DB.pays.find(x=>x.id===id);DB.pays=DB.pays.filter(x=>x.id!==id);const o=O(p.oid);commit();UI.ed=JSON.parse(JSON.stringify(o));renderEditor();toast('已刪除')}}
  else if(a==='closeModal')closeModal();
  else if(a==='newProduct')editProduct();
  else if(a==='editProduct')editProduct(id);
  else if(a==='adjust')adjustModal(id);
  else if(a==='newPartner')editPartner(null,id);
  else if(a==='editPartner')editPartner(id);
  else if(a==='exportList')exportList(id);
  else if(a==='exportReport')exportReport();
  else if(a==='range'){const r=UI.rp;r.k=id;if(id==='m0'){r.from=monthStart(0);r.to=monthEnd(0)}else if(id==='m1'){r.from=monthStart(-1);r.to=monthEnd(-1)}else if(id==='y'){r.from=new Date().getFullYear()+'-01-01';r.to=new Date().getFullYear()+'-12-31'}else{r.from=monthStart(-11);r.to=monthEnd(0)}render()}
  else if(a==='saveCo'){const c=DB.co;c.name=$('#c_name').value.trim()||'我的公司';c.taxId=$('#c_tid').value.trim();c.phone=$('#c_phone').value.trim();c.addr=$('#c_addr').value.trim();const tx=num($('#c_tax').value);if(tx<0||tx>100)return toast('稅率需介於 0~100',true);c.tax=tx;c.negStock=$('#c_neg').checked;commit();toast('已儲存設定')}
  else if(a==='fsPick')fsPick();else if(a==='fsLoad')fsLoad();else if(a==='fsAsk'||a==='fsChip'){if(FS.h&&!FS.ok)fsAsk();else{UI.page='set';render()}}else if(a==='fsUnlink')fsUnlink();
  else if(a==='keepLocal'){closeModal();FS.known=null;fsWrite(true).then(()=>toast('已用目前資料覆蓋電腦檔案'))}
  else if(a==='useFile'){DB=UI.pendingFile;FS.known=DB.savedAt||0;closeModal();rebuild();localStorage.setItem(KEY,JSON.stringify(DB));render();toast('已載入電腦檔案')}
  else if(a==='exportJson')exportJson();
  else if(a==='importBtn')$('#impFile').click();
  else if(a==='loadDemo'){if(confirm('這會取代目前所有資料為示範資料,確定嗎?'))  {seedDemo();commit(true);toast('已載入示範資料')}}
  else if(a==='wipeAll'){if(!confirm('這會刪除所有資料,無法復原!請先確認已匯出備份。確定要清空嗎?'))return;const co=DB.co;DB=blank();DB.co=co;commit();toast('已清空')}
  else if(a==='wipeDemo'){const co=DB.co;DB=blank();DB.co=co;DB.co.name='我的公司';commit();toast('已清除示範資料,可以開始建立自己的資料了')}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='impFile'&&t.files[0])importJson(t.files[0]);
  else if(t.id==='st'){UI.st=t.value;render()}else if(t.id==='pf'){UI.pf=t.value;render()}else if(t.id==='mq'){UI.mq=t.value;render()}
  else if(t.id==='rf'||t.id==='rt'){UI.rp.k='c';UI.rp[t.id==='rf'?'from':'to']=t.value;render()}
  else if(t.id==='ty'){UI.taxYear=+t.value;render()}
  else if(t.id==='e_partner'){syncEd();UI.ed.due=dueFor(UI.ed);renderEditor()}
  else if(t.id==='e_date'){syncEd();UI.ed.due=dueFor(UI.ed);renderEditor()}
  else if(t.id==='e_tax'){syncEd();renderEditor()}
  else if(t.dataset.l!==undefined){
    const l=UI.ed.lines[+t.dataset.l],f=t.dataset.f;
    if(f==='pid'){l.pid=t.value;const p=P(l.pid);if(p){l.price=UI.ed.type==='S'?p.price:p.cost}renderEditor()}
    else{l[f]=num(t.value);edTotals()}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){UI.q=t.value;UI.focusQ=true;render()}
  else if(t.dataset&&t.dataset.l!==undefined&&t.dataset.f!=='pid'){UI.ed.lines[+t.dataset.l][t.dataset.f]=num(t.value);edTotals()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden&&!UI.pendingFile)closeModal()});
addEventListener('beforeunload',()=>{if(FS.ok&&DB)fsWrite()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&DB&&FS.ok)fsWrite()});

/* =================== 啟動 =================== */
(async function boot(){
  try{const th=localStorage.getItem('erp_theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  let local=null;try{local=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(local&&Array.isArray(local.products)&&Array.isArray(local.orders)){DB=Object.assign(blank(),local);DB.co=Object.assign(blank().co,local.co||{})}
  else{seedDemo()}
  rebuild();render();
  if(FS_OK){
    try{
      const h=await idb('readonly',s=>s.get('h'));
      if(h){FS.h=h;const p=await h.queryPermission({mode:'readwrite'});FS.ok=p==='granted';fsUi();
        if(FS.ok){let F=null;try{F=await readFileDB(h)}catch(e){}await reconcile(F)}
        else toast('電腦存檔需要重新連結:點左下角「💾」',false)}
    }catch(e){}
  }
  fsUi();
  window.__ERP={get DB(){return DB},get STK(){return STK},stock,calc,confirmOrder,voidOrder,addPay,balOf,paidOf,seedDemo,commit,fsWrite,FS,saleLines,newOrder,nextNo,openEditor,P,PA,O,UI,adjustStock};
})();
</script>
</body>
</html>
