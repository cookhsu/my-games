<!DOCTYPE html>

<head>
<script>
(function(){
  try{
    var a=document.createElement('audio');
    a.setAttribute('loop',''); a.setAttribute('playsinline',''); a.volume=0;
    a.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(a);});
    var unlocked=false;
    function unlock(){
      if(unlocked) return; unlocked=true;
      a.play().catch(function(){});
      if(window.__EJ_AC && window.__EJ_AC.state==='suspended'){ window.__EJ_AC.resume().catch(function(){}); }
    }
    ['touchstart','mousedown','keydown'].forEach(function(ev){ window.addEventListener(ev, unlock, {once:false, passive:true}); });
  }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>眉飛色舞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#101622; --ink:#F0F4FF; --muted:#A7B3CE; --gold:#FFC83D; --green:#5CE68C; --blue:#4FA8FF; --red:#FF5A6B; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; background:#000; height:100%; overflow:hidden; overscroll-behavior:none;}
  body{ display:flex; align-items:center; justify-content:center; font-family:'Noto Sans TC','Fredoka',sans-serif;
    color:var(--ink); min-height:100vh; min-height:100dvh;
    background:radial-gradient(ellipse at 50% 0%, #1B2740 0%, #101622 65%); }
  .wrap{ position:relative; width:360px; height:640px; max-width:100vw; max-height:100vh; aspect-ratio:360/640; background:var(--bg); overflow:hidden; }
  @media (max-width:360px), (max-height:640px){ .wrap{ width:100vw; height:100vh; height:100dvh; } }
  canvas{ display:block; position:absolute; touch-action:none; }
  #c{ z-index:2; }

  .topbar{ position:absolute; top:0; left:0; right:0; display:none; flex-direction:column; gap:6px;
    padding:10px 56px 0 14px; font-family:'Fredoka',sans-serif; pointer-events:none; z-index:4; }
  .topbar.on{ display:flex; }
  .topbar .row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .topbar .pill{ background:rgba(16,22,34,.78); border:1px solid rgba(255,255,255,.14); padding:5px 10px; border-radius:999px; font-size:12.5px; pointer-events:auto; }
  .topbar .pill b{ color:var(--gold); }
  .browMeter{ width:100%; height:10px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden; pointer-events:auto; border:1px solid rgba(255,255,255,.1); }
  .browMeter i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--blue),var(--green)); transition:width .05s linear; }

  .menuBtn{ position:absolute; top:10px; right:14px; width:32px; height:32px; border-radius:50%;
    background:rgba(16,22,34,.78); border:1px solid rgba(255,255,255,.14); color:var(--ink);
    font-size:15px; display:none; align-items:center; justify-content:center; cursor:pointer; z-index:6; }
  .menuBtn.on{ display:flex; }

  .ov{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; background:rgba(8,11,18,.88); backdrop-filter:blur(6px); z-index:10; gap:12px; overflow-y:auto; }
  .ov.hidden{ display:none; }
  .ov h1{ font-family:'Fredoka',sans-serif; font-size:24px; margin:0; letter-spacing:1px; }
  .ov h2{ font-family:'Fredoka',sans-serif; font-size:20px; margin:0; }
  .ov p.sub{ margin:0; color:var(--muted); font-size:13px; line-height:1.7; max-width:280px; }
  .ov .stat{ font-size:13px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .ov .stat b{ color:var(--gold); font-size:18px; }
  .btn{ font-family:'Fredoka',sans-serif; font-size:15px; font-weight:600; color:#14182A;
    background:linear-gradient(135deg,var(--gold),#ffe08a); border:none; padding:12px 28px; border-radius:999px;
    cursor:pointer; box-shadow:0 6px 18px rgba(255,200,61,.3); letter-spacing:.5px; }
  .btn.alt{ background:rgba(255,255,255,.08); color:var(--ink); box-shadow:none; border:1px solid rgba(255,255,255,.18); }
  .btn.cam{ background:linear-gradient(135deg,#4FA8FF,#7fd2ff); }
  .btn:active{ transform:scale(.96); }
  .btnrow{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .toastMsg{ font-size:12.5px; color:var(--red); max-width:260px; }
  .faceState{ position:absolute; left:50%; transform:translateX(-50%); top:66px; font-size:12px; color:rgba(255,255,255,.55); z-index:4; display:none; }
  .faceState.on{ display:block; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <canvas id="c" width="360" height="640"></canvas>

  <div class="topbar" id="topbar">
    <div class="row">
      <div class="pill">距離 <b id="distTxt">0</b>m</div>
      <div class="pill">❤️ <b id="livesTxt">3</b></div>
    </div>
    <div class="browMeter"><i id="browFill"></i></div>
  </div>
  <div class="faceState" id="faceState">請把臉放進鏡頭範圍</div>
  <div class="menuBtn" id="menuBtn">☰</div>

  <div class="ov" id="ovMenu">
    <h1>🤨 眉飛色舞</h1>
    <p class="sub">用力挑眉毛讓小傢伙跳起來，閃過迎面而來的障礙物！眉毛挑得越快，反應要越準。</p>
    <div class="stat">最佳距離 <b id="bestTxt">0</b>m</div>
    <div class="btnrow">
      <button class="btn cam" id="btnStartCam">📷 開啟鏡頭開始</button>
      <button class="btn alt" id="btnStartDemo">🎬 示範模式</button>

    <p class="toastMsg hidden" id="camErr"></p>
  </div>

  <div class="ov hidden" id="ovCleared">
    <h2>💥 遊戲結束</h2>
    <p class="sub" id="clearedDetail"></p>
    <div class="stat">本局距離 <b id="finalDistTxt">0</b>m</div>
    <div class="btnrow">
      <button class="btn" id="btnReplay">再玩一次</button>
      <button class="btn alt" id="btnBackMenu1">返回選單</button>
    </div>
  </div>

  <div class="ov hidden" id="ovPause">
    <h2>已暫停</h2>
    <div class="btnrow">
      <button class="btn" id="btnResume">繼續遊戲</button>
      <button class="btn alt" id="btnMenu2">返回選單</button>
    </div>
  </div>
</div>

<script type="module">
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=360,H=640, GROUND=500;
var $=function(id){return document.getElementById(id);};

var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); window.__EJ_AC=AC; }catch(e){} } return AC; }
function playTone(freq,dur,type,vol,sweepTo){
  var c=ac(); if(!c) return;
  try{
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,c.currentTime);
    if(sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo,c.currentTime+dur);
    g.gain.setValueAtTime(vol||0.15,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
  }catch(e){}
}
function sfxJump(){ playTone(500,0.1,'triangle',0.12,900); }
function sfxHit(){ playTone(160,0.2,'sawtooth',0.14,80); }
function sfxPass(){ playTone(880,0.05,'sine',0.06); }
function sfxEnd(){ playTone(392,0.12,'triangle',0.12); setTimeout(function(){playTone(330,0.16,'triangle',0.13);},120); }
function sfxStart(){ playTone(523,0.08,'triangle',0.12); setTimeout(function(){playTone(659,0.08,'triangle',0.12);},80); setTimeout(function(){playTone(784,0.14,'triangle',0.13);},160); }

function loadBest(){ try{ return parseFloat(localStorage.getItem('ej_best')||'0')||0; }catch(e){ return 0; } }
function saveBest(v){ try{ localStorage.setItem('ej_best', String(v)); }catch(e){} }

function S0(){
  return {
    phase:'menu',
    prePausePhase:null,
    demo:false,
    stream:null,
    lives:3,
    dist:0,
    speed:220,
    best:loadBest(),
    obstacles:[], // {x, w, h, passed}
    nextSpawnIn:1.2,
    playerY:0, // 0 = ground, negative = airborne offset
    vy:0,
    airborne:false,
    invuln:0,
    t:0,
    runCycle:0,
    demoTimers:[],
    browVal:0,
    browBaseline:0,
    browArmed:true
  };
}
var S=S0();

function resetState(){
  var fresh=S0();
  fresh.best=S.best;
  for(var k in S){ if(Object.prototype.hasOwnProperty.call(S,k)) delete S[k]; }
  for(var k2 in fresh){ if(Object.prototype.hasOwnProperty.call(fresh,k2)) S[k2]=fresh[k2]; }
}

function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }

function renderHUD(){
  $('distTxt').textContent=String(Math.floor(S.dist));
  $('livesTxt').textContent=String(S.lives);
  var pct=Math.max(0,Math.min(1,(S.browVal-S.browBaseline)/0.45))*100;
  $('browFill').style.width=pct+'%';
}

var JUMP_V=-620, GRAV=1500, JUMP_DUR_HINT=0.62;

function doJump(){
  if(S.phase!=='playing') return;
  if(S.airborne) return;
  S.airborne=true;
  S.vy=JUMP_V;
  sfxJump();
}

function spawnObstacle(){
  var h=34+Math.random()*26;
  var w=24+Math.random()*10;
  S.obstacles.push({ x:W+20, w:w, h:h, passed:false });
}

function startCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.reject({name:'NoMedia'});
  return navigator.mediaDevices.getUserMedia({ video:{facingMode:'user', width:{ideal:480}, height:{ideal:640}}, audio:false })
    .then(function(s){ S.stream=s; video.srcObject=s; return video.play().catch(function(){}); });
}
function stopCamera(){
  if(S.stream){ S.stream.getTracks().forEach(function(t){t.stop();}); S.stream=null; }
}

var video=document.createElement('video');
video.setAttribute('playsinline',''); video.muted=true;

// ---- FaceLandmarker loading (mirrors proven face-challenge.html pattern) ----
var landmarker=null, lmState='idle';
function loadLandmarker(){
  if(lmState==='ready'||lmState==='loading') return Promise.resolve();
  lmState='loading';
  var bases=['0.10.14','0.10.9'];
  var attempt=function(i){
    if(i>=bases.length){ lmState='failed'; return Promise.resolve(); }
    var base='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@'+bases[i];
    return import(/* @vite-ignore */ base+'/vision_bundle.mjs').then(function(mod){
      return mod.FilesetResolver.forVisionTasks(base+'/wasm').then(function(fs){
        var mk=function(del){ return mod.FaceLandmarker.createFromOptions(fs,{
          baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:del},
          runningMode:'VIDEO', numFaces:1, outputFaceBlendshapes:true
        }); };
        return mk('GPU').catch(function(){ return mk('CPU'); });
      }).then(function(lm){ landmarker=lm; lmState='ready'; });
    }).catch(function(){ return attempt(i+1); });
  };
  return attempt(0);
}

var lastVT=-1, faceOn=false, lastFaceT=0, rawBrow=0;
function detectFace(now){
  if(S.demo || lmState!=='ready' || !video.videoWidth) return;
  if(video.currentTime===lastVT) return;
  lastVT=video.currentTime;
  try{
    var r=landmarker.detectForVideo(video, now);
    var cat=r && r.faceBlendshapes && r.faceBlendshapes[0] && r.faceBlendshapes[0].categories;
    if(cat){
      faceOn=true; lastFaceT=now;
      for(var i=0;i<cat.length;i++){
        if(cat[i].categoryName==='browInnerUp'){ rawBrow=cat[i].score; break; }
      }
    } else if(now-lastFaceT>400){ faceOn=false; }
  }catch(e){}
}

var calibSamples=[], calibDone=false, calibStartT=0;
function updateBrowSignal(now){
  if(S.demo){ return; }
  if(!calibDone){
    if(calibStartT===0) calibStartT=now;
    if(faceOn) calibSamples.push(rawBrow);
    if(now-calibStartT>900){
      calibDone=true;
      var sum=0; for(var i=0;i<calibSamples.length;i++) sum+=calibSamples[i];
      S.browBaseline=calibSamples.length? sum/calibSamples.length : 0.15;
    }
    S.browVal=rawBrow;
    return;
  }
  S.browVal=rawBrow;
  var norm=rawBrow-S.browBaseline;
  var THRESH=0.3;
  if(norm>THRESH){
    if(S.browArmed){
      doJump();
      S.browArmed=false;
    }
  } else if(norm<THRESH*0.5){
    S.browArmed=true;
  }
}

function drawCameraFrame(){
  if(!video.videoWidth) return false;
  var vw=video.videoWidth, vh=video.videoHeight;
  var scale=Math.max(W/vw, H/vh);
  var dw=vw*scale, dh=vh*scale;
  var dx=(W-dw)/2, dy=(H-dh)/2;
  ctx.save();
  ctx.globalAlpha=0.5;
  ctx.translate(W,0); ctx.scale(-1,1);
  ctx.drawImage(video, dx, dy, dw, dh);
  ctx.restore();
  return true;
}

function startPlaying(useDemo){
  hide('ovMenu'); hide('ovCleared'); hide('ovPause');
  $('camErr').classList.add('hidden');
  resetState();
  S.demo=!!useDemo;
  calibSamples=[]; calibDone=false; calibStartT=0; faceOn=false; rawBrow=0;

  if(S.demo){
    S.browBaseline=0; S.browVal=0;
    beginPlayingPhase();
    scheduleDemoAutopilot();
  } else {
    $('btnStartCam').textContent='開啟相機中…';
    $('faceState').classList.add('on');
    $('faceState').textContent='啟動相機與臉部模型中…';
    Promise.all([startCamera(), loadLandmarker()]).then(function(){
      beginPlayingPhase();
    }).catch(function(err){
      $('btnStartCam').textContent='📷 開啟鏡頭開始';
      $('faceState').classList.remove('on');
      var m = (err&&err.name==='NotAllowedError') ? '沒有取得相機權限，請允許存取相機，或改用示範模式。' : '無法開啟相機，可改用示範模式體驗遊戲。';
      $('camErr').textContent=m;
      $('camErr').classList.remove('hidden');
    });
  }
}

function beginPlayingPhase(){
  S.phase='playing';
  $('topbar').classList.add('on');
  $('menuBtn').classList.add('on');
  sfxStart();
  renderHUD();
}

function scheduleDemoAutopilot(){
  function tick(){
    if(S.phase!=='playing') return;
    for(var i=0;i<S.obstacles.length;i++){
      var ob=S.obstacles[i];
      if(ob.passed || ob._demoScheduled) continue;
      var timeToReach=(ob.x-70)/S.speed;
      if(timeToReach<0.45 && timeToReach>0){
        ob._demoScheduled=true;
        doJump();
      }
    }
    var id=setTimeout(tick, 40);
    S.demoTimers.push(id);
  }
  tick();
}

function endRound(){
  S.phase='cleared';
  $('topbar').classList.remove('on'); $('menuBtn').classList.remove('on');
  $('faceState').classList.remove('on');
  stopCamera();
  S.demoTimers.forEach(function(id){ clearTimeout(id); });
  S.demoTimers=[];
  var distInt=Math.floor(S.dist);
  var isNew=false;
  if(distInt>S.best){ S.best=distInt; saveBest(S.best); isNew=true; }
  sfxEnd();
  $('finalDistTxt').textContent=String(distInt);
  $('clearedDetail').textContent='撐過了 '+distInt+' 公尺！'+(isNew?' 🎉創下新紀錄！':'');
  show('ovCleared');
}

function updateGame(dt){
  S.t+=dt;
  S.dist+=S.speed*dt/40;
  S.speed=Math.min(420, 220+S.dist*0.5);

  S.nextSpawnIn-=dt;
  if(S.nextSpawnIn<=0){
    spawnObstacle();
    var gap=Math.max(0.85, 1.5-S.dist*0.003);
    S.nextSpawnIn=gap+Math.random()*0.4;
  }

  if(S.airborne){
    S.playerY+=S.vy*dt;
    S.vy+=GRAV*dt;
    if(S.playerY>=0){ S.playerY=0; S.vy=0; S.airborne=false; }
  } else {
    S.runCycle+=dt*10;
  }

  if(S.invuln>0) S.invuln-=dt;

  var px=70, pw=36, ph=44;
  for(var i=S.obstacles.length-1;i>=0;i--){
    var ob=S.obstacles[i];
    ob.x-=S.speed*dt;
    if(!ob.passed && ob.x+ob.w<px-pw/2){
      ob.passed=true;
      sfxPass();
    }
    var overlapX = ob.x < px+pw/2 && ob.x+ob.w > px-pw/2;
    var playerBottom=GROUND+S.playerY;
    var playerTop=playerBottom-ph;
    var obTop=GROUND-ob.h;
    var overlapY = playerBottom > obTop;
    if(overlapX && overlapY && S.invuln<=0){
      S.lives--;
      S.invuln=1.4;
      sfxHit();
      if(S.lives<=0){ endRound(); return; }
    }
    if(ob.x+ob.w<-20) S.obstacles.splice(i,1);
  }

  renderHUD();
}

function drawBG(){
  var haveFrame=false;
  if(!S.demo && (S.phase==='playing'||S.phase==='paused')) haveFrame=drawCameraFrame();
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1B2740'); bg.addColorStop(0.6,'#141C30'); bg.addColorStop(1,'#0C1120');
  if(!haveFrame){ ctx.fillStyle=bg; ctx.fillRect(0,0,W,H); }
  else {
    ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle=bg; ctx.fillRect(0,0,W,H); ctx.restore();
  }
  // ground
  ctx.fillStyle='rgba(10,14,24,.85)';
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle='rgba(255,255,255,.18)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
  if(S.demo && (S.phase==='playing'||S.phase==='paused')){
    ctx.font='13px "Noto Sans TC",sans-serif';
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.textAlign='center';
    ctx.fillText('🎬 示範模式（未使用鏡頭）', W/2, 70);
  }
}

function drawObstacle(ob){
  var x=ob.x, h=ob.h, w=ob.w;
  var grad=ctx.createLinearGradient(0,GROUND-h,0,GROUND);
  grad.addColorStop(0,'#FF8F8F'); grad.addColorStop(1,'#C43E4E');
  ctx.fillStyle=grad;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,GROUND-h,w,h,6);
  else ctx.rect(x,GROUND-h,w,h);
  ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2; ctx.stroke();
}

function drawPlayer(){
  var px=70, by=GROUND+S.playerY;
  var blink = S.invuln>0 && Math.floor(S.t*12)%2===0;
  ctx.save();
  if(blink) ctx.globalAlpha=0.35;
  ctx.translate(px,by);
  var squashY = S.airborne?1:(1-Math.abs(Math.sin(S.runCycle))*0.08);
  ctx.scale(1, squashY);
  // shadow
  ctx.save();
  ctx.translate(0, (GROUND-by));
  ctx.globalAlpha=(blink?0.35:1)*Math.max(0.15, 1-Math.abs(S.playerY)/260);
  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(0,0,16,5,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // body
  ctx.font='40px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  var tilt = S.airborne ? -0.15 : 0;
  ctx.rotate(tilt);
  ctx.fillText('🐰', 0, 2);
  ctx.restore();
}

function draw(){
  drawBG();
  if(!(S.phase==='playing' || S.phase==='paused')) return;
  for(var i=0;i<S.obstacles.length;i++){ drawObstacle(S.obstacles[i]); }
  drawPlayer();
}

var lastTs=0;
function loop(ts){
  var dtRaw=(ts-lastTs)/1000;
  lastTs=ts;
  var dt=Math.min(0.05, isNaN(dtRaw)?0:dtRaw);

  if(!S.demo && (S.phase==='playing')){
    detectFace(ts);
    updateBrowSignal(ts);
    if(!faceOn && $('faceState')){
      $('faceState').classList.add('on');
      $('faceState').textContent='請把臉放進鏡頭範圍';
    } else {
      $('faceState').classList.remove('on');
    }
  }

  draw();

  if(S.phase==='playing'){
    updateGame(dt);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

$('btnStartCam').addEventListener('click',function(){ startPlaying(false); });
$('btnStartDemo').addEventListener('click',function(){ startPlaying(true); });
$('btnReplay').addEventListener('click',function(){ startPlaying(S.demo); });
$('btnBackMenu1').addEventListener('click',function(){ backToMenu(); });
$('btnMenu2').addEventListener('click',function(){ hide('ovPause'); backToMenu(); });
$('btnResume').addEventListener('click',function(){
  if(S.phase==='paused'){ hide('ovPause'); S.phase=S.prePausePhase||'playing'; }
});
$('menuBtn').addEventListener('click',function(){
  if(S.phase!=='playing') return;
  S.prePausePhase=S.phase;
  S.phase='paused';
  show('ovPause');
});
cv.addEventListener('pointerdown',function(){
  if(S.phase==='playing' && S.demo){ doJump(); }
});

function backToMenu(){
  hide('ovCleared'); hide('ovPause');
  stopCamera();
  $('faceState').classList.remove('on');
  S.demoTimers.forEach(function(id){ clearTimeout(id); });
  S.demoTimers=[];
  S.phase='menu';
  $('topbar').classList.remove('on'); $('menuBtn').classList.remove('on');
  $('bestTxt').textContent=String(S.best);
  show('ovMenu');
}
$('bestTxt').textContent=String(S.best);

window.__EJ = {
  state:S,
  startCam:function(){ startPlaying(false); },
  startDemo:function(){ startPlaying(true); },
  jump:doJump,
  spawnObstacle:spawnObstacle,
  isGameOver:function(){ return S.phase==='cleared'; },
  forceEnd:function(){ S.lives=0; if(S.phase==='playing'){ endRound(); } },
  injectBrow:function(v){ rawBrow=v; faceOn=true; },
  advance:function(seconds){
    var steps=Math.ceil(seconds/0.03);
    for(var i=0;i<steps;i++){ updateGame(0.03); }
  }
};
</script>
