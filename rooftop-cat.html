  <div class="marquee">

      <div class="stat right"><span class="label">最遠</span><span class="value" id="best">0</span></div>

      <div class="overlay" id="startOverlay">
        <h2>準備起跑</h2>

        <div class="skins" id="skinsA"></div>
        <button class="btn" id="startBtn">開始奔跑</button>
      </div>

        <p id="endText"></p>
        <div class="skins" id="skinsB"></div>
        <button class="btn" id="againBtn">再跑一次</button>
      </div>
    </div>
  </div>

  <p class="hint">電腦：<kbd>空白鍵</kbd> / <kbd>↑</kbd> 跳躍，<kbd>↓</kbd> 低頭　手機：輕點跳躍，向下滑低頭</p>

<script>
