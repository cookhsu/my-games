<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>屋頂貓跑酷 Rooftop Cat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2A1A33; --plum:#3B2441; --plum-2:#4A2D54; --sun:#FFE3A3; --coral:#FF8F5E; --rose:#E98AA0; --cream:#FFF4E3; --shadow:rgba(30,10,40,.45); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; background:var(--plum); color:var(--cream); font-family:'Noto Sans TC',system-ui,sans-serif; }
  body{ display:flex; flex-direction:column; align-items:center; padding:28px 16px 56px; background:radial-gradient(ellipse at 50% -10%, rgba(255,143,94,.28), transparent 60%), var(--plum); }
  .marquee{ text-align:center; margin-bottom:18px; }
  .marquee h1{ margin:0 0 8px; font-weight:900; font-size:clamp(26px,6.5vw,40px); letter-spacing:2px; color:var(--sun); }
  .marquee p{ margin:0; color:#D8C3DE; font-size:14px; max-width:440px; line-height:1.7; }
  .board{ width:100%; max-width:540px; background:var(--plum-2); border-radius:22px; padding:14px; box-shadow:0 20px 50px var(--shadow); }
  .hud{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 8px 10px; }
  .stat .label{ display:block; font-size:11px; letter-spacing:2px; color:#D8C3DE; margin-bottom:2px; }
  .stat .value{ font-weight:900; font-size:22px; font-variant-numeric:tabular-nums; }
  .stat.right{ text-align:right; }
  .music-btn{ width:40px; height:40px; border-radius:50%; border:1px solid #6B4A78; background:var(--plum); color:var(--sun); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .music-btn:focus-visible, .btn:focus-visible{ outline:3px solid var(--sun); outline-offset:2px; }
  .frame{ position:relative; border-radius:14px; overflow:hidden; }
  canvas{ display:block; width:100%; height:auto; touch-action:none; cursor:pointer; }
  .overlay{ position:absolute; inset:0; background:rgba(42,26,51,.88); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:12px; padding:20px; }
  .overlay.hidden{ display:none; }
  .overlay h2{ margin:0; font-weight:900; font-size:clamp(24px,6.5vw,32px); color:var(--sun); }
  .overlay p{ margin:0; font-size:14px; line-height:1.8; max-width:340px; }
  .btn{ font:900 16px 'Noto Sans TC',sans-serif; color:var(--ink); background:var(--sun); border:none; padding:12px 28px; border-radius:24px; cursor:pointer; box-shadow:0 4px 0 #C9A25A; }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #C9A25A; }
  .hint{ margin-top:14px; max-width:480px; text-align:center; font-size:12px; line-height:1.8; color:#D8C3DE; }
  .hint kbd{ font:700 11px 'Noto Sans TC',sans-serif; background:var(--plum-2); border:1px solid #6B4A78; border-radius:4px; padding:2px 7px; color:var(--sun); }
</style>
</head>
<body>
  <div class="marquee">
    <h1>屋頂貓跑酷</h1>
    <p>夕陽下的屋頂，一隻黑貓一路狂奔。跳過煙囪和木箱，低頭鑽過飛鳥，順路叼走小魚乾。</p>
  </div>

  <div class="board">
    <div class="hud">
      <div class="stat"><span class="label">距離（公尺）</span><span class="value" id="dist">0</span></div>
      <button class="music-btn" id="musicBtn" aria-label="切換背景音樂" aria-pressed="true">🔊</button>
      <div class="stat right"><span class="label">最遠</span><span class="value" id="best">0</span></div>
    </div>

    <div class="frame">
      <canvas id="cv" width="480" height="300" aria-label="屋頂貓跑酷遊戲畫面"></canvas>

      <div class="overlay" id="startOverlay">
        <h2>準備起跑</h2>
        <p>點畫面或按空白鍵跳躍（按久跳得高），向下滑或按住 ↓ 低頭滑行。撿到小魚乾加 10 公尺。</p>
        <button class="btn" id="startBtn">開始奔跑</button>
      </div>

      <div class="overlay hidden" id="endOverlay">
        <h2>撞到了！</h2>
        <p id="endText"></p>
        <button class="btn" id="againBtn">再跑一次</button>
      </div>
    </div>
  </div>

  <p class="hint">電腦：<kbd>空白鍵</kbd> / <kbd>↑</kbd> 跳躍，<kbd>↓</kbd> 低頭　手機：輕點跳躍，向下滑低頭</p>

<script>
(function(){
  "use strict";
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height, GROUND = 244;
  var distEl = document.getElementById('dist'), bestEl = document.getElementById('best');
  var startOverlay = document.getElementById('startOverlay'), endOverlay = document.getElementById('endOverlay');
  var endText = document.getElementById('endText'), musicBtn = document.getElementById('musicBtn');

  var G = 2300, JUMP_V = 800, CAT_X = 84, CAT_W = 40, STAND_H = 46, DUCK_H = 26;
  var cat, obs, fish, speed, traveled, bonus, spawnLeft, running, last, raf, phase, duckT, jumpHeld, score;

  var best = 0;
  try { var sv = localStorage.getItem('rooftopcat_best'); if (sv) best = parseInt(sv, 10) || 0; } catch (e) { /* ignore */ }
  bestEl.textContent = best;
  var musicOn = true;
  try { var mv = localStorage.getItem('rooftopcat_music'); if (mv !== null) musicOn = (mv === '1'); } catch (e) { /* ignore */ }

  var ac = null;
  function getAc(){
    try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; }
    return ac;
  }
  function tone(f, d, type, v, delay){
    var a = getAc(); if (!a) return;
    try {
      var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.03);
    } catch (e) { /* ignore */ }
  }
  var music = {
    timer: null, step: 0,
    mel: [440, 0, 523.25, 587.33, 0, 523.25, 440, 392, 440, 0, 659.25, 587.33, 0, 523.25, 587.33, 0],
    bass: [110, 0, 110, 0, 130.81, 0, 98, 0],
    start: function(){ this.stop(); if (!musicOn) return; this.step = 0; var s = this; this.timer = setInterval(function(){ s.play(); }, 190); },
    play: function(){
      var m = this.mel[this.step % 16], b = this.bass[this.step % 8];
      if (m) tone(m, 0.18, 'square', 0.025);
      if (b) tone(b, 0.3, 'triangle', 0.07);
      this.step++;
    },
    stop: function(){ if (this.timer){ clearInterval(this.timer); this.timer = null; } }
  };

  function rnd(a, b){ return a + Math.random() * (b - a); }

  var seedv = 7;
  function srand(){ seedv = (seedv * 16807) % 2147483647; return seedv / 2147483647; }
  function makeCity(n, minW, maxW, minH, maxH){
    var list = [], x = 0;
    for (var i = 0; i < n; i++){ var w = minW + srand() * (maxW - minW); list.push({ x: x, w: w, h: minH + srand() * (maxH - minH) }); x += w + 4 + srand() * 14; }
    return { list: list, total: x };
  }
  var far = makeCity(16, 40, 90, 50, 110), mid = makeCity(14, 50, 100, 60, 130), near = makeCity(10, 70, 130, 40, 80);

  function drawLayer(layer, off, color, base){
    ctx.fillStyle = color;
    var o = -((off % layer.total) + layer.total) % layer.total;
    for (var rep = 0; rep < 3; rep++){
      layer.list.forEach(function(b){
        var x = b.x + o + rep * layer.total;
        if (x > W || x + b.w < 0) return;
        ctx.fillRect(x, base - b.h, b.w, b.h);
      });
    }
  }

  function spawnObstacle(){
    var roll = Math.random(), o;
    if (score > 150 && roll < 0.24){
      o = { type: 'bird', x: W + 30, w: 38, top: GROUND - 70, h: 40, wing: 0 };
    } else if (roll < 0.55){
      o = { type: 'crate', x: W + 30, w: 34, h: 34, top: GROUND - 34 };
    } else if (roll < 0.85){
      o = { type: 'chimney', x: W + 30, w: 38, h: 58, top: GROUND - 58 };
    } else {
      o = { type: 'double', x: W + 30, w: 70, h: 34, top: GROUND - 34 };
    }
    obs.push(o);
    if (Math.random() < 0.55){
      var fy = o.type === 'bird' ? GROUND - 30 : GROUND - rnd(110, 150);
      fish.push({ x: o.x + o.w / 2, y: fy, got: false });
    }
    spawnLeft = speed * rnd(0.95, 1.55) + 90;
  }

  function jump(){
    if (!running) return;
    if (cat.h <= 0.5){ cat.vy = JUMP_V; cat.h = 1; jumpHeld = true; tone(520, 0.12, 'triangle', 0.1); tone(780, 0.1, 'triangle', 0.06, 0.05); }
  }
  function releaseJump(){ jumpHeld = false; if (cat.vy > 300) cat.vy = 300; }

  function hits(a, b){ return a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t; }

  function update(dt){
    speed = Math.min(620, 290 + traveled * 0.012);
    var dx = speed * dt; traveled += dx; phase += dt * speed * 0.03;
    score = Math.floor(traveled / 18) + bonus;
    distEl.textContent = score;

    if (duckT > 0) duckT -= dt;
    var ducking = duckT > 0 && cat.h <= 0.5;
    if (cat.h > 0 || cat.vy > 0){
      cat.vy -= G * dt; cat.h += cat.vy * dt;
      if (cat.h <= 0){ cat.h = 0; cat.vy = 0; }
    }

    spawnLeft -= dx;
    if (spawnLeft <= 0) spawnObstacle();
    var i;
    for (i = obs.length - 1; i >= 0; i--){
      var o = obs[i]; o.x -= dx + (o.type === 'bird' ? 90 * dt : 0); if (o.type === 'bird') o.wing += dt * 12;
      if (o.x + o.w < -20) obs.splice(i, 1);
    }
    for (i = fish.length - 1; i >= 0; i--){
      fish[i].x -= dx; if (fish[i].x < -30) fish.splice(i, 1);
    }

    var ch = ducking ? DUCK_H : STAND_H, bottom = GROUND - cat.h;
    var box = { l: CAT_X + 6, r: CAT_X + CAT_W - 4, t: bottom - ch + 4, b: bottom };
    for (i = 0; i < obs.length; i++){
      var ob = obs[i];
      if (hits(box, { l: ob.x + 4, r: ob.x + ob.w - 4, t: ob.top + 4, b: ob.top + ob.h })){ finish(); return; }
    }
    for (i = 0; i < fish.length; i++){
      var f = fish[i];
      if (!f.got && hits(box, { l: f.x - 12, r: f.x + 12, t: f.y - 8, b: f.y + 8 })){ f.got = true; bonus += 10; tone(988, 0.1, 'triangle', 0.09); tone(1318, 0.14, 'triangle', 0.07, 0.07); }
    }
    fish = fish.filter(function(q){ return !q.got; });
  }

  function drawCat(ducking){
    var bottom = GROUND - cat.h, x = CAT_X;
    ctx.save();
    ctx.fillStyle = '#1E1824';
    var run = cat.h > 0.5 ? 0 : Math.sin(phase * 2);
    if (ducking){
      ctx.beginPath(); ctx.ellipse(x + 20, bottom - 11, 24, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 40, bottom - 14, 9, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 34, bottom - 20); ctx.lineTo(x + 36, bottom - 30); ctx.lineTo(x + 41, bottom - 21); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 2, bottom - 8); ctx.quadraticCurveTo(x - 20, bottom - 14, x - 14, bottom - 26); ctx.lineWidth = 5; ctx.strokeStyle = '#1E1824'; ctx.lineCap = 'round'; ctx.stroke();
      ctx.fillStyle = '#FFD25C'; ctx.beginPath(); ctx.arc(x + 43, bottom - 15, 2.2, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(x + 18, bottom - 22, 20, 12, -0.08, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 38, bottom - 32, 10, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 31, bottom - 38); ctx.lineTo(x + 33, bottom - 50); ctx.lineTo(x + 39, bottom - 40); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 40, bottom - 40); ctx.lineTo(x + 45, bottom - 50); ctx.lineTo(x + 47, bottom - 36); ctx.fill();
      ctx.strokeStyle = '#1E1824'; ctx.lineCap = 'round'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(x - 1, bottom - 26); ctx.quadraticCurveTo(x - 16, bottom - 30 + run * 4, x - 10, bottom - 46 + run * 3); ctx.stroke();
      ctx.lineWidth = 5;
      var l1 = run * 8, l2 = -run * 8;
      if (cat.h > 0.5){ l1 = 8; l2 = -8; }
      ctx.beginPath(); ctx.moveTo(x + 6, bottom - 14); ctx.lineTo(x + 6 + l1, bottom); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 14, bottom - 14); ctx.lineTo(x + 14 + l2, bottom); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 26, bottom - 14); ctx.lineTo(x + 26 + l2, bottom); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 32, bottom - 14); ctx.lineTo(x + 32 + l1, bottom); ctx.stroke();
      ctx.fillStyle = '#FFD25C'; ctx.beginPath(); ctx.arc(x + 41, bottom - 33, 2.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawObs(o){
    if (o.type === 'crate' || o.type === 'double'){
      var n = o.type === 'double' ? 2 : 1, cw = o.w / n;
      for (var k = 0; k < n; k++){
        var cx = o.x + k * cw;
        ctx.fillStyle = '#D9A25A'; ctx.fillRect(cx, o.top, cw - 1, o.h);
        ctx.strokeStyle = '#8C5A25'; ctx.lineWidth = 3; ctx.strokeRect(cx + 1.5, o.top + 1.5, cw - 4, o.h - 3);
        ctx.beginPath(); ctx.moveTo(cx + 3, o.top + 3); ctx.lineTo(cx + cw - 5, o.top + o.h - 3); ctx.stroke();
      }
    } else if (o.type === 'chimney'){
      ctx.fillStyle = '#B5483A'; ctx.fillRect(o.x, o.top, o.w, o.h);
      ctx.fillStyle = '#7E2F26'; ctx.fillRect(o.x - 4, o.top, o.w + 8, 9);
      ctx.strokeStyle = 'rgba(30,10,10,.35)'; ctx.lineWidth = 1;
      for (var y = o.top + 18; y < GROUND; y += 12){ ctx.beginPath(); ctx.moveTo(o.x, y); ctx.lineTo(o.x + o.w, y); ctx.stroke(); }
    } else {
      var fl = Math.sin(o.wing) * 10, bx = o.x + o.w / 2, by = o.top + o.h / 2;
      ctx.fillStyle = '#4B3A6B';
      ctx.beginPath(); ctx.ellipse(bx, by, 17, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx - 4, by - 2); ctx.lineTo(bx + 2, by - 4 - fl * 2); ctx.lineTo(bx + 10, by - 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx - 16, by); ctx.lineTo(bx - 24, by + 3); ctx.lineTo(bx - 16, by + 5); ctx.fill();
      ctx.fillStyle = '#FFB347'; ctx.beginPath(); ctx.moveTo(bx + 15, by - 2); ctx.lineTo(bx + 22, by + 1); ctx.lineTo(bx + 15, by + 3); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx + 8, by - 3, 2, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawFish(f){
    ctx.save(); ctx.translate(f.x, f.y + Math.sin(phase + f.x * 0.02) * 3);
    ctx.fillStyle = '#7FD4FF'; ctx.beginPath(); ctx.ellipse(0, 0, 11, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(17, -6); ctx.lineTo(17, 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1E1824'; ctx.beginPath(); ctx.arc(-5, -1.5, 1.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function draw(){
    var g = ctx.createLinearGradient(0, 0, 0, GROUND); g.addColorStop(0, '#FF8F5E'); g.addColorStop(1, '#FFD59A');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FFE9B8'; ctx.beginPath(); ctx.arc(350, 100, 48, 0, Math.PI * 2); ctx.fill();
    drawLayer(far, traveled * 0.12, '#E58A9C', GROUND);
    drawLayer(mid, traveled * 0.28, '#A9567F', GROUND);
    drawLayer(near, traveled * 0.55, '#6B3F73', GROUND + 4);
    ctx.fillStyle = '#3B2441'; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#4A2D54'; ctx.fillRect(0, GROUND, W, 8);
    ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 2;
    var off = traveled % 44;
    for (var x = -off; x < W; x += 44){ ctx.beginPath(); ctx.moveTo(x, GROUND + 8); ctx.lineTo(x - 14, H); ctx.stroke(); }
    fish.forEach(drawFish);
    obs.forEach(drawObs);
    drawCat(duckT > 0 && cat.h <= 0.5);
  }

  function loop(ts){
    if (!running) return;
    if (!last) last = ts;
    var dt = Math.min(0.033, (ts - last) / 1000); last = ts;
    update(dt);
    if (!running) return;
    draw();
    raf = requestAnimationFrame(loop);
  }

  function finish(){
    running = false; cancelAnimationFrame(raf); music.stop(); draw();
    tone(130, 0.35, 'sawtooth', 0.1);
    var isBest = score > best;
    if (isBest){ best = score; bestEl.textContent = best; try { localStorage.setItem('rooftopcat_best', String(best)); } catch (e) { /* ignore */ } }
    endText.innerHTML = '跑了 ' + score + ' 公尺' + (isBest ? '<br>刷新最遠紀錄了！' : '');
    setTimeout(function(){ endOverlay.classList.remove('hidden'); }, 350);
  }

  function startGame(){
    getAc();
    startOverlay.classList.add('hidden'); endOverlay.classList.add('hidden');
    cat = { h: 0, vy: 0 }; obs = []; fish = []; speed = 290; traveled = 0; bonus = 0; score = 0; spawnLeft = 360; phase = 0; duckT = 0; jumpHeld = false; last = 0;
    distEl.textContent = '0';
    running = true; music.start(); raf = requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', function(e){
    if (e.repeat) return;
    if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W'){ e.preventDefault(); jump(); }
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S'){ e.preventDefault(); if (running) duckT = 9; }
  });
  document.addEventListener('keyup', function(e){
    if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') releaseJump();
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') duckT = 0;
  });
  cv.addEventListener('mousedown', function(){ jump(); });
  document.addEventListener('mouseup', function(){ if (running) releaseJump(); });
  var ty = null, tx = null;
  cv.addEventListener('touchstart', function(e){ e.preventDefault(); ty = e.touches[0].clientY; tx = e.touches[0].clientX; }, { passive: false });
  cv.addEventListener('touchmove', function(e){
    e.preventDefault();
    if (ty !== null && e.touches[0].clientY - ty > 28){ if (running) duckT = 0.7; ty = null; tx = null; }
  }, { passive: false });
  cv.addEventListener('touchend', function(e){
    e.preventDefault();
    if (ty !== null){ jump(); setTimeout(function(){ if (running) releaseJump(); }, 190); }
    ty = null; tx = null;
  }, { passive: false });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);
  function refreshMusicBtn(){ musicBtn.textContent = musicOn ? '🔊' : '🔇'; musicBtn.setAttribute('aria-pressed', String(musicOn)); }
  musicBtn.addEventListener('click', function(){
    musicOn = !musicOn;
    try { localStorage.setItem('rooftopcat_music', musicOn ? '1' : '0'); } catch (e) { /* ignore */ }
    if (musicOn && running) music.start(); else music.stop();
    refreshMusicBtn();
  });

  cat = { h: 0, vy: 0 }; obs = []; fish = []; speed = 290; traveled = 0; bonus = 0; score = 0; phase = 0; duckT = 0;
  refreshMusicBtn(); draw();
})();
</script>
</body>
</html>
