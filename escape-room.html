<script>
(function(){
  try{
    var a=document.createElement('audio');
    a.setAttribute('loop',''); a.setAttribute('playsinline',''); a.volume=0;
    a.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(a);});
    var unlocked=false;
    function unlock(){
      if(unlocked) return; unlocked=true;
      a.play().catch(function(){});
      if(window.__ER_AC && window.__ER_AC.state==='suspended'){ window.__ER_AC.resume().catch(function(){}); }

})();

var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); window.__ER_AC=AC; }catch(e){} } return AC; }
function playTone(freq,dur,type,vol,sweepTo){
  var c=ac(); if(!c) return;
  try{
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,c.currentTime);
    if(sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo,c.currentTime+dur);
    g.gain.setValueAtTime(vol||0.15,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
  }catch(e){}
}
function sfxTap(){ playTone(440,0.04,'triangle',0.07); }
function sfxItem(){ playTone(500,0.07,'triangle',0.1); setTimeout(function(){playTone(700,0.08,'triangle',0.1);},70); }
function sfxDigit(){ playTone(600,0.08,'square',0.08,800); }
function sfxLocked(){ playTone(160,0.1,'sawtooth',0.08); }
function sfxWrong(){ playTone(180,0.12,'sawtooth',0.1,120); }
function sfxClear(){ playTone(523,0.1,'triangle',0.14); setTimeout(function(){playTone(659,0.1,'triangle',0.14);},90); setTimeout(function(){playTone(784,0.16,'triangle',0.15);},180); }
function sfxAllClear(){ playTone(523,0.1,'triangle',0.14); setTimeout(function(){playTone(659,0.1,'triangle',0.14);},100); setTimeout(function(){playTone(784,0.1,'triangle',0.14);},200); setTimeout(function(){playTone(1047,0.22,'triangle',0.17);},300); }

// ---------- level data ----------
function H_(id,x,y,w,h,icon,kind,opts){
  // kind: 'item' | 'locked' | 'digit' | 'flavor' | 'door'
  return Object.assign({id:id,x:x,y:y,w:w,h:h,icon:icon,kind:kind}, opts||{});
}

function buildHotspots(lv){
  // layout: wall grid (up to 6 slots, 3 cols x 2 rows) for item/digit/flavor hotspots; floor row for locked+door
  var wallSlots=[[30,100],[140,100],[250,100],[30,230],[140,230],[250,230]];
  var list=[];
  var wi=0;
  list.push(H_('item',wallSlots[wi][0],wallSlots[wi][1],80,100,lv.itemIcon,'item',{itemId:'key',itemName:lv.itemName,desc:lv.itemDesc})); wi++;
  for(var i=0;i<lv.freeDigits.length;i++){
    var d=lv.freeDigits[i];
    list.push(H_('digit'+(i+1),wallSlots[wi][0],wallSlots[wi][1],80,100,d.icon,'digit',{pos:d.pos,value:d.value,desc:d.desc})); wi++;
  }
  list.push(H_('flavor',wallSlots[wi][0],wallSlots[wi][1],80,100,lv.flavorIcon,'flavor',{desc:lv.flavorDesc})); wi++;
  list.push(H_('locked',40,420,140,170,lv.lockedIcon,'locked',{requires:'key',pos:0,value:lv.code[0],desc:lv.lockedDesc}));
  list.push(H_('door',200,420,120,170,'🚪','door',{}));
  return list;
}

function resetState(){
  var fresh=S0();
  for(var k in S){ if(Object.prototype.hasOwnProperty.call(S,k)) delete S[k]; }
  for(var k2 in fresh){ if(Object.prototype.hasOwnProperty.call(fresh,k2)) S[k2]=fresh[k2]; }
}

function curLevel(){ return LEVELS[S.levelIndex]; }

function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }

function renderHUD(){
  var lv=curLevel();
  $('lvNoTxt').textContent=String(S.levelIndex+1);
  var slots='';
  for(var i=0;i<lv.codeLen;i++){
    var v=S.clues[i];
    slots += '<span class="clueSlot'+(v?' on':'')+'">'+(v||'?')+'</span>';
  }
  $('clueSlots').innerHTML=slots;
  var inv='';
  for(var k in S.inventory){ if(S.inventory[k]){ inv += '<span class="invIcon">'+lv.itemIcon+'</span>'; } }
  $('invIcons').innerHTML = inv || '<span style="opacity:.5;font-size:12px;">（無）</span>';
}

function isSolved(){
  return S.phase==='cleared' || S.phase==='allclear';
}

function showExamine(icon, desc, badge){
  S.examine={icon:icon, desc:desc, badge:badge||null};
  $('exIcon').textContent=icon;
  $('exDesc').textContent=desc;
  if(badge){ $('exBadge').textContent=badge; $('exBadge').classList.remove('hidden'); }
  else { $('exBadge').classList.add('hidden'); }
  show('ovExamine');
}
$('btnExamineClose').addEventListener('click',function(){ hide('ovExamine'); S.examine=null; });

function toast(msg){
  // lightweight transient message via the clueBoard pill area replaced briefly
  var el=document.createElement('div');
  el.textContent=msg;
  el.style.position='absolute';
  el.style.left='50%'; el.style.top='70px'; el.style.transform='translateX(-50%)';
  el.style.background='rgba(20,15,26,.92)';
  el.style.border='1px solid rgba(255,200,61,.4)';
  el.style.color='#FFC83D';
  el.style.padding='8px 16px';
  el.style.borderRadius='999px';
  el.style.fontSize='12.5px';
  el.style.zIndex='8';
  el.style.pointerEvents='none';
  el.style.fontFamily="'Noto Sans TC',sans-serif";
  $('wrap').appendChild(el);
  setTimeout(function(){ el.style.transition='opacity .4s'; el.style.opacity='0'; }, 1100);
  setTimeout(function(){ el.remove(); }, 1600);
}

function tapHotspot(id){
  if(S.phase!=='playing') return false;
  var lv=curLevel();
  var h=null;
  for(var i=0;i<lv.hotspots.length;i++){ if(lv.hotspots[i].id===id){ h=lv.hotspots[i]; break; } }
  if(!h) return false;

  if(h.kind==='door'){
    openDoorAttempt();
    return true;
  }

  if(h.requires && !S.inventory[h.requires]){
    sfxLocked();
    toast('🔒 需要先找到：'+lv.itemName);
    return false;
  }

  sfxTap();
  if(h.kind==='item'){
    S.inventory[h.itemId]=true;
    S.found[id]=true;
    sfxItem();
    toast('獲得道具：'+h.itemName+' '+lv.itemIcon);
    showExamine(h.icon, h.desc, '獲得道具');
    renderHUD();
  } else if(h.kind==='locked'){
    S.inventory['_'] = S.inventory['_']; // no-op, keep lint happy
    S.clues[h.pos]=h.value;
    S.found[id]=true;
    sfxDigit();
    toast('密碼第 '+(h.pos+1)+' 位：'+h.value);
    showExamine(h.icon, h.desc, '密碼線索');
    renderHUD();
  } else if(h.kind==='digit'){
    S.clues[h.pos]=h.value;
    S.found[id]=true;
    sfxDigit();
    toast('密碼第 '+(h.pos+1)+' 位：'+h.value);
    showExamine(h.icon, h.desc, '密碼線索');
    renderHUD();
  } else if(h.kind==='flavor'){
    S.found[id]=true;
    showExamine(h.icon, h.desc, null);
  }
  return true;
}

function openDoorAttempt(){
  var lv=curLevel();
  var missing=[];
  for(var i=0;i<lv.codeLen;i++){ if(!S.clues[i]) missing.push(i+1); }
  if(missing.length>0){
    sfxLocked();
    toast('🔒 還有線索未找到（第 '+missing.join('、')+' 位）');
    return;
  }
  openKeypad();
}

function openKeypad(){
  var lv=curLevel();
  S.codeInput='';
  var slots='';
  for(var i=0;i<lv.codeLen;i++){ slots += '<span class="clueSlot on">'+S.clues[i]+'</span>'; }
  $('keypadClueSlots').innerHTML=slots;
  renderCodeDisplay();
  buildKeypadGrid();
  show('ovKeypad');
}
function renderCodeDisplay(){
  var lv=curLevel();
  var html='';
  for(var i=0;i<lv.codeLen;i++){
    var ch=S.codeInput[i];
    html += '<div class="codeDigit'+(ch?' filled':'')+'" id="cd'+i+'">'+(ch||'')+'</div>';
  }
  $('codeDisplay').innerHTML=html;
}
function buildKeypadGrid(){
  var grid=$('keypadGrid');
  grid.innerHTML='';
  var keys=['1','2','3','4','5','6','7','8','9','⌫','0','✔'];
  keys.forEach(function(k){
    var b=document.createElement('button');
    b.className='keyBtn'+(k==='⌫'||k==='✔' ? ' wide':'');
    b.textContent=k;
    b.addEventListener('click',function(){
      if(k==='⌫'){ backspaceDigit(); }
      else if(k==='✔'){ confirmCode(); }
      else { pressDigit(k); }
    });
    grid.appendChild(b);
  });
}
function pressDigit(d){
  var lv=curLevel();
  if(S.codeInput.length>=lv.codeLen) return;
  S.codeInput += d;
  sfxTap();
  renderCodeDisplay();
}
function backspaceDigit(){
  S.codeInput = S.codeInput.slice(0,-1);
  renderCodeDisplay();
}
function confirmCode(){
  var lv=curLevel();
  if(S.codeInput.length < lv.codeLen) return;
  if(S.codeInput === lv.code){
    hide('ovKeypad');
    checkWin();
  } else {
    sfxWrong();
    for(var i=0;i<lv.codeLen;i++){
      var el=$('cd'+i);
      if(el) el.classList.add('shake');
    }
    setTimeout(function(){
      S.codeInput='';
      renderCodeDisplay();
    }, 300);
  }
}
$('btnKeypadClose').addEventListener('click',function(){ hide('ovKeypad'); });

function checkWin(){
  var idx=S.levelIndex;
  if(!S.progress[idx]){ S.progress[idx]=true; saveProgress(S.progress); }
  sfxClear();
  $('topbar').classList.remove('on'); $('menuBtn').classList.remove('on');
  if(idx>=LEVELS.length-1){
    S.phase='allclear';
    setTimeout(sfxAllClear,200);
    $('allClearDetail').textContent='恭喜成功逃出全部 '+LEVELS.length+' 間密室！';
    show('ovAllClear');
  } else {
    S.phase='cleared';
    $('clearedDetail').textContent='你成功逃出了「'+LEVELS[idx].title+'」！';
    show('ovCleared');
  }
}

function buildLevelGrid(){
  var grid=$('levelGrid');
  grid.innerHTML='';
  for(var i=0;i<LEVELS.length;i++){
    (function(i){
      var card=document.createElement('div');
      card.className='lvlCard'+(S.progress[i]?' cleared':'');
      card.innerHTML='<span class="n">'+(i+1)+'</span>'+(S.progress[i]?'<span class="check">✅</span>':'');
      card.addEventListener('click',function(){ startLevel(i); });
      grid.appendChild(card);
    })(i);
  }
  var clearedN=Object.keys(S.progress).length;
  $('clearedCountTxt').textContent=String(clearedN);
  $('totalLevelsTxt').textContent=String(LEVELS.length);
}

function startLevel(idx){
  hide('ovMenu'); hide('ovLevelSelect'); hide('ovCleared'); hide('ovAllClear'); hide('ovPause'); hide('ovExamine'); hide('ovKeypad');
  S.levelIndex=idx;
  S.inventory={};
  S.found={};
  S.clues=[];
  S.codeInput='';
  S.examine=null;
  S.phase='playing';
  $('topbar').classList.add('on');
  $('menuBtn').classList.add('on');
  renderHUD();
}

function openLevelSelect(){
  hide('ovMenu'); hide('ovCleared'); hide('ovAllClear'); hide('ovPause'); hide('ovExamine'); hide('ovKeypad');
  $('topbar').classList.remove('on'); $('menuBtn').classList.remove('on');
  S.phase='levelselect';
  buildLevelGrid();
  show('ovLevelSelect');
}

function backToMenu(){
  hide('ovLevelSelect'); hide('ovCleared'); hide('ovAllClear'); hide('ovPause'); hide('ovExamine'); hide('ovKeypad');
  S.phase='menu';
  $('topbar').classList.remove('on'); $('menuBtn').classList.remove('on');
  var clearedN=Object.keys(S.progress).length;
  $('clearedCountTxt').textContent=String(clearedN);
  $('totalLevelsTxt').textContent=String(LEVELS.length);
  show('ovMenu');
}

$('btnStart').addEventListener('click',function(){ openLevelSelect(); });
$('btnBackMenu').addEventListener('click',function(){ backToMenu(); });
$('btnNextLevel').addEventListener('click',function(){
  hide('ovCleared');
  var next=S.levelIndex+1;
  if(next<LEVELS.length) startLevel(next); else openLevelSelect();
});
$('btnBackSelect1').addEventListener('click',function(){ openLevelSelect(); });
$('btnBackSelect2').addEventListener('click',function(){ openLevelSelect(); });
$('btnReplay').addEventListener('click',function(){ startLevel(0); });
$('btnResetLevel').addEventListener('click',function(){ startLevel(S.levelIndex); });
$('btnMenu2').addEventListener('click',function(){ hide('ovPause'); backToMenu(); });
$('btnResume').addEventListener('click',function(){
  if(S.phase==='paused'){ hide('ovPause'); S.phase=S.prePausePhase||'playing'; }
});
$('menuBtn').addEventListener('click',function(){
  if(S.phase!=='playing') return;
  S.prePausePhase=S.phase;
  S.phase='paused';
  hide('ovExamine'); hide('ovKeypad');
  show('ovPause');
});

function pointerXY(e){
  var rect=cv.getBoundingClientRect();
  var scaleX=W/rect.width, scaleY=H/rect.height;
  return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
}
var downPt=null;
cv.addEventListener('pointerdown',function(e){
  downPt=pointerXY(e);
});
cv.addEventListener('pointerup',function(e){
  if(!downPt) return;
  var p=pointerXY(e);
  var dx=p.x-downPt.x, dy=p.y-downPt.y;
  downPt=null;
  if(Math.sqrt(dx*dx+dy*dy)>12) return; // treat as drag, not tap
  if(S.phase!=='playing') return;
  var lv=curLevel();
  for(var i=lv.hotspots.length-1;i>=0;i--){
    var h=lv.hotspots[i];
    if(p.x>=h.x && p.x<=h.x+h.w && p.y>=h.y && p.y<=h.y+h.h){
      tapHotspot(h.id);
      break;
    }
  }
});

function drawHotspot(h, lv){
  var found=S.found[h.id];
  var locked = h.requires && !S.inventory[h.requires];
  var pulse = !found && !locked ? (0.5+0.5*Math.sin(S.t*2.4 + h.x*0.05)) : 0;

  ctx.save();
  // panel
  var r=12;
  ctx.beginPath();
  ctx.moveTo(h.x+r,h.y);
  ctx.arcTo(h.x+h.w,h.y,h.x+h.w,h.y+h.h,r);
  ctx.arcTo(h.x+h.w,h.y+h.h,h.x,h.y+h.h,r);
  ctx.arcTo(h.x,h.y+h.h,h.x,h.y,r);
  ctx.arcTo(h.x,h.y,h.x+h.w,h.y,r);
  ctx.closePath();

  var baseFill = h.kind==='door' ? 'rgba(255,200,61,0.10)' : 'rgba(255,255,255,0.06)';
  ctx.fillStyle = found ? 'rgba(92,230,140,0.12)' : baseFill;
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = found ? 'rgba(92,230,140,0.55)' : ('rgba(255,255,255,'+(0.18+pulse*0.25)+')');
  ctx.stroke();

  if(pulse>0 && !found){
    ctx.save();
    ctx.globalAlpha = pulse*0.35;
    ctx.strokeStyle='#FFC83D';
    ctx.lineWidth=3;
    ctx.stroke();
    ctx.restore();
  }

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='32px sans-serif';
  var iconY=h.y+h.h*0.42;
  ctx.fillText(h.icon, h.x+h.w/2, iconY);

  ctx.font='11px "Noto Sans TC",sans-serif';
  ctx.fillStyle='rgba(255,255,255,.7)';
  var label = h.kind==='door' ? '房門' : (h.kind==='item' ? lv.itemName+'？' : (h.kind==='locked' ? '上鎖' : (h.kind==='flavor'?'':'')));
  if(h.kind==='digit') label='';
  if(label) ctx.fillText(label, h.x+h.w/2, h.y+h.h-14);

  if(found){
    ctx.font='16px sans-serif';
    ctx.fillStyle='#5CE68C';
    ctx.fillText('✓', h.x+h.w-12, h.y+14);
  } else if(locked){
    ctx.font='14px sans-serif';
    ctx.fillText('🔒', h.x+h.w-14, h.y+14);
  }
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(!(S.phase==='playing' || S.phase==='paused' || S.phase==='cleared' || S.phase==='allclear')){
    var bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#241A30'); bg.addColorStop(1,'#140F1A');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    return;
  }
  var lv=curLevel();
  ctx.fillStyle=lv.wall; ctx.fillRect(0,0,W,400);
  ctx.fillStyle=lv.floor; ctx.fillRect(0,400,W,H-400);
  ctx.strokeStyle='rgba(255,255,255,.08)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,400); ctx.lineTo(W,400); ctx.stroke();

  for(var i=0;i<lv.hotspots.length;i++){ drawHotspot(lv.hotspots[i], lv); }
}

function loop(ts){
  S.t = (ts||0)/1000;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
renderHUD();

window.__ER = {
  state:S,
  start:function(){ $('btnStart').click(); },
  startLevel:function(i){ startLevel(i); },
  tapHotspot:tapHotspot,
  closeExamine:function(){ $('btnExamineClose').click(); },
  openKeypad:function(){ openDoorAttempt(); },
  pressDigit:pressDigit,
  backspaceDigit:backspaceDigit,
  confirmCode:confirmCode,
  isSolved:isSolved,
  levelCount:LEVELS.length,
  retry:function(){ startLevel(S.levelIndex); },
  retryWin:function(){ startLevel(0); },
  solveInstant:function(){
    var lv=curLevel();
    S.inventory['key']=true;
    for(var i=0;i<lv.hotspots.length;i++){
      var h=lv.hotspots[i];
      if(h.kind==='digit' || h.kind==='locked'){ S.clues[h.pos]=h.value; S.found[h.id]=true; }
      if(h.kind==='item'){ S.found[h.id]=true; }
    }
    renderHUD();
    S.codeInput=lv.code;
    confirmCode();
  },
  advance:function(seconds){ /* no continuous physics */ }
};
})();
</script>
