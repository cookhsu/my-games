<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>珍珠接接樂 Pearl Catch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --mint:#CFEFE3; --mint-2:#B5E3D3; --brown:#3A2418; --brown-soft:#6F5242; --tea:#E88F3D; --tea-dark:#B8691F;
    --card:#F7FCF9; --shadow:rgba(40,70,60,.28);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; background:var(--mint); color:var(--brown); font-family:'Noto Sans TC',system-ui,sans-serif; }
  body{ display:flex; flex-direction:column; align-items:center; padding:28px 16px 56px; background:linear-gradient(180deg,var(--mint-2),var(--mint) 45%); }
  .marquee{ text-align:center; margin-bottom:18px; }
  .marquee h1{ margin:0 0 8px; font-weight:900; font-size:clamp(26px,6.5vw,38px); letter-spacing:1px; }
  .marquee p{ margin:0; color:var(--brown-soft); font-size:14px; max-width:420px; line-height:1.7; }
  .board{ width:100%; max-width:400px; background:var(--card); border-radius:22px; padding:14px; box-shadow:0 20px 45px var(--shadow); }
  .hud{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 8px 10px; }
  .stat .label{ display:block; font-size:11px; letter-spacing:1px; color:var(--brown-soft); margin-bottom:2px; }
  .stat .value{ font-weight:900; font-size:22px; font-variant-numeric:tabular-nums; }
  .stat.right{ text-align:right; }
  .lives{ font-size:20px; letter-spacing:2px; color:#E5484D; min-width:72px; text-align:center; }
  .music-btn{ width:40px; height:40px; border-radius:50%; border:1px solid #CBE3DA; background:#fff; color:var(--brown); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .music-btn:focus-visible, .btn:focus-visible{ outline:3px solid var(--tea); outline-offset:2px; }
  .frame{ position:relative; border-radius:14px; overflow:hidden; }
  canvas{ display:block; width:100%; height:auto; touch-action:none; cursor:ew-resize; }
  .overlay{ position:absolute; inset:0; background:rgba(58,36,24,.86); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:22px; }
  .overlay.hidden{ display:none; }
  .overlay h2{ margin:0; font-weight:900; font-size:clamp(24px,6.5vw,32px); color:#FFC987; }
  .overlay p{ margin:0; font-size:14px; line-height:1.8; max-width:290px; }
  .btn{ font:900 16px 'Noto Sans TC',sans-serif; color:var(--brown); background:#FFC987; border:none; padding:12px 28px; border-radius:24px; cursor:pointer; box-shadow:0 4px 0 var(--tea-dark); }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--tea-dark); }
  .hint{ margin-top:14px; max-width:400px; text-align:center; font-size:12px; line-height:1.8; color:var(--brown-soft); }
/* ===== UI v2 (template) ===== */
body{ position:relative; }
.marquee{ margin-top:18px; }
.marquee h1{ letter-spacing:.06em; text-shadow:0 2px 0 rgba(255,255,255,.35), 0 6px 18px rgba(0,0,0,.18); }
.marquee h1::after{ content:""; display:block; width:56px; height:4px; margin:10px auto 0; border-radius:4px; background:currentColor; opacity:.35; }
.marquee p{ opacity:.9; line-height:1.7; }
.board,.box{ box-shadow:0 26px 54px rgba(0,0,0,.38), 0 3px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.14) !important; }
.hud .stat{ padding:7px 12px 8px; border-radius:12px; background:rgba(0,0,0,.14); box-shadow:inset 0 1px 0 rgba(0,0,0,.12), 0 1px 0 rgba(255,255,255,.25); min-width:84px; }
.hud .value{ font-variant-numeric:tabular-nums; text-shadow:0 1px 0 rgba(255,255,255,.25); }
.music-btn,.icon-btn{ box-shadow:0 3px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.6) !important; transition:transform .1s, box-shadow .1s; }
.music-btn:active,.icon-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.25) !important; }
.screen-frame,.frame,.field-frame,.table-frame,.tray-frame{ position:relative; box-shadow:inset 0 0 0 2px rgba(0,0,0,.18), inset 0 6px 16px rgba(0,0,0,.28), 0 1px 0 rgba(255,255,255,.3); }
.screen-frame::after,.frame::after,.field-frame::after,.table-frame::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, transparent 62%, rgba(0,0,0,.28)); z-index:1; }
.overlay{ z-index:3; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); animation:tplIn .32s ease; }
@keyframes tplIn{ from{ opacity:0; transform:scale(.97);} to{ opacity:1; transform:none; } }
.overlay>*{ animation:tplUp .45s ease backwards; } .overlay>*:nth-child(2){ animation-delay:.06s } .overlay>*:nth-child(3){ animation-delay:.12s } .overlay>*:nth-child(4){ animation-delay:.18s }
@keyframes tplUp{ from{ opacity:0; transform:translateY(12px);} }
.overlay h2{ letter-spacing:.08em; text-shadow:0 3px 0 rgba(0,0,0,.28), 0 8px 20px rgba(0,0,0,.3); }
.overlay p{ line-height:1.75; }
.overlay p[id]{ font-size:17px; font-weight:800; padding:10px 20px; border-radius:14px; background:rgba(255,255,255,.12); box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); max-width:none; }
.btn{ position:relative; overflow:hidden; letter-spacing:.08em; padding-left:30px; padding-right:30px; transition:transform .1s ease, box-shadow .1s ease, filter .15s; }
.btn::after{ content:""; position:absolute; left:14%; right:14%; top:3px; height:34%; border-radius:99px; background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0)); pointer-events:none; }
#startBtn,#restartBtn,.overlay .btn:first-of-type{ animation:tplPulse 2s ease-in-out infinite; }
@keyframes tplPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.05);} }
#startBtn::before,#restartBtn::before{ content:""; position:absolute; top:0; bottom:0; left:-45%; width:28%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent); transform:skewX(-20deg); animation:tplShine 3s ease-in-out infinite; }
@keyframes tplShine{ 0%{ left:-45%; } 55%,100%{ left:140%; } }
.hint kbd{ box-shadow:0 2px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.5); border:1px solid rgba(0,0,0,.12); }
@media (prefers-reduced-motion:reduce){ .overlay,.overlay>*,#startBtn,#restartBtn,.overlay .btn:first-of-type,#startBtn::before,#restartBtn::before{ animation:none !important; } }
</style>
</head>
<body>
  <div class="marquee">
    <h1>珍珠接接樂</h1>
    <p>珍珠、布丁從天而降，把它們接進杯子裡！小心冰塊，撞到會讓這杯變淡。</p>
  </div>

  <div class="board">
    <div class="hud">
      <div class="stat"><span class="label">分數</span><span class="value" id="score">0</span></div>
      <div class="lives" id="lives" aria-label="剩餘生命">♥♥♥</div>
      <button class="music-btn" id="musicBtn" aria-label="切換背景音樂" aria-pressed="true">🔊</button>
      <div class="stat right"><span class="label">最高</span><span class="value" id="best">0</span></div>
    </div>

    <div class="frame">
      <canvas id="cv" width="360" height="520" aria-label="珍珠接接樂遊戲畫面"></canvas>

      <div class="overlay" id="startOverlay">
        <h2>開張囉！</h2>
        <p>滑鼠移動、手指拖曳或按 ← → 移動杯子。黑色珍珠 1 分、黃色布丁 3 分，連續接住會有連擊加成，冰塊會扣一條命。</p>
        <button class="btn" id="startBtn">開始接料</button>
      </div>

      <div class="overlay hidden" id="endOverlay">
        <h2>這杯淡掉了</h2>
        <p id="endText"></p>
        <button class="btn" id="againBtn">再喝一杯</button>
      </div>
    </div>
  </div>

  <p class="hint">接料不用急著追，預判落點再移動，連擊越高分數越多。</p>

<script>
(function(){
  "use strict";
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  var livesEl = document.getElementById('lives'), musicBtn = document.getElementById('musicBtn');
  var startOverlay = document.getElementById('startOverlay'), endOverlay = document.getElementById('endOverlay');
  var endText = document.getElementById('endText');

  var CUP_W = 78, CUP_H = 96, CUP_Y = H - CUP_H - 14, CATCH_W = 70;
  var comboT = 0, cupX, items, floats, score, lives, combo, maxCombo, elapsed, spawnT, running, last, raf, shake, keys = { l: false, r: false };

  var best = 0;
  try { var sv = localStorage.getItem('pearlcatch_best'); if (sv) best = parseInt(sv, 10) || 0; } catch (e) { /* ignore */ }
  bestEl.textContent = best;
  var musicOn = true;
  try { var mv = localStorage.getItem('pearlcatch_music'); if (mv !== null) musicOn = (mv === '1'); } catch (e) { /* ignore */ }

  var ac = null;
  function getAc(){
    try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; }
    return ac;
  }
  function tone(f, d, type, v, delay){
    var a = getAc(); if (!a) return;
    try {
      var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.03);
    } catch (e) { /* ignore */ }
  }
  var music = {
    timer: null, step: 0,
    mel: [392, 440, 523.25, 440, 392, 329.63, 392, 0, 440, 523.25, 587.33, 523.25, 440, 392, 329.63, 0],
    bass: [130.81, 0, 196, 0, 174.61, 0, 196, 0],
    start: function(){ this.stop(); if (!musicOn) return; this.step = 0; var s = this; this.timer = setInterval(function(){ s.play(); }, 240); },
    play: function(){
      var m = this.mel[this.step % 16], b = this.bass[this.step % 8];
      if (m) tone(m, 0.22, 'triangle', 0.045);
      if (b) tone(b, 0.4, 'sine', 0.05);
      this.step++;
    },
    stop: function(){ if (this.timer){ clearInterval(this.timer); this.timer = null; } }
  };

  function rnd(a, b){ return a + Math.random() * (b - a); }

  function spawn(){
    var iceP = Math.min(0.34, 0.2 + elapsed * 0.002);
    var roll = Math.random(), type = roll < iceP ? 'ice' : roll < iceP + 0.12 ? 'pudding' : 'pearl';
    var speed = Math.min(340, 150 + elapsed * 3.2) * rnd(0.9, 1.15);
    items.push({ type: type, x: rnd(24, W - 24), y: -24, v: speed, r: type === 'pearl' ? 11 : 15, rot: rnd(0, 6) });
  }

  function setLives(){
    var s = ''; for (var i = 0; i < 3; i++) s += i < lives ? '♥' : '♡';
    livesEl.textContent = s;
  }
  function addFloat(x, y, text, color){ floats.push({ x: x, y: y, text: text, color: color, life: 0.7 }); }

  function update(dt){
    elapsed += dt; clock += dt; cupVx = (cupX - lastCupX) / Math.max(dt, .001); lastCupX = cupX; wob *= .9; hitFlash = Math.max(0, hitFlash - dt * 3);
    parts.forEach(function(p){ p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 520 * dt; p.life -= dt; }); parts = parts.filter(function(p){ return p.life > 0; });
    if (keys.l) cupX -= 440 * dt;
    if (keys.r) cupX += 440 * dt;
    cupX = Math.max(CUP_W / 2, Math.min(W - CUP_W / 2, cupX));
    spawnT -= dt;
    if (spawnT <= 0){ spawn(); spawnT = Math.max(0.34, 0.85 - elapsed * 0.008) * rnd(0.8, 1.2); }
    for (var i = items.length - 1; i >= 0; i--){
      var it = items[i];
      it.y += it.v * dt; it.rot += dt * 2;
      var inX = Math.abs(it.x - cupX) < CATCH_W / 2 + it.r * 0.4;
      if (inX && it.y + it.r >= CUP_Y + 6 && it.y - it.r <= CUP_Y + 40){
        items.splice(i, 1);
        if (it.type === 'ice'){
          lives--; combo = 0; shake = 0.25; hitFlash = .5; wob = .1; burst(it.x, CUP_Y, ['#BFE6FA', '#fff', '#6DB7DE'], 12); setLives(); tone(110, 0.3, 'sawtooth', 0.09);
          addFloat(it.x, CUP_Y, '冰塊！', '#4AA3D9');
          if (lives <= 0){ finish(); return; }
        } else {
          combo++; comboT = clock; wob = (Math.random() - .5) * .08; burst(it.x, CUP_Y, it.type === 'pudding' ? ['#FFD25C', '#FFF1A8'] : ['#D9A066', '#7A5A48'], it.type === 'pudding' ? 10 : 6, true); if (combo > maxCombo) maxCombo = combo;
          var base = it.type === 'pudding' ? 3 : 1;
          var gain = Math.round(base * (1 + Math.floor(combo / 10) * 0.5));
          score += gain; scoreEl.textContent = score;
          tone(it.type === 'pudding' ? 784 : 520 + Math.min(combo, 20) * 18, 0.1, 'triangle', 0.09);
          addFloat(it.x, CUP_Y - 6, '+' + gain, it.type === 'pudding' ? '#E0A100' : '#3A2418');
        }
      } else if (it.y - it.r > H){
        items.splice(i, 1);
        if (it.type !== 'ice') combo = 0;
      }
    }
    for (var j = floats.length - 1; j >= 0; j--){
      floats[j].life -= dt; floats[j].y -= 40 * dt;
      if (floats[j].life <= 0) floats.splice(j, 1);
    }
    if (shake > 0) shake -= dt;
  }

  function rr(x, y, w, h, r){
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  var parts = [], bgCache = null, hitFlash = 0, wob = 0, lastCupX = 0, cupVx = 0, clock = 0;
  function burst(x, y, cols, n, up){ for (var i = 0; i < n; i++){ var an = -Math.PI * (.15 + Math.random() * .7), v = 60 + Math.random() * 150; parts.push({ x: x, y: y, vx: Math.cos(an) * v * (up ? .8 : 1), vy: Math.sin(an) * v, life: .6, max: .6, r: 2 + Math.random() * 2.5, c: cols[i % cols.length] }); } }
  function buildBg(){
    var c = document.createElement('canvas'); c.width = W; c.height = H; var g = c.getContext('2d');
    var gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#CFF0E4'); gr.addColorStop(.7, '#E6F7EF'); gr.addColorStop(1, '#BFE3D2'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // wall tiles
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2; for (var x = 0; x < W; x += 40){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H - 40); g.stroke(); } for (var y = 0; y < H - 40; y += 40){ g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    g.fillStyle = 'rgba(150,200,180,.18)'; for (x = 0; x < W; x += 40) for (y = 0; y < H - 40; y += 40) if (((x + y) / 40) % 2 === 0) g.fillRect(x + 2, y + 2, 38, 38);
    // awning
    for (x = 0; x < W; x += 36){ g.fillStyle = (x / 36) % 2 ? '#FFF6EA' : '#F0735E'; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 36, 0); g.lineTo(x + 36, 30); g.arc(x + 18, 30, 18, 0, Math.PI); g.lineTo(x, 30); g.fill(); }
    g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(0, 0, W, 4);
    // menu board
    g.fillStyle = '#2E3B36'; g.beginPath(); g.roundRect ? g.roundRect(W - 112, 74, 94, 62, 8) : g.rect(W - 112, 74, 94, 62); g.fill(); g.strokeStyle = '#8B5E34'; g.lineWidth = 4; g.stroke();
    g.fillStyle = '#F6EEDB'; g.font = "800 13px 'Noto Sans TC',sans-serif"; g.textAlign = 'left'; g.fillText('珍珠奶茶', W - 100, 98); g.fillText('布丁鮮奶', W - 100, 116); g.fillStyle = '#FFD25C'; g.fillText('★ 手搖', W - 100, 132 - 2);
    // hanging lamps
    [[50, 70], [180, 56]].forEach(function(p){ g.strokeStyle = 'rgba(80,60,40,.5)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(p[0], 30); g.lineTo(p[0], p[1]); g.stroke(); var lg = g.createRadialGradient(p[0], p[1] + 14, 2, p[0], p[1] + 14, 46); lg.addColorStop(0, 'rgba(255,230,160,.65)'); lg.addColorStop(1, 'rgba(255,230,160,0)'); g.fillStyle = lg; g.fillRect(p[0] - 50, p[1] - 30, 100, 100); g.fillStyle = '#FFE9A8'; g.beginPath(); g.arc(p[0], p[1] + 12, 12, Math.PI, 0); g.fill(); g.fillRect(p[0] - 12, p[1] + 12, 24, 3); });
    // counter
    var cg = g.createLinearGradient(0, H - 40, 0, H); cg.addColorStop(0, '#B07A45'); cg.addColorStop(1, '#6E4723'); g.fillStyle = cg; g.fillRect(0, H - 40, W, 40);
    g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(0, H - 40, W, 3); g.strokeStyle = 'rgba(60,35,15,.3)'; g.lineWidth = 1; for (var q = 1; q < 3; q++){ g.beginPath(); g.moveTo(0, H - 40 + q * 13); g.lineTo(W, H - 40 + q * 13 + 1); g.stroke(); }
    return c;
  }
  function lerpC(a, b, t){ return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')'; }

  function drawItem(it){
    ctx.save(); ctx.translate(it.x, it.y);
    if (it.type === 'pearl'){
      ctx.fillStyle = 'rgba(58,36,24,.12)'; ctx.beginPath(); ctx.ellipse(0, -it.r * 1.8, it.r * .6, it.r * 1.2, 0, 0, 6.3); ctx.fill();
      var g = ctx.createRadialGradient(-3.5, -4, 1, 0, 0, it.r); g.addColorStop(0, '#7A5A48'); g.addColorStop(.35, '#3A2418'); g.addColorStop(1, '#170B05'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, it.r, 0, 6.3); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.65)'; ctx.beginPath(); ctx.ellipse(-3.6, -4.2, 3.4, 2, -.6, 0, 6.3); ctx.fill();
    } else if (it.type === 'pudding'){
      ctx.rotate(Math.sin(it.rot) * 0.15);
      ctx.shadowColor = 'rgba(255,200,60,.7)'; ctx.shadowBlur = 12;
      var pg = ctx.createLinearGradient(0, -14, 0, 14); pg.addColorStop(0, '#FFE488'); pg.addColorStop(1, '#F5B93A');
      ctx.fillStyle = pg; ctx.beginPath(); ctx.moveTo(-11, -12); ctx.lineTo(11, -12); ctx.lineTo(15, 12); ctx.lineTo(-15, 12); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#8A4E1E'; ctx.beginPath(); ctx.ellipse(0, -12, 12, 5, 0, 0, 6.3); ctx.fill(); ctx.fillStyle = '#B2702F'; ctx.beginPath(); ctx.ellipse(-3, -13, 6, 2, 0, 0, 6.3); ctx.fill();
      ctx.strokeStyle = '#D8962A'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-15, 12); ctx.lineTo(15, 12); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(-9, -4, 3, 10);
    } else {
      ctx.rotate(it.rot * 0.6);
      var ig = ctx.createLinearGradient(-14, -14, 14, 14); ig.addColorStop(0, 'rgba(235,250,255,.95)'); ig.addColorStop(1, 'rgba(150,210,240,.8)');
      ctx.shadowColor = 'rgba(100,190,240,.7)'; ctx.shadowBlur = 10; ctx.fillStyle = ig; rr(-14, -14, 28, 28, 7); ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = '#6DB7DE'; ctx.lineWidth = 2; rr(-14, -14, 28, 28, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-8, -6); ctx.lineTo(-8, -10); ctx.lineTo(-3, -10); ctx.stroke(); ctx.beginPath(); ctx.moveTo(4, 6); ctx.lineTo(9, 6); ctx.stroke();
      ctx.fillStyle = '#3A7FA8'; ctx.font = '900 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('✕', 0, 4);
    }
    ctx.restore();
  }

  function drawCup(){
    var x = cupX, top = CUP_Y, bot = CUP_Y + CUP_H, tw = CUP_W / 2, bw = CUP_W / 2 - 12;
    ctx.save();
    ctx.fillStyle = 'rgba(40,20,5,.28)'; ctx.beginPath(); ctx.ellipse(x, bot + 6, CUP_W * .5, 6, 0, 0, 6.3); ctx.fill();
    if (shake > 0) ctx.translate(Math.sin(elapsed * 90) * 3, 0);
    ctx.translate(x, bot); ctx.rotate(Math.max(-.12, Math.min(.12, cupVx * .0003 + wob))); ctx.translate(-x, -bot);
    // straw
    var sg = ctx.createLinearGradient(x + 8, 0, x + 18, 0); sg.addColorStop(0, '#FF8B8B'); sg.addColorStop(1, '#D93A46');
    ctx.strokeStyle = '#E5484D'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x + 10, top + 14); ctx.lineTo(x + 26, top - 40); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = 2; ctx.setLineDash([5, 7]); ctx.beginPath(); ctx.moveTo(x + 10, top + 14); ctx.lineTo(x + 26, top - 40); ctx.stroke(); ctx.setLineDash([]);
    function body(){ ctx.beginPath(); ctx.moveTo(x - tw, top); ctx.lineTo(x + tw, top); ctx.lineTo(x + bw, bot); ctx.lineTo(x - bw, bot); ctx.closePath(); }
    body(); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
    var level = Math.min(.78, .38 + score / 400), ty = bot - CUP_H * level, dil = (3 - lives) / 3;
    ctx.save(); body(); ctx.clip();
    var tg = ctx.createLinearGradient(0, ty, 0, bot); tg.addColorStop(0, lerpC([226, 178, 124], [240, 222, 196], dil)); tg.addColorStop(1, lerpC([170, 112, 62], [214, 186, 150], dil)); ctx.fillStyle = tg;
    ctx.beginPath(); ctx.moveTo(x - CUP_W, bot); ctx.lineTo(x - CUP_W, ty);
    for (var wx = -CUP_W; wx <= CUP_W; wx += 6) ctx.lineTo(x + wx, ty + Math.sin(clock * 5 + wx * .15) * 2 + wob * 40);
    ctx.lineTo(x + CUP_W, bot); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x - CUP_W, ty - 1, CUP_W * 2, 2);
    var n = Math.min(30, 6 + Math.floor(score / 5));
    for (var i = 0; i < n; i++){
      var row = Math.floor(i / 6), px = x - 22 + (i % 6) * 8.8 + (row % 2) * 4, py = bot - 7 - row * 9;
      var pgd = ctx.createRadialGradient(px - 1.5, py - 2, .5, px, py, 5); pgd.addColorStop(0, '#7A5A48'); pgd.addColorStop(1, '#1E0F07'); ctx.fillStyle = pgd; ctx.beginPath(); ctx.arc(px, py, 4.8, 0, 6.3); ctx.fill();
    }
    ctx.restore();
    // sleeve band
    ctx.save(); body(); ctx.clip(); ctx.fillStyle = 'rgba(240,115,94,.9)'; ctx.fillRect(x - CUP_W, top + 30, CUP_W * 2, 30); ctx.fillStyle = '#FFF6EA'; ctx.font = "900 16px 'Noto Serif TC',serif"; ctx.textAlign = 'center'; ctx.fillText('茶', x, top + 52); ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(x - CUP_W, top + 30, CUP_W * 2, 3); ctx.restore();
    // glass highlights
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x - tw + 9, top + 8); ctx.lineTo(x - bw + 6, bot - 12); ctx.stroke();
    ctx.strokeStyle = '#3A2418'; ctx.lineWidth = 2.6; ctx.lineJoin = 'round'; body(); ctx.stroke();
    // lid rim
    var lg = ctx.createLinearGradient(0, top - 9, 0, top + 2); lg.addColorStop(0, '#FFB055'); lg.addColorStop(1, '#D9751F'); ctx.fillStyle = lg; rr(x - tw - 5, top - 8, CUP_W + 10, 11, 5); ctx.fill(); ctx.strokeStyle = '#8A4E1E'; ctx.lineWidth = 1.5; rr(x - tw - 5, top - 8, CUP_W + 10, 11, 5); ctx.stroke();
    ctx.restore();
    if (hitFlash > 0){ ctx.fillStyle = 'rgba(120,200,255,' + (hitFlash * .6) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  function draw(){
    if (!bgCache) bgCache = buildBg();
    ctx.drawImage(bgCache, 0, 0);
    // floating bokeh
    for (var i = 0; i < 6; i++){ var bx = (i * 67 + clock * (6 + i)) % (W + 40) - 20, by = 140 + ((i * 53) % 260) + Math.sin(clock + i) * 8; ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(bx, by, 4 + (i % 3) * 2, 0, 6.3); ctx.fill(); }
    // drop guide
    if (running){ var gg = ctx.createLinearGradient(0, 0, 0, CUP_Y); gg.addColorStop(0, 'rgba(255,255,255,0)'); gg.addColorStop(1, 'rgba(255,255,255,.3)'); ctx.fillStyle = gg; ctx.fillRect(cupX - CATCH_W / 2, 0, CATCH_W, CUP_Y); }
    items.forEach(drawItem);
    drawCup();
    parts.forEach(function(p){ var a = p.life / p.max; ctx.globalAlpha = a; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (.5 + a * .5), 0, 6.3); ctx.fill(); }); ctx.globalAlpha = 1;

    floats.forEach(function(f){ ctx.globalAlpha = Math.max(0, f.life / 0.7); ctx.font = "900 20px 'Noto Sans TC', sans-serif"; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y); });

  }

  function loop(ts){
    if (!running) return;
    if (!last) last = ts;
    var dt = Math.min(0.033, (ts - last) / 1000); last = ts;
    update(dt);
    if (!running) return;
    draw();
    raf = requestAnimationFrame(loop);
  }

  function finish(){
    running = false; cancelAnimationFrame(raf); music.stop(); draw();
    var isBest = score > best;
    if (isBest){ best = score; bestEl.textContent = best; try { localStorage.setItem('pearlcatch_best', String(best)); } catch (e) { /* ignore */ } }
    var rk = score >= 150 ? '手搖店之神 🏆' : score >= 80 ? '資深店員 🧋' : score >= 30 ? '工讀生 🥤' : '新手學徒 🫧'; endText.innerHTML = rk + '<br>本局 ' + score + ' 分，最高連擊 ' + maxCombo + (isBest ? '<br>刷新最高分了！' : '');
    setTimeout(function(){ endOverlay.classList.remove('hidden'); }, 350);
  }

  function startGame(){
    getAc();
    startOverlay.classList.add('hidden'); endOverlay.classList.add('hidden');
    cupX = W / 2; items = []; floats = []; parts = []; score = 0; lives = 3; combo = 0; maxCombo = 0; elapsed = 0; spawnT = 0.6; shake = 0; last = 0; hitFlash = 0; wob = 0;
    scoreEl.textContent = '0'; setLives();
    running = true; music.start(); raf = requestAnimationFrame(loop);
  }

  function setFromClient(x){
    var r = cv.getBoundingClientRect();
    cupX = Math.max(CUP_W / 2, Math.min(W - CUP_W / 2, (x - r.left) / r.width * W));
  }
  cv.addEventListener('mousemove', function(e){ if (running) setFromClient(e.clientX); });
  cv.addEventListener('touchstart', function(e){ if (running){ setFromClient(e.touches[0].clientX); } e.preventDefault(); }, { passive: false });
  cv.addEventListener('touchmove', function(e){ if (running){ setFromClient(e.touches[0].clientX); } e.preventDefault(); }, { passive: false });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){ keys.l = true; e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){ keys.r = true; e.preventDefault(); }
  });
  document.addEventListener('keyup', function(e){
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.l = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.r = false;
  });
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);
  function refreshMusicBtn(){ musicBtn.textContent = musicOn ? '🔊' : '🔇'; musicBtn.setAttribute('aria-pressed', String(musicOn)); }
  musicBtn.addEventListener('click', function(){
    musicOn = !musicOn;
    try { localStorage.setItem('pearlcatch_music', musicOn ? '1' : '0'); } catch (e) { /* ignore */ }
    if (musicOn && running) music.start(); else music.stop();
    refreshMusicBtn();
  });

  cupX = W / 2; items = []; floats = []; score = 0; lives = 3; combo = 0; elapsed = 0; shake = 0;
  refreshMusicBtn(); setLives(); draw();
})();
</script>
