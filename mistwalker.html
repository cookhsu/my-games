<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>霧隱長廊</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0A1620; --ink:#D9F3F0; --teal:#4DE1C1; --teal2:#2BB89A; --gold:#FFC83D; --goldD:#8A4B07; --red:#FF5A6A; --panel:#132736; --panel2:#1B3448; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:'Noto Sans TC',system-ui,sans-serif; overflow:hidden; }
  body{ display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 0%, #1D3B4A 0%, #0A1620 72%); }
  .wrap{ position:relative; width:min(100vw, calc(100vh * 0.5625)); aspect-ratio:360/640; max-height:100vh; border-radius:20px; overflow:hidden; background:#0A1620; box-shadow:0 24px 70px rgba(0,0,0,.65), 0 0 0 3px rgba(77,225,193,.22); user-select:none; -webkit-user-select:none; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }
  .mus{ position:absolute; right:8px; top:8px; z-index:6; width:30px; height:28px; border:0; border-radius:999px; background:rgba(10,22,32,.7); color:#fff; font-size:14px; box-shadow:0 2px 0 rgba(0,0,0,.35); }

  .topbar{ position:absolute; left:0; right:0; top:0; z-index:5; display:none; align-items:center; justify-content:center; gap:14px; padding:12px 14px 20px;
           background:linear-gradient(180deg, rgba(10,22,32,.95) 0%, rgba(10,22,32,.7) 60%, rgba(10,22,32,0) 100%); }
  .topbar.on{ display:flex; }
  .read{ display:flex; align-items:center; gap:10px; font-weight:900; font-size:12.5px; letter-spacing:.06em; color:#CFEFEA; }
  .read .pips{ display:flex; gap:5px; } .read .pips i{ width:13px; height:13px; border-radius:50%; background:#1B3448; box-shadow:inset 0 2px 0 rgba(0,0,0,.35); transition:background .2s, box-shadow .2s; }
  .read .pips i.on{ background:radial-gradient(circle at 35% 30%, #BFFFF0, #2BB89A); box-shadow:0 0 9px rgba(77,225,193,.9); }

  .ctrl{ position:absolute; left:0; right:0; bottom:0; z-index:5; padding:8px 14px 14px; display:none; flex-direction:column; align-items:center; gap:8px;
         background:linear-gradient(180deg, rgba(10,22,32,0) 0%, rgba(10,22,32,.88) 28%, rgba(10,22,32,.97) 100%); }
  .ctrl.on{ display:flex; }
  .pad{ display:grid; grid-template-columns:60px 60px 60px; grid-template-rows:52px 52px 52px; gap:7px; }
  .pad button{ border:0; border-radius:14px; color:#EAFBF7; font:900 20px 'Fredoka',sans-serif; background:linear-gradient(180deg,#2B5367,#17313F); box-shadow:0 5px 0 #0C1E29, 0 8px 12px rgba(0,0,0,.4); }
  .pad button:active{ transform:translateY(4px); box-shadow:0 1px 0 #0C1E29; }
  .pad .blank{ background:transparent; box-shadow:none; }
  .pad .blow{ background:linear-gradient(180deg,#FFE27A,#FFB32A); color:#4A2800; font-size:13px; letter-spacing:1px; }
  .pad .blow:disabled{ opacity:.35; box-shadow:0 2px 0 var(--goldD); transform:translateY(3px); }
  .pad #bU{ grid-column:2; grid-row:1; } .pad #bL{ grid-column:1; grid-row:2; } .pad #bBlow{ grid-column:2; grid-row:2; } .pad #bR{ grid-column:3; grid-row:2; } .pad #bD{ grid-column:2; grid-row:3; }

  .ov{ position:absolute; inset:0; z-index:8; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:22px; overflow:hidden;
       background:radial-gradient(circle at 50% 14%, #1F4456 0%, #132736 52%, #0A1620 100%); animation:ovIn .3s ease; }
  .ov.hidden{ display:none; }
  @keyframes ovIn{ from{ opacity:0; transform:scale(.97);} to{ opacity:1; transform:none; } }
  h1{ margin:0; font-weight:900; font-size:40px; line-height:1.1; letter-spacing:3px; background:linear-gradient(180deg,#EAFFFC,#9BF2E4 55%,#2BB89A); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 0 #0C3A33); }
  h2{ margin:0; font-weight:900; font-size:26px; color:var(--teal); text-shadow:0 3px 0 rgba(0,0,0,.4); }
  .sub{ font-size:13.5px; line-height:1.7; color:#CDEAE4; max-width:290px; }
  .sub b{ color:var(--gold); }
  .rules{ text-align:left; background:rgba(255,255,255,.06); border:2px dashed rgba(77,225,193,.35); border-radius:16px; padding:11px 15px; font-size:12.5px; line-height:1.75; max-width:300px; }
  .rules b{ color:var(--teal); }
  .btn{ min-width:200px; padding:13px 24px; border:none; border-radius:999px; font:900 18px 'Noto Sans TC',sans-serif; letter-spacing:2px; color:#063024; text-decoration:none; display:inline-block; cursor:pointer;
        background:linear-gradient(180deg,#9BF2E4,#2BB89A); box-shadow:0 6px 0 #0F6B59, 0 12px 18px rgba(0,0,0,.4); }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #0F6B59; }
  .btn.g{ color:#EAF8FF; background:linear-gradient(180deg,#2B5367,#17313F); box-shadow:0 6px 0 #0C1E29, 0 12px 18px rgba(0,0,0,.4); min-width:0; padding:10px 20px; font-size:14px; }
  .row{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .best{ font-size:12.5px; font-weight:700; color:#9FD9CF; }
  .best b{ color:var(--gold); font:700 17px 'Fredoka'; margin:0 3px; }
  .toast{ position:absolute; left:50%; top:14px; transform:translateX(-50%); z-index:7; background:rgba(10,22,32,.85); border:1px solid rgba(77,225,193,.4); color:#EAFBF7;
          font-weight:700; font-size:12.5px; padding:7px 16px; border-radius:999px; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; }
  .toast.on{ opacity:1; }
</style>

<body>
<div class="wrap">
  <canvas id="cv" width="360" height="640"></canvas>
  <button class="mus" id="mus">🔊</button>
  <div class="toast" id="toast"></div>
  <div class="topbar" id="topbar">
    <div class="read"><span>第 <b id="floorTxt">1</b> 層</span></div>
    <div class="read"><span>分數 <b id="scoreTxt">0</b></span></div>
    <div class="read"><span>💨</span><span class="pips" id="pips"></span></div>
  </div>

  <div class="ov" id="ovMenu">
    <div style="font:700 11px 'Fredoka';letter-spacing:7px;color:var(--teal)">EXPLORE · HIDE · ESCAPE</div>
    <h1>霧隱<br>長廊</h1>
    <div class="rules">
      <div><b>🌫️ 濃霧</b>：整座地城被霧蓋住，只看得見腳邊。</div>
      <div><b>💨 吹氣</b>：按吹氣鍵吹開一片迷霧，看清地形、金幣與怪物——但怪物也會被吵醒。</div>
      <div><b>👻 怪物</b>：沒被吵醒時不會動，一旦被吹到就會開始追你。</div>
      <div><b>🚪 出口</b>：找到出口深入下一層，金幣與層數都計入分數。</div>
    </div>
    <div class="best" id="bestLine">最佳紀錄：<b>0</b> 分</div>
    <button class="btn" id="startBtn">▶ 踏入迷霧</button>
  </div>

  <div class="ov hidden" id="ovClear">
    <div style="font:700 11px 'Fredoka';letter-spacing:6px;color:var(--teal)">FLOOR CLEARED</div>
    <h2 id="clearTitle">第 1 層 通關！</h2>
    <div class="sub" id="clearSub">收集 <b>0</b> 枚金幣　花費 <b>0</b> 回合</div>
    <div class="row"><div class="best">目前總分<b id="clearScore">0</b></div></div>
    <button class="btn" id="nextBtn">繼續深入 ▶</button>
  </div>

  <div class="ov hidden" id="ovLose">
    <div style="font:700 11px 'Fredoka';letter-spacing:6px;color:var(--red)">CAUGHT IN THE FOG</div>
    <h2 style="color:var(--red)">被發現了…</h2>
    <div class="sub">你走到了第 <b id="loseFloor">1</b> 層，最終分數 <b id="loseScore">0</b></div>
    <div class="best" id="loseBest">最佳紀錄：<b>0</b> 分</div>
    <button class="btn" id="retryBtn">↺ 重新挑戰</button>
  </div>

  <div class="ctrl" id="ctrl">
    <div class="pad">
      <button id="bU">▲</button>
      <button id="bL">◀</button>
      <button class="blank"></button>
      <button id="bR">▶</button>
      <button id="bD">▼</button>
      <button class="blow" id="bBlow">💨<br>吹氣</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var W=360,H=640;
var COLS=8, ROWS=9, CS=38, GX=(W-COLS*CS)/2, GY=56;

function $(id){ return document.getElementById(id); }
function show(el){ el.classList.remove('hidden'); } function hide(el){ el.classList.add('hidden'); }

/* ---------------- sound ---------------- */
var sndOn = (localStorage.getItem('mw_snd')!=='0');
function setMus(){ $('mus').textContent = sndOn?'🔊':'🔇'; }
$('mus').addEventListener('click', function(){ sndOn=!sndOn; localStorage.setItem('mw_snd', sndOn?'1':'0'); setMus(); });
setMus();
var actx=null;
function beep(freq,dur,type,gain){
  if(!sndOn) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.value=gain||.08;
    o.connect(g); g.connect(actx.destination);
    var t=actx.currentTime;
    g.gain.setValueAtTime(g.gain.value,t);
    g.gain.exponentialRampToValueAtTime(.001,t+(dur||.2));
    o.start(t); o.stop(t+(dur||.2)+.02);
  }catch(e){}
}
var sfx={
  move:function(){ beep(220,.05,'square',.04); },
  blow:function(){ beep(180,.35,'sine',.09); beep(360,.3,'sine',.05); },
  coin:function(){ beep(880,.09,'triangle',.07); beep(1320,.12,'triangle',.05); },
  alert:function(){ beep(140,.22,'sawtooth',.08); },
  win:function(){ beep(660,.12,'triangle',.08); setTimeout(function(){beep(880,.16,'triangle',.08);},110); setTimeout(function(){beep(1100,.22,'triangle',.08);},230); },
  lose:function(){ beep(220,.1,'sawtooth',.09); setTimeout(function(){beep(140,.35,'sawtooth',.1);},100); }
};

/* ---------------- state ---------------- */
var S=null; // run state
var vfx=[]; // transient visual effects {type,x,y,t,life}
var toastT=0;

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function bfsDist(grid, sx, sy){
  var dist=new Array(COLS*ROWS).fill(-1);
  dist[sy*COLS+sx]=0;
  var q=[[sx,sy]], qi=0;
  while(qi<q.length){
    var c=q[qi++], x=c[0], y=c[1], d=dist[y*COLS+x];
    var nbs=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
    for(var i=0;i<nbs.length;i++){
      var nx=nbs[i][0], ny=nbs[i][1];
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS) continue;
      if(grid[ny*COLS+nx]===1) continue;
      if(dist[ny*COLS+nx]!==-1) continue;
      dist[ny*COLS+nx]=d+1; q.push([nx,ny]);
    }
  }
  return dist;
}
function bfsNextStep(grid, fx,fy, tx,ty){
  if(fx===tx && fy===ty) return null;
  var dist=new Array(COLS*ROWS).fill(-1);
  dist[ty*COLS+tx]=0;
  var q=[[tx,ty]], qi=0;
  while(qi<q.length){
    var c=q[qi++], x=c[0], y=c[1], d=dist[y*COLS+x];
    if(x===fx&&y===fy) break;
    var nbs=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
    for(var i=0;i<nbs.length;i++){
      var nx=nbs[i][0], ny=nbs[i][1];
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS) continue;
      if(grid[ny*COLS+nx]===1) continue;
      if(dist[ny*COLS+nx]!==-1) continue;
      dist[ny*COLS+nx]=d+1; q.push([nx,ny]);
    }
  }
  if(dist[fy*COLS+fx]===-1) return null;
  var x=fx,y=fy,d=dist[fy*COLS+fx];
  var nbs=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
  for(var i=0;i<nbs.length;i++){
    var nx=nbs[i][0], ny=nbs[i][1];
    if(nx<0||ny<0||nx>=COLS||ny>=ROWS) continue;
    if(dist[ny*COLS+nx]===d-1) return [nx,ny];
  }
  return null;
}

function genFloor(floorNo){
  var rng=mulberry32(floorNo*104729 + Math.floor(Math.random()*1e9));
  var grid=new Array(COLS*ROWS).fill(1);
  var sx=1, sy=ROWS-2;
  grid[sy*COLS+sx]=0;
  var carved=[[sx,sy]];
  var target=Math.floor(COLS*ROWS*0.52);
  while(carved.length<target){
    var from=carved[Math.floor(rng()*carved.length)];
    var x=from[0], y=from[1];
    var dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(function(){return rng()-.5;});
    var moved=false;
    for(var i=0;i<dirs.length;i++){
      var nx=x+dirs[i][0], ny=y+dirs[i][1];
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS) continue;
      if(grid[ny*COLS+nx]===1){
        grid[ny*COLS+nx]=0; carved.push([nx,ny]); moved=true; break;
      }
    }
    if(!moved && carved.length<target){
      // pick a random existing carved tile with a wall neighbor to branch from
      var tries=0, ok=false;
      while(tries<40 && !ok){
        tries++;
        var p=carved[Math.floor(rng()*carved.length)];
        var dd=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(rng()*4)];
        var nx2=p[0]+dd[0], ny2=p[1]+dd[1];
        if(nx2<0||ny2<0||nx2>=COLS||ny2>=ROWS) continue;
        if(grid[ny2*COLS+nx2]===1){ grid[ny2*COLS+nx2]=0; carved.push([nx2,ny2]); ok=true; }
      }
      if(!ok) break;
    }
  }
  var dist=bfsDist(grid,sx,sy);
  var best=0,bi=sy*COLS+sx;
  for(var k=0;k<dist.length;k++){ if(dist[k]>best){ best=dist[k]; bi=k; } }
  var ex=bi%COLS, ey=Math.floor(bi/COLS);

  var floorCells=[];
  for(var yy=0;yy<ROWS;yy++) for(var xx=0;xx<COLS;xx++){
    if(grid[yy*COLS+xx]===0 && !(xx===sx&&yy===sy) && !(xx===ex&&yy===ey)) floorCells.push([xx,yy]);
  }
  floorCells.sort(function(){return rng()-.5;});

  var coinN=Math.min(5, Math.max(3, Math.floor(floorCells.length*0.18)));
  var coins={};
  for(var c=0;c<coinN && c<floorCells.length;c++){ var p=floorCells[c]; coins[p[1]*COLS+p[0]]=true; }

  var monN=Math.min(5, 1+Math.floor((floorNo-1)/1.4));
  var mons=[];
  var farCells=floorCells.filter(function(p){ return dist[p[1]*COLS+p[0]] > 3; });
  if(farCells.length<monN) farCells=floorCells;
  for(var m=0;m<monN && m<farCells.length;m++){
    var mp=farCells[m];
    mons.push({x:mp[0], y:mp[1], alert:false});
  }

  var seen=new Array(COLS*ROWS).fill(false);
  var litUntil=new Array(COLS*ROWS).fill(-1);
  return {
    grid:grid, sx:sx, sy:sy, ex:ex, ey:ey, coins:coins, mons:mons,
    seen:seen, litUntil:litUntil
  };
}

function startRun(){
  S = {
    phase:'play', floor:1, score:0, turn:0, breath:3, breathMax:3, turnsSinceRegen:0,
    px:0, py:0, dir:'d', floorCoins:0, floorTurns:0, map:null
  };
  loadFloor(1);
  hide($('ovMenu')); hide($('ovLose')); hide($('ovClear'));
  $('ctrl').classList.add('on'); $('topbar').classList.add('on');
  renderHUD();
}
function loadFloor(n){
  var m = genFloor(n);
  S.map = m; S.px=m.sx; S.py=m.sy; S.floorCoins=0; S.floorTurns=0;
  markSeenAround(S.px,S.py,1,true);
}
function markSeenAround(cx,cy,r,setLit){
  var m=S.map;
  for(var y=Math.max(0,cy-r); y<=Math.min(ROWS-1,cy+r); y++){
    for(var x=Math.max(0,cx-r); x<=Math.min(COLS-1,cx+r); x++){
      var dx=x-cx, dy=y-cy;
      if(Math.max(Math.abs(dx),Math.abs(dy))<=r){
        var idx=y*COLS+x;
        m.seen[idx]=true;
        if(setLit) m.litUntil[idx]=S.turn;
      }
    }
  }
}

function canMove(x,y){
  if(x<0||y<0||x>=COLS||y>=ROWS) return false;
  return S.map.grid[y*COLS+x]===0;
}

function doMove(dir){
  if(!S || S.phase!=='play') return;
  var dx=0,dy=0;
  if(dir==='u'){dy=-1;} else if(dir==='d'){dy=1;} else if(dir==='l'){dx=-1;} else if(dir==='r'){dx=1;}
  S.dir=dir;
  var nx=S.px+dx, ny=S.py+dy;
  if(!canMove(nx,ny)){ return; }
  S.px=nx; S.py=ny;
  S.turn++; S.floorTurns++;
  markSeenAround(S.px,S.py,1,true);
  var idx=S.py*COLS+S.px;
  if(S.map.coins[idx]){
    delete S.map.coins[idx]; S.score+=10; S.floorCoins++; sfx.coin();
    vfx.push({type:'pop', x:GX+S.px*CS+CS/2, y:GY+S.py*CS+CS/2, t:0, life:.5, col:'#FFC83D'});
  }
  regenCheck();
  stepMonsters();
  checkEnd();
}

function doBlow(){
  if(!S || S.phase!=='play') return;
  if(S.breath<=0) return;
  S.breath--; sfx.blow();
  var R=3;
  markSeenAround(S.px,S.py,R,true);
  vfx.push({type:'ring', x:GX+S.px*CS+CS/2, y:GY+S.py*CS+CS/2, t:0, life:.55, r0:CS*0.6, r1:CS*(R+0.4)});
  var woke=false;
  S.map.mons.forEach(function(mo){
    var dx=mo.x-S.px, dy=mo.y-S.py;
    if(Math.max(Math.abs(dx),Math.abs(dy))<=R){
      if(!mo.alert){ mo.alert=true; woke=true; }
    }
  });
  if(woke) sfx.alert();
  S.turn++; S.floorTurns++;
  regenCheck();
  stepMonsters();
  checkEnd();
}

function regenCheck(){
  S.turnsSinceRegen++;
  if(S.turnsSinceRegen>=4 && S.breath<S.breathMax){ S.breath++; S.turnsSinceRegen=0; }
  else if(S.turnsSinceRegen>=4){ S.turnsSinceRegen=0; }
}

function stepMonsters(){
  var occ={}; S.map.mons.forEach(function(mo){ occ[mo.y*COLS+mo.x]=true; });
  S.map.mons.forEach(function(mo){
    if(!mo.alert) return;
    var step=bfsNextStep(S.map.grid, mo.x, mo.y, S.px, S.py);
    if(step){
      var k=step[1]*COLS+step[0];
      if(!occ[k] || (step[0]===S.px&&step[1]===S.py)){
        delete occ[mo.y*COLS+mo.x];
        mo.x=step[0]; mo.y=step[1];
        occ[k]=true;
      }
    }
  });
}

function checkEnd(){
  renderHUD();
  for(var i=0;i<S.map.mons.length;i++){
    var mo=S.map.mons[i];
    if(mo.x===S.px && mo.y===S.py){ doLose(); return; }
  }
  if(S.px===S.map.ex && S.py===S.map.ey){ doClear(); return; }
}

function doClear(){
  S.phase='clear'; sfx.win();
  var bonus = 30 + S.floorCoins*10 + Math.max(0, 40-S.floorTurns);
  S.score += bonus;
  $('clearTitle').textContent = '第 '+S.floor+' 層 通關！';
  $('clearSub').innerHTML = '收集 <b>'+S.floorCoins+'</b> 枚金幣　花費 <b>'+S.floorTurns+'</b> 回合　(+'+bonus+' 分)';
  $('clearScore').textContent = S.score;
  show($('ovClear'));
}
$('nextBtn').addEventListener('click', function(){
  S.floor++; S.phase='play'; hide($('ovClear'));
  S.breath = S.breathMax;
  loadFloor(S.floor);
  renderHUD();
});

function doLose(){
  S.phase='lose'; sfx.lose();
  var best = parseInt(localStorage.getItem('mw_best')||'0',10);
  if(S.score>best){ best=S.score; localStorage.setItem('mw_best', String(best)); }
  $('loseFloor').textContent = S.floor;
  $('loseScore').textContent = S.score;
  $('loseBest').innerHTML = '最佳紀錄：<b>'+best+'</b> 分';
  show($('ovLose'));
}
$('retryBtn').addEventListener('click', function(){ hide($('ovLose')); startRun(); });
$('startBtn').addEventListener('click', function(){ startRun(); });

function renderHUD(){
  $('floorTxt').textContent = S.floor;
  $('scoreTxt').textContent = S.score;
  var pips=$('pips'); pips.innerHTML='';
  for(var i=0;i<S.breathMax;i++){ var el=document.createElement('i'); if(i<S.breath) el.className='on'; pips.appendChild(el); }
  $('bBlow').disabled = (S.breath<=0);
}

var bestInit = parseInt(localStorage.getItem('mw_best')||'0',10);
$('bestLine').innerHTML = '最佳紀錄：<b>'+bestInit+'</b> 分';

/* ---------------- input ---------------- */
$('bU').addEventListener('click', function(){ doMove('u'); });
$('bD').addEventListener('click', function(){ doMove('d'); });
$('bL').addEventListener('click', function(){ doMove('l'); });
$('bR').addEventListener('click', function(){ doMove('r'); });
$('bBlow').addEventListener('click', function(){ doBlow(); });
addEventListener('keydown', function(e){
  if(!S || S.phase!=='play') return;
  if(e.key==='ArrowUp'||e.key==='w') doMove('u');
  else if(e.key==='ArrowDown'||e.key==='s') doMove('d');
  else if(e.key==='ArrowLeft'||e.key==='a') doMove('l');
  else if(e.key==='ArrowRight'||e.key==='d') doMove('r');
  else if(e.key===' '){ e.preventDefault(); doBlow(); }
});

/* ---------------- render ---------------- */
function cellLit(x,y){
  var idx=y*COLS+x;
  if(Math.max(Math.abs(x-S.px),Math.abs(y-S.py))<=1) return true;
  return S.map.litUntil[idx] >= S.turn-2;
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0A1620'; ctx.fillRect(0,0,W,H);

  // title bar
  ctx.textAlign='center';
  if(S && S.phase!=='menu'){
    var m=S.map;
    for(var y=0;y<ROWS;y++){
      for(var x=0;x<COLS;x++){
        var idx=y*COLS+x, px=GX+x*CS, py=GY+y*CS;
        var isWall = m.grid[idx]===1;
        var seen = m.seen[idx];
        var lit = cellLit(x,y);
        if(!seen){ continue; } // pure black fog, nothing drawn
        if(isWall){
          ctx.fillStyle = lit? '#234A5C' : '#152C38';
          ctx.fillRect(px+1,py+1,CS-2,CS-2);
        } else {
          ctx.fillStyle = lit? '#13303D' : '#0E222C';
          ctx.fillRect(px+1,py+1,CS-2,CS-2);
          if(x===m.ex && y===m.ey){
            var tpulse = 1+Math.sin(performance.now()/260)*.12;
            ctx.save(); ctx.translate(px+CS/2,py+CS/2);
            ctx.strokeStyle = lit? '#9BF2E4':'#2BB89A'; ctx.lineWidth=3;
            ctx.beginPath(); ctx.arc(0,0,CS*0.32*tpulse,0,Math.PI*2); ctx.stroke();
            ctx.strokeStyle='rgba(155,242,228,.5)'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.arc(0,0,CS*0.44*tpulse,0,Math.PI*2); ctx.stroke();
            ctx.restore();
          }
          if(lit && m.coins[idx]){
            ctx.save(); ctx.translate(px+CS/2,py+CS/2);
            var bob=Math.sin(performance.now()/220+x+y)*2;
            ctx.translate(0,bob);
            ctx.fillStyle='#FFC83D'; ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#FFF3B0'; ctx.beginPath(); ctx.arc(-2,-2,2.4,0,Math.PI*2); ctx.fill();
            ctx.restore();
          }
          if(!lit && seen){
            ctx.fillStyle='rgba(5,12,17,.55)'; ctx.fillRect(px+1,py+1,CS-2,CS-2);
          }
        }
      }
    }
    // monsters
    m.mons.forEach(function(mo){
      if(!cellLit(mo.x,mo.y)) return;
      var px=GX+mo.x*CS+CS/2, py=GY+mo.y*CS+CS/2;
      ctx.save(); ctx.translate(px,py);
      var wob=Math.sin(performance.now()/180+mo.x)*2;
      ctx.translate(0,wob*0.3);
      ctx.fillStyle = mo.alert? 'rgba(255,90,106,.28)':'rgba(120,120,140,.22)';
      ctx.beginPath(); ctx.ellipse(0,4,13,9,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = mo.alert? '#3a1420':'#241c2c';
      ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = mo.alert? '#FF5A6A':'#8893a8';
      ctx.beginPath(); ctx.arc(-4,-2,2.1,0,Math.PI*2); ctx.arc(4,-2,2.1,0,Math.PI*2); ctx.fill();
      if(mo.alert){ ctx.shadowColor='#FF5A6A'; ctx.shadowBlur=10; ctx.fillStyle='#FF5A6A'; ctx.beginPath(); ctx.arc(-4,-2,2.1,0,Math.PI*2); ctx.arc(4,-2,2.1,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; }
      ctx.restore();
    });
    // player
    (function(){
      var px=GX+S.px*CS+CS/2, py=GY+S.py*CS+CS/2;
      ctx.save(); ctx.translate(px,py);
      var glow=14+Math.sin(performance.now()/300)*3;
      var g=ctx.createRadialGradient(0,0,0,0,0,glow);
      g.addColorStop(0,'rgba(155,242,228,.45)'); g.addColorStop(1,'rgba(155,242,228,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,glow,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#EAFFFC'; ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#2BB89A';
      var rot = {u:-Math.PI/2, d:Math.PI/2, l:Math.PI, r:0}[S.dir]||Math.PI/2;
      ctx.rotate(rot);
      ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(2,-5); ctx.lineTo(2,5); ctx.closePath(); ctx.fill();
      ctx.restore();
    })();

    // vfx
    for(var vi=vfx.length-1; vi>=0; vi--){
      var v=vfx[vi]; v.t += 1/60;
      var p=Math.min(1,v.t/v.life);
      if(p>=1){ vfx.splice(vi,1); continue; }
      ctx.save();
      if(v.type==='ring'){
        ctx.globalAlpha = 1-p;
        ctx.strokeStyle='#9BF2E4'; ctx.lineWidth=3;
        var r=v.r0+(v.r1-v.r0)*p;
        ctx.beginPath(); ctx.arc(v.x,v.y,r,0,Math.PI*2); ctx.stroke();
      } else if(v.type==='pop'){
        ctx.globalAlpha=1-p;
        ctx.fillStyle=v.col;
        ctx.font='bold 13px Fredoka, sans-serif';
        ctx.fillText('+10', v.x, v.y-10-p*18);
      }
      ctx.restore();
    }
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ---------------- debug hook ---------------- */
window.__MW = {
  G: function(){ return S; },
  phase: function(){ return S? S.phase : 'menu'; },
  move: function(dir){ doMove(dir); },
  blow: function(){ doBlow(); },
  start: function(){ startRun(); },
  next: function(){ if(S && S.phase==='clear') $('nextBtn').click(); },
  retry: function(){ if(S && S.phase==='lose') $('retryBtn').click(); }
};
})();
</script>
</body>
