<script id="funjs">/* FUN · 共用成就 / 等級 / 每日挑戰模組(整個遊戲大廳通用) */
(function(){
const W=window,KP='fun_profile';let G='game',DEFS=[],S={a:{},d:{}},P={xp:0};
const $=id=>document.getElementById(id);
const K=()=>'fun_'+G;
function load(){try{S=Object.assign({a:{},d:{}},JSON.parse(localStorage.getItem(K())||'{}'));}catch(e){}try{P=Object.assign({xp:0},JSON.parse(localStorage.getItem(KP)||'{}'));}catch(e){}}
function save(){try{localStorage.setItem(K(),JSON.stringify(S));localStorage.setItem(KP,JSON.stringify(P));}catch(e){}}
const need=lv=>100+lv*60;
function lvOf(xp){let lv=1,x=xp;while(x>=need(lv)){x-=need(lv);lv++;}return{lv,cur:x,nx:need(lv)};}
const TITLES=['新手牌友','熟客','牌桌常客','老手','高手','大師','傳說'];
const titleOf=lv=>TITLES[Math.min(TITLES.length-1,Math.floor((lv-1)/2))];
let q=[],qb=false;
function banner(ic,t1,t2){q.push([ic,t1,t2]);if(!qb)run();}
function run(){const it=q.shift();if(!it){qb=false;return;}qb=true;const d=document.createElement('div');d.className='fun-ban';d.innerHTML='<i>'+it[0]+'</i><div><small>'+it[1]+'</small><b>'+it[2]+'</b></div>';document.body.appendChild(d);requestAnimationFrame(()=>d.classList.add('on'));setTimeout(()=>{d.classList.remove('on');setTimeout(()=>{d.remove();run();},350);},2400);}
function xp(n){if(!n)return;const b=lvOf(P.xp);P.xp+=n;const a=lvOf(P.xp);save();if(a.lv>b.lv)banner('⬆️','等級提升','Lv.'+a.lv+' '+titleOf(a.lv));chip();}
function unlock(id){if(S.a[id])return false;const d=DEFS.find(x=>x.id===id);if(!d)return false;S.a[id]=Date.now();save();banner(d.ic,'成就解鎖',d.name);xp(30);return true;}
function dateKey(off){const t=new Date(Date.now()+8*3600e3+(off||0)*86400e3);return t.toISOString().slice(0,10);}
function hashS(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function dailySeed(extra){return hashS(dateKey()+'|'+G+(extra||''));}
function dailyInfo(){const t=dateKey();return{done:S.d.last===t,streak:(S.d.last===t||S.d.last===dateKey(-1))?(S.d.streak||0):0,best:S.d.best||0};}
function dailyDone(){const t=dateKey();if(S.d.last===t)return false;S.d.streak=(S.d.last===dateKey(-1)?(S.d.streak||0):0)+1;S.d.last=t;S.d.best=Math.max(S.d.best||0,S.d.streak);save();banner('📅','每日挑戰完成','連續 '+S.d.streak+' 天');xp(60+Math.min(S.d.streak,7)*10);return true;}
function chip(){const e=$('funChip');if(!e)return;const l=lvOf(P.xp);e.querySelector('b').textContent='Lv.'+l.lv+' · '+titleOf(l.lv);e.querySelector('em').style.width=Math.round(l.cur/l.nx*100)+'%';e.querySelector('small').textContent=l.cur+' / '+l.nx+' XP';}
function panel(){let o=$('funOv');if(!o){o=document.createElement('div');o.id='funOv';o.className='fun-ov';o.onclick=e=>{if(e.target===o)o.classList.remove('on');};document.body.appendChild(o);}
 const n=DEFS.filter(d=>S.a[d.id]).length,di=dailyInfo();
 o.innerHTML='<div class="fun-card"><h3>🏆 成就</h3><p class="fun-s">已解鎖 '+n+' / '+DEFS.length+(di.streak?' · 每日挑戰連續 '+di.streak+' 天':'')+'</p><div class="fun-l">'+DEFS.map(d=>{const u=S.a[d.id];return'<div class="fun-i'+(u?' u':'')+'"><i>'+(u?d.ic:'🔒')+'</i><div><b>'+d.name+'</b><small>'+d.desc+'</small></div></div>';}).join('')+'</div><button class="fun-x">關閉</button></div>';
 o.querySelector('.fun-x').onclick=()=>o.classList.remove('on');o.classList.add('on');}
function anchor(card){const st=card.querySelector('.stats');if(st&&st.parentNode===card)return st;const pb=$('playBtn')||$('startBtn');let n=pb;while(n&&n.parentNode!==card)n=n.parentNode;return n||null;}
function buildRow(row,opts){
 if(opts.daily){const b=document.createElement('button');b.className='btn ghost g';b.id='dailyBtn';b.type='button';b.onclick=opts.daily.onclick;row.appendChild(b);W.FUN._db=b;dailyLabel(opts.daily.label);}
 const a=document.createElement('button');a.className='btn ghost g';a.id='achBtn';a.type='button';a.textContent='🏆 成就';a.onclick=panel;row.appendChild(a);
}
function mount(opts){opts=opts||{};const how=$('howBtn');const card=how&&how.closest('.card,.panel,#startBox,.box,.menu');if(!card||$('funChip'))return;
 if(opts.compact){const row0=document.createElement('div');row0.className='row fun-row fun-compact';buildRow(row0,opts);const pr=how.parentNode;if(pr.parentNode===card){const wrap=document.createElement('div');wrap.className='fun-wrap';card.insertBefore(wrap,pr);wrap.appendChild(pr);wrap.appendChild(row0);}else pr.after(row0);return;}
 const chipEl=document.createElement('div');chipEl.id='funChip';chipEl.innerHTML='<b></b><span><em></em></span><small></small>';
 card.insertBefore(chipEl,anchor(card));
 const row=document.createElement('div');row.className='row fun-row';buildRow(row,opts);
 card.appendChild(row);chip();}
function segment(items,def,onchange,key){const how=$('howBtn');const card=how&&how.closest('.card,.panel,#startBox,.box,.menu');if(!card)return;let cur=def;try{const v=localStorage.getItem(key);if(v!==null&&items.some(i=>String(i[0])===v))cur=isNaN(+v)?v:+v;}catch(e){}
 const d=document.createElement('div');d.className='fun-seg';
 items.forEach(([v,t,sm])=>{const b=document.createElement('button');b.type='button';b.innerHTML=t+(sm?'<small>'+sm+'</small>':'');b.className=v===cur?'on':'';b.onclick=()=>{[...d.children].forEach(x=>x.classList.toggle('on',x===b));try{localStorage.setItem(key,v);}catch(e){}onchange(v);};d.appendChild(b);});
 const ch=$('funChip');card.insertBefore(d,ch||anchor(card));onchange(cur);}
function dailyLabel(l){const b=W.FUN._db;if(!b)return;const di=dailyInfo();b.textContent=(di.done?'✅ ':'📅 ')+(l||'每日挑戰')+(di.streak?' · '+di.streak+'天':'');}
function init(game,defs){G=game;DEFS=defs||[];load();}
W.FUN={segment,init,unlock,xp,mount,panel,banner,dailyInfo,dailyDone,dailySeed,rng,dateKey,dailyLabel,has:id=>!!S.a[id],_db:null,lvOf:()=>lvOf(P.xp)};
})();

<div class="ov" id="how"><div class="card"><h2>玩法說明</h2><ul class="rules">
  <li data-i="🧵">每一行、每一列上的數字,代表那一行/列要連續繡幾格。</li>
  <li data-i="👆">點格子下針(填色);再點一次可以拆線(復原)。</li>

  <li data-i="✅">某一行/列繡滿正確格數,該行/列的數字會變暗,方便確認進度。</li>
  <li data-i="💡">卡關時可以用<b>提示</b>自動點亮一格正確位置,但會影響星等。</li>

/* ---------- 音效(程式合成) ---------- */
var ACTX = null;
function actx(){
  if (!ACTX) { try { ACTX = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  return ACTX;
}
function tone(f, t, d, type, v, slideTo){
  var c = actx(); if (!c) return;
  var o = c.createOscillator(), g = c.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(f, c.currentTime+t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime+t+d);
  g.gain.setValueAtTime(0.0001, c.currentTime+t);
  g.gain.linearRampToValueAtTime(v||.3, c.currentTime+t+.012);
  g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+t+d);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+t); o.stop(c.currentTime+t+d+.05);
}
var SFX = {
  stitch: function(){ tone(640,0,.05,'triangle',.22,820); },
  undo:   function(){ tone(420,0,.05,'sine',.16,320); },
  wrong:  function(){ tone(180,0,.12,'sawtooth',.2,120); },
  lineDone: function(){ tone(880,0,.06,'sine',.18,1100); tone(1320,.05,.07,'sine',.12); },
  hint:   function(){ tone(700,0,.08,'triangle',.2,900); tone(1100,.06,.08,'sine',.14); },
  win:    function(){ [0,.09,.18,.30,.44].forEach(function(t,i){ tone([523,659,784,1046,1318][i],t,.22,'triangle',.24); }); },
  select: function(){ tone(700,0,.05,'sine',.2); },
  click:  function(){ tone(520,0,.05,'triangle',.22); },
};

/* ---------- 邏輯工具:由完成圖算出數字線索 ---------- */
function clueOf(line){
  var runs = [], c = 0;
  for (var i=0;i<line.length;i++){
    if (line[i]==='1'){ c++; } else { if (c) runs.push(c); c=0; }
  }
  if (c) runs.push(c);
  return runs.length ? runs : [0];
}
function rowClue(rows, r){ return clueOf(rows[r]); }
function colClue(rows, c){
  var s=''; for (var r=0;r<rows.length;r++) s += rows[r][c];
  return clueOf(s);
}
window.__NONO = { clueOf:clueOf, rowClue:rowClue, colClue:colClue };

/* 千絲萬縷 embroidery: b.js — 棋盤建構與繪製 */
(function(){
'use strict';
var N = window.__NONO;

function solutionGrid(rows){
  return rows.map(function(row){ return row.split('').map(function(ch){ return ch==='1'?1:0; }); });
}

function buildBoard(lv){
  var size = lv.size;
  var sol = solutionGrid(lv.rows);
  var rowClues = sol.map(function(_,r){ return N.rowClue(lv.rows, r); });
  var colClues = sol[0].map(function(_,c){ return N.colClue(lv.rows, c); });

  var board = document.getElementById('board');
  board.innerHTML = '';

  var avail = Math.min(window.innerWidth - 64, 420);
  var availH = window.innerHeight - 220;
  var cols = size+1;
  var cell = Math.floor(Math.min(avail, availH) / cols);
  cell = Math.max(24, Math.min(54, cell));

  board.style.gridTemplateColumns = 'repeat('+cols+','+cell+'px)';
  board.style.gridTemplateRows = 'repeat('+cols+','+cell+'px)';

  // 左上角空白
  var corner = document.createElement('div');
  board.appendChild(corner);

  // 欄線索(上方)
  for (var c=0;c<size;c++){
    var cd = document.createElement('div');
    cd.className = 'cclue';
    cd.id = 'cc'+c;
    cd.innerHTML = colClues[c].map(function(n){ return '<div>'+n+'</div>'; }).join('');
    board.appendChild(cd);
  }

  // 每一列:列線索 + 該列格子
  var cellEls = [];
  for (var r=0;r<size;r++){
    var rd = document.createElement('div');
    rd.className = 'rclue';
    rd.id = 'rc'+r;
    rd.innerHTML = rowClues[r].map(function(n){ return '<span>'+n+'</span>'; }).join(' ');
    board.appendChild(rd);
    var rowEls = [];
    for (c=0;c<size;c++){
      var cellEl = document.createElement('div');
      cellEl.className = 'cell';
      if ((c+1)%5===0 && c<size-1) cellEl.classList.add('a5');
      if ((r+1)%5===0 && r<size-1) cellEl.classList.add('b5');
      cellEl.dataset.r = r; cellEl.dataset.c = c;
      board.appendChild(cellEl);
      rowEls.push(cellEl);
    }
    cellEls.push(rowEls);
  }

  return { size:size, sol:sol, rowClues:rowClues, colClues:colClues, cellEls:cellEls };
}

function setCellFilled(B, r, c, filled){
  var el = B.cellEls[r][c];
  el.classList.toggle('filled', !!filled);
}
function flashWrong(B, r, c){
  var el = B.cellEls[r][c];
  el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
}
function updateLineDone(B, player){
  var size = B.size, changed=[];
  for (var r=0;r<size;r++){
    var filled=0; for (var c=0;c<size;c++) filled += player[r][c];
    var need = B.rowClues[r].reduce(function(a,b){return a+b;},0);
    var done = filled>0 && filled===need;
    var el = document.getElementById('rc'+r);
    if (el.classList.contains('done') !== done){ el.classList.toggle('done', done); if (done) changed.push('r'); }
  }
  for (c=0;c<size;c++){
    filled=0; for (r=0;r<size;r++) filled += player[r][c];
    need = B.colClues[c].reduce(function(a,b){return a+b;},0);
    done = filled>0 && filled===need;
    el = document.getElementById('cc'+c);
    if (el.classList.contains('done') !== done){ el.classList.toggle('done', done); if (done) changed.push('c'); }
  }
  return changed.length>0;
}

window.__BOARD = { buildBoard:buildBoard, setCellFilled:setCellFilled, flashWrong:flashWrong, updateLineDone:updateLineDone, solutionGrid:solutionGrid };

/* 千絲萬縷 embroidery: c.js — 遊戲狀態、互動、勝利判定 */
(function(){
'use strict';
var BM = window.__BOARD;

function newGame(lv){
  var B = BM.buildBoard(lv);
  var size = B.size;
  var player = [];
  for (var r=0;r<size;r++){ var row=[]; for (var c=0;c<size;c++) row.push(0); player.push(row); }
  var total = 0;
  for (r=0;r<size;r++) for (c=0;c<size;c++) total += B.sol[r][c];
  return {
    lv:lv, B:B, player:player, total:total, filled:0,
    mistakes:0, hints:0, history:[], startT:performance.now(), won:false,
  };
}

function tapCell(G, r, c, isHint){
  if (G.won) return 'ignore';
  if (G.player[r][c]){
    return 'already'; // 已填,交由呼叫端決定是否要拆線(點兩下)
  }
  if (G.B.sol[r][c]){
    G.player[r][c] = 1; G.filled++;
    BM.setCellFilled(G.B, r, c, true);
    G.history.push({r:r,c:c,hint:!!isHint});
    var lineChanged = BM.updateLineDone(G.B, G.player);
    if (G.filled === G.total) G.won = true;
    return { ok:true, lineChanged:lineChanged, won:G.won };
  } else {
    G.mistakes++;
    BM.flashWrong(G.B, r, c);
    return { ok:false };
  }
}

function undoCell(G, r, c){
  if (!G.player[r][c]) return false;
  G.player[r][c] = 0; G.filled--;
  BM.setCellFilled(G.B, r, c, false);
  BM.updateLineDone(G.B, G.player);
  // 從歷史移除對應記錄(由後往前找最後一筆相符的)
  for (var i=G.history.length-1;i>=0;i--){
    if (G.history[i].r===r && G.history[i].c===c){ G.history.splice(i,1); break; }
  }
  return true;
}

function undoLast(G){
  if (!G.history.length) return null;
  var last = G.history[G.history.length-1];
  undoCell(G, last.r, last.c);
  return last;
}

function giveHint(G){
  var cands = [];
  for (var r=0;r<G.B.size;r++) for (var c=0;c<G.B.size;c++){
    if (G.B.sol[r][c] && !G.player[r][c]) cands.push([r,c]);
  }
  if (!cands.length) return null;
  var pick = cands[Math.floor(Math.random()*cands.length)];
  G.hints++;
  var res = tapCell(G, pick[0], pick[1], true);
  return { r:pick[0], c:pick[1], res:res };
}

function stars(G){
  if (G.hints>0) return G.mistakes>0 ? 1 : 2;
  if (G.mistakes===0) return 3;
  if (G.mistakes<=2) return 2;
  return 1;
}

window.__GAME = { newGame:newGame, tapCell:tapCell, undoCell:undoCell, undoLast:undoLast, giveHint:giveHint, stars:stars };

})();
/* d.js — 遊戲流程:選單、關卡選擇、HUD、互動綁定、測試掛鉤 */
(function(){
'use strict';
var LV = window.__LV;
var GAME = window.__GAME;
var CHNAME = window.__CHNAME;
var SAVEKEY = 'embroidery_save_v1';

function loadSave(){
  try { return Object.assign({done:{}}, JSON.parse(localStorage.getItem(SAVEKEY))); } catch(e){ return { done:{} }; }
}
function saveSave(s){ try { localStorage.setItem(SAVEKEY, JSON.stringify(s)); } catch(e){} }
var SAVE = loadSave();

var S = { phase:'menu', idx:0, G:null, daily:false };

function idxOf(id){ for (var i=0;i<LV.length;i++) if (LV[i].id===id) return i; return 0; }

var toastT = null;
function toast(msg, ms){
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.classList.remove('on'); }, ms||1200);
}

function showOv(id){
  document.querySelectorAll('.ov').forEach(function(e){ e.classList.remove('on'); });
  if (id) document.getElementById(id).classList.add('on');
}

function hud(){
  var lv = LV[S.idx];
  document.getElementById('lvn').textContent = CHNAME[lv.chapter]+'章 · '+lv.name;
}

function updMistake(){ document.getElementById('mistakeN').textContent = S.G.mistakes; }

function enterLevel(idx, daily){
  S.idx = idx; S.daily = !!daily;
  var lv = LV[idx];
  S.G = GAME.newGame(lv);
  S.phase = 'play';
  hud(); updMistake();
  showOv(null);
  toast((daily ? '每日挑戰 · ' : '') + CHNAME[lv.chapter]+'章 · '+lv.name, 1400);
}

function onWin(){
  S.phase = 'result';
  var G = S.G, lv = LV[S.idx];
  var t = (performance.now()-G.startT)/1000;
  var st = GAME.stars(G);
  var prev = SAVE.done[lv.id];
  if (!prev || st > prev.stars) SAVE.done[lv.id] = { stars:st, time:t };
  saveSave(SAVE);
  window.ESFX.win();
  if (window.FUN){
    FUN.unlock('a1');
    var ch1Lvs = LV.filter(function(l){ return l.chapter==='1'; });
    if (ch1Lvs.every(function(l){ return SAVE.done[l.id]; })) FUN.unlock('a2');
    var ch3Lvs = LV.filter(function(l){ return l.chapter==='3'; });
    if (ch3Lvs.every(function(l){ return SAVE.done[l.id]; })) FUN.unlock('a4');
    if (LV.every(function(l){ return SAVE.done[l.id]; })) FUN.unlock('a5');
    if (G.mistakes===0 && G.hints===0) FUN.unlock('a3');
    if (S.daily) { FUN.dailyDone(); FUN.unlock('a6'); }
  }
  showResult(t, st);
}

function buildPreview(container, lv){
  container.innerHTML = '';
  var size = lv.size;
  container.style.gridTemplateColumns = 'repeat('+size+',1fr)';
  container.style.gridTemplateRows = 'repeat('+size+',1fr)';
  for (var r=0;r<size;r++) for (var c=0;c<size;c++){
    var d = document.createElement('div');
    if (lv.rows[r][c]==='1') d.className='pc';
    container.appendChild(d);
  }
}

function showResult(t, st){
  var card = document.getElementById('resCard');
  var lv = LV[S.idx];
  card.innerHTML = '<h2>繡成 · '+lv.name+'</h2>'+
    '<div class="resPreview" id="resPrev"></div>'+
    '<div class="resTime">用時 '+t.toFixed(1)+' 秒 · 失誤 '+S.G.mistakes+' 次'+(S.G.hints?' · 提示 '+S.G.hints+' 次':'')+'</div>'+
    '<div class="resStars">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</div>'+
    '<div class="resBtns"></div>';
  buildPreview(document.getElementById('resPrev'), lv);
  var btns = card.querySelector('.resBtns');
  function mk(label, cls, fn){ var b=document.createElement('button'); b.className='btn'+(cls?' '+cls:''); b.textContent=label; b.onclick=fn; btns.appendChild(b); }
  if (!S.daily && S.idx+1 < LV.length){
    mk('下一幅','', function(){ window.ESFX.select(); enterLevel(S.idx+1); });
  }
  mk('重新繡製','g', function(){ enterLevel(S.idx, S.daily); });
  mk('選擇紋樣','g', function(){ buildLevelGrid(); showOv('sel'); S.phase='sel'; });
  mk('回主選單','g', function(){ S.phase='menu'; showOv('start'); refreshBest(); });
  showOv('res');
}

function buildLevelGrid(){
  var grid = document.getElementById('lvGrid');
  grid.innerHTML = '';
  ['1','2','3'].forEach(function(ch){
    var lvs = LV.filter(function(l){ return l.chapter===ch; });
    var sec = document.createElement('div'); sec.className='chSec';
    var h = document.createElement('div'); h.className='chTitle'; h.textContent = ch+'. '+CHNAME[ch]+'章 ('+lvs[0].size+'×'+lvs[0].size+')';
    sec.appendChild(h);
    var row = document.createElement('div'); row.className='chRow';
    lvs.forEach(function(lv, li){
      var done = SAVE.done[lv.id];
      var btn = document.createElement('button');
      btn.className = 'lvBtn'+(done?' done':'');
      btn.innerHTML = (li+1)+(done?'<span class="st">'+'★'.repeat(done.stars)+'</span>':'');
      btn.onclick = function(){ window.ESFX.select(); enterLevel(idxOf(lv.id)); };
      row.appendChild(btn);
    });
    sec.appendChild(row);
    grid.appendChild(sec);
  });
}

function refreshBest(){
  var n = 0; LV.forEach(function(l){ if (SAVE.done[l.id]) n++; });
  document.getElementById('bestLine').textContent = n>0 ? ('已繡成 '+n+' / '+LV.length+' 幅') : '';
}

function nextUnfinishedOrFirst(){
  for (var i=0;i<LV.length;i++){ if (!SAVE.done[LV[i].id]) return i; }
  return 0;
}

/* ---------- 棋盤點擊互動 ---------- */
document.getElementById('board').addEventListener('click', function(ev){
  if (S.phase!=='play') return;
  var el = ev.target.closest('.cell');
  if (!el) return;
  var r = +el.dataset.r, c = +el.dataset.c;
  var G = S.G;
  if (G.player[r][c]){
    GAME.undoCell(G, r, c);
    window.ESFX.undo();
    return;
  }
  var res = GAME.tapCell(G, r, c);
  if (res && res.ok){
    window.ESFX.stitch();
    if (res.lineChanged) window.ESFX.lineDone();
    if (res.won) onWin();
  } else {
    window.ESFX.wrong();
    updMistake();
  }
});

document.getElementById('undoBtn').onclick = function(){
  if (S.phase!=='play') return;
  var last = GAME.undoLast(S.G);
  if (last) window.ESFX.undo();
};
document.getElementById('hintBtn').onclick = function(){
  if (S.phase!=='play') return;
  var r = GAME.giveHint(S.G);
  if (!r){ toast('沒有更多提示了'); return; }
  window.ESFX.hint();
  if (r.res && r.res.lineChanged) window.ESFX.lineDone();
  if (r.res && r.res.won) onWin();
};

/* ---------- 綁定 UI ---------- */
document.getElementById('startBtn').onclick = function(){ window.ESFX.select(); enterLevel(nextUnfinishedOrFirst()); };
document.getElementById('selBtn').onclick = function(){ buildLevelGrid(); showOv('sel'); S.phase='sel'; };
document.getElementById('selBack').onclick = function(){ S.phase='menu'; showOv('start'); };
document.getElementById('howBtn').onclick = function(){ showOv('how'); };
document.getElementById('howOk').onclick = function(){ showOv(S.phase==='menu'?'start':null); };
document.getElementById('menuBtn').onclick = function(){ if (S.phase==='play') showOv('menu'); };
document.getElementById('mResume').onclick = function(){ showOv(null); };
document.getElementById('mRetry').onclick = function(){ enterLevel(S.idx, S.daily); };
document.getElementById('mSel').onclick = function(){ buildLevelGrid(); showOv('sel'); S.phase='sel'; };
document.getElementById('mHome').onclick = function(){ S.phase='menu'; showOv('start'); refreshBest(); };
document.getElementById('back').onclick = function(){ location.href='index.html'; };
document.getElementById('mLobby').onclick = function(){ location.href='index.html'; };

addEventListener('resize', function(){
  if (S.phase==='play'){ var lv=LV[S.idx]; var keep=JSON.parse(JSON.stringify(S.G.player)); S.G.B = window.__BOARD.buildBoard(lv);
    for (var r=0;r<lv.size;r++) for (var c=0;c<lv.size;c++) if (keep[r][c]) window.__BOARD.setCellFilled(S.G.B, r, c, true);
    window.__BOARD.updateLineDone(S.G.B, S.G.player);
  }
});

refreshBest();

if (window.GMB) GMB.init({ style:'gu', button:true, key:'emb_bgm_off' });

if (window.FUN) {
  FUN.mount({ daily: { label:'每日挑戰', onclick: function(){
    var r = FUN.rng(FUN.dailySeed('embroidery'));
    var idx = Math.floor(r()*LV.length);
    window.ESFX.select();
    enterLevel(idx, true);
  } } });
}

/* ---------- 測試掛鉤(headless 驗證用) ---------- */
window.__thread = {
  enterLevel: function(idOrIdx){ enterLevel(typeof idOrIdx==='string'?idxOf(idOrIdx):idOrIdx); },
  tap: function(r,c){ document.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]').click(); },
  getState: function(){ var G=S.G; return G ? { phase:S.phase, idx:S.idx, filled:G.filled, total:G.total, mistakes:G.mistakes, hints:G.hints, won:G.won } : { phase:S.phase }; },
  hint: function(){ document.getElementById('hintBtn').click(); },
  undo: function(){ document.getElementById('undoBtn').click(); },
  solveAll: function(){
    var G = S.G, justWon = false;
    for (var r=0;r<G.B.size;r++) for (var c=0;c<G.B.size;c++){
      if (G.B.sol[r][c] && !G.player[r][c]){
        var res = GAME.tapCell(G, r, c);
        if (res && res.won) justWon = true;
      }
    }
    window.__BOARD.updateLineDone(G.B, G.player);
    if (justWon) onWin();
  },
  levels: function(){ return LV.map(function(l){ return l.id; }); },
};

})();
</script>
